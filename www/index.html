لغ إلى محافظ الدولة."},{"n":"875","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثالث — في الفصل في القضية","القسم الأول — في الجدولة"],"g":"معدلة · ق 13-22","t":"يجوز لرئيس المحكمة الإدارية أو تشكيلة الحكم أن يقرر، في أي وقت، وفي حالة الضرورة، جدولة أية قضية للجلسة للفصل فيها بإحدى تشكيلاتها بعد تبليغ محافظ الدولة."},{"n":"876","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثالث — في الفصل في القضية","القسم الأول — في الجدولة"],"g":"","t":"يخطر جميع الخصوم بتاريخ الجلسة الذي ينادى فيه على القضية.\nيتم الإخطار من طرف أمانة الضبط عشرة ) (10 أيام على الأقل قبل تاريخ الجلسة.\nفي حالة الاستعجال، يجوز تقليص هذا الأجل إلى يوم ) (2 ين بأمر من رئيس تشكيلة الحكم."},{"n":"877","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثالث — في الفصل في القضية","القسم الثاني — في الرد والتنحي"],"g":"معدلة · ق 13-22","t":"يقدم طلب الرد بعريضة تودع بأمانة ضبط الجهة القضائية الإدارية التي يعمل بها القاضي المعني.\nوإذا كان القاضي المطلوب رده رئيس محكمة إدارية، يقدم الطلب مباشرة إلى رئيس المحكمة الادارية للاستئناف.\nواذا كان القاضي المراد رده رئيس محكمة ادارية للاستئناف، يقدم الطلب مباشرة الى رئيس مجلس الدولة."},{"n":"878","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثالث — في الفصل في القضية","القسم الثاني — في الرد والتنحي"],"g":"معدلة · ق 13-22","t":"يجب تقديم طلب الرد قبل إقفال باب المرافعات.\nويجب أن يتضمن الطلب تحت طائلة عدم القبول، الإشارة إلى أسباب الرد المنصوص عليها في المادة 241 من هذا القانون، ويرفق بالوثائق المبررة له، عند الاقتضاء.\nيجب أيضا على القاضي الذي يعلم أنه في وضعية تجعله قابلا للرد بمفهوم المادة 241 من هذا القانون، أن يقدم طلبا لرئيس الجهة القضائية الإدارية التابع لها بغرض استبداله."},{"n":"879","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثالث — في الفصل في القضية","القسم الثاني — في الرد والتنحي"],"g":"","t":"يبلغ رئيس الجهة القضائية الإدارية نسخة من طلب الرد إلى القاضي المطلوب رده."},{"n":"880","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثالث — في الفصل في القضية","القسم الثاني — في الرد والتنحي"],"g":"","t":"يجب على القاضي المطلوب رده، أن يتنحى عن القضية بمجرد تبليغه بطلب الرد إلى حين الفصل فيه.\nفي حالة الاستعجال، يع ين رئيس الجهة القضائية الإدارية قاضيا آخر لضمان سير القضية."},{"n":"881","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثالث — في الفصل في القضية","القسم الثاني — في الرد والتنحي"],"g":"","t":"يقدم القاضي المطلوب رده، كتابة قبول الرد أو أسباب اعتراضه عليه في أجل عشرة ) (10 أيام من تاريخ استلامه طلب الرد."},{"n":"882","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثالث — في الفصل في القضية","القسم الثاني — في الرد والتنحي"],"g":"معدلة · ق 13-22","t":"إذا قبل القاضي طلب الرد، يتم استخلافه حالا.\nفي حالة الاعتراض على الرد، وكان القاضي المطلوب رده تابعا للمحكمة الإدارية، يرسل رئيس المحكمة الملف إلى رئيس المحكمة الادارية للاستئناف المختصة اقليميا بمجرد انتهاء الأجل المحدد في المادة 881 أعلاه.\nيتعين أن يفصل في الطلب خلال عشرة ) (10 أيام من تاريخ استلام الملف، في غرفة المشورة برئاسة رئيس المحكمة الادارية للاستئناف وبمساعدة رئيسي ) (2 غرفة على الأقل.\nإذا تعلق الرد بقاض من المحكمة الادارية للاستئناف، يقدم الطلب الى رئيس هذه الأخيرة.وفي حالة اعتراض القاضي المعني على الرد، يرسل رئيس المحكمة الادارية للاستئناف الملف إلى رئيس مجلس الدولة، ويتعين الفصل في الطلب خلال أجل عشرة ) (10 أيام من تاريخ استلام الملف، في غرفة المشورة برئاسة رئيس مجلس الدولة وبمساعدة رئيسي ) (2 غرفة على الأقل.\nوإذا تعلق الرد بقاض في مجلس الدولة تطبق أحكام المادة 244 من هذا القانون.\nيبلغ طالب الرد والمحكمة الإدارية والمحكمة الادارية للاستئناف بقرار المحكمة الادارية للاستئناف أو مجلس الدولة، حسب الحالة، بمجرد النطق به."},{"n":"883","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثالث — في الفصل في القضية","القسم الثاني — في الرد والتنحي"],"g":"معدلة · ق 13-22","t":"يحكم على طالب الرد الذي خسر دعواه، بغرامة مدنية لا تقل عن عشرين آلف ) (20.000 د.ج، دون الإخلال بالتعويضات المحتملة."},{"n":"884","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثالث — في الفصل في القضية","القسم الثالث — في سير الجلسة"],"g":"","t":"بعد تلاوة القاضي المقرر للتقرير المعد حول القضية، يجوز للخصوم تقديم ملاحظاتهم ّ الشفوية تدعيما لطلباتهم الكتابية.\nيمكن أيضا لرئيس تشكيلة الحكم الاستماع إلى أعوان الإدارة المعنية أو دعوتهم لتقديم توضيحات.\nيمكنه أيضا، خلال الجلسة، وبصفة استثنائية، أن يطلب توضيحات من كل شخص حاضر يرغب أحد الخصوم في سماعه."},{"n":"885","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثالث — في الفصل في القضية","القسم الثالث — في سير الجلسة"],"g":"","t":"يقدم محافظ الدولة طلباته بعد إتمام الإجراءات المنصوص عليها في المادة 884 أعلاه."},{"n":"886","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثالث — في الفصل في القضية","القسم الثالث — في سير الجلسة"],"g":"معدلة · ق 13-22","t":"يمكن الأطراف، زيادة على مذكراتهم المكتوبة، تقديم ملاحظاتهم الشفوية في الجلسة."},{"n":"887","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثالث — في الفصل في القضية","القسم الثالث — في سير الجلسة"],"g":"","t":"يتناول المدعى عليه الكلمة أثناء الجلسة بعد المدعي، عندما يقدم هذا الأخير ملاحظات شفوية."},{"n":"888","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثالث — في الفصل في القضية","القسم الرابع — في الأحكام — -1أحكام عامة:"],"g":"","t":"تطبق المقتضيات المتعلقة بالأحكام القضائية المنصوص عليها في المواد من 270 إلى 298 من هذا القانون أمام المحاكم الإدارية."},{"n":"889","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثالث — في الفصل في القضية","القسم الرابع — في الأحكام — -1أحكام عامة:"],"g":"","t":"يتضمن الحكم أيضا، الإشارة إلى الوثائق والنصوص المطبقة، ويشار إلى أنه تم الاستماع إلى القاضي المقرر وإلى محافظ الدولة، وعند الاقتضاء، إلى الخصوم و ممثليهم، وكذا إلى كل شخص تم سماعه بأمر من الرئيس."},{"n":"890","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثالث — في الفصل في القضية","القسم الرابع — في الأحكام — -1أحكام عامة:"],"g":"","t":"يسبق منطوق الحكم بكلمة \" يقرر\".\n2- تصحيح الأخطاء المادية و الإغفالات:"},{"n":"891","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثالث — في الفصل في القضية","القسم الرابع — في الأحكام — -1أحكام عامة:"],"g":"معدلة · ق 13-22","t":"يجوز للجهة القضائية التي أصدرت الحكم، ولو بعد حيازة ذلك الحكم قوة الشيء المقضي به، أن تصحح الخطأ المادي البحت والبسيط الذي يشوبه، كما يجوز للجهة القضائية التي يطعن في الحكم أمامها القيام بتصحيحه.\nيقدم طلب التصحيح إلى رئيس التشكيلة المصدرة للحكم ويفصل في هذا الطلب بموجب أمر على عريضة في أجل خمسة عشر ) (15 يوما من تاريخ تقديم الطلب، بعد سماع الخصوم أو بعد صحة تكليفهم بالحضور.\nيجوز لمحافظ الدولة تقديم طلب التصحيح تلقائيا، أو بناء على طلب أحد الخصوم، لاسيما اذا تبين أن الخطأ المادي يعود الى مرفق القضاء.\nيفصل في طلب التصحيح بعد سماع"},{"n":"892","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثالث — في الفصل في القضية","القسم الرابع — في الأحكام — -1أحكام عامة:"],"g":"معدلة · ق 13-22","t":"يكون الأمر الفاصل في طلب التصحيح قابلا للاعتراض أمام رئيس الجهة القضائية الذي أصدره في أجل خمسة عشر )(15 يوما من تاريخ التبليغ الرسمي للأمر.\nالأمر الفاصل في الاعتراض غير قابل لأي طعن.\nيؤشر على أصل الحكم المصحح وعلى النسخ المستخرجة منه بما قضى به أمر التصحيح، ويبلغ الخصوم المعنيون بأمر التصحيح.\n3- حفظ الملف:"},{"n":"893","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثالث — في الفصل في القضية","القسم الرابع — في الأحكام — -1أحكام عامة:"],"g":"","t":"تحفظ أصول الأحكام والأوامر بأمانة ضبط المحكمة الإدارية لكل قضية مع الوثائق المتعلقة بالتحقيق.\nيستعيد الخصوم الوثائق المملوكة لهم، بناء على طلبهم مقابل وصل بالاستلام، ما لم يأمر رئيس المحكمة الإدارية أن بعض هذه الوثائق تبقى ملحقة بالحكم.\nفي حالة استئناف الحكم أو الأمر، يرسل ملف القضية مع الوثائق المرفقة به، إلى جهة الاستئناف.\n4- تبليغ الأحكام:"},{"n":"894","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثالث — في الفصل في القضية","القسم الرابع — في الأحكام — -1أحكام عامة:"],"g":"","t":"يتم التبليغ الرسمي للأحكام والأوامر إلى الخصوم في موطنهم، عن طريق محضر قضائي."},{"n":"895","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثالث — في الفصل في القضية","القسم الرابع — في الأحكام — -1أحكام عامة:"],"g":"","t":"يجوز بصفة استثنائية لرئيس المحكمة الإدارية أن يأمر بتبليغ الحكم أو الأمر إلى الخصوم عن طريق أمانة الضبط.\n5- المصاريف القضائية:"},{"n":"896","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثالث — في الفصل في القضية","القسم الرابع — في الأحكام — -1أحكام عامة:"],"g":"","t":"تطبق الأحكام المتعلقة بالمصاريف القضائية المنصوص عليها في المواد من 417 إلى 422 من هذا القانون أمام المحاكم الإدارية."},{"n":"897","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثالث — في الفصل في القضية","القسم الخامس — في دور محافظ الدولة"],"g":"","t":"يحيل القاضي المقرر وجوبا، ملف القضية مرفقا بالتقرير والوثائق الملحقة به إلى محافظ الدولة، لتقديم تقريره المكتوب في أجل شهر واحد ) (1 من تاريخ استلامه الملف.\nيجب على محافظ الدولة إعادة الملف والوثائق المرفقة به إلى القاضي المقرر بمجرد انقضاء الأجل المذكور."},{"n":"898","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثالث — في الفصل في القضية","القسم الخامس — في دور محافظ الدولة"],"g":"","t":"يعرض محافظ الدولة تقريره المكتوب.\nيتضمن التقرير عرضا عن الوقائع والقانون والأوجه المثارة ورأيه حول كل مسألة مطروحة والحلول المقترحة للفصل في النزاع، ويختتم بطلبات محددة."},{"n":"899","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثالث — في الفصل في القضية","القسم الخامس — في دور محافظ الدولة"],"g":"معدلة · ق 13-22","t":"يمكن محافظ الدولة أيضا خلال الجلسة، تقديم ملاحظاته ّ الشفوية حول كل قضية قبل غلق باب المرافعات."},{"n":"900","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثالث — في الفصل في القضية","القسم الخامس — في دور محافظ الدولة"],"g":"","t":"يجب أن يشار في أحكام المحكمة الإدارية، بإيجاز إلى طلبات محافظ الدولة وملاحظاته والرد عليها."},{"n":"900 مكرر","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول مكرر — في الاجراءات المتبعة أمام المحاكم الادارية للاستئناف","الفصل الأول — في الاختصاص","القسم الأول — في الاختصاص النوعي"],"g":"مدرجة · ق 13-22","t":"تختص المحكمة الإدارية للاستئناف بالفصل في
