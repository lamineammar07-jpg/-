<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قانون الإجراءات المدنية والإدارية — بحث ومراجعة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ee;--cd:#fff;--tx:#1c2230;--mu:#6b7280;--ac:#1f5f4a;--a2:#e3f0ea;--bd:#e2ded2;--hl:#ffe58a;--fs:19px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13161b;--cd:#1c2027;--tx:#e8e6e0;--mu:#99a0ab;--ac:#6fcf9f;--a2:#1d2c26;--bd:#2b3039;--hl:#6b5a14}}
:root[data-theme="dark"]{--bg:#13161b;--cd:#1c2027;--tx:#e8e6e0;--mu:#99a0ab;--ac:#6fcf9f;--a2:#1d2c26;--bd:#2b3039;--hl:#6b5a14}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Cairo,Tahoma,sans-serif}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);padding:10px 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:900px;margin:0 auto}
h1{font-size:17px;margin:0;flex:1;color:var(--ac)}
input,select,textarea,button{font:inherit;color:inherit}
#q{flex:1;min-width:0;padding:10px 14px;border:1.5px solid var(--bd);border-radius:12px;background:var(--cd);font-size:16px}
#q:focus{outline:2px solid var(--ac)}
button{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:6px 12px;cursor:pointer}
button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
select{padding:6px 8px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);max-width:100%}
nav{display:flex;gap:6px;margin-top:8px}nav button{flex:1;font-weight:600}
label{font-size:14px;color:var(--mu);display:flex;gap:4px;align-items:center}
main{max-width:900px;margin:0 auto;padding:12px}
.inf{color:var(--mu);font-size:14px;margin:4px 0 10px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.c header{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.n{background:var(--a2);color:var(--ac);padding:2px 10px;border-radius:8px}
.tg{font-size:12px;color:var(--mu);border:1px solid var(--bd);border-radius:6px;padding:0 6px}
.sp{flex:1}.c header button{padding:2px 9px;font-size:15px}
.bc{font-size:12.5px;color:var(--mu);margin:6px 0}
.t{font:var(--fs)/2 "Noto Naskh Arabic",Tahoma,serif}.t p{margin:.3em 0}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.nb{display:none;width:100%;margin-top:8px;min-height:70px;padding:8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.nb.v{display:block}
details{margin:4px 0 4px 0;padding-inline-start:14px;border-inline-start:2px solid var(--bd)}
summary{cursor:pointer;padding:5px 0;display:flex;gap:8px;align-items:center}summary span{flex:1}
summary small{color:var(--mu)}summary button{padding:0 8px;font-size:13px}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac)}
.fc{text-align:center;padding:22px 14px}.fc .big{font-size:26px;font-weight:700;color:var(--ac);margin:8px 0}
.fc .t{text-align:start}.fc .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.chip{display:inline-flex;gap:6px;background:var(--a2);color:var(--ac);border-radius:20px;padding:2px 12px;margin:0 0 8px}
.chip button{border:0;background:none;padding:0}
main.wide{max-width:1200px}.g{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media(min-width:900px){.g{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}#pane{position:sticky;top:190px;max-height:calc(100vh - 210px);overflow:auto}}
.msg{border-radius:14px;padding:10px 14px;margin-bottom:10px;line-height:1.9}.msg.u{background:var(--ac);color:var(--bg);margin-inline-start:15%}.msg.b{background:var(--cd);border:1px solid var(--bd)}
.sum{background:var(--a2);border-radius:10px;padding:8px 12px;margin-bottom:8px}.sum b{display:block;color:var(--ac)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chips button,.msg .ch{padding:0 9px;font-size:13px;border-color:var(--ac);color:var(--ac)}
.ask{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:0;background:var(--bg);padding:8px 0}.ask textarea{flex:1;padding:10px;border:1.5px solid var(--bd);border-radius:12px;background:var(--cd);resize:none}
.why{background:var(--a2);border-radius:8px;padding:4px 10px;margin-bottom:4px;font-size:14px}.ph{display:flex;justify-content:space-between;margin-bottom:8px}
.fl{animation:fl 1.6s}@keyframes fl{0%{box-shadow:0 0 0 4px var(--ac)}100%{box-shadow:0 0 0 0 transparent}}
nav button{font-size:14px;padding:6px 4px}
</style></head><body>

<div class="row" style="margin-top:8px"><input id="q" type="search" placeholder="ابحث بكلمة أو عبارة، أو اكتب رقم المادة (مثال: 45)" autocomplete="off">
</div><div class="row" style="margin-top:6px"><select id="bk"><option value="">كل الكتب</option></select><label><input type="checkbox" id="ex"> عبارة كاملة</label></div>

<script type="application/json" id="d">[{"n":"1","p":["أحكام تمهيدية"],"g":"","t":"تطبق أحكام هذا القانون على الدعاوى المرفوعة أمام الجهات القضائية العادية والجهات القضائية الإدارية."},{"n":"2","p":["أحكام تمهيدية"],"g":"","t":"تطبق أحكام هذا القانون فور سريانه، باستثناء ما يتعلق منها بالآجال التي بدأ سريانها في ظل القانون القديم."},{"n":"3","p":["أحكام تمهيدية"],"g":"","t":"يجوز لكل شخص يدعي حقا، رفع دعوى أمام القضاء للحصول على ذلك الحق أو حمايته.\nيستفيد الخصوم أثناء سير الخصومة من فرص متكافئة لعرض طلباتهم و وسائل دفاعهم.\nيلتزم الخصوم والقاضي بمبدأ الوجاهية.\nتفصل الجهات القضائية في الدعاوى المعروضة أمامها في آجال معقولة."},{"n":"4","p":["أحكام تمهيدية"],"g":"","t":"يمكن للقاضي إجراء الصلح بين الأطراف أثناء سير الخصومة في أية مادة كانت."},{"n":"5","p":["أحكام تمهيدية"],"g":"","t":"تفصل الجهات القضائية بقاض فرد أو بتشكيلة جماعية، وفقا لقواعد التنظيم القضائي."},{"n":"6","p":["أحكام تمهيدية"],"g":"","t":"المبدأ أن التقاضي يقوم على درجتين ما لم ينص القانون على خلاف ذلك."},{"n":"7","p":["أحكام تمهيدية"],"g":"","t":"الجلسات علنية، ما لم تمس العلنية بالنظام العام أو الآداب العامة أو حرمة الأسرة."},{"n":"8","p":["أحكام تمهيدية"],"g":"","t":"يجب أن تتم الإجراءات والعقود القضائية من عرائض ومذكرات باللغة العربية، تحت طائلة عدم القبول.\nيجب أن تقدم الوثائق والمستندات باللغة العربية أو مصحوبة بترجمة رسمية إلى هذه اللغة، تحت طائلة عدم القبول.\nتتم المناقشات والمرافعات باللغة العربية.\nتصدر الأحكام القضائية باللغة العربية، تحت طائلة البطلان المثار تلقائيا من القاضي.\nيقصد بالأحكام القضائية في هذا القانون، الأوامر والأحكام والقرارات القضائية."},{"n":"9","p":["أحكام تمهيدية"],"g":"","t":"الأصل في إجراءات التقاضي أن تكون مكتوبة."},{"n":"10","p":["أحكام تمهيدية"],"g":"","t":"تمثيل الخصوم بمحام وجوبي أمام جهات الاستئناف والنقض، ما لم ينص القانون على خلاف ذلك."},{"n":"11","p":["أحكام تمهيدية"],"g":"","t":"يجب أن تكون الأوامر والأحكام والقرارات مسببة."},{"n":"12","p":["أحكام تمهيدية"],"g":"","t":"يلتزم الأطراف بالهدوء أثناء الجلسة وأن يراعوا الوقار الواجب للعدالة."},{"n":"13","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الأول في الدعوى","الفصل الأول في شروط قبول الدعوى"],"g":"","t":"لا يجوز لأي شخص، التقاضي ما لم تكن له صفة، وله مصلحة قائمة أو محتملة يقرها القانون.\nيثير القاضي تلقائيا انعدام الصفة في المدعي أو في المدعى عليه.\nكما يثير تلقائيا انعدام الإذن إذا ما اشترطه القانون."},{"n":"14","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الأول في الدعوى","الفصل الثاني — في عريضة افتتاح الدعوى"],"g":"","t":"ترفع الدعوى أمام المحكمة بعريضة مكتوبة، موقعة ومؤرخة، تودع بأمانة الضبط من قبل المدعي أو وكيله أو محاميه، بعدد من النسخ يساوي عدد الأطراف."},{"n":"15","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الأول في الدعوى","الفصل الثاني — في عريضة افتتاح الدعوى"],"g":"","t":"يجب أن تتضمن عريضة افتتاح الدعوى، تحت طائلة عدم قبولها شكلا، البيانات الآتية:\n1- الجهة القضائية التي ترفع أمامها الدعوى،\n2- اسم ولقب المدعي وموطنه،\n3- اسم ولقب وموطن المدعى عليه، فإن لم يكن له موطن معلوم، فآخر موطن له،\n4- الإشارة إلى تسمية وطبيعة الشخص المعنوي، ومقره الاجتماعي وصفة ممثله القانوني أو الاتفاقي،\n5- عرضا موجزا للوقائع والطلبات والوسائل التي تؤسس عليها الدعوى،\n6- الإشارة، عند الاقتضاء، إلى المستندات والوثائق المؤيدة للدعوى."},{"n":"16","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الأول في الدعوى","الفصل الثاني — في عريضة افتتاح الدعوى"],"g":"","t":"تقيد العريضة حالا في سجل خاص تبعا لترتيب ورودها، مع بيان أسماء وألقاب الخصوم ورقم القضية وتاريخ أول جلسة.\nيسجل أمين الضبط رقم القضية وتاريخ أول جلسة على نسخ العريضة الافتتاحية، ويسلمها للمدعي بغرض تبليغها رسميا للخصوم.\nيجب احترام أجل عشرين ) (20 يوما على الأقل بين تاريخ تسليم التكليف بالحضور، والتاريخ المحدد لأول جلسة، ما لم ينص القانون على خلاف ذلك.\nيمدد هذا الأجل أمام جميع الجهات القضائية إلى ثلاثة ) (3 أشهر، إذا كان الشخص المكلف بالحضور مقيما في الخارج."},{"n":"17","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الأول في الدعوى","الفصل الثاني — في عريضة افتتاح الدعوى"],"g":"","t":"لا تقيد العريضة إلا بعد دفع الرسوم المحددة قانونا، ما لم ينص القانون على خلاف ذلك.\nيفصل رئيس الجهة القضائية في كل نزاع يعرض عليه حول دفع الرسوم، بأمر غير قابل لأي طعن.\nيجب إشهار عريضة رفع الدعوى لدى المحافظة العقارية، إذا تعلقت بعقار و /أو حق عيني عقاري مشهر طبقا للقانون، وتقديمها في أول جلسة ينادى فيها على القضية، تحت طائلة عدم قبولها شكلا، ما لم يثبت إيداعها للإشهار."},{"n":"18","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الأول في الدعوى","الفصل الثالث — في شكل وبيانات التكليف بالحضور"],"g":"","t":"يجب أن يتضمن التكليف بالحضور البيانات الآتية:\n1- اسم ولقب المحضر القضائي وعنوانه المهني وختمه وتوقيعه وتاريخ التبليغ الرسمي وساعته،\n2- اسم ولقب المدعي وموطنه،\n3- اسم ولقب الشخص المكلف بالحضور وموطنه،\n4- تسمية وطبيعة الشخص المعنوي ومقره الاجتماعي، وصفة ممثله القانوني أو الاتفاقي،\n5- تاريخ أول جلسة وساعة انعقادها."},{"n":"19","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الأول في الدعوى","الفصل الثالث — في شكل وبيانات التكليف بالحضور"],"g":"","t":"مع مراعاة أحكام المواد من 406 إلى 416 من هذا القانون، يسلم التكليف بالحضور للخصوم بواسطة المحضر القضائي، الذي يحرر محضرا يتضمن البيانات الآتية:\nاسم ولقب المحضر القضائي، وعنوانه المهني وختمه وتوقيعه، وتاريخ التبليغ الرسمي وساعته، اسم ولقب المدعي وموطنه، اسم ولقب الشخص المبلغ له وموطنه، وإذا تعلق الأمر بشخص معنوي يشار إلى تسميته وطبيعته ومقره الاجتماعي، واسم ولقب وصفة الشخص المبلغ له، توقيع المبلغ له على المحضر، والإشارة إلى طبيعة الوثيقة المثبتة لهويته، مع بيان رقمها، وتاريخ صدورها، تسليم التكليف بالحضور إلى المبلغ له، مرفقا بنسخة من العريضة الافتتاحية، مؤشر عليها من أمين الضبط، الإشارة في المحضر إلى رفض استلام التكليف بالحضور، أو استحالة تسليمه، أو رفض التوقيع عليه، وضع بصمة المبلغ له في حالة استحالة التوقيع على المحضر، تنبيه المدعى عليه بأنه في حالة عدم امتثاله للتكليف بالحضور، سيصدر حكم ضده، بناء على ما قدمه المدعي من عناصر."},{"n":"20","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الأول في الدعوى","الفصل الثالث — في شكل وبيانات التكليف بالحضور"],"g":"","t":"يحضر الخصوم في التاريخ المحدد في التكليف بالحضور شخصيا أو بواسطة محاميهم أو وكلائهم."},{"n":"21","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الأول في الدعوى","الفصل الرابع — في تقديم المستندات"],"g":"","t":"يجب إيداع الأوراق والسندات والوثائق التي يستند إليها الخصوم، دعما لادعاءاتهم، بأمانة ضبط الجهة القضائية، بأصولها أو نسخ رسمية منها أو نسخ مطابقة للأصل، وتبلغ للخصم.\nغير أنه يجوز للقاضي قبول نسخ عادية منها، عند الاقتضاء.\nيمكن تبليغ تلك الأوراق أو السندات أو الوثائق لباقي الخصوم في شكل نسخ."},{"n":"22","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الأول في الدعوى","الفصل الرابع — في تقديم المستندات"],"g":"","t":"يقدم الخصوم المستندات المشار إليها في المادة 21 أعلاه، إلى أمين الضبط، لجردها والتأشير عليها، قبل إيداعها بملف القضية، تحت طائلة الرفض.\nيتم إيداع هذه المستندات بأمانة الضبط مقابل وصل استلام."},{"n":"23","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الأول في الدعوى","الفصل الرابع — في تقديم المستندات"],"g":"","t":"يتبادل الخصوم المستندات المودعة طبقا للمادة 22 أعلاه، أثناء الجلسة، أو خارجها بواسطة أمين الضبط.\nيمكن للقاضي، بناء على طلب أحد الخصوم، أن يأمر شفهيا بإبلاغ كل وثيقة عرضت عليه وثبت عدم إبلاغها للخصم الآخر، ويحدد أجل وكيفية ذلك الإبلاغ.\nيمكن للقاضي أن يستبعد من المناقشة كل وثيقة لم يتم إبلاغها خلال الآجال، وبالكيفية التي حددها."},{"n":"24","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الأول في الدعوى","الفصل الرابع — في تقديم المستندات"],"g":"","t":"يسهر القاضي على حسن سير الخصومة، و يمنح الآجال ويتخذ ما يراه لازما من إجراءات."},{"n":"25","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الأول في الدعوى","الفصل الخامس — في تحديد موضوع النزاع"],"g":"","t":"يتحدد موضوع النزاع بالادعاءات التي يقدمها الخصوم في عريضة افتتاح الدعوى ومذكرات الرد.\nغير أنه يمكن تعديله بناء على تقديم طلبات عارضة، إذا كانت هذه الطلبات مرتبطة بالادعاءات الأصلية.\nتتحدد قيمة النزاع بالطلبات الأصلية والإضافية وبالطلبات المقابلة أو المقاصة القضائية.\nالطلب الإضافي هو الطلب الذي يقدمه أحد أطراف النزاع بهدف تعديل طلباته الأصلية.\nالطلب المقابل هو الطلب الذي يقدمه المدعى عليه للحصول على منفعة، فضلا عن طلبه رفض مزاعم خصمه."},{"n":"26","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الأول في الدعوى","الفصل الخامس — في تحديد موضوع النزاع"],"g":"","t":"لا يجوز للقاضي أن يؤسس حكمه على وقائع لم تكن محل المناقشات والمرافعات.\nيجوز للقاضي أن يأخذ بعين الاعتبار، من بين عناصر المناقشات والمرافعات، الوقائع التي أثيرت من طرف الخصوم ولم يؤسسوا عليها ادعاءاتهم."},{"n":"27","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الأول في الدعوى","الفصل السادس — في سلطات القاضي"],"g":"","t":"يمكن للقاضي أن يأمر في الجلسة بحضور الخصوم شخصيا لتقديم توضيحات يراها ضرورية لحل النزاع.\nكما يجوز له أن يأمر شفهيا، بإحضار أية وثيقة لنفس الغرض."},{"n":"28","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الأول في الدعوى","الفصل السادس — في سلطات القاضي"],"g":"","t":"يجوز للقاضي أن يأمر تلقائيا باتخاذ أي إجراء من إجراءات التحقيق الجائزة قانونا."},{"n":"29","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الأول في الدعوى","الفصل السادس — في سلطات القاضي"],"g":"","t":"يكيف القاضي الوقائع والتصرفات محل النزاع التكييف القانوني الصحيح، دون التقيد بتكييف الخصوم.\nيفصل في النزاع وفقا للقواعد القانونية المطبقة عليه."},{"n":"30","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الأول في الدعوى","الفصل السادس — في سلطات القاضي"],"g":"","t":"يجوز للقاضي أن يأمر بإرجاع المستندات المبلغة للخصوم تحت طائلة غرامة تهديدية عند الاقتضاء."},{"n":"31","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الأول في الدعوى","الفصل السادس — في سلطات القاضي"],"g":"","t":"يجوز للخصوم، دون سواهم أو بوكالة خاصة، عند انتهاء الخصومة، استرجاع الوثائق المودعة في أمانة الضبط مقابل وصل.\nيفصل رئيس الجهة القضائية في الإشكالات التي قد تثار بهذا الشأن."},{"n":"32","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثاني — في الاختصاص","الفصل الأول — في الاختصاص النوعي للمحاكم"],"g":"معدلة · ق 13-22","t":"المحكمة هي الجهة القضائية ذات الاختصاص العام وتتشكل من أقسام.\nيمكن أيضا أن تتشكل من أقطاب متخصصة.\nتفصل المحكمة في جميع القضايا، لاسيما المدنية والتجارية والبحرية والاجتماعية والعقارية وقضايا شؤون الأسرة والتي تختص بها إقليميا.\nتتم جدولة القضايا أمام الأقسام حسب طبيعة النزاع.\nغير أنه في المحاكم التي لم تنشأ فيها الأقسام، يبقى القسم المدني هو الذي ينظر في جميع النزاعات باستثناء القضايا الاجتماعية.\nفي حالة جدولة قضية أمام قسم غير القسم المعني بالنظر فيها، يحال الملف إلى القسم المعني عن طريق أمانة الضبط، بعد إخبار رئيس المحكمة مسبقا."},{"n":"33","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثاني — في الاختصاص","الفصل الأول — في الاختصاص النوعي للمحاكم"],"g":"","t":"عدم دستورية هذه المادة بموجب القرار رقم -01 ق.م.د- د.ع.م 21-في 10 فبراير 2021 ثم تم تعديلها بموجب ق 13-22 في 12 يوليو:(2022 تفصل المحكمة في جميع الدعاوى بأحكام قابلة للاستئناف."},{"n":"34","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثاني — في الاختصاص","الفصل الثاني — في الاختصاص النوعي للمجالس"],"g":"","t":"يختص المجلس القضائي بالنظر في استئناف الأحكام الصادرة عن المحاكم في الدرجة الأولى وفي جميع المواد، حتى ولو كان وصفها خاطئا."},{"n":"35","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثاني — في الاختصاص","الفصل الثاني — في الاختصاص النوعي للمجالس"],"g":"","t":"يختص المجلس القضائي بالفصل في الطلبات المتعلقة بتنازع الاختصاص بين القضاة، إذا كان النزاع متعلقا بجهتين قضائيتين واقعتين في دائرة اختصاصه، وكذلك في طلبات الرد المرفوعة ضد قضاة المحاكم التابعة لدائرة اختصاصه."},{"n":"36","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثاني — في الاختصاص","الفصل الثالث — في طبيعة الاختصاص النوعي"],"g":"","t":"عدم الاختصاص النوعي من النظام العام، تقضي به الجهة القضائية تلقائيا في أية مرحلة كانت عليها الدعوى."},{"n":"37","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثاني — في الاختصاص","الفصل الرابع — في الاختصاص الإقليمي"],"g":"","t":"يؤول الاختصاص الإقليمي للجهة القضائية التي يقع في دائرة اختصاصها موطن المدعى عليه، وإن لم يكن له موطن معروف، فيعود الاختصاص للجهة القضائية التي يقع فيها آخر موطن له، وفي حالة اختيار موطن، يؤول الاختصاص الإقليمي للجهة القضائية التي يقع فيها الموطن المختار، ما لم ينص القانون على خلاف ذلك."},{"n":"38","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثاني — في الاختصاص","الفصل الرابع — في الاختصاص الإقليمي"],"g":"","t":"في حالة تعدد المدعى عليهم، يؤول الاختصاص الإقليمي للجهة القضائية التي يقع في دائرة اختصاصها موطن أحدهم."},{"n":"39","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثاني — في الاختصاص","الفصل الرابع — في الاختصاص الإقليمي"],"g":"","t":"ترفع الدعاوى المتعلقة بالمواد المبينة أدناه أمام الجهات القضائية الآتية:\nفي مواد الدعاوى المختلطة، أمام الجهة القضائية التي يقع في دائرة اختصاصها مقر الأموال، في مواد تعويض الضرر عن جناية، أو جنحة، أو مخالفة، أو فعل تقصيري، ودعاوى الأضرار الحاصلة بفعل الإدارة، أمام الجهة القضائية التي وقع في دائرة اختصاصها الفعل الضار، في مواد المنازعات المتعلقة بالتوريدات والأشغال وتأجير الخدمات الفنية أو الصناعية، يؤول الاختصاص للجهة القضائية التي يقع في دائرة اختصاصها مكان إبرام الاتفاق أو تنفيذه، حتى ولو كان أحد الأطراف غير مقيم في ذلك المكان، في المواد التجارية، غير الإفلاس والتسوية القضائية، أمام الجهة القضائية التي وقع في دائرة اختصاصها الوعد، أو تسليم البضاعة، أو أمام الجهة القضائية التي يجب أن يتم الوفاء في دائرة اختصاصها، وفي الدعاوى المرفوعة ضد شركة، أمام الجهة القضائية التي يقع في دائرة اختصاصها أحد فروعها، في المواد المتعلقة بالمنازعات الخاصة بالمراسلات والأشياء الموصى عليها، والإرسال ذي القيمة المصرح بها، وطرود البريد، أمام الجهة القضائية التي يقع في دائرة اختصاصها موطن المرسل، أو موطن المرسل إليه."},{"n":"40","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثاني — في الاختصاص","الفصل الرابع — في الاختصاص الإقليمي"],"g":"","t":"فضلا عما ورد في المواد 37 و 38 و 46 من هذا القانون، ترفع الدعاوى أمام الجهات القضائية المبينة أدناه دون سواها:\n.في المواد العقارية، أو الأشغال المتعلقة بالعقار، أو دعاوى الإيجارات بما فيها التجارية المتعلقة بالعقارات، والدعاوى المتعلقة بالأشغال العمومية، أمام المحكمة التي يقع في دائرة اختصاصها العقار، أو المحكمة التي يقع في دائرة اختصاصها مكان تنفيذ الأشغال.\n.في مواد الميراث، دعاوى الطلاق أو الرجوع، الحضانة، النفقة الغذائية والسكن، على التوالي، أمام المحكمة التي يقع في دائرة اختصاصها موطن المتوفى، مسكن الزوجية، مكان ممارسة الحضانة، موطن الدائن بالنفقة، مكان وجود السكن.\n.في مواد الإفلاس أو التسوية القضائية للشركات وكذا الدعاوى المتعلقة بمنازعات الشركاء، أمام المحكمة التي يقع في دائرة اختصاصها مكان افتتاح الإفلاس أو التسوية القضائية أو مكان المقر الاجتماعي للشركة.\n.في مواد الملكية الفكرية، أمام المحكمة المنعقدة في مقر المجلس القضائي الموجود في دائرة اختصاصه موطن المدعى عليه.\n.في المواد المتعلقة بالخدمات الطبية، أمام المحكمة التي تم في دائرة اختصاصها تقديم العلاج.\nفي مواد مصاريف الدعاوى وأجور المساعدين القضائيين أمام المحكمة التي فصلت في الدعوى الأصلية، وفي دعاوى الضمان أمام المحكمة التي قدم إليها الطلب الأصلي.\n.في مواد الحجز، سواء كان بالنسبة للإذن بالحجز، أو للإجراءات التالية له، أمام المحكمة التي وقع في دائرة اختصاصها الحجز.\n.في المنازعات التي تقوم بين صاحب العمل والأجير، يؤول الاختصاص الإقليمي للمحكمة التي تم في دائرة اختصاصها إبرام عقد العمل أو تنفيذه أو التي يوجد بها موطن المدعى عليه.غير أنه في حالة إنهاء أو تعليق عقد العمل بسبب حادث عمل أو مرض مهني يؤول الاختصاص للمحكمة التي يوجد بها موطن المدعي.\n.في المواد المستعجلة، أمام المحكمة الواقع في دائرة اختصاصها مكان وقوع الإشكال في التنفيذ، أو التدابير المطلوبة."},{"n":"41","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثاني — في الاختصاص","الفصل الرابع — في الاختصاص الإقليمي","القسم الأول — في الدعاوى المرفوعة ضد أو من الأجانب"],"g":"","t":"يجوز أن يكلف بالحضور كل أجنبي، حتى ولو لم يكن مقيما في الجزائر، أمام الجهات القضائية الجزائرية، لتنفيذ الالتزامات التي تعاقد عليها في الجزائر مع جزائري.كما يجوز أيضا تكليفه بالحضور أمام الجهات القضائية الجزائرية بشأن التزامات تعاقد عليها في بلد أجنبي مع جزائريين."},{"n":"42","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثاني — في الاختصاص","الفصل الرابع — في الاختصاص الإقليمي","القسم الأول — في الدعاوى المرفوعة ضد أو من الأجانب"],"g":"","t":"يجوز أن يكلف بالحضور كل جزائري أمام الجهات القضائية الجزائرية بشأن التزامات تعاقد عليها في بلد أجنبي، حتى ولو كان مع أجنبي."},{"n":"43","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثاني — في الاختصاص","الفصل الرابع — في الاختصاص الإقليمي","القسم الثاني — في الدعاوى المرفوعة من أو ضد القضاة"],"g":"","t":"عندما يكون القاضي مدع في دعوى يؤول فيها الاختصاص لجهة قضائية تابعة لدائرة اختصاص المجلس القضائي الذي يمارس فيه وظائفه، وجب عليه رفع الدعوى أمام جهة قضائية تابعة لأقرب مجلس قضائي محاذ للمجلس الذي يمارس فيه مهامه."},{"n":"44","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثاني — في الاختصاص","الفصل الرابع — في الاختصاص الإقليمي","القسم الثاني — في الدعاوى المرفوعة من أو ضد القضاة"],"g":"","t":"عندما يكون القاضي مدعى عليه، جاز للخصم أن يرفع دعواه أمام جهة قضائية تابعة لدائرة اختصاص أقرب مجلس قضائي محاذ لتلك التي يمارس في دائرة اختصاصها القاضي وظائفه."},{"n":"45","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثاني — في الاختصاص","الفصل الرابع — في الاختصاص الإقليمي","القسم الثالث — في طبيعة الاختصاص الإقليمي"],"g":"","t":"يعتبر لاغيا وعديم الأثر كل شرط يمنح الاختصاص الإقليمي لجهة قضائية غير مختصة، إلا إذا تم بين التجار."},{"n":"46","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثاني — في الاختصاص","الفصل الرابع — في الاختصاص الإقليمي","القسم الثالث — في طبيعة الاختصاص الإقليمي"],"g":"","t":"يجوز للخصوم الحضور باختيارهم أمام القاضي، حتى ولو لم يكن مختصا إقليميا.\nيوقع الخصوم على تصريح بطلب التقاضي، وإذا تعذر التوقيع يشار إلى ذلك.\nيكون القاضي مختصا طيلة الخصومة، و يمتد الاختصاص في حالة الاستئناف إلى المجلس القضائي التابع له."},{"n":"47","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثاني — في الاختصاص","الفصل الرابع — في الاختصاص الإقليمي","القسم الثالث — في طبيعة الاختصاص الإقليمي"],"g":"","t":"يجب إثارة الدفع بعدم الاختصاص الإقليمي، قبل أي دفاع في الموضوع أو دفع بعدم القبول."},{"n":"48","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثالث — في وسائل الدفاع","الفصل الأول — في الدفوع الموضوعية"],"g":"","t":"الدفوع الموضوعية هي وسيلة تهدف إلى دحض ادعاءات الخصم.\nويمكن تقد يمها في أية مرحلة كانت عليها الدعوى."},{"n":"49","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثالث — في وسائل الدفاع","الفصل الثاني — في الدفوع الشكلية"],"g":"","t":"الدفوع الشكلية هي كل وسيلة تهدف إلى التصريح بعدم صحة الإجراءات أو انقضائها أو وقفها."},{"n":"50","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثالث — في وسائل الدفاع","الفصل الثاني — في الدفوع الشكلية"],"g":"","t":"يجب إثارة الدفوع الشكلية في آن واحد قبل إبداء أي دفاع في الموضوع، أو دفع بعدم القبول، وذلك تحت طائلة عدم القبول."},{"n":"51","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثالث — في وسائل الدفاع","الفصل الثاني — في الدفوع الشكلية","القسم الأول — في الدفع بعدم الاختصاص الإقليمي"],"g":"","t":"يجب على الخصم الذي يدفع بعدم الاختصاص الإقليمي للجهة القضائية، أن يسبب طلبه، ويعين الجهة القضائية التي يستوجب رفع الدعوى أمامها.\nلا يجوز للمدعي إثارة هذا الدفع."},{"n":"52","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثالث — في وسائل الدفاع","الفصل الثاني — في الدفوع الشكلية","القسم الأول — في الدفع بعدم الاختصاص الإقليمي"],"g":"","t":"يفصل القاضي بحكم في الدفع بعدم الاختصاص الإقليمي، و يمكنه، عند الاقتضاء، أن يفصل فيه بنفس الحكم مع موضوع النزاع بعد إعذار الخصوم مسبقا شفاهة، لتقديم طلباتهم في الموضوع."},{"n":"53","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثالث — في وسائل الدفاع","الفصل الثاني — في الدفوع الشكلية","القسم الثاني — في الدفع بوحدة الموضوع والارتباط"],"g":"","t":"تقوم وحدة الموضوع عندما يرفع نفس النزاع إلى جهتين قضائيتين مختصتين ومن نفس الدرجة."},{"n":"54","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثالث — في وسائل الدفاع","الفصل الثاني — في الدفوع الشكلية","القسم الثاني — في الدفع بوحدة الموضوع والارتباط"],"g":"","t":"يجب على الجهة القضائية الأخيرة التي رفع إليها النزاع أن تتخلى لصالح الجهة الأخرى، إذا طلب أحد الخصوم ذلك.\nويجوز للقاضي أن يتخلى عن الفصل تلقائيا إذا تبين له وحدة الموضوع."},{"n":"55","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثالث — في وسائل الدفاع","الفصل الثاني — في الدفوع الشكلية","القسم الثاني — في الدفع بوحدة الموضوع والارتباط"],"g":"","t":"تقوم حالة الارتباط عند وجود علاقة بين قضايا مرفوعة أمام تشكيلات مختلفة لنفس الجهة القضائية، أو أمام جهات قضائية مختلفة، والتي تستلزم لحسن سير العدالة أن ينظر ويفصل فيها معا."},{"n":"56","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثالث — في وسائل الدفاع","الفصل الثاني — في الدفوع الشكلية","القسم الثاني — في الدفع بوحدة الموضوع والارتباط"],"g":"","t":"التخلي عن النزاع بسبب الارتباط بين القضايا، يؤمر به من طرف آخر جهة قضائية أو آخر تشكيلة طرح عليها النزاع، لصالح جهة قضائية أو تشكيلة أخرى بموجب حكم مسبب بناء على طلب أحد الخصوم أو تلقائيا."},{"n":"57","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثالث — في وسائل الدفاع","الفصل الثاني — في الدفوع الشكلية","القسم الثاني — في الدفع بوحدة الموضوع والارتباط"],"g":"","t":"الأحكام الصادرة بالتخلي بسبب وحدة الموضوع أو الارتباط، ملزمة للجهة القضائية أو التشكيلة المحال إليها، وهي غير قابلة لأي طعن."},{"n":"58","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثالث — في وسائل الدفاع","الفصل الثاني — في الدفوع الشكلية","القسم الثاني — في الدفع بوحدة الموضوع والارتباط"],"g":"","t":"تقضي جهة الإحالة بالضم تلقائيا في حالة وجود ارتباط بين خصومات مطروحة أمام تشكيلات مختلفة لنفس الجهة القضائية أو أمام جهات قضائية مختلفة بعد التخلي لها."},{"n":"59","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثالث — في وسائل الدفاع","الفصل الثاني — في الدفوع الشكلية","القسم الثالث — في الدفع بإرجاء الفصل"],"g":"","t":"يجب على القاضي إرجاء الفصل في الخصومة إذا نص القانون على منح أجل للخصم الذي يطلبه."},{"n":"60","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثالث — في وسائل الدفاع","الفصل الثاني — في الدفوع الشكلية","القسم الرابع — في الدفع بالبطلان"],"g":"","t":"لا يقرر بطلان الأعمال الإجرائية شكلا، إلا إذا نص القانون صراحة على ذلك، وعلى من يتمسك به أن يثبت الضرر الذي لحقه."},{"n":"61","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثالث — في وسائل الدفاع","الفصل الثاني — في الدفوع الشكلية","القسم الرابع — في الدفع بالبطلان"],"g":"","t":"يمكن إثارة الدفع ببطلان الأعمال الإجرائية شكلا خلال القيام بها، ولا يعتد بهذا الدفع إذا قدم من تمسك به دفاعا في الموضوع لاحقا للعمل الإجرائي المشوب بالبطلان دون إثارته."},{"n":"62","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثالث — في وسائل الدفاع","الفصل الثاني — في الدفوع الشكلية","القسم الرابع — في الدفع بالبطلان"],"g":"","t":"يجوز للقاضي أن يمنح أجلا للخصوم لتصحيح الإجراء المشوب بالبطلان، بشرط عدم بقاء أي ضرر قائم بعد التصحيح.\nيسري أثر هذا التصحيح من تاريخ الإجراء المشوب بالبطلان."},{"n":"63","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثالث — في وسائل الدفاع","الفصل الثاني — في الدفوع الشكلية","القسم الرابع — في الدفع بالبطلان"],"g":"","t":"لا يجوز التمسك ببطلان الأعمال الإجرائية شكلا، إلا لمن تقرر البطلان لصالحه."},{"n":"64","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثالث — في وسائل الدفاع","الفصل الثاني — في الدفوع الشكلية","القسم الرابع — في الدفع بالبطلان"],"g":"","t":"حالات بطلان العقود غير القضائية والإجراءات من حيث موضوعها محددة على سبيل الحصر فيما يأتي:\n1- انعدام الأهلية للخصوم،\n2- انعدام الأهلية أو التفويض لممثل الشخص الطبيعي أو المعنوي."},{"n":"65","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثالث — في وسائل الدفاع","الفصل الثاني — في الدفوع الشكلية","القسم الرابع — في الدفع بالبطلان"],"g":"","t":"يثير القاضي تلقائيا انعدام الأهلية، ويجوز له أن يثير تلقائيا انعدام التفويض لممثل الشخص الطبيعي أو المعنوي."},{"n":"66","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثالث — في وسائل الدفاع","الفصل الثاني — في الدفوع الشكلية","القسم الرابع — في الدفع بالبطلان"],"g":"","t":"لا يقضى ببطلان إجراء من الإجراءات القابلة للتصحيح، إذا زال سبب ذلك البطلان بإجراء لاحق أثناء سير الخصومة."},{"n":"67","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثالث — في وسائل الدفاع","الفصل الثالث — في الدفع بعدم القبول"],"g":"","t":"الدفع بعدم القبول، هو الدفع الذي يرمي إلى التصريح بعدم قبول طلب الخصم لانعدام الحق في التقاضي، كانعدام الصفة وانعدام المصلحة والتقادم وانقضاء الأجل المسقط وحجية الشيء المقضي فيه، وذلك دون النظر في موضوع النزاع."},{"n":"68","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثالث — في وسائل الدفاع","الفصل الثالث — في الدفع بعدم القبول"],"g":"","t":"يمكن للخصوم تقديم الدفع بعدم القبول في أية مرحلة كانت عليها الدعوى ولو بعد تقديم دفوع في الموضوع."},{"n":"69","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثالث — في وسائل الدفاع","الفصل الثالث — في الدفع بعدم القبول"],"g":"","t":"يجب على القاضي أن يثير تلقائيا الدفع بعدم القبول إذا كان من النظام العام، لاسيما عند عدم احترام آجال طرق الطعن أو عند غياب طرق الطعن."},{"n":"70","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الأول — في إبلاغ الأدلة الكتابية"],"g":"","t":"يجب إبلاغ الأوراق والسندات والوثائق التي يقدمها كل طرف دعما لادعاءاته إلى الخصم الآخر ولو لم يطلبها.\nلا يشترط إبلاغ الخصم في مرحلة الاستئناف بالأوراق المودعة في ملف الدعوى بالدرجة الأولى، غير أنه يجوز لكل طرف طلبها."},{"n":"71","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الأول — في إبلاغ الأدلة الكتابية"],"g":"","t":"يفصل القاضي في الإشكالات التي قد تثار بشأن إبلاغ الوثائق المذكورة في المادة 70 أعلاه.\nيحدد شفاهة، وعند الاقتضاء، تحت طائلة غرامة تهديدية أجل وكيفية تبليغ الأوراق واستردادها من الخصوم."},{"n":"72","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الأول — في إبلاغ الأدلة الكتابية"],"g":"","t":"يجوز للقاضي تصفية الغرامة التهديدية التي أمر بها."},{"n":"73","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الأول — في إبلاغ الأدلة الكتابية"],"g":"","t":"يجوز للقاضي أن يأمر باستخراج نسخة رسمية أو إحضار عقد رسمي أو عرفي أو إحضار أية وثيقة محجوزة لدى الغير، بناء على طلب أحد الخصوم، حتى ولو لم يكن طرفا في العقد."},{"n":"74","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الأول — في إبلاغ الأدلة الكتابية"],"g":"","t":"يقدم في الجلسة الطلب المشار إليه في المادة 73 أعلاه، في شكل عريضة تبلغ للخصوم.\nيفصل القاضي في الطلب بأمر معجل النفاذ بموجب النسخة الأصلية للأمر."},{"n":"75","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الأول أحكام عامة"],"g":"","t":"يمكن للقاضي بناء على طلب الخصوم، أو من تلقاء نفسه، أن يأمر شفاهة أو كتابة بأي إجراء من إجراءات التحقيق التي يسمح بها القانون."},{"n":"76","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الأول أحكام عامة"],"g":"","t":"يجوز الأمر بإجراء التحقيق في أية مرحلة تكون عليها الدعوى."},{"n":"77","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الأول أحكام عامة"],"g":"","t":"يمكن للقاضي، ولسبب مشروع وقبل مباشرة الدعوى، أن يأمر بأي إجراء من إجراءات التحقيق، بناء على طلب كل ذي مصلحة، قصد إقامة الدليل والاحتفاظ به لإثبات الوقائع التي قد تحدد مآل النزاع.\nيأمر القاضي بالإجراء المطلوب بأمر على عريضة أو عن طريق الاستعجال."},{"n":"78","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الأول أحكام عامة"],"g":"","t":"يمكن للقاضي أن يأمر بعدة إجراءات تحقيق في آن واحد أو متتالية."},{"n":"79","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الأول أحكام عامة"],"g":"","t":"يأمر القاضي، عند الاقتضاء، الخصوم أو أحدهم، بإيداع مصاريف إجراءات التحقيق أو التسبيقات المالية بعد تحديدها، لدى أمانة ضبط الجهة القضائية.\nإذا لم تودع هذه المبالغ في الآجال التي حددها القاضي، استغنى عن الإجراء الذي أمر به، وحكم في القضية على الحالة التي هي عليها.\nلا يخل تطبيق أحكام هذه المادة بما هو مقرر في شأن المساعدة القضائية."},{"n":"80","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الأول أحكام عامة"],"g":"","t":"لا يترتب على الأمر بأي إجراء من إجراءات التحقيق، تخلي القاضي عن الفصل في القضية."},{"n":"81","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الأول أحكام عامة"],"g":"","t":"لا تقبل المعارضة في الأوامر والأحكام والقرارات، التي تأمر بإجراء من إجراءات التحقيق، ولا يقبل استئنافها أو الطعن فيها بالنقض، إلا مع الحكم الذي فصل في موضوع الدعوى."},{"n":"82","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثاني — في تنفيذ إجراءات التحقيق"],"g":"","t":"تنفذ إجراءات التحقيق، حسب الحالة، بمبادرة من القاضي أومن أحد الخصوم بموجب أمر شفوي أو تنفيذًا لمستخرج الحكم أو نسخة منه."},{"n":"83","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثاني — في تنفيذ إجراءات التحقيق"],"g":"","t":"يتولى القاضي المقرر، مراقبة تنفيذ إجراء التحقيق المأمور به، إذا كان الحكم الذي قضى به صادرا عن تشكيلة جماعية."},{"n":"84","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثاني — في تنفيذ إجراءات التحقيق"],"g":"","t":"يمكن للقاضي أن ينتقل خارج دائرة اختصاصه، للقيام بإجراء التحقيق أو لمراقبة تنفيذه."},{"n":"85","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثاني — في تنفيذ إجراءات التحقيق"],"g":"","t":"يتم إخطار الخصوم لحضور إجراءات التحقيق المأمور به شفاهة بالجلسة أو بواسطة محاميهم.\nفي حالة غيابهم ومحاميهم عن الجلسة التي أمر فيها بإجراء التحقيق، يتم استدعاؤهم برسالة مضمنة مع الإشعار بالاستلام من طرف أمين ضبط الجهة القضائية.\nويتم استدعاء الغير بالحضور لنفس الغرض حسب نفس الإجراء."},{"n":"86","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثاني — في تنفيذ إجراءات التحقيق"],"g":"","t":"يجوز للخصوم أن يستعينوا بمحاميهم أثناء تنفيذ إجراءات التحقيق."},{"n":"87","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثاني — في تنفيذ إجراءات التحقيق"],"g":"","t":"يجوز لممثل أو محامي أحد الخصوم أمام الجهة القضائية التي أمرت بإجراء التحقيق، متابعة تنفيذه أيا كان مكانه، وتقديم الملاحظات والطلبات المتعلقة به حتى في غياب الخصم."},{"n":"88","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثاني — في تنفيذ إجراءات التحقيق"],"g":"","t":"يجوز لممثل النيابة العامة حضور إجراءات التحقيق في القضايا التي يتم إشعاره بها، وعند الاقتضاء، إبداء ملاحظاته."},{"n":"89","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثاني — في تنفيذ إجراءات التحقيق"],"g":"","t":"تنفذ إجراءات التحقيق أمام الجهة القضائية، في جلسة علنية أو في غرفة المشورة، حسب القواعد المعمول بها في سير الخصومة."},{"n":"90","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثاني — في تنفيذ إجراءات التحقيق"],"g":"","t":"يجوز للقاضي أن يقوم شخصيا بتنفيذ إجراء من إجراءات التحقيق أو يشرف على تنفيذه، ويتم بحضور أمين الضبط الذي يحرر محضرا بذلك، يودع بأمانة الضبط."},{"n":"91","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثالث — في تسوية إشكالات تنفيذ التحقيق"],"g":"","t":"يتولى القاضي تلقائيا أو بناء على طلب أحد الخصوم أو الخبير المعين تسوية الإشكالات التي قد تعترض تنفيذ التحقيق المأمور به.\nعند إشراف القاضي على عمليات الخبرة، يأمر أمين الضبط بتحرير محضر يدون فيه معاينته، والتوضيحات المقدمة من الخبير، وتصريحات الخصوم والغير."},{"n":"92","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثالث — في تسوية إشكالات تنفيذ التحقيق"],"g":"","t":"يفصل القاضي في الإشكالات التي قد تعترض تنفيذ التحقيق، بأمر غير قابل لأي طعن."},{"n":"93","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثالث — في تسوية إشكالات تنفيذ التحقيق"],"g":"","t":"يستأنف السير في الخصومة بعد الانتهاء من التحقيق، من الخصم الذي يهمه التعجيل، وذلك بموجب طلب بسيط."},{"n":"94","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثالث — في تسوية إشكالات تنفيذ التحقيق"],"g":"","t":"تسلم نسخ من المحاضر والتقارير التي تحرر أثناء تنفيذ إجراءات التحقيق، إلى الخصوم من طرف أمين الضبط، وذلك بعد تسديد المصاريف المستحقة.\nيؤشر على التسليم في السجل الخاص."},{"n":"95","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الرابع — في بطلان إجراءات التحقيق"],"g":"","t":"يخضع بطلان إجراءات التنفيذ المتعلقة بتدابير التحقيق للقواعد المقررة لبطلان الأعمال الإجرائية."},{"n":"96","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الرابع — في بطلان إجراءات التحقيق"],"g":"","t":"لا يمس البطلان عمليات التحقيق إلا في جوانبها المشوبة بعدم الصحة."},{"n":"97","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الرابع — في بطلان إجراءات التحقيق"],"g":"","t":"يمكن القيام بعمليات التحقيق من جديد أو تصحيحها، إذا أمكن تصحيح العيب الذي يشوبها."},{"n":"98","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الخامس — في حضور الخصوم واستجوابهم"],"g":"","t":"يمكن للقاضي في جميع المواد أن يأمر الخصوم أو أحدهم، بالحضور شخصيا أمامه.\nيفصل القاضي بأمر غير قابل لأي طعن، في طلب أحد الخصوم الرامي إلى الحضور الشخصي لطرف آخر."},{"n":"99","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الخامس — في حضور الخصوم واستجوابهم"],"g":"","t":"يحضر الخصوم شخصيا أمام الجهة القضائية في جلسة علنية أو في غرفة المشورة، طبقا للقواعد التي تحكم سير الخصومة."},{"n":"100","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الخامس — في حضور الخصوم واستجوابهم"],"g":"","t":"يتم استجواب الخصوم معا، ما لم تتطلب ظروف القضية استجوابهم بصفة انفرادية.\nتتم المواجهة بينهم إذا طلب أحدهم ذلك.\nإذا أمر بحضور أحد الخصوم، يتم استجوابه في حضور الخصم الآخر، ما لم تتطلب الظروف استجوابه على الفور، مع حفظ حق الطرف المتغيب في الاطلاع على تصريحات الطرف المسموع، ولا يحول غياب أحد الخصوم سماع من حضر منهم."},{"n":"101","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الخامس — في حضور الخصوم واستجوابهم"],"g":"","t":"يمكن استجواب الخصوم بحضور خبير و مواجهتهم بالشهود بطلب منهم."},{"n":"102","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الخامس — في حضور الخصوم واستجوابهم"],"g":"","t":"يجيب الخصوم بأنفسهم على الأسئلة المطروحة عليهم، دون قراءة لأي نص مكتوب."},{"n":"103","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الخامس — في حضور الخصوم واستجوابهم"],"g":"","t":"الحضور الشخصي للخصوم الممثلين بمحام، يتم بحضور المحامي أو بعد إخطاره."},{"n":"104","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الخامس — في حضور الخصوم واستجوابهم"],"g":"","t":"يجوز للخصوم والمحامين بعد انتهاء الاستجواب، طرح الأسئلة بواسطة القاضي."},{"n":"105","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الخامس — في حضور الخصوم واستجوابهم"],"g":"","t":"تدون تصريحات الخصوم في محضر، ويشار فيه، عند الاقتضاء، إلى غيابهم أو رفضهم الإدلاء بالتصريحات.\nيوقع الخصوم على المحضر فور تلاوته عليهم من طرف أمين الضبط.\nفي حالة رفض التوقيع يشار إلى ذلك في المحضر.\nيتضمن المحضر مكان وتاريخ وساعة تحريره، و يوقع من قبل القاضي وأمين الضبط."},{"n":"106","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الخامس — في حضور الخصوم واستجوابهم"],"g":"","t":"إذا قدم أحد الخصوم مبررا لاستحالة مثوله، جاز للقاضي الانتقال لسماعه، بعد الإخطار المسبق للخصم الذي يمكنه الحصول على نسخة من المحضر المحرر بشأن هذا الإجراء."},{"n":"107","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الخامس — في حضور الخصوم واستجوابهم"],"g":"","t":"يمكن للقاضي أن يأمر بمثول فاقد الأهلية رفقة ممثله القانوني.\nخاضعا يمكن أيضا أن يأمر بمثول الممثل القانوني للشخص المعنوي، سواء كان للقانون العام أو الخاص."},{"n":"108","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم السادس — في الإنابات القضائية الداخلية"],"g":"","t":"إذا تعذر على القاضي الانتقال خارج دائرة اختصاصه بسبب بعد المسافة، أو بسبب المصاريف، جاز له إصدار إنابة قضائية للجهة القضائية المختصة من نفس الدرجة، أو درجة أدنى، للقيام بالإجراءات المأمور بها."},{"n":"109","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم السادس — في الإنابات القضائية الداخلية"],"g":"","t":"ترسل الإنابة القضائية مرفقة بالمستندات الضرورية بمعرفة أمانة ضبط الجهة القضائية المنيبة إلى الجهة القضائية المنابة.\nبمجرد الاستلام يباشر في الإجراءات المأمور بها من قبل الجهة القضائية المنابة، أو من قبل القاضي الذي يعينه رئيس هذه الجهة القضائية."},{"n":"110","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم السادس — في الإنابات القضائية الداخلية"],"g":"","t":"تستدعي الجهة القضائية المنابة مباشرة، الخصوم أو أي شخص معين في الإنابة القضائية."},{"n":"111","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم السادس — في الإنابات القضائية الداخلية"],"g":"","t":"تتولى أمانة ضبط الجهة القضائية المنابة، إرسال المحاضر مرفقة بالمستندات والأشياء الملحقة بها أو المودعة، إلى أمانة ضبط الجهة القضائية المنيبة بمجرد الانتهاء من إنجاز المهمة."},{"n":"112","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم السابع — في الإنابات القضائية الدولية","الفرع الأول — في الإنابات القضائية الصادرة"],"g":"","t":"يجوز للقاضي تلقائيا أو بطلب من الخصوم، أن يطلب اتخاذ أي إجراء من إجراءات التحقيق أو أي إجراء قضائي آخر يراه ضروريا في دولة أجنبية، بإصدار إنابة قضائية إلى السلطة القضائية المختصة للدولة المعنية أو إلى السلطات الدبلوماسية أو القنصلية الجزائرية."},{"n":"113","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم السابع — في الإنابات القضائية الدولية","الفرع الأول — في الإنابات القضائية الصادرة"],"g":"","t":"يرسل أمين ضبط الجهة القضائية المنيبة إلى النائب العام، نسخة من الحكم القاضي بإجراء الإنابة القضائية، مصحوبة بترجمة رسمية يتكفل بها الخصوم."},{"n":"114","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم السابع — في الإنابات القضائية الدولية","الفرع الأول — في الإنابات القضائية الصادرة"],"g":"","t":"يقوم النائب العام بإرسال الإنابة القضائية حالا إلى وزير العدل، حافظ الأختام قصد إرسالها، ما لم توجد اتفاقية قضائية تسمح بإرسالها مباشرة إلى السلطة القضائية الأجنبية."},{"n":"115","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم السابع — في الإنابات القضائية الدولية","الفرع الثاني — في الإنابات القضائية الواردة"],"g":"","t":"يرسل وزير العدل، حافظ الأختام الإنابات القضائية، الواردة إليه من دول أجنبية، إلى النائب العام لدى المجلس القضائي المختص إقليميا بتنفيذها."},{"n":"116","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم السابع — في الإنابات القضائية الدولية","الفرع الثاني — في الإنابات القضائية الواردة"],"g":"","t":"يرسل النائب العام في الحال الإنابة القضائية للتنفيذ إلى الجهة القضائية المختصة."},{"n":"117","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم السابع — في الإنابات القضائية الدولية","الفرع الثالث — في تنفيذ الإنابات القضائية الدولية"],"g":"","t":"فور تلقي الإنابة القضائية، تنفذ المهمة المطلوبة، بسعي من الجهة القضائية المنابة أو من قبل قاض يعينه رئيس هذه الجهة القضائية."},{"n":"118","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم السابع — في الإنابات القضائية الدولية","الفرع الثالث — في تنفيذ الإنابات القضائية الدولية"],"g":"","t":"تنفذ الإنابة القضائية طبقا للقانون الجزائري، ما لم تطلب الجهة القضائية الأجنبية تنفيذها في شكل خاص، بشرط أن لا يتعارض مع التشريع الوطني."},{"n":"119","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم السابع — في الإنابات القضائية الدولية","الفرع الثالث — في تنفيذ الإنابات القضائية الدولية"],"g":"","t":"يمكن للخصوم ومحاميهم، طرح الأسئلة، بعد ترخيص من القاضي.ويجب أن تصاغ الأسئلة والأجوبة باللغة العربية أو تترجم إليها."},{"n":"120","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم السابع — في الإنابات القضائية الدولية","الفرع الثالث — في تنفيذ الإنابات القضائية الدولية"],"g":"","t":"يتعين على القاضي المناب إشعار الجهة القضائية المنيبة بمكان وتاريخ وساعة تنفيذ الإنابة القضائية إذا طلبت منه ذلك، كما يجوز للقاضي الأجنبي المنيب، أن يحضر إجراءات تنفيذ الإنابة القضائية، إذا وجدت اتفاقيات قضائية تسمح بذلك."},{"n":"121","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم السابع — في الإنابات القضائية الدولية","الفرع الثالث — في تنفيذ الإنابات القضائية الدولية"],"g":"","t":"يجوز للقاضي المناب أن يرفض تلقائيا أو بطلب من أي شخص يهمه الأمر، تنفيذ الإنابة القضائية إذا رأى أنها لا تدخل ضمن صلاحياته.\nيجب على القاضي رفض تنفيذ الإنابة القضائية، إذا كان من شأنها المساس بالسيادة أو بأمن الدولة أو بالنظام العام.\nويجوز كذلك في هذه الحالات، لكل شخص معني أن يطلب من القاضي المناب التراجع عن الإجراءات المتخذة، وإبطال العقود التي قام بتحريرها تنفيذا للإنابة القضائية."},{"n":"122","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم السابع — في الإنابات القضائية الدولية","الفرع الثالث — في تنفيذ الإنابات القضائية الدولية"],"g":"","t":"يجب تسبيب الحكم الذي يصدره القاضي المناب بشأن رفض تنفيذ الإنابة القضائية، أو إبطال العقود التي قام بتحريرها تنفيذا للإنابة القضائية، أو التراجع عن الإجراءات المتخذة، أو رفض التراجع.\nيجوز للخصوم وللنيابة العامة استئناف الحكم في أجل خمسة عشر ) (15 يوما، ولا يمدد هذا الأجل بسبب المسافات."},{"n":"123","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم السابع — في الإنابات القضائية الدولية","الفرع الثالث — في تنفيذ الإنابات القضائية الدولية"],"g":"","t":"ترسل العقود المحررة تنفيذا للإنابة القضائية أو الحكم الذي قضى برفض تنفيذها إلى الجهة القضائية المنيبة بنفس الطرق التي استعملت في إرسالها إلى الجهة القضائية المنابة."},{"n":"124","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم السابع — في الإنابات القضائية الدولية","الفرع الثالث — في تنفيذ الإنابات القضائية الدولية"],"g":"","t":"تنفذ الإنابات القضائية دون دفع مصاريف أو رسوم.\nغير أن المبالغ المستحقة للشهود والخبراء والمترجمين ولأي شخص ساهم في إنجاز الإنابة القضائية، تكون على عاتق السلطة الأجنبية، دون الإخلال بما تنص عليه الاتفاقيات القضائية."},{"n":"125","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثامن — في الخبرة"],"g":"","t":"تهدف الخبرة إلى توضيح واقعة مادية تقنية أو علمية محضة للقاضي."},{"n":"126","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثامن — في الخبرة","الفرع الأول — في تعيين الخبراء"],"g":"","t":"يجوز للقاضي من تلقاء نفسه أو بطلب أحد الخصوم، تعيين خبير أو عدة خبراء من نفس التخصص أو من تخصصات مختلفة.\nالمعينين يقومون بأعمال الخبرة معا،"},{"n":"127","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثامن — في الخبرة","الفرع الأول — في تعيين الخبراء"],"g":"","t":"في حالة تعدد الخبراء واحدا.\nتقريرا ويعدون إذا اختلفت آراؤهم وجب على كل واحد منهم تسبيب رأيه."},{"n":"128","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثامن — في الخبرة","الفرع الأول — في تعيين الخبراء"],"g":"","t":"يجب أن يتضمن الحكم الآمر بإجراء الخبرة ما يأتي:\n1- عرض الأسباب التي بررت اللجوء إلى الخبرة، وعند الاقتضاء، تبرير تعيين عدة خبراء،\n2- بيان اسم ولقب وعنوان الخبير أو الخبراء المعينين مع تحديد التخصص، دقيقا، تحديدا\n3- تحديد مهمة الخبير\n4- تحديد أجل إيداع تقرير الخبرة بأمانة الضبط، مقاربا"},{"n":"129","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثامن — في الخبرة","الفرع الأول — في تعيين الخبراء"],"g":"","t":"يحدد القاضي الآمر بالخبرة، مبلغ التسبيق، على أن يكون قدر الإمكان للمبلغ النهائي المحتمل لأتعاب ومصاريف الخبير.\nيعين القاضي الخصم أو الخصوم الذين يتعين عليهم إيداع مبلغ التسبيق لدى أمانة الضبط في الأجل الذي يحدده.\nلاغيا.\nيترتب على عدم إيداع التسبيق في الأجل المحدد اعتبار تعيين الخبير ً"},{"n":"130","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثامن — في الخبرة","الفرع الأول — في تعيين الخبراء"],"g":"","t":"يجوز للخصم الذي لم يودع مبلغ التسبيق، تقديم طلب تمديد الأجل أو رفع إلغاء تعيين الخبير بموجب أمر على عريضة، إذا أثبت أنه حسن النية."},{"n":"131","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثامن — في الخبرة","الفرع الأول — في تعيين الخبراء"],"g":"","t":"يؤدي الخبير غير المقيد في قائمة الخبراء، اليمين أمام القاضي المعين في الحكم الآمر بالخبرة.\nتودع نسخة من محضر أداء اليمين في ملف القضية."},{"n":"132","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثامن — في الخبرة","الفرع الثاني — في استبدال ورد الخبراء"],"g":"","t":"إذا رفض الخبير إنجاز المهمة المسندة إليه أو تعذر عليه ذلك، استبدل بغيره بموجب أمر على عريضة صادر عن القاضي الذي عينه.\nإذا قبل الخبير المهمة ولم يقم بها أو لم ينجز تقريره أو لم يودعه في الأجل المحدد، جاز الحكم عليه بكل ما تسبب فيه من مصاريف، وعند الاقتضاء، الحكم عليه بالتعويضات المدنية، و يمكن علاوة على ذلك استبداله."},{"n":"133","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثامن — في الخبرة","الفرع الثاني — في استبدال ورد الخبراء"],"g":"","t":"إذا أراد أحد الخصوم رد الخبير المعين، يقدم عريضة تتضمن أسباب الرد، توجه إلى القاضي الذي أمر بالخبرة خلال ثمانية ) (8 أيام من تاريخ تبليغه بهذا التعيين ويفصل دون تأخير في طلب الرد بأمر غير قابل لأي طعن.\nلا يقبل الرد إلا بسبب القرابة المباشرة أو القرابة غير المباشرة لغاية الدرجة الرابعة أو لوجود مصلحة شخصية أو لأي سبب جدي آخر."},{"n":"134","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثامن — في الخبرة","الفرع الثالث — في تنفيذ الخبرة"],"g":"","t":"إذا تطلب الأمر أثناء القيام بالخبرة، اللجوء إلى ترجمة مكتوبة أو شفوية بواسطة مترجم، يختار الخبير مترجما من بين المترجم ين المعتمدين أو يرجع إلى القاضي في ذلك."},{"n":"135","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثامن — في الخبرة","الفرع الثالث — في تنفيذ الخبرة"],"g":"","t":"فيما عدا الحالات التي يستحيل فيها حضور الخصوم بسبب طبيعة الخبرة، يجب على الخبير إخطار الخصوم بيوم وساعة ومكان إجرائها عن طريق محضر قضائي."},{"n":"136","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثامن — في الخبرة","الفرع الثالث — في تنفيذ الخبرة"],"g":"","t":"يرفع الخبير تقريرا عن جميع الإشكالات التي تعترض تنفيذ مهمته، كما يمكنه عند الضرورة طلب تمديد المهمة.\nيأمر القاضي باتخاذ أي تدبير يراه ضروريا."},{"n":"137","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثامن — في الخبرة","الفرع الثالث — في تنفيذ الخبرة"],"g":"","t":"يجوز للخبير أن يطلب من الخصوم تقديم المستندات التي يراها ضرورية لإنجاز مهمته دون تأخير.\nيطلع الخبير القاضي على أي إشكال يعترضه، و يمكن للقاضي أن يأمر الخصوم، تحت طائلة غرامة تهديدية، بتقديم المستندات.\nيجوز للجهة القضائية أن تستخلص الآثار القانونية المترتبة على امتناع الخصوم عن تقديم المستندات."},{"n":"138","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثامن — في الخبرة","الفرع الثالث — في تنفيذ الخبرة"],"g":"","t":"يسجل الخبير في تقريره على الخصوص:\n1- أقوال وملاحظات الخصوم ومستنداتهم،\n2- عرض تحليلي عما قام به وعاينه في حدود المهمة المسندة إليه،\n3- نتائج الخبرة."},{"n":"139","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثامن — في الخبرة","الفرع الثالث — في تنفيذ الخبرة"],"g":"","t":"لا يرخص للخبير باقتطاع تسبيق من المبلغ المودع بأمانة الضبط، إلا إذا قدم تبريرا عن هذا التسبيق.\nإذا تبين أن المبلغ المودع بأمانة الضبط لتغطية أتعاب الخبير غير كاف، يحدد وأجلا لإيداعه.\nالقاضي مبلغا إضافيا في حالة عدم إيداع المبلغ المحدد في الأجل المقرر، يودع الخبير تقريره على الحالة التي يوجد عليها، ويستغني عما تبقى من إجراءات."},{"n":"140","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثامن — في الخبرة","الفرع الثالث — في تنفيذ الخبرة"],"g":"","t":"لا يجوز للخصوم بأي حال من الأحوال، أداء تسبيقات عن الأتعاب والمصاريف، مباشرة للخبير.\nيترتب على قبول الخبير، المقيد في الجدول، هذه التسبيقات، شطبه من قائمة الخبراء وبطلان الخبرة."},{"n":"141","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثامن — في الخبرة","الفرع الثالث — في تنفيذ الخبرة"],"g":"","t":"إذا تبين للقاضي أن العناصر التي بنى عليها الخبير تقريره غير وافية، له أن يتخذ جميع الإجراءات اللازمة، كما يجوز له على الخصوص أن يأمر باستكمال التحقيق، أو بحضور الخبير أمامه، ليتلقى منه الإيضاحات والمعلومات الضرورية."},{"n":"142","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثامن — في الخبرة","الفرع الثالث — في تنفيذ الخبرة"],"g":"","t":"إذا تبين للخبير أن مهمته أصبحت بدون موضوع، بسبب تصالح الخصوم، يتعين عليه إخبار القاضي عن ذلك بموجب تقرير."},{"n":"143","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثامن — في الخبرة","الفرع الرابع — في تحديد أتعاب الخبراء"],"g":"","t":"يتم تحديد أتعاب الخبير النهائية من طرف رئيس الجهة القضائية، بعد إيداع التقرير، مراعيا في ذلك المساعي المبذولة، واحترام الآجال المحددة وجودة العمل المنجز.\nيأذن رئيس الجهة القضائية لأمانة الضبط، بتسليم المبالغ المودعة لديها للخبير، في حدود المبلغ المستحق مقابل أتعابه.\nيأمر الرئيس عند اللزوم، إما باستكمال المبالغ المستحقة للخبير مع تعيين الخصم الذي يتحمل ذلك، وإما إعادة المبالغ الفائضة إلى من أودعها.\nفي جميع هذه الحالات، يفصل رئيس الجهة القضائية بأمر، تسلم أمانة الضبط نسخة رسمية منه إلى الخبير للتنفيذ."},{"n":"144","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثامن — في الخبرة","الفرع الخامس — في الحكم المتعلق بالخبرة"],"g":"","t":"يمكن للقاضي أن يؤسس حكمه على نتائج الخبرة.\nالقاضي غير ملزم برأي الخبير، غير أنه ينبغي عليه تسبيب استبعاد نتائج الخبرة."},{"n":"145","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثامن — في الخبرة","الفرع الخامس — في الحكم المتعلق بالخبرة"],"g":"","t":"لا يجوز استئناف الحكم الآمر بالخبرة، أو الطعن فيه بالنقض، إلا مع الحكم الفاصل في موضوع النزاع.\nلا يمكن أن تشكل المناقشات المتعلقة بعناصر الخبرة، أسبابا لاستئناف الحكم أو الطعن فيه بالنقض، إذا لم تكن قد أثيرت مسبقا أمام الجهة القضائية التي فصلت في نتائج الخبرة."},{"n":"146","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم التاسع — في المعاينات والانتقال إلى الأماكن"],"g":"","t":"يجوز للقاضي من تلقاء نفسه أو بطلب من الخصوم، القيام بإجراء معاينات أو تقييمات أو تقديرات أو إعادة تمثيل الوقائع التي يراها ضرورية مع الانتقال إلى عين المكان إذا اقتضى الأمر ذلك.\nيحدد القاضي خلال الجلسة مكان ويوم وساعة الانتقال، ويدعو الخصوم إلى حضور العمليات.\nإذا تقرر إجراء الانتقال إلى الأماكن من طرف تشكيلة جماعية، يمكن تنفيذه من قبل القاضي المقرر.\nفي حالة غياب الخصوم أو أحدهم، تتبع الإجراءات المقررة في المادة 85 من هذا القانون."},{"n":"147","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم التاسع — في المعاينات والانتقال إلى الأماكن"],"g":"","t":"إذا تطلب موضوع الانتقال معارف تقنية، يجوز للقاضي أن يأمر في نفس الحكم بتعيين من يختاره من التقنيين لمساعدته."},{"n":"148","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم التاسع — في المعاينات والانتقال إلى الأماكن"],"g":"","t":"يمكن للقاضي أثناء تنقله، سماع أي شخص، من تلقاء نفسه أو بناء على طلب أحد الخصوم إذا رأى في ذلك ضرورة.\nكما يجوز له في نفس الظروف سماع الخصوم."},{"n":"149","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم التاسع — في المعاينات والانتقال إلى الأماكن"],"g":"","t":"يحرر محضر عن الانتقال إلى الأماكن، يوقعه القاضي وأمين الضبط، ويودع ضمن الأصول بأمانة الضبط.\nيمكن للخصوم الحصول على نسخ من هذا المحضر."},{"n":"150","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم العاشر — في سماع الشهود"],"g":"","t":"يجوز الأمر بسماع الشهود حول الوقائع التي تكون بطبيعتها قابلة للإثبات بشهادة الشهود، ويكون التحقيق فيها جائزا ومفيدا للقضية."},{"n":"151","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم العاشر — في سماع الشهود"],"g":"","t":"يحدد القاضي في الحكم الآمر بسماع الشهود، الوقائع التي يسمعون حولها، ويوم وساعة الجلسة المحددة لذلك، مع مراعاة الظروف الخاصة بكل قضية.\nيتضمن هذا الحكم دعوة الخصوم للحضور وإحضار شهودهم في اليوم والساعة المحددين للجلسة."},{"n":"152","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم العاشر — في سماع الشهود"],"g":"","t":"يسمع كل شاهد على انفراد في حضور أو في غياب الخصوم، ويعرف قبل سماعه، باسمه ولقبه ومهنته وسنه وموطنه وعلاقته ودرجة قرابته ومصاهرته أو تبعيته للخصوم.\nيؤدي الشاهد اليمين بأن يقول الحقيقة وإلا كانت شهادته قابلة للإبطال.\nيجوز إعادة سماع الشهود ومواجهة بعضهم البعض."},{"n":"153","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم العاشر — في سماع الشهود","الفرع الأول — في حالات عدم قبول الشهادة"],"g":"","t":"لا يجوز سماع أي شخص كشاهد إذا كانت له قرابة أو مصاهرة مباشرة مع أحد الخصوم.\nلا يجوز سماع شهادة زوج أحد الخصوم في القضية التي تعني زوجه، ولو كان مطلقا.\nلا يجوز أيضا قبول شهادة الإخوة والأخوات وأبناء العمومة لأحد الخصوم.\nغير أن الأشخاص المذكورين في هذه المادة، باستثناء الفروع، يجوز سماعهم في القضايا الخاصة بحالة الأشخاص والطلاق.\nيجوز سماع القصر الذين بلغوا سن التمييز على سبيل الاستدلال.\nتقبل شهادة باقي الأشخاص، ما عدا ناقصي الأهلية."},{"n":"154","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم العاشر — في سماع الشهود","الفرع الثاني — في تخلف الشهود"],"g":"","t":"يتم تكليف الشهود بالحضور بسعي من الخصم الراغب في ذلك وعلى نفقته، بعد إيداع المبالغ اللازمة لتغطية التعويضات المستحقة للشهود والمقررة قانونا."},{"n":"155","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم العاشر — في سماع الشهود","الفرع الثاني — في تخلف الشهود"],"g":"","t":"إذا أثبت الشاهد أنه استحال عليه الحضور في اليوم المحدد، جاز للقاضي أن يحدد له أجلا آخر أو ينتقل لتلقي شهادته.\nإذا كان الشاهد مقيما خارج دائرة اختصاص الجهة القضائية، جاز للقاضي إصدار إنابة قضائية لتلقي شهادته."},{"n":"156","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم العاشر — في سماع الشهود","الفرع الثالث — في التجريح في الشاهد"],"g":"","t":"إذا تم التجريح في شاهد بسبب عدم أهليته للشهادة أو قرابته أو لأي سبب جدي آخر، يفصل فورا في ذلك بموجب أمر غير قابل لأي طعن."},{"n":"157","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم العاشر — في سماع الشهود","الفرع الثالث — في التجريح في الشاهد"],"g":"","t":"يجب إثارة أوجه التجريح قبل الإدلاء بالشهادة، إلا إذا ظهر سبب التجريح بعد الإدلاء بالشهادة وأثناء سماع الشهود الآخرين.\nإذا قبل التجريح في الحالة الأخيرة تكون الشهادة باطلة."},{"n":"158","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم العاشر — في سماع الشهود","الفرع الرابع — في تلقي الشهادة"],"g":"","t":"يدلي الشاهد بشهادته دون قراءة لأي نص مكتوب.\nيجوز للقاضي من تلقاء نفسه أو بطلب من الخصوم أو من أحدهم، أن يطرح على الشاهد الأسئلة التي يراها مفيدة."},{"n":"159","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم العاشر — في سماع الشهود","الفرع الرابع — في تلقي الشهادة"],"g":"","t":"لا يمكن لأي كان، ما عدا القاضي، أن يقاطع الشاهد أثناء الإدلاء بشهادته أو يسأله مباشرة."},{"n":"160","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم العاشر — في سماع الشهود","الفرع الرابع — في تلقي الشهادة"],"g":"","t":"تدون أقوال الشاهد في محضر.\nيتضمن المحضر البيانات الآتية:\nمكان ويوم وساعة سماع الشاهد، حضور أو غياب الخصوم، اسم ولقب ومهنة وموطن الشاهد، أداء اليمين من طرف الشاهد، ودرجة قرابته أو مصاهرته مع الخصوم أو تبعيته لهم، أوجه التجريح المقدمة ضد الشاهد عند الاقتضاء، أقوال الشاهد والتنويه بتلاوتها عليه."},{"n":"161","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم العاشر — في سماع الشهود","الفرع الرابع — في تلقي الشهادة"],"g":"","t":"تتلى على الشاهد أقواله من طرف أمين الضبط فور الإدلاء بها.\nيجب توقيع المحضر من القاضي وأمين الضبط والشاهد ويلحق مع أصل الحكم.\nإذا كان الشاهد لا يعرف أو لا يستطيع التوقيع أو يرفضه، ينوه عن ذلك في المحضر."},{"n":"162","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم العاشر — في سماع الشهود","الفرع الرابع — في تلقي الشهادة"],"g":"","t":"يجوز للخصوم، الحصول على نسخة من محضر السماع."},{"n":"163","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم العاشر — في سماع الشهود","الفرع الرابع — في تلقي الشهادة"],"g":"","t":"يجوز للقاضي أن يفصل في القضية فور سماع الشهود أو يؤجلها إلى جلسة لاحقة."},{"n":"164","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الحادي عشر — في مضاهاة الخطوط."],"g":"","t":"تهدف دعوى مضاهاة الخطوط إلى إثبات أو نفي صحة الخط أو التوقيع على المحرر العرفي.\nيختص القاضي الذي ينظر في الدعوى الأصلية، بالفصل في الطلب الفرعي لمضاهاة الخطوط المتعلقة بمحرر عرفي.\nيمكن تقديم دعوى مضاهاة الخطوط للمحرر العرفي كدعوى أصلية، أمام الجهة القضائية المختصة."},{"n":"165","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الحادي عشر — في مضاهاة الخطوط."],"g":"","t":"إذا أنكر أحد الخصوم الخط أو التوقيع المنسوب إليه، أو صرح بعدم الاعتراف بخط أو توقيع الغير، يجوز للقاضي أن يصرف النظر عن ذلك إذا رأى أن هذه الوسيلة غير منتجة في الفصل في النزاع.\nوفي الحالة العكسية، يؤشر القاضي على الوثيقة محل النزاع، ويأمر بإيداع أصلها بأمانة الضبط، كما يأمر بإجراء مضاهاة الخطوط، اعتمادا على المستندات أو على شهادة الشهود، وعند الاقتضاء، بواسطة خبير.\nيبلغ ملف القضية إلى النيابة العامة لتقديم طلباتها المكتوبة.\nإذا عرضت القضية أمام القاضي الجزائي، يتم إرجاء الفصل في دعوى مضاهاة الخطوط إلى حين الفصل في الدعوى الجزائية."},{"n":"166","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الحادي عشر — في مضاهاة الخطوط."],"g":"","t":"يمكن للقاضي أن يأمر بالحضور الشخصي للخصوم وسماع من كتب المحرر المنازع فيه، وعند الاقتضاء، سماع الشهود الذين شاهدوا كتابة ذلك المحرر أو توقيعه."},{"n":"167","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الحادي عشر — في مضاهاة الخطوط."],"g":"","t":"يتعين على القاضي إجراء مضاهاة الخطوط استنادا إلى عناصر المقارنة التي توجد بحوزته.\nيمكنه، عند الاقتضاء، أمر الخصوم بتقديم الوثائق التي تسمح بإجراء المقارنة، مع كتابة نماذج بإملاء منه.\nيقبل على وجه المقارنة، لاسيما العناصر الآتية:\n1- التوقيعات التي تتضمنها العقود الرسمية،\n2- الخطوط والتوقيعات التي سبق الاعتراف بها،\n3- الجزء من المستند موضوع المضاهاة الذي لم يتم إنكاره."},{"n":"168","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الحادي عشر — في مضاهاة الخطوط."],"g":"","t":"يؤشر القاضي على الوثائق المعتمدة للمقارنة ويحتفظ بها مع المحرر المنازع فيه أو يأمر بإيداعها بأمانة الضبط، ليتم سحبها من طرف الخبير المعين مقابل توقيعه بالاستلام."},{"n":"169","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الحادي عشر — في مضاهاة الخطوط."],"g":"","t":"يجوز للقاضي أن يأمر ولو من تلقاء نفسه وتحت طائلة غرامة تهديدية، بإحضار الأصل أو نسخة من الوثائق التي بحوزة الغير إذا كانت مقارنتها بالمحرر المنازع فيه مفيدة.\nتودع هذه الوثائق بأمانة ضبط الجهة القضائية مقابل وصل.\nيأمر القاضي باتخاذ التدابير اللازمة التي من شأنها المحافظة على هذه الوثائق والاطلاع عليها أو نسخها أو إرجاعها أو إعادة إدراجها."},{"n":"170","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الحادي عشر — في مضاهاة الخطوط."],"g":"","t":"تعرض على القاضي إشكالات تنفيذ مضاهاة الخطوط، لاسيما المتعلقة بتحديد الوثائق المعتمدة في عملية المقارنة، ويفصل في ذلك بمجرد التأشير على الملف، على أن يتضمنه الحكم فيما بعد."},{"n":"171","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الحادي عشر — في مضاهاة الخطوط."],"g":"","t":"يعتبر القاضي عدم حضور المدعى عليه المبلغ شخصيا في حالة إقرارا بصحة المحرر، ما لم يوجد له عذر الادعاء الأصلي بمضاهاة الخطوط، مشروع."},{"n":"172","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الحادي عشر — في مضاهاة الخطوط."],"g":"","t":"إذا اعترف المدعى عليه بكتابة المحرر، أعطى القاضي للمدعي إشهادا بذلك."},{"n":"173","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الحادي عشر — في مضاهاة الخطوط."],"g":"","t":"إذا تغيب المدعى عليه، رغم صحة تكليفه، أو إذا أنكر أو لم يتعرف على الخط أو التوقيع، تتبع الإجراءات المنصوص عليها في المادة 165 وما يليها من هذا القانون."},{"n":"174","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الحادي عشر — في مضاهاة الخطوط."],"g":"","t":"إذا ثبت من مضاهاة الخطوط أن المحرر محل النزاع مكتوب أو موقع عليه من الخصم الذي أنكره، يحكم عليه بغرامة مدنية من خمسة آلاف دينار ) 5.000 د ج( إلى )خمسين ألف دينار 50.000 د ج( دون المساس بحق المطالبة بالتعويضات المدنية والمصاريف."},{"n":"175","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثاني عشر — في تزوير العقود العرفية"],"g":"","t":"إذا طعن بالتزوير، بطلب فرعي، في محرر عرفي قدم أثناء سير الخصومة، تتبع الإجراءات المنصوص عليها في المادة 165 وما يليها من هذا القانون."},{"n":"176","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثاني عشر — في تزوير العقود العرفية"],"g":"","t":"إذا كان المحرر العرفي محل دعوى أصلية بالتزوير، يجب أن يبين في العريضة أوجه التزوير."},{"n":"177","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثاني عشر — في تزوير العقود العرفية"],"g":"","t":"إذا صرح المدعى عليه بعدم استعمال المحرر المطعون فيه بالتزوير، يعطي القاضي إشهادا بذلك للمدعي."},{"n":"178","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثاني عشر — في تزوير العقود العرفية"],"g":"","t":"إذا صرح المدعى عليه بتمسكه بالمحرر المنازع فيه، تتبع الإجراءات المنصوص عليها في المادة 165 وما يليها من هذا القانون."},{"n":"179","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثالث عشر — في الادعاء بتزوير العقود الرسمية"],"g":"","t":"الادعاء بالتزوير ضد العقود الرسمية هو الدعوى التي تهدف إلى إثبات تزييف أو تغيير عقد سبق تحريره أو إضافة معلومات مزورة إليه.\nوقد تهدف أيضا إلى إثبات الطابع المصطنع لهذا العقد.\nيقام الادعاء بالتزوير بطلب فرعي أو بدعوى أصلية."},{"n":"180","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثالث عشر — في الادعاء بتزوير العقود الرسمية","الفرع الأول — في الادعاء الفرعي بالتزوير"],"g":"","t":"يثار الادعاء الفرعي بالتزوير بمذكرة تودع أمام القاضي الذي ينظر في الدعوى الأصلية.وتتضمن هذه المذكرة بدقة، الأوجه التي يستند عليها الخصم لإثبات التزوير، تحت طائلة عدم قبول الادعاء.\nيجب على المدعي في الطلب الفرعي تبليغ هذه المذكرة إلى خصمه، ويحدد القاضي الأجل الذي يمنحه للمدعى عليه للرد على هذا الطلب."},{"n":"181","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثالث عشر — في الادعاء بتزوير العقود الرسمية","الفرع الأول — في الادعاء الفرعي بالتزوير"],"g":"","t":"إذا أثار أحد الخصوم الادعاء الفرعي بالتزوير ضد عقد رسمي، جاز للقاضي أن يصرف النظر عن ذلك، إذا رأى أن الفصل في الدعوى لا يتوقف على العقد المطعون فيه، وإذا كان الفصل في الدعوى يتوقف عليه، يدعو الخصم الذي قدمه للتصريح عما إذا كان يتمسك به.\nإذا صرح الخصم بعدم التمسك بالمحرر الرسمي أو لم يبد أي تصريح، استبعد المحرر.\nوإذا تمسك الخصم باستعماله، دعاه القاضي إلى إيداع أصل العقد أو نسخة مطابقة عنه بأمانة ضبط الجهة القضائية خلال أجل لا يزيد عن ثمانية ) (8 أيام.\nفي حالة عدم إيداع المستند في الأجل المحدد، يتم استبعاده.\nوإذا كان أصل هذا المستند مودعا ضمن محفوظات عمومية، يأمر القاضي المودع لديه هذا الأصل، بتسليمه إلى أمانة ضبط الجهة القضائية."},{"n":"182","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثالث عشر — في الادعاء بتزوير العقود الرسمية","الفرع الأول — في الادعاء الفرعي بالتزوير"],"g":"","t":"يجب على القاضي إرجاء الفصل في الدعوى الأصلية إلى حين صدور الحكم في التزوير."},{"n":"183","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثالث عشر — في الادعاء بتزوير العقود الرسمية","الفرع الأول — في الادعاء الفرعي بالتزوير"],"g":"","t":"إذا قضى الحكم بثبوت التزوير، يأمر إما بإزالة أو إتلاف المحرر أو شطبه كليا أو جزئيا وإما بتعديله.\nيسجل المنطوق على هامش العقد المزور.\nيقرر القاضي إما إعادة إدراج أصل العقد الرسمي ضمن المحفوظات التي استخرج منها أو حفظه بأمانة الضبط.\nيخضع الحكم الفاصل في دعوى التزوير الفرعية إلى جميع طرق الطعن."},{"n":"184","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثالث عشر — في الادعاء بتزوير العقود الرسمية","الفرع الأول — في الادعاء الفرعي بالتزوير"],"g":"","t":"إذا أمر الحكم برد المستندات المقدمة، لا ينفذ إلا إذا حاز قوة الشيء المقضي به، ما لم يأمر بخلاف ذلك بناء على طلب المعني."},{"n":"185","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثالث عشر — في الادعاء بتزوير العقود الرسمية","الفرع الأول — في الادعاء الفرعي بالتزوير"],"g":"","t":"لا تسلم نسخة رسمية من المستندات المودعة بأمانة الضبط، المطعون فيها بالتزوير، إلا بموجب أمر على عريضة."},{"n":"186","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثالث عشر — في الادعاء بتزوير العقود الرسمية","الفرع الثاني — في الادعاء الأصلي بالتزوير"],"g":"","t":"يرفع الادعاء الأصلي بالتزوير طبقا للقواعد المقررة لرفع الدعوى."},{"n":"187","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثالث عشر — في الادعاء بتزوير العقود الرسمية","الفرع الثاني — في الادعاء الأصلي بالتزوير"],"g":"","t":"يأمر القاضي بإيداع المستند المطعون فيه بالتزوير لدى أمانة الضبط خلال أجل لا يتعدى ثمانية ) (8 أيام، وتتبع الإجراءات المنصوص عليها في المواد 165 و 167 إلى 170 و 174 من هذا القانون."},{"n":"188","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الثالث عشر — في الادعاء بتزوير العقود الرسمية","الفرع الثاني — في الادعاء الأصلي بالتزوير"],"g":"","t":"إذا قضى الحكم بثبوت التزوير، تطبق أحكام المادة 183 أعلاه."},{"n":"189","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الرابع عشر — في اليمين"],"g":"","t":"يأمر القاضي بأداء اليمين في المواد التي يجوز فيها ذلك."},{"n":"190","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الرابع عشر — في اليمين"],"g":"","t":"يحدد الخصم الذي يوجه اليمين لخصم آخر، الوقائع التي ينصب عليها اليمين.\nيحدد القاضي في الحكم، الوقائع التي ستؤدى بشأنها اليمين سواء كان طلب توجيه اليمين من أحد الخصوم أو قرره القاضي تلقائيا.\nلا يجوز توجيه اليمين حول وقائع مخالفة للنظام العام."},{"n":"191","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الرابع عشر — في اليمين"],"g":"","t":"يحدد القاضي اليوم والساعة والمكان الذي تؤدى فيه اليمين.\nيحدد القاضي الصيغة التي تؤدى بها اليمين، وينبه الخصوم إلى ما يترتب من عقوبات جزائية على اليمين الكاذبة."},{"n":"192","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الرابع عشر — في اليمين"],"g":"","t":"إذا امتنع الخصم عن أداء اليمين التي وجهت إليه دون ردها للخصم الآخر سقط ادعاؤه.\nإذا رفض من ردت عليه اليمين أداءها، سقط ادعاؤه."},{"n":"193","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الرابع — في وسائل الإثبات","الفصل الثاني — في إجراءات التحقيق","القسم الرابع عشر — في اليمين"],"g":"","t":"تؤدى اليمين من قبل الخصم الذي وجهت له شخصيا بالجلسة أو في المكان الذي يحدده القاضي، وإذا برر استحالة التنقل يمكنه أداءها إما أمام قاض منتدب لهذا الغرض، ينتقل إلى مكان تواجده بحضور أمين الضبط، وإما أمام المحكمة الموجود بدائرة اختصاصها محل إقامته.\nتؤدى اليمين حسب الحالة، بحضور أمين الضبط أو المحضر القضائي الذي يحرر محضرا عن ذلك، وفي جميع الحالات، تؤدى بحضور الخصم الآخر أو بعد صحة تبليغه."},{"n":"194","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الخامس — في التدخل","الفصل الأول — أحكام عامة"],"g":"","t":"يكون التدخل في الخصومة في أول درجة أو في مرحلة الاستئناف اختياريا أو وجوبيا.\nلا يقبل التدخل إلا ممن توفرت فيه الصفة والمصلحة.\nيتم التدخل تبعا للإجراءات المقررة لرفع الدعوى.\nلا يقبل التدخل أمام جهة الإحالة بعد النقض، ما لم يتضمن قرار الإحالة خلاف ذلك."},{"n":"195","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الخامس — في التدخل","الفصل الأول — أحكام عامة"],"g":"","t":"لا يقبل التدخل ما لم يكن مرتبطا ارتباطا كافيا بادعاءات الخصوم."},{"n":"196","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الخامس — في التدخل","الفصل الثاني — في التدخل الاختياري"],"g":"","t":"يكون التدخل الاختياري أصليا أو فرعيا."},{"n":"197","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","ا
