08","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثاني — في الإجراءات المتبعة أمام مجلس الدولة","الفصل الثاني — في الدعوى","القسم الأول — في افتتاح الدعوى"],"g":"معدلة · ق 13-22","t":"للاستئناف أمام مجلس الدولة أثر ناقل للنزاع وموقف لتنفيذ الحكم."},{"n":"909","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثاني — في الإجراءات المتبعة أمام مجلس الدولة","الفصل الثاني — في الدعوى","القسم الأول — في افتتاح الدعوى"],"g":"","t":"الطعن بالنقض أمام مجلس الدولة ليس له أثر موقف."},{"n":"910","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثاني — في الإجراءات المتبعة أمام مجلس الدولة","الفصل الثاني — في الدعوى","القسم الثاني — أحكام عامة"],"g":"معدلة · ق 13-22","t":"يجوز لمجلس الدولة أن يأمر بوقف تنفيذ القرارات الإدارية أو رفع وقف تنفيذها عند نظره كجهة استئناف في المادة الاستعجالية."},{"n":"911","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثاني — في الإجراءات المتبعة أمام مجلس الدولة","الفصل الثاني — في الدعوى","القسم الثالث — في وقف تنفيذ القرارات الإدارية"],"g":"معدلة · ق 13-22","t":"يجوز لمجلس الدولة، إذا أخطر بعريضة رفع وقف التنفيذ المأمور به من طرف المحكمة الإدارية للاستئناف للجزائر العاصمة، أن يقرر رفعه حالا، إذا كان من شأنه الإضرار بمصلحة عامة أو بحقوق المستأنف، وذلك إلى غاية الفصل في موضوع الاستئناف."},{"n":"912","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثاني — في الإجراءات المتبعة أمام مجلس الدولة","الفصل الثاني — في الدعوى","القسم الثالث — في وقف تنفيذ القرارات الإدارية"],"g":"ملغاة · ق 13-22","t":"مادة ملغاة."},{"n":"913","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثاني — في الإجراءات المتبعة أمام مجلس الدولة","الفصل الثاني — في الدعوى","القسم الرابع — في وقف تنفيذ القرارات القضائية"],"g":"ملغاة · ق 13-22","t":"مادة ملغاة."},{"n":"914","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثاني — في الإجراءات المتبعة أمام مجلس الدولة","الفصل الثاني — في الدعوى","القسم الرابع — في وقف تنفيذ القرارات القضائية"],"g":"ملغاة · ق 13-22","t":"مادة ملغاة."},{"n":"915","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثاني — في الإجراءات المتبعة أمام مجلس الدولة","الفصل الثاني — في الدعوى","القسم الخامس — في التحقيق"],"g":"","t":"تطبق الأحكام الواردة في المواد من 838 إلى 873 أعلاه، المتعلقة بالتحقيق أمام مجلس الدولة."},{"n":"916","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثاني — في الإجراءات المتبعة أمام مجلس الدولة","الفصل الثالث — في القرارات"],"g":"","t":"تطبق أحكام المواد من 874 إلى 900 أعلاه، المتعلقة بالفصل في القضية أمام مجلس الدولة."},{"n":"917","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الأول — في قاضي الاستعجال"],"g":"معدلة · ق 13-22","t":"يفصل في مادة الاستعجال على مستوى المحكمة الإدارية من قبل رئيسها، ومن قبل التشكيلة الجماعية على مستوى المحكمة الإدارية للاستئناف برئاسة رئيس هذه الأخيرة ومن قبل التشكيلة الجماعية على مستوى مجلس الدولة."},{"n":"918","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الأول — في قاضي الاستعجال"],"g":"","t":"يأمر قاضي الاستعجال بالتدابير المؤقتة.\nلا ينظر في أصل الحق، ويفصل في أقرب الآجال."},{"n":"919","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الثاني — في الاستعجال الفوري","القسم الأول — في سلطات قاضي الاستعجال"],"g":"","t":"عندما يتعلق الأمر بقرار إداري ولو بالرفض، ويكون موضوع طلب إلغاء كلي أو جزئي، يجوز لقاضي الاستعجال، أن يأمر بوقف تنفيذ هذا القرار أو وقف آثار معينة منه متى كانت ظروف الاستعجال تبرر ذلك، ومتى ظهر له من التحقيق وجود وجه خاص من شأنه إحداث شك جدي حول مشروعية القرار.\nعندما يقضى بوقف التنفيذ، يفصل في طلب إلغاء القرار في أقرب الآجال.\nينتهي أثر وقف التنفيذ عند الفصل في موضوع الطلب."},{"n":"920","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الثاني — في الاستعجال الفوري","القسم الأول — في سلطات قاضي الاستعجال"],"g":"","t":"يمكن لقاضي الاستعجال، عندما يفصل في الطلب المشار إليه في المادة 919 أعلاه، إذا كانت ظروف الاستعجال قائمة، أن يأمر بكل التدابير الضرورية للمحافظة على الحريات الأساسية المنتهكة من الأشخاص المعنوية العامة أو الهيئات التي تخضع في مقاضاتها لاختصاص الجهات القضائية الإدارية أثناء ممارسة سلطاتها، متى كانت هذه الانتهاكات تشكل مساسا خطيرا وغير مشروع بتلك الحريات.\nيفصل قاضي الاستعجال في هذه الحالة في أجل ثمان وأربعين ) (48 ساعة من تاريخ تسجيل الطلب."},{"n":"921","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الثاني — في الاستعجال الفوري","القسم الأول — في سلطات قاضي الاستعجال"],"g":"معدلة · ق 13-22","t":"في حالة الاستعجال القصوى، يجوز لقاضي الاستعجال ولو في غياب القرار الإداري المسبق، أن يأمر بكل التدابير الضرورية الأخرى، دون عرقلة تنفيذ أي قرار إداري.وفي حالة التعدي أو الاستيلاء أو الغلق الإداري، يمكن أيضا قاضي الاستعجال أن يأمر بوقف تنفيذ القرار الإداري المطعون فيه أو وضع حد للتعدي."},{"n":"922","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الثاني — في الاستعجال الفوري","القسم الأول — في سلطات قاضي الاستعجال"],"g":"","t":"يجوز لقاضي الاستعجال، بطلب من كل ذي مصلحة، أن يعدل في أي وقت و بناء على مقتضيات جديدة، التدابير التي سبق أن أمر بها أو يضع حدا لها."},{"n":"923","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الثاني — في الاستعجال الفوري","القسم الثاني — في الإجراءات"],"g":"","t":"يفصل قاضي الاستعجال وفقا لإجراءات وجاهية، كتابية وشفوية."},{"n":"924","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الثاني — في الاستعجال الفوري","القسم الثاني — في الإجراءات"],"g":"","t":"عندما لا يتوفر الاستعجال في الطلب، أو يكون غير مؤسس، يرفض قاضي الاستعجال هذا الطلب بأمر مسبب.\nوعندما يظهر أن الطلب لا يدخل في اختصاص الجهة القضائية الإدارية، يحكم القاضي بعدم الاختصاص النوعي."},{"n":"925","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الثاني — في الاستعجال الفوري","القسم الثاني — في الإجراءات"],"g":"","t":"يجب أن تتضمن العريضة الرامية إلى استصدار تدابير استعجالية عرضا موجزا للوقائع والأوجه المبررة للطابع الاستعجالي للقضية."},{"n":"926","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الثاني — في الاستعجال الفوري","القسم الثاني — في الإجراءات"],"g":"","t":"يجب أن ترفق العريضة الرامية إلى وقف تنفيذ القرار الإداري أو بعض آثاره، تحت طائلة عدم القبول، بنسخة من عريضة دعوى الموضوع."},{"n":"927","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الثاني — في الاستعجال الفوري","القسم الثاني — في الإجراءات"],"g":"","t":"لا تطبق في مادة الاستعجال أحكام المادة 848 أعلاه، المتعلقة بطلب التسوية و الإعذار."},{"n":"928","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الثاني — في الاستعجال الفوري","القسم الثاني — في الإجراءات"],"g":"","t":"تبلغ رسميا العريضة إلى المدعى عليهم، وتمنح للخصوم آجال قصيرة من طرف المحكمة، لتقديم مذكرات الرد أو ملاحظاتهم ويجب احترام هذه الآجال بصرامة وإلا استغني عنها دون إعذار."},{"n":"929","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الثاني — في الاستعجال الفوري","القسم الثاني — في الإجراءات"],"g":"","t":"عندما يخطر قاضي الاستعجال بطلبات مؤسسة وفقا لأحكام المادة 919 أو المادة 920 أعلاه، يستدعى الخصوم إلى الجلسة في أقرب الآجال وبمختلف الطرق."},{"n":"930","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الثاني — في الاستعجال الفوري","القسم الثاني — في الإجراءات"],"g":"","t":"تعتبر القضية مهيأة للفصل بمجرد استكمال الإجراء المنصوص عليه في المادة 926 أعلاه، والتأكد من استدعاء الخصوم بصفة قانونية إلى الجلسة."},{"n":"931","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الثاني — في الاستعجال الفوري","القسم الثاني — في الإجراءات"],"g":"معدلة · ق 13-22","t":"يختتم التحقيق بانتهاء الجلسة، ما لم يقرر قاضي الاستعجال تأجيل اختتامه إلى تاريخ لاحق، ويخطر به الخصوم بكل الوسائل.و في هذه الحالة الأخيرة، يجوز أن توجه المذكرات والوثائق الإضافية المقدمة بعد الجلسة وقبل اختتام التحقيق مباشرة إلى الخصوم الآخرين بكل الوسائل القانونية بما في ذلك الطريقة الالكترونية.\nيفتتح التحقيق من جديد في حالة التأجيل إلى جلسة أخرى."},{"n":"932","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الثاني — في الاستعجال الفوري","القسم الثاني — في الإجراءات"],"g":"","t":"خلافا لأحكام المادة 843 أعلاه، يجوز إخبار الخصوم بالأوجه المثارة الخاصة بالنظام العام خلال الجلسة."},{"n":"933","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الثاني — في الاستعجال الفوري","القسم الثاني — في الإجراءات"],"g":"","t":"يجب أن يتضمن الأمر الاستعجالي الإشارة إلى تطبيق أحكام المادتين 931 و 932 أعلاه."},{"n":"934","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الثاني — في الاستعجال الفوري","القسم الثاني — في الإجراءات"],"g":"","t":"يتم التبليغ الرسمي للأمر الاستعجالي، وعند الاقتضاء، يبلغ بكل الوسائل وفي أقرب الآجال."},{"n":"935","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الثاني — في الاستعجال الفوري","القسم الثاني — في الإجراءات"],"g":"","t":"يرتب الأمر الاستعجالي آثاره من تاريخ التبليغ الرسمي أو التبليغ للخصم المحكوم عليه.\nغير أنه، يجوز لقاضي الاستعجال أن يقرر تنفيذه فور صدوره.\nيبلغ أمين ضبط الجلسة، بأمر من القاضي، منطوق الأمر ممهورا بالصيغة التنفيذية في الحال إلى الخصوم مقابل وصل استلام، إذا اقتضت ظروف الاستعجال ذلك."},{"n":"936","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الثاني — في الاستعجال الفوري","القسم الثالث — في الطعن في الأوامر الاستعجالية"],"g":"معدلة · ق 13-22","t":"تكون الأوامر الصادرة في مادة الاستعجال قابلة للطعن."},{"n":"937","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الثاني — في الاستعجال الفوري","القسم الثالث — في الطعن في الأوامر الاستعجالية"],"g":"معدلة · ق 13-22","t":"تكون الأوامر الصادرة عن المحكمة الإدارية في مادة الاستعجال قابلة للطعن بالاستئناف أمام المحكمة الإدارية للاستئناف خلال خمسة عشر ) ( 15 يوما من تاريخ التبليغ الرسمي أو التبليغ.\nو في هذه الحالة، تفصل المحكمة الإدارية للاستئناف في أجل لا يتجاوز عشرة ) ( 10 أيام.\nتكون الأوامر الاستعجالية الصادرة في أول درجة عن المحكمة الإدارية للاستئناف للجزائر العاصمة قابلة للاستئناف أمام مجلس الدولة خلال خمسة عشر ) ( 15 يوما من تاريخ التبليغ الرسمي أو التبليغ.\nو في هذه الحالة، يفصل مجلس الدولة في أجل لا يتجاوز خمسة عشر ) 15 ( يوما."},{"n":"938","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الثاني — في الاستعجال الفوري","القسم الثالث — في الطعن في الأوامر الاستعجالية"],"g":"معدلة · ق 13-22","t":"في حالة استثناف أمر صادر وفقا لأحكام المادة 924 أعلاه، يفصل مجلس الدولة في أجل شهر واحد ).(1"},{"n":"939","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الثالث — الاستعجال في مادة إثبات الحالة وتدابير التحقيق","القسم الأول في إثبات الحالة"],"g":"معدلة · ق 13-22","t":"يجوز لقاضي الاستعجال ما لم يطلب منه أكثر من إثبات حالة الوقائع، بموجب أمر على عريضة ولو في غياب قرار إداري مسبق، أن يعين خبيرا أو محضرا قضائيا ليقوم بدون تأخير، بإثبات الوقائع التي من شأنها أن تؤدي إلى نزاع أمام الجهة القضائية.\nيتم إشعار المدعى عليه المحتمل من قبل الخبير أو المحضر القضائي المعين على الفور."},{"n":"940","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الثالث — الاستعجال في مادة إثبات الحالة وتدابير التحقيق","القسم الثاني — في تدابير التحقيق"],"g":"معدلة · ق 13-22","t":"يجوز لقاضي الاستعجال بناء على عريضة ولو في غياب قرار إداري مسبق، أن يأمر بكل تدبير ضروري للتحقيق.\nالا إلى"},{"n":"941","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الثالث — الاستعجال في مادة إثبات الحالة وتدابير التحقيق","القسم الثاني — في تدابير التحقيق"],"g":"معدلة · ق 13-22","t":"يتم التبليغ الرسمي للعريضة ح ً المدعى عليه مع تحديد أجل للرد من قبل الجهة القضائية."},{"n":"942","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الرابع — الاستعجال في مادة التسبيق المالي"],"g":"","t":"يجوز لقاضي الاستعجال أن يمنح تسبيقا ماليا إلى الدائن الذي رفع دعوى في الموضوع أمام المحكمة الإدارية، ما لم ينازع في وجود الدين بصفة جدية.\nويجوز له ولو تلقائيا، أن يخضع دفع هذا التسبيق لتقديم ضمان."},{"n":"943","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الرابع — الاستعجال في مادة التسبيق المالي"],"g":"معدلة · ق 13-22","t":"يكون الأمر الصادر عن المحكمة الإدارية قابلا للاستئناف أمام المحكمة الإدارية للاستئناف خلال أجل خمسة عشر ) ( 15 يوما من تاريخ التبليغ الرسمي."},{"n":"944","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الرابع — الاستعجال في مادة التسبيق المالي"],"g":"معدلة · ق 13-22","t":"يجوز لمجلس الدولة عندنظره كجهة استئناف وللمحكمة الإدارية للاستئناف بمناسبة نظرها كجهة ابتدائية أو في الاستئناف أن يمنحا تسبيقا ماليا إلى الدائن الذي يطلب ذلك، ما لم ينازع في وجود الدين بصفة جدية.\nويجوز لهما ولو تلقائيا، أن تخضعا دفع هذا التسبيق لتقديم ضمان."},{"n":"945","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الرابع — الاستعجال في مادة التسبيق المالي"],"g":"معدلة · ق 13-22","t":"يجوز للمحكمة الإدارية للاستئناف أو لمجلس الدولة، حسب الحالة، الأمر بوقف تنفيذ الأمر القاضي بمنح التسبيق، إذا كان من شأن تنفيذه أن يؤدي إلى نتائج لا يمكن تداركها، وإذا كانت الأوجه المثارة تبدو من خلال التحقيق جدية، ومن طبيعتها أن تبرر إلغاءه ورفض الطلب."},{"n":"946","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الخامس — الاستعجال في مادة إبرام العقود والصفقات"],"g":"","t":"يجوز إخطار المحكمة الإدارية بعريضة، وذلك في حالة الإخلال بالتزامات الإشهار أو المنافسة التي تخضع لها عمليات إبرام العقود الإدارية والصفقات العمومية.\nيتم هذا الإخطار من قبل كل من له مصلحة في إبرام العقد والذي قد يتضرر من هذا الإخلال، وكذلك لممثل الدولة على مستوى الولاية إذا أبرم العقد أو سيبرم من طرف جماعة إقليمية أو مؤسسة عمومية محلية.\nيجوز إخطار المحكمة الإدارية قبل إبرام العقد.\nيمكن للمحكمة الإدارية أن تأمر المتسبب في الإخلال بالامتثال لالتزاماته، وتحدد الأجل الذي يجب أن يمتثل فيه.\nو يمكن لها أيضا الحكم بغرامة تهديدية تسري من تاريخ انقضاء الأجل المحدد.\nو يمكن لها كذلك وبمجرد إخطارها، أن تأمر بتأجيل إمضاء العقد إلى نهاية الإجراءات ولمدة لا تتجاوز عشرين ) (20 يوما."},{"n":"947","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل الخامس — الاستعجال في مادة إبرام العقود والصفقات"],"g":"","t":"تفصل المحكمة الإدارية في أجل عشرين ) (20 يوما تسري من تاريخ إخطارها بالطلبات المقدمة لها طبقا للمادة 946 أعلاه."},{"n":"948","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الثالث — في الاستعجال","الفصل السادس — الاستعجال في المادة الجبائية"],"g":"","t":"يخضع الاستعجال في المادة الجبائية للقواعد المنصوص عليها في قانون الإجراءات الجبائية ولأحكام هذا الباب."},{"n":"949","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الرابع — في طرق الطعن","الفصل الأول — في طرق الطعن العادية","القسم الأول — في الاستئناف"],"g":"معدلة · ق 13-22","t":"يجوز لكل طرف حضر أو استدعي بصفة قانونية، ولو لم يقدم أي دفاع، أن يرفع استثنافا ضد الحكم أو الأمر الصادر عن المحكمة الإدارية أو القرار الصادر في أول درجة عن المحكمة الادارية للاستئناف للجزائر العاصمة."},{"n":"950","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الرابع — في طرق الطعن","الفصل الأول — في طرق الطعن العادية","القسم الأول — في الاستئناف"],"g":"معدلة · ق 13-22","t":"يحدد أجل الاستئناف بشهر ) ( 1 بالنسبة لأحكام المحاكم الإدارية، وشهرين ) ( 2 بالنسبة لقرارات المحاكم الإدارية للاستئناف.\nتخفض هذه الآجال إلى خمسة عشر ) (15 يوما بالنسبة للأوامر الاستعجالية ما لم توجد نصوص خاصة.\nتسري هذه الأجال من يوم التبليغ الرسمي للأمر أو الحكم أو القرار إلى المعني، وتسري من تاريخ انقضاء أجل المعارضة إذا صدر غيابيا.\nتسري هذه الآجال في مواجهة طالب التبليغ الرسمي."},{"n":"951","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الرابع — في طرق الطعن","الفصل الأول — في طرق الطعن العادية","القسم الأول — في الاستئناف"],"g":"معدلة · ق 13-22","t":"يجوز للمستأنف عليه استئناف الحكم فرعيا حتى في حالة سقوط حقه في رفع الاستئناف الأصلي.لا يقبل الاستئناف الفرعي إذا كان الاستئناف الأصلي غير مقبول.\nيترتب على التنازل عن الاستئناف الأصلي عدم قبول الاستئناف الفرعي إذا وقع بعد هذا التنازل.\nتطبق أمام جهات الاستئناف أحكام المادة 334 من هذا القانون المتعلقة بأوامر التحقيق أو التدابير المؤقتة."},{"n":"952","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الرابع — في طرق الطعن","الفصل الأول — في طرق الطعن العادية","القسم الأول — في الاستئناف"],"g":"","t":"لا تكون الأحكام الصادرة قبل الفصل في الموضوع، قابلة للاستئناف إلا مع الحكم الفاصل في موضوع الدعوى، ويتم الاستئناف بعريضة واحدة."},{"n":"953","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الرابع — في طرق الطعن","الفصل الأول — في طرق الطعن العادية","القسم الثاني — في المعارضة"],"g":"معدلة · ق 13-22","t":"تكون الأوامر والأحكام والقرارات الصادرة غيابيا عن المحاكم الإدارية والمحاكم الإدارية للاستئناف و مجلس الدولة كجهة استناف، قابلة للمعارضة."},{"n":"954","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الرابع — في طرق الطعن","الفصل الأول — في طرق الطعن العادية","القسم الثاني — في المعارضة"],"g":"معدلة · ق 13-22","t":"ترفع المعارضة خلال أجل شهر واحد ) (1 من تاريخ التبليغ الرسمي للحكم أو القرار الغيابي.\nويخفض هذا الاجل الى خمسة عشر ) (15 يوما بالنسبة للأوامر."},{"n":"955","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الرابع — في طرق الطعن","الفصل الأول — في طرق الطعن العادية","القسم الثاني — في المعارضة"],"g":"","t":"للمعارضة أثر موقف للتنفيذ، ما لم يؤمر بخلاف ذلك."},{"n":"956","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الرابع — في طرق الطعن","الفصل الثاني — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض"],"g":"","t":"يحدد أجل الطعن بالنقض بشهرين ) (2 يسري من تاريخ التبليغ الرسمي للقرار محل الطعن، ما لم ينص القانون على خلاف ذلك.\nالطعون بالنقض المعروضة أمام مجلس الدولة على الغرف"},{"n":"957","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الرابع — في طرق الطعن","الفصل الثاني — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض"],"g":"","t":"توزع ّ من طرف رئيس مجلس الدولة."},{"n":"958","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الرابع — في طرق الطعن","الفصل الثاني — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض"],"g":"","t":"عندما يقرر مجلس الدولة نقض قرار مجلس المحاسبة يفصل في الموضوع."},{"n":"959","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الرابع — في طرق الطعن","الفصل الثاني — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض"],"g":"معدلة · ق 13-22","t":"تطبق على الطعن بالنقض أمام مجلس الدولة أحكام المواد 349 و 350 و 352 و 353 و 355 و 356 و 357 و 358 و 359 و 360 ومن 362 إلى 379 من هذا القانون."},{"n":"960","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الرابع — في طرق الطعن","الفصل الثاني — في طرق الطعن غير العادية","القسم الثاني — في اعتراض الغير الخارج عن الخصومة"],"g":"معدلة · ق 13-22","t":"يهدف اعتراض الغير الخارج عن الخصومة إلى مراجعة أو إلغاء الحكم أو القرار أو الأمر الذي فصل في موضوع النزاع.\nويفصل في القضية من جديد من حيث الوقائع والقانون."},{"n":"961","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الرابع — في طرق الطعن","الفصل الثاني — في طرق الطعن غير العادية","القسم الثاني — في اعتراض الغير الخارج عن الخصومة"],"g":"","t":"تطبق الأحكام المتعلقة باعتراض الغير الخارج عن الخصومة المنصوص عليها في المواد من 381 إلى 389 من هذا القانون، أمام الجهات القضائية الإدارية."},{"n":"962","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الرابع — في طرق الطعن","الفصل الثاني — في طرق الطعن غير العادية","القسم الثاني — في اعتراض الغير الخارج عن الخصومة"],"g":"","t":"يجرى التحقيق في اعتراض الغير الخارج عن الخصومة بنفس الأشكال المتعلقة بالعريضة المنصوص عليها في المادة 815 وما يليها من هذا القانون."},{"n":"963","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الرابع — في طرق الطعن","الفصل الثاني — في طرق الطعن غير العادية","القسم الثالث — في دعوى تصحيح الأخطاء المادية ودعوى التفسير"],"g":"معدلة · ق 13-22","t":"يجوز للجهة القضائية التي أصدرت الحكم، ولو بعد حيازة هذا الحكم فوة الشيء المقضي به، أن تصحح الخطأ المادي أو الإغفال الذي يشوبه.\nإذا أصدر مجلس الدولة قرارا حضوريا مشوبا بخطأ مادي من شأنه التأثير على الحكم الصادر عنه جاز للخصم المعني أن يرفع طعنا أمامه لتصحيح هذا الخطأ.\nإذا كان الخطأ المادي موضوع طلب التصحيح جوهريا وأثر في القرار، ومنسوبا إلى مرفق القضاء وقد مس بحقوق وواجبات الأطراف، جاز لمجلس الدولة تعديله."},{"n":"964","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الرابع — في طرق الطعن","الفصل الثاني — في طرق الطعن غير العادية","القسم الثالث — في دعوى تصحيح الأخطاء المادية ودعوى التفسير"],"g":"","t":"يجب أن ترفع دعوى تصحيح الأخطاء المادية بنفس الأشكال والإجراءات المقررة لعريضة افتتاح الدعوى.\nيجب تقديم دعوى تصحيح الأخطاء المادية في أجل شهرين ) (2 ابتداء من تاريخ التبليغ الرسمي للحكم أو القرار المشوب بالخطأ."},{"n":"965","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الرابع — في طرق الطعن","الفصل الثاني — في طرق الطعن غير العادية","القسم الثالث — في دعوى تصحيح الأخطاء المادية ودعوى التفسير"],"g":"","t":"ترفع دعوى تفسير الأحكام ويفصل فيها وفقا للأشكال والإجراءات المنصوص عليها في المادة 285 من هذا القانون."},{"n":"966","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الرابع — في طرق الطعن","الفصل الثاني — في طرق الطعن غير العادية","القسم الرابع — في دعوى التماس إعادة النظر"],"g":"معدلة · ق 13-22","t":"لا يجوز الطعن بالتماس إعادة النظر إلا في الأحكام الصادرة نهائيا عن المحاكم الإدارية والقرارات النهائية الصادرة عن المحاكم الإدارية للاستئناف و /أو عن مجلس الدولة كجهة استئناف."},{"n":"967","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الرابع — في طرق الطعن","الفصل الثاني — في طرق الطعن غير العادية","القسم الرابع — في دعوى التماس إعادة النظر"],"g":"معدلة · ق 13-22","t":"يمكن تقديم التماس إعادة النظر في إحدى الحالتين الآتيتين:\n1- إذا اكتشف أن القرار قد صدر بناء على وثائق مزورة قدمت لأول مرة أمام الجهة القضائية الإدارية،\n2- إذا حكم على خصم بسبب عدم تقديم وثيقة قاطعة كانت محتجزة عند الخصم"},{"n":"968","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الرابع — في طرق الطعن","الفصل الثاني — في طرق الطعن غير العادية","القسم الرابع — في دعوى التماس إعادة النظر"],"g":"","t":"يحدد أجل الطعن بالتماس إعادة النظر بشهرين ) (2 يسري من تاريخ التبليغ الرسمي للقرار أو من تاريخ اكتشاف التزوير أو من تاريخ استرداد الوثيقة المحتجزة بغير حق من طرف الخصم."},{"n":"969","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الرابع — في طرق الطعن","الفصل الثاني — في طرق الطعن غير العادية","القسم الرابع — في دعوى التماس إعادة النظر"],"g":"","t":"لا يجوز تقديم التماس إعادة النظر من جديد في القرار الفاصل في دعوى الالتماس."},{"n":"970","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الخامس — في الصلح و التحكيم","الفصل الأول — في الصلح"],"g":"","t":"يجوز للجهات القضائية الإدارية إجراء الصلح في مادة القضاء الكامل."},{"n":"971","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الخامس — في الصلح و التحكيم","الفصل الأول — في الصلح"],"g":"","t":"يجوز إجراء الصلح في أية مرحلة تكون عليها الخصومة."},{"n":"972","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الخامس — في الصلح و التحكيم","الفصل الأول — في الصلح"],"g":"","t":"يتم إجراء الصلح بسعي من الخصوم أو بمبادرة من رئيس تشكيلة الحكم بعد موافقة الخصوم."},{"n":"973","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الخامس — في الصلح و التحكيم","الفصل الأول — في الصلح"],"g":"","t":"إذا حصل صلح، يحرر رئيس تشكيلة الحكم محضرا، يبين فيه ما تم الاتفاق عليه، ويأمر بتسوية النزاع وغلق الملف، ويكون هذا الأمر غير قابل لأي طعن."},{"n":"974","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الخامس — في الصلح و التحكيم","الفصل الأول — في الصلح"],"g":"","t":"لا يجوز للجهة القضائية الإدارية أن تباشر الصلح إلا في النزاعات التي تدخل في اختصاصها."},{"n":"975","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الخامس — في الصلح و التحكيم","الفصل الثاني — في التحكيم","القسم الأول — في الإجراءات"],"g":"","t":"لا يجوز للأشخاص المذكورة في المادة 800 أعلاه، أن تجري تحكيما إلا في الحالات الواردة في الاتفاقيات الدولية التي صادقت عليها الجزائر وفي مادة الصفقات العمومية."},{"n":"976","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الخامس — في الصلح و التحكيم","الفصل الثاني — في التحكيم","القسم الأول — في الإجراءات"],"g":"معدلة · ق 13-22","t":"تطبق الأحكام المتعلقة بالتحكيم المنصوص عليها في هذا القانون، أمام الجهات القضائية الإدارية.\nعندما يكون التحكيم متعلقا بالدولة، يتم اللجوء إلى هذا الإجراء بمبادرة من الوزير المعني أو الوزراء المعنيين.\nعندما يتعلق التحكيم بالولاية أو البلدية، يتم اللجوء إلى هذا الإجراء على التوالي بمبادرة من الوالي أو من رئيس المجلس الشعبي البلدي.\nعندما يتعلق التحكيم بمؤسسة عمومية ذات صبغة إدارية، يتم اللجوء إلى هذا الإجراء بمبادرة من ممثلها القانوني، أو من ممثل السلطة الوصية التي يتبعها.\nعندما يكون التحكيم متعلقا بالهيات العمومية الوطنية أو المنظمات المهنية، يتم اللجوء إلى هذا الإجراء بمبادرة من ممثلها القانوني أو من الجهة الوصية."},{"n":"977","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الخامس — في الصلح و التحكيم","الفصل الثاني — في التحكيم","القسم الثاني — في تنفيذ أحكام التحكيم والطعن فيها"],"g":"","t":"تطبق المقتضيات الواردة في هذا القانون المتعلقة بتنفيذ أحكام التحكيم وطرق الطعن فيها على أحكام التحكيم الصادرة في المادة الإدارية."},{"n":"978","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب السادس — في تنفيذ أحكام الجهات القضائية الإدارية","الفصل الأول — أحكام عامة"],"g":"","t":"عندما يتطلب الأمر أو الحكم أو القرار، إلزام أحد الأشخاص المعنوية العامة أو هيئة تخضع منازعاتها لاختصاص الجهات القضائية الإدارية باتخاذ تدابير تنفيذ معينة، تأمر الجهة القضائية الإدارية المطلوب منها ذلك، في نفس الحكم القضائي، بالتدبير المطلوب مع تحديد أجل للتنفيذ، عند الاقتضاء."},{"n":"979","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب السادس — في تنفيذ أحكام الجهات القضائية الإدارية","الفصل الأول — أحكام عامة"],"g":"","t":"عندما يتطلب الأمر أو الحكم أو القرار، إلزام أحد الأشخاص المعنوية العامة أو هيئة تخضع منازعاتها لاختصاص الجهات القضائية الإدارية باتخاذ تدابير تنفيذ معينة، لم يسبق أن أمرت بها بسبب عدم طلبها في الخصومة السابقة، تأمر الجهة القضائية الإدارية المطلوب منها ذلك، بإصدار قرار إداري جديد في أجل محدد."},{"n":"980","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب السادس — في تنفيذ أحكام الجهات القضائية الإدارية","الفصل الأول — أحكام عامة"],"g":"","t":"يجوز للجهة القضائية الإدارية، المطلوب منها اتخاذ أمر بالتنفيذ وفقا للمادتين 978 و 979 أعلاه، أن تأمر بغرامة تهديدية مع تحديد تاريخ سريان مفعولها."},{"n":"981","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب السادس — في تنفيذ أحكام الجهات القضائية الإدارية","الفصل الأول — أحكام عامة"],"g":"","t":"في حالة عدم تنفيذ أمر أو حكم أو قرار قضائي، ولم تحدد تدابير التنفيذ، تقوم الجهة القضائية المطلوب منها ذلك، بتحديدها، ويجوز لها تحديد أجل للتنفيذ والأمر بغرامة تهديدية."},{"n":"982","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب السادس — في تنفيذ أحكام الجهات القضائية الإدارية","الفصل الأول — أحكام عامة"],"g":"","t":"تكون الغرامة التهديدية مستقلة عن تعويض الضرر."},{"n":"983","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب السادس — في تنفيذ أحكام الجهات القضائية الإدارية","الفصل الأول — أحكام عامة"],"g":"","t":"في حالة عدم التنفيذ الكلي أو الجزئي، أو في حالة التأخير في التنفيذ، تقوم الجهة القضائية الإدارية بتصفية الغرامة التهديدية التي أمرت بها."},{"n":"984","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب السادس — في تنفيذ أحكام الجهات القضائية الإدارية","الفصل الأول — أحكام عامة"],"g":"","t":"يجوز للجهة القضائية تخفيض الغرامة التهديدية أو إلغائها، عند الضرورة."},{"n":"985","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب السادس — في تنفيذ أحكام الجهات القضائية الإدارية","الفصل الأول — أحكام عامة"],"g":"","t":"يجوز للجهة القضائية أن تقرر عدم دفع جزء من الغرامة التهديدية إلى المدعي، إذا تجاوزت قيمة الضرر، وتأمر بدفعه إلى الخزينة العمومية."},{"n":"986","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب السادس — في تنفيذ أحكام الجهات القضائية الإدارية","الفصل الأول — أحكام عامة"],"g":"معدلة · ق 13-22","t":"عندما يقضي الحكم أو القرار الحائز قوة الشيء المقضي به بإلزام أحد أشخاص القانون العام بدفع مبلغ مالي محدد القيمة لفائدة أحد أشخاص القانون الخاص، يقوم المحضر القضائي بالتبليغ الرسمي للتكليف للمنفذ عليه بالوفاء بما تضمنه السند التنفيذي والمصاريف في أجل شهرين ). ( 2 وفي حالة رفض المنفذ عليه التنفيذ بعد انتهاء الأجال، يحرر المحضر القضائي محضر امتناع عن التنفيذ، ويقدم طلب التحصيل إلى أمين خزينة الولاية لمقر الجهة المحكوم عليها بعريضة مكتوبة مرفقة بما يأتي:\n1- نسخة من السند التنفيذي،\n2- محضر التبليغ الرسمي للتكليف بالوفاء،\n3- محضر امتناع عن التنفيذ،\n4- رقم الحساب الجاري للدائن.\nيمكن أمين الخزينة العمومية أن يأمر تلقائيا بسحب مبلغ الدين والمصاريف من حسابات الهيئة المحكوم عليها وتحويله في حساب الدائن في أجل لا يتجاوز ثلاثة ) (3 أشهر من تاريخ إيداع الطلب.\nيمكن أمين الخزينة، قبل عملية التحويل، طلب معلومات إضافية من المحضر القضائي أو من الجهة القضائية المصدرة للحكم أو القرار المطلوب تنفيذه خلال الآجال المحددة في الفقرة أعلاه.\nيمكن الإدارات والهيئات العمومية المنصوص عليها في المادة 800 من هذا القانون المستفيدة من حكم أو قرار قضائي يتضمن مبالغ مالية ضد إدارات وهيئات عمومية أخرى أن تطلب من أمين الخزينة العمومية لمقر الهيئة المحكوم عليها تحصيل تلك المبالغ.\nيقدم طلب التحصيل مباشرة من طرف المستفيد من الحكم أو القرار إلى أمين خزينة الولاية لمقر الجهة المحكوم عليها بعريضة مكتوبة تكون مصحوبة بما يأتي:\n1- نسخة من السند التنفيذي،\n2- كل الوثائق أو المستندات التي تثبت أن جميع المساعي لتنفيذ الحكم أو القرار بقيت طيلة أربعة ) ( 4 أشهر دون نتيجة، من تاريخ التكليف بالوفاء.\nيمكن أمين الخزينة، قبل عملية التحويل، طلب معلومات إضافية لدى الجهة القضائية التي أصدرت الحكم أو القرار المطلوب تنفيذه خلال الأجال المحددة في الفقرة أعلاه."},{"n":"987","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب السادس — في تنفيذ أحكام الجهات القضائية الإدارية","الفصل الثاني — في الأحكام المطبقة على المحاكم الإدارية و المحاكم الادارية — للاستئناف و مجلس الدولة"],"g":"معدلة · ق 13-22","t":"لا يجوز تقديم طلب إلى الجهة القضائية الإدارية من أجل الأمر باتخاذ التدابير الضرورية لتنفيذ حكمها أو قرارها النهائي وطلب الغرامة التهديدية لتنفيذه، عند الاقتضاء، إلا بعد رفض التنفيذ من طرف المحكوم عليه، وانقضاء أجل ثلاثة ) (3 أشهر، يبدأ من تاريخ التبليغ الرسمي للحكم.\nغير أنه فيما يخص الأوامر الاستعجالية، يجوز تقديم الطلب بشأنها بدون أجل.\nفي الحالة التي تحدد الجهة القضائية الإدارية في حكمها أو قرارها محل التنفيذ أجلا للمحكوم عليه لاتخاذ تدابير تنفيذ معينة، لا يجوز تقديم الطلب إلا بعد انقضاء هذا الأجل."},{"n":"988","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب السادس — في تنفيذ أحكام الجهات القضائية الإدارية","الفصل الثاني — في الأحكام المطبقة على المحاكم الإدارية و المحاكم الادارية — للاستئناف و مجلس الدولة"],"g":"","t":"في حالة رفض التظلم الموجه إلى الإدارة من أجل تنفيذ الحكم الصادر عن الجهة القضائية الإدارية، يبدأ سريان الأجل المحدد في المادة 987 أعلاه، بعد قرار الرفض."},{"n":"989","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب السادس — في تنفيذ أحكام الجهات القضائية الإدارية","الفصل الثاني — في الأحكام المطبقة على المحاكم الإدارية و المحاكم الادارية — للاستئناف و مجلس الدولة"],"g":"معدلة · ق 13-22","t":"في نهاية كل سنة، يوجه رئيس كل محكمة إدارية للاستئناف تقريرا مرفقا بتقارير المحاكم الادارية التابعة لها إلى رئيس مجلس الدولة حول صعوبات التنفيذ ومختلف الإشكالات المعاينة، واقتراح الحلول الملائمة لها."},{"n":"990","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الأول — في الصلح والوساطة","الفصل الأول — في الصلح"],"g":"","t":"يجوز للخصوم التصالح تلقائيا، أو بسعي من القاضي، في جميع مراحل الخصومة."},{"n":"991","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الأول — في الصلح والوساطة","الفصل الأول — في الصلح"],"g":"","t":"تتم محاولة الصلح في المكان والوقت الذي يراهما القاضي مناسبين ما لم توجد نصوص خاصة في القانون تقرر خلاف ذلك."},{"n":"992","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الأول — في الصلح والوساطة","الفصل الأول — في الصلح"],"g":"","t":"يثبت الصلح في محضر، يوقع عليه الخصوم والقاضي وأمين الضبط ويودع بأمانة ضبط الجهة القضائية."},{"n":"993","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الأول — في الصلح والوساطة","الفصل الأول — في الصلح"],"g":"","t":"يعد محضر الصلح سندا تنفيذيا بمجرد إيداعه بأمانة الضبط."},{"n":"994","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الأول — في الصلح والوساطة","الفصل الثاني — في الوساطة"],"g":"","t":"يجب على القاضي عرض إجراء الوساطة على الخصوم في جميع المواد، باستثناء قضايا شؤون الأسرة والقضايا العمالية و كل ما من شأنه أن يمس بالنظام العام.\nإذا قبل الخصوم هذا الإجراء، يعين القاضي وسيطا لتلقي وجهة نظر كل واحد منهم ومحاولة التوفيق بينهم، لتمكينهم من إيجاد حل للنزاع."},{"n":"995","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الأول — في الصلح والوساطة","الفصل الثاني — في الوساطة"],"g":"","t":"تمتد الوساطة إلى كل النزاع أو إلى جزء منه.\nلا يترتب على الوساطة تخلي القاضي عن القضية، و يمكنه اتخاذ أي تدبير يراه ضروريا في أي وقت."},{"n":"996","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الأول — في الصلح والوساطة","الفصل الثاني — في الوساطة"],"g":"","t":"لا يمكن أن تتجاوز مدة الوساطة ثلاثة ) (3 أشهر.\nو يمكن تجديدها لنفس المدة مرة واحدة بطلب من الوسيط عند الاقتضاء، بعد موافقة الخصوم."},{"n":"997","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الأول — في الصلح والوساطة","الفصل الثاني — في الوساطة"],"g":"","t":"تسند الوساطة إلى شخص طبيعي أو إلى جمعية.\nعندما يكون الوسيط المعين جمعية، يقوم رئيسها بتعيين أحد أعضائها لتنفيذ الإجراء باسمها ويخطر القاضي بذلك."},{"n":"998","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الأول — في الصلح والوساطة","الفصل الثاني — في الوساطة"],"g":"","t":"يجب أن يعين الشخص الطبيعي المكلف بالوساطة من بين الأشخاص المعترف لهم بحسن السلوك والاستقامة، وأن تتوفر فيه الشروط الآتية:\n1- ألا يكون قد تعرض إلى عقوبة عن جريمة مخلة بالشرف، وألا يكون ممنوعا من حقوقه المدنية،\n2- أن يكون مؤهلا للنظر في المنازعة المعروضة عليه،\n3- أن يكون محايدا ومستقلا في ممارسة الوساطة، تحدد كيفيات تطبيق هذه المادة عن طريق التنظيم."},{"n":"999","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الأول — في الصلح والوساطة","الفصل الثاني — في الوساطة"],"g":"","t":"يجب أن يتضمن الأمر القاضي بتعيين الوسيط ما يأتي:\n1- موافقة الخصوم،\n2- تحديد الآجال الأولى الممنوحة للوسيط للقيام بمهمته وتاريخ رجوع القضية إلى الجلسة."},{"n":"1000","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الأول — في الصلح والوساطة","الفصل الثاني — في الوساطة"],"g":"","t":"بمجرد النطق بالأمر القاضي بتعيين الوسيط، يقوم أمين الضبط بتبليغ نسخة منه للخصوم والوسيط.\nيخطر الوسيط القاضي بقبوله مهمة الوساطة دون تأخير، ويدعو الخصوم إلى أول لقاء للوساطة."},{"n":"1001","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الأول — في الصلح والوساطة","الفصل الثاني — في الوساطة"],"g":"","t":"يجوز للوسيط بعد موافقة الخصوم سماع كل شخص يقبل ذلك، ويرى في سماعه فائدة لتسوية النزاع، ويخطر القاضي بكل الصعوبات التي تعترضه في مهمته."},{"n":"1002","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الأول — في الصلح والوساطة","الفصل الثاني — في الوساطة"],"g":"","t":"يمكن للقاضي في أي وقت إنهاء الوساطة، بطلب من الوسيط أو من الخصوم.\nيمكن للقاضي إنهاء الوساطة تلقائيا، عندما يتبين له استحالة السير الحسن لها.\nوفي جميع الحالات، ترجع القضية إلى الجلسة، ويستدعى الوسيط والخصوم إليها عن طريق أمين الضبط."},{"n":"1003","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الأول — في الصلح والوساطة","الفصل الثاني — في الوساطة"],"g":"","t":"عند إنهاء الوسيط لمهمته، يخبر القاضي كتابيا بما توصل إليه الخصوم من اتفاق أو عدمه.\nفي حالة الاتفاق يحرر الوسيط محضرا يضمنه محتوى الاتفاق، ويوقعه والخصوم.\nترجع القضية أمام القاضي في التاريخ المحدد لها مسبقا."},{"n":"1004","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الأول — في الصلح والوساطة","الفصل الثاني — في الوساطة"],"g":"","t":"يقوم القاضي بالمصادقة على محضر الاتفاق بموجب أمر غير قابل لأي طعن، ويعد محضر الاتفاق سندا تنفيذيا."},{"n":"1005","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الأول — في الصلح والوساطة","الفصل الثاني — في الوساطة"],"g":"","t":"يلتزم الوسيط بحفظ السر إزاء الغير."},{"n":"1006","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الأول — في اتفاقيات التحكيم"],"g":"","t":"يمكن لكل شخص اللجوء إلى التحكيم في الحقوق التي له مطلق التصرف فيها.\nلا يجوز التحكيم في المسائل المتعلقة بالنظام العام أو حالة الأشخاص وأهليتهم.\nولا يجوز للأشخاص المعنوية العامة أن تطلب التحكيم، ما عدا في علاقاتها الاقتصادية الدولية أو في إطار الصفقات العمومية."},{"n":"1007","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الأول — في اتفاقيات التحكيم","القسم الأول — في شرط التحكيم"],"g":"","t":"شرط التحكيم هو الاتفاق الذي يلتزم بموجبه الأطراف في عقد متصل بحقوق متاحة بمفهوم المادة 1006 أعلاه، لعرض النزاعات التي قد تثار بشأن هذا العقد على التحكيم."},{"n":"1008","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الأول — في اتفاقيات التحكيم","القسم الأول — في شرط التحكيم"],"g":"","t":"يثبت شرط التحكيم، تحت طائلة البطلان، بالكتابة في الاتفاقية الأصلية أو في الوثيقة التي تستند إليها.\nيجب أن يتضمن شرط التحكيم، تحت طائلة البطلان، تعيين المحكم أو المحكم، ين أو تحديد كيفيات تعيينهم."},{"n":"1009","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الأول — في اتفاقيات التحكيم","القسم الأول — في شرط التحكيم"],"g":"","t":"إذا اعترضت صعوبة تشكيل محكمة التحكيم، بفعل أحد الأطراف أو بمناسبة تنفيذ إجراءات تعيين المحكم أو المحكمين، يعين المحكم أو المحكمون من قبل رئيس المحكمة الواقع في دائرة اختصاصها محل إبرام العقد أو محل تنفيذه.\nإذا كان شرط التحكيم باطلا أو غير كاف لتشكيل محكمة التحكيم، يعاين رئيس المحكمة ذلك ويصرح بألا وجه للتعيين."},{"n":"1010","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الأول — في اتفاقيات التحكيم","القسم الأول — في شرط التحكيم"],"g":"","t":"يعرض النزاع على محكمة التحكيم من قبل الأطراف معا أو من الطرف الذي يهمه التعجيل."},{"n":"1011","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الأول — في اتفاقيات التحكيم","القسم الثاني — في اتفاق التحكيم"],"g":"","t":"اتفاق التحكيم هو الاتفاق الذي يقبل الأطراف بموجبه عرض نزاع سبق نشوؤه على التحكيم."},{"n":"1012","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الأول — في اتفاقيات التحكيم","القسم الثاني — في اتفاق التحكيم"],"g":"","t":"يحصل الاتفاق على التحكيم كتابيا.يجب أن يتضمن اتفاق التحكيم، تحت طائلة البطلان، موضوع النزاع وأسماء المحكمين، أو كيفية تعيينهم.\nإذا رفض المحكم المعين القيام بالمهمة المسندة إليه، يستبدل بغيره بأمر من طرف رئيس المحكمة المختصة."},{"n":"1013","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الأول — في اتفاقيات التحكيم","القسم الثاني — في اتفاق التحكيم"],"g":"","t":"يجوز للأطراف الاتفاق على التحكيم، حتى أثناء سريان الخصومة أمام الجهة القضائية."},{"n":"1014","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الأول — في اتفاقيات التحكيم","القسم الثالث — أحكام مشتركة"],"g":"","t":"لا تسند مهمة التحكيم لشخص طبيعي، إلا إذا كان متمتعا بحقوقه المدنية.\nإذا عينت اتفاقية التحكيم شخصا معنويا، تولى هذا الأخير تعيين عضو أو أكثر من أعضائه بصفة محكم."},{"n":"1015","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الأول — في اتفاقيات التحكيم","القسم الثالث — أحكام مشتركة"],"g":"","t":"لا يعد تشكيل محكمة التحكيم صحيحا، إلا إذا قبل المحكم أو المحكمون بالمهمة المسندة إليهم.\nإذا علم المحكم أنه قابل للرد، يخبر الأطراف بذلك، ولا يجوز له القيام بالمهمة إلا بعد موافقتهم."},{"n":"1016","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الأول — في اتفاقيات التحكيم","القسم الثالث — أحكام مشتركة"],"g":"","t":"يجوز رد المحكم في الحالات الآتية:\n1- عندما لا تتوفر فيه المؤهلات المتفق عليها بين الأطراف،\n2- عندما يوجد سبب رد منصوص عليه في نظام التحكيم الموافق عليه من قبل الأطراف،\n3- عندما تتبين من الظروف شبهة مشروعة في استقلاليته، لاسيما بسبب وجود مصلحة أو علاقة اقتصادية أو عائلية مع أحد الأطراف مباشرة أو عن طريق وسيط.\nلا يجوز طلب رد المحكم من الطرف الذي كان قد عينه، أو شارك في تعيينه، إلا لسبب علم به بعد التعيين تبلغ محكمة التحكيم و الطرف الآخر دون تأخير بسبب الرد.\nفي حالة النزاع، إذا لم يتضمن نظام التحكيم كيفيات تسويته أولم يسع الأطراف لتسوية إجراءات الرد، يفصل القاضي في ذلك بأمر بناء على طلب من يهمه التعجيل.\nهذا الأمر غير قابل لأي طعن."},{"n":"1017","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الأول — في اتفاقيات التحكيم","القسم الثالث — أحكام مشتركة"],"g":"","t":"تتشكل محكمة التحكيم من محكم أو عدة محكمين بعدد فردي."},{"n":"1018","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الأول — في اتفاقيات التحكيم","القسم الثالث — أحكام مشتركة"],"g":"","t":"يكون اتفاق التحكيم صحيحا ولو لم يحدد أجلا لإنهائه، وفي هذه الحالة يلزم المحكمون بإتمام مهمتهم في ظرف أربعة ) (4 أشهر تبدأ من تاريخ تعيينهم أو من تاريخ إخطار محكمة التحكيم.غير أنه يمكن تمديد هذا الأجل بموافقة الأطراف، وفي حالة عدم الموافقة عليه، يتم التمديد وفقا لنظام التحكيم، وفي غياب ذلك، يتم من طرف رئيس المحكمة المختصة.\nلا يجوز عزل المحكمين خلال هذا الأجل إلا باتفاق جميع الأطراف."},{"n":"1019","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الثاني — في الخصومة التحكيمية"],"g":"","t":"تطبق على الخصومة التحكيمية الآجال والأوضاع المقررة أمام الجهات القضائية ما لم يتفق الأطراف على خلاف ذلك."},{"n":"1020","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الثاني — في الخصومة التحكيمية"],"g":"","t":"تنجز أعمال التحقيق و المحاضر من قبل جميع المحكم، ين إلا إذا أجاز اتفاق التحكيم سلطة ندب أحدهم للقيام بها."},{"n":"1021","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الثاني — في الخصومة التحكيمية"],"g":"","t":"لا يجوز للمحكمين التخلي عن المهمة إذا شرعوا فيها، ولا يجوز ردهم إلا إذا طرأ سبب من أسباب الرد بعد تعيينهم.\nإذا طعن بالتزوير مدنيا في ورقة، أو إذا حصل عارض جنائي، يحيل المحكمون الأطراف إلى الجهة القضائية المختصة، ويستأنف سريان أجل التحكيم من تاريخ الحكم في المسألة العارضة."},{"n":"1022","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الثاني — في الخصومة التحكيمية"],"g":"","t":"يجب على كل طرف تقديم دفاعه ومستنداته قبل انقضاء أجل التحكيم بخمسة عشر ) (15 يوما على الأقل، و إلا فصل المحكم بناء على ما قدم إليه خلال هذا الأجل."},{"n":"1023","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الثاني — في الخصومة التحكيمية"],"g":"","t":"يفصل المحكمون وفقا لقواعد القانون."},{"n":"1024","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الثاني — في الخصومة التحكيمية"],"g":"","t":"ينتهي التحكيم:\n1- بوفاة أحد المحكمين أو رفضه القيام بمهمته بمبرر أو تنحيته أو حصول مانع له، ما لم يوجد شرط مخالف، أو إذا اتفق الأطراف على استبداله أو استبداله من قبل المحكم أو المحكمين الباقين.وفي حالة غياب الاتفاق تطبق أحكام المادة 1009 أعلاه،\n2- بانتهاء المدة المقررة للتحكيم، فإذا لم تشترط المدة، فبانتهاء مدة أربعة )(4 أشهر،\n3- بفقد الشيء موضوع النزاع أو انقضاء الدين المتنازع فيه،\n4- بوفاة أحد أطراف العقد."},{"n":"1025","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الثالث — في أحكام التحكيم"],"g":"","t":"تكون مداولات المحكمين سرية."},{"n":"1026","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الثالث — في أحكام التحكيم"],"g":"","t":"تصدر أحكام التحكيم بأغلبية الأصوات."},{"n":"1027","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الثالث — في أحكام التحكيم"],"g":"","t":"يجب أن تتضمن أحكام التحكيم عرضا موجزا لادعاءات الأطراف وأوجه دفاعهم.\nيجب أن تكون أحكام التحكيم مسببة."},{"n":"1028","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الثالث — في أحكام التحكيم"],"g":"","t":"يتضمن حكم التحكيم البيانات الآتية:\n1- اسم ولقب المحكم أو المحكمين،\n2- تاريخ صدور الحكم،\n3- مكان إصداره،\n4- أسماء وألقاب الأطراف وموطن كل منهم وتسمية الأشخاص المعنوية ومقرها الاجتماعي،\n5- أسماء وألقاب المحامين أو من مثل أو ساعد الأطراف، عند الاقتضاء."},{"n":"1029","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الثالث — في أحكام التحكيم"],"g":"","t":"توقع أحكام التحكيم من قبل جميع المحكمين.\nوفي حالة امتناع الأقلية عن التوقيع يشير بقية المحكمين إلى ذلك، ويرتب الحكم أثره باعتباره موقعا من جميع المحكمين."},{"n":"1030","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الثالث — في أحكام التحكيم"],"g":"","t":"يتخلى المحكم عن النزاع بمجرد الفصل فيه.\nغير أنه يمكن للمحكم تفسير الحكم، أو تصحيح الأخطاء المادية و الإغفالات التي تشوبه، طبقا للأحكام الواردة في هذا القانون."},{"n":"1031","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الثالث — في أحكام التحكيم"],"g":"","t":"تحوز أحكام التحكيم حجية الشيء المقضي فيه بمجرد صدورها فيما يخص النزاع المفصول فيه."},{"n":"1032","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الرابع — طرق الطعن في أحكام التحكيم"],"g":"","t":"أحكام التحكيم غير قابلة للمعارضة.\nيجوز الطعن فيها عن طريق اعتراض الغير الخارج عن الخصومة أمام المحكمة المختصة قبل عرض النزاع على التحكيم."},{"n":"1033","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الرابع — طرق الطعن في أحكام التحكيم"],"g":"","t":"يرفع الاستئناف في أحكام التحكيم في أجل شهر واحد ) (1 من تاريخ النطق بها، أمام المجلس القضائي الذي صدر في دائرة اختصاصه حكم التحكيم، ما لم يتنازل الأطراف عن حق الاستئناف في اتفاقية التحكيم."},{"n":"1034","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الرابع — طرق الطعن في أحكام التحكيم"],"g":"","t":"تكون القرارات الفاصلة في الاستئناف وحدها قابلة للطعن بالنقض طبقا للأحكام المنصوص عليها في هذا القانون."},{"n":"1035","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الخامس — في تنفيذ أحكام التحكيم"],"g":"","t":"يكون حكم التحكيم النهائي أو الجزئي أو التحضيري قابلا للتنفيذ بأمر من قبل رئيس المحكمة التي صدر في دائرة اختصاصها، ويودع أصل الحكم في أمانة ضبط المحكمة من الطرف الذي يهمه التعجيل.\nيتحمل الأطراف نفقات إيداع العرائض والوثائق وأصل حكم التحكيم.\nيمكن للخصوم استئناف الأمر القاضي برفض التنفيذ في أجل خمسة عشر ) (15 يوما من تاريخ الرفض أمام المجلس القضائي."},{"n":"1036","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الخامس — في تنفيذ أحكام التحكيم"],"g":"","t":"يسلم رئيس أمناء الضبط نسخة رسمية ممهورة بالصيغة التنفيذية من حكم التحكيم لمن يطلبها من الأطراف."},{"n":"1037","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الخامس — في تنفيذ أحكام التحكيم"],"g":"","t":"تطبق القواعد المتعلقة بالنفاذ المعجل للأحكام على أحكام التحكيم المشمولة بالنفاذ المعجل."},{"n":"1038","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل الخامس — في تنفيذ أحكام التحكيم"],"g":"","t":"لا يحتج بأحكام التحكيم تجاه الغير."},{"n":"1039","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل السادس — في الأحكام الخاصة بالتحكيم التجاري الدولي","القسم الأول — أحكام عامة"],"g":"","t":"يعد التحكيم دوليا، بمفهوم هذا القانون، التحكيم الذي يخص النزاعات المتعلقة بالمصالح الاقتصادية لدولتين على الأقل."},{"n":"1040","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل السادس — في الأحكام الخاصة بالتحكيم التجاري الدولي","القسم الأول — أحكام عامة"],"g":"","t":"تسري اتفاقية التحكيم على النزاعات القائمة والمستقبلية.\nيجب من حيث الشكل، وتحت طائلة البطلان، أن تبرم اتفاقية التحكيم كتابة، أو بأية وسيلة اتصال أخرى تجيز الإثبات بالكتابة.\nتكون اتفاقية التحكيم صحيحة من حيث الموضوع، إذا استجابت للشروط التي يضعها إما القانون الذي اتفق الأطراف على اختياره أو القانون المنظم لموضوع النزاع أو القانون الذي يراه المحكم ملائما.\nلا يمكن الاحتجاج بعدم صحة اتفاقية التحكيم، بسبب عدم صحة العقد الأصلي."},{"n":"1041","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل السادس — في الأحكام الخاصة بالتحكيم التجاري الدولي","القسم الثاني تنظيم التحكيم الدولي","الفرع الأول في تعيين المحكمين"],"g":"","t":"يمكن للأطراف، مباشرة أو بالرجوع إلى نظام التحكيم، تعيين المحكم أو المحكمين أو تحديد شروط تعيينهم وشروط عزلهم أو استبدالهم.\nفي غياب التعيين، وفي حالة صعوبة تعيين المحكمين أو عزلهم أو استبدالهم، يجوز للطرف الذي يهمه التعجيل القيام بما يأتي:\n1- رفع الأمر إلى رئيس المحكمة التي يقع في دائرة اختصاصها التحكيم، إذا كان التحكيم يجري في الجزائر،\n2- رفع الأمر إلى رئيس محكمة الجزائر، إذا كان التحكيم يجري في الخارج واختار الأطراف تطبيق قواعد الإجراءات المعمول بها في الجزائر."},{"n":"1042","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل السادس — في الأحكام الخاصة بالتحكيم التجاري الدولي","القسم الثاني تنظيم التحكيم الدولي","الفرع الأول في تعيين المحكمين"],"g":"","t":"إذا لم تحدد الجهة القضائية المختصة في اتفاقية التحكيم، يؤول الاختصاص إلى المحكمة التي يقع في دائرة اختصاصها مكان إبرام العقد أو مكان التنفيذ."},{"n":"1043","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل السادس — في الأحكام الخاصة بالتحكيم التجاري الدولي","القسم الثاني تنظيم التحكيم الدولي","الفرع الثاني — في الخصومة التحكيمية"],"g":"","t":"يمكن أن تضبط في اتفاقية التحكيم، الإجراءات الواجب إتباعها في الخصومة مباشرة أو استنادا على نظام تحكيم، كما يمكن إخضاع هذه الإجراءات إلى قانون الإجراءات الذي يحدده الأطراف في اتفاقية التحكيم.\nإذا لم تنص الاتفاقية على ذلك، تتولى محكمة التحكيم ضبط الإجراءات، عند الحاجة، مباشرة أو استنادا إلى قانون أو نظام تحكيم."},{"n":"1044","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل السادس — في الأحكام الخاصة بالتحكيم التجاري الدولي","القسم الثاني تنظيم التحكيم الدولي","الفرع الثاني — في الخصومة التحكيمية"],"g":"","t":"تفصل محكمة التحكيم في الاختصاص الخاص بها.ويجب إثارة الدفع بعدم الاختصاص قبل أي دفاع في الموضوع.\nتفصل محكمة التحكيم في اختصاصها بحكم أولي إلا إذا كان الدفع بعدم الاختصاص مرتبطا بموضوع النزاع."},{"n":"1045","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل السادس — في الأحكام الخاصة بالتحكيم التجاري الدولي","القسم الثاني تنظيم التحكيم الدولي","الفرع الثاني — في الخصومة التحكيمية"],"g":"","t":"يكون القاضي غير مختص بالفصل في موضوع النزاع، إذا كانت الخصومة التحكيمية قائمة، أو إذا تبين له وجود اتفاقية تحكيم على أن تثار من أحد الأطراف."},{"n":"1046","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل السادس — في الأحكام الخاصة بالتحكيم التجاري الدولي","القسم الثاني تنظيم التحكيم الدولي","الفرع الثاني — في الخصومة التحكيمية"],"g":"","t":"يمكن لمحكمة التحكيم أن تأمر بتدابير مؤقتة أو تحفظية بناء على طلب أحد الأطراف، ما لم ينص اتفاق التحكيم على خلاف ذلك.\nإذا لم يقم الطرف المعني بتنفيذ هذا التدبير إراديا، جاز لمحكمة التحكيم أن تطلب تدخل القاضي المختص، ويطبق في هذا الشأن قانون بلد القاضي.\nيمكن لمحكمة التحكيم أو للقاضي أن يخضع التدابير المؤقتة أو التحفظية لتقديم الضمانات الملائمة من قبل الطرف الذي طلب هذا التدبير."},{"n":"1047","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل السادس — في الأحكام الخاصة بالتحكيم التجاري الدولي","القسم الثاني تنظيم التحكيم الدولي","الفرع الثاني — في الخصومة التحكيمية"],"g":"","t":"تتولى محكمة التحكيم البحث عن الأدلة."},{"n":"1048","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل السادس — في الأحكام الخاصة بالتحكيم التجاري الدولي","القسم الثاني تنظيم التحكيم الدولي","الفرع الثاني — في الخصومة التحكيمية"],"g":"","t":"إذا اقتضت الضرورة مساعدة السلطة القضائية في تقديم الأدلة أو تمديد مهمة المحكمين أو تثبيت الإجراءات أو في حالات أخرى، جاز لمحكمة التحكيم أو للأطراف بالاتفاق مع هذه الأخيرة، أو للطرف الذي يهمه التعجيل بعد الترخيص له من طرف محكمة التحكيم، أن يطلبوا بموجب عريضة تدخل القاضي المختص، ويطبق في هذا الشأن قانون بلد القاضي."},{"n":"1049","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل السادس — في الأحكام الخاصة بالتحكيم التجاري الدولي","القسم الثاني تنظيم التحكيم الدولي","الفرع الثاني — في الخصومة التحكيمية"],"g":"","t":"يجوز لمحكمة التحكيم إصدار أحكام اتفاق أطراف أو أحكام جزئية، ما لم يتفق الأطراف على خلاف ذلك."},{"n":"1050","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل السادس — في الأحكام الخاصة بالتحكيم التجاري الدولي","القسم الثاني تنظيم التحكيم الدولي","الفرع الثاني — في الخصومة التحكيمية"],"g":"","t":"تفصل محكمة التحكيم في النزاع عملا بقواعد القانون الذي اختاره الأطراف، وفي غياب هذا الاختيار تفصل حسب قواعد القانون والأعراف التي تراها ملائمة."},{"n":"1051","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل السادس — في الأحكام الخاصة بالتحكيم التجاري الدولي","القسم الثالث — في الاعتراف بأحكام التحكيم الدولي وتنفيذها الجبري وطرق الطعن — فيها","الفرع الأول — في الاعتراف بأحكام التحكيم الدولي"],"g":"","t":"يتم الاعتراف بأحكام التحكيم الدولي في الجزائر إذا أثبت من تمسك بها وجودها، وكان هذا الاعتراف غير مخالف للنظام العام الدولي.\nوتعتبر قابلة للتنفيذ في الجزائر وبنفس الشروط، بأمر صادر عن رئيس المحكمة التي صدرت أحكام التحكيم في دائرة اختصاصها أو محكمة محل التنفيذ إذا كان مقر محكمة التحكيم موجودا خارج الإقليم الوطني."},{"n":"1052","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل السادس — في الأحكام الخاصة بالتحكيم التجاري الدولي","القسم الثالث — في الاعتراف بأحكام التحكيم الدولي وتنفيذها الجبري وطرق الطعن — فيها","الفرع الأول — في الاعتراف بأحكام التحكيم الدولي"],"g":"","t":"يثبت حكم التحكيم بتقديم الأصل مرفقا باتفاقية التحكيم أو بنسخ عنهما، تستوفي شروط صحتها."},{"n":"1053","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل السادس — في الأحكام الخاصة بالتحكيم التجاري الدولي","القسم الثالث — في الاعتراف بأحكام التحكيم الدولي وتنفيذها الجبري وطرق الطعن — فيها","الفرع الأول — في الاعتراف بأحكام التحكيم الدولي"],"g":"","t":"تودع الوثائق المذكورة في المادة 1052 أعلاه، بأمانة ضبط الجهة القضائية المختصة من الطرف المعني بالتعجيل."},{"n":"1054","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل السادس — في الأحكام الخاصة بالتحكيم التجاري الدولي","القسم الثالث — في الاعتراف بأحكام التحكيم الدولي وتنفيذها الجبري وطرق الطعن — فيها","الفرع الثاني — في تنفيذ أحكام التحكيم الدولي"],"g":"","t":"تطبق أحكام المواد من 1035 إلى 1038 أعلاه، فيما يتعلق بتنفيذ أحكام التحكيم الدولي."},{"n":"1055","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل السادس — في الأحكام الخاصة بالتحكيم التجاري الدولي","القسم الثالث — في الاعتراف بأحكام التحكيم الدولي وتنفيذها الجبري وطرق الطعن — فيها","الفرع الثالث — في طرق الطعن في أحكام التحكيم الدولي"],"g":"","t":"يكون الأمر القاضي برفض الاعتراف أو برفض التنفيذ قابلا للاستئناف."},{"n":"1056","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل السادس — في الأحكام الخاصة بالتحكيم التجاري الدولي","القسم الثالث — في الاعتراف بأحكام التحكيم الدولي وتنفيذها الجبري وطرق الطعن — فيها","الفرع الثالث — في طرق الطعن في أحكام التحكيم الدولي"],"g":"","t":"لا يجوز استئناف الأمر القاضي بالاعتراف أو بالتنفيذ إلا في الحالات الآتية:\n1- إذا فصلت محكمة التحكيم بدون اتفاقية تحكيم أو بناء على اتفاقية باطلة أو انقضاء مدة الاتفاقية،\n2- إذا كان تشكيل محكمة التحكيم أو تعيين المحكم الوحيد مخالفا للقانون،\n3- إذا فصلت محكمة التحكيم بما يخالف المهمة المسندة إليها،\n4- إذا لم يراع مبدأ الوجاهية،\n5- إذا لم تسبب محكمة التحكيم حكمها، أو إذا وجد تناقض في الأسباب،\n6- إذا كان حكم التحكيم مخالفا للنظام العام الدولي."},{"n":"1057","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل السادس — في الأحكام الخاصة بالتحكيم التجاري الدولي","القسم الثالث — في الاعتراف بأحكام التحكيم الدولي وتنفيذها الجبري وطرق الطعن — فيها","الفرع الثالث — في طرق الطعن في أحكام التحكيم الدولي"],"g":"","t":"يرفع الاستئناف أمام المجلس القضائي خلال أجل شهر واحد ) (1 ابتداء من تاريخ التبليغ الرسمي لأمر رئيس المحكمة."},{"n":"1058","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل السادس — في الأحكام الخاصة بالتحكيم التجاري الدولي","القسم الثالث — في الاعتراف بأحكام التحكيم الدولي وتنفيذها الجبري وطرق الطعن — فيها","الفرع الثالث — في طرق الطعن في أحكام التحكيم الدولي"],"g":"","t":"يمكن أن يكون حكم التحكيم الدولي الصادر في الجزائر موضوع طعن بالبطلان في الحالات المنصوص عليها في المادة 1056 أعلاه.\nلا يقبل الأمر الذي يقضي بتنفيذ حكم التحكيم الدولي المشار إليه أعلاه أي طعن، غير أن الطعن ببطلان حكم التحكيم يرتب بقوة القانون الطعن في أمر التنفيذ أو تخلي المحكمة عن الفصل في طلب التنفيذ، إذا لم يتم الفصل فيه."},{"n":"1059","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل السادس — في الأحكام الخاصة بالتحكيم التجاري الدولي","القسم الثالث — في الاعتراف بأحكام التحكيم الدولي وتنفيذها الجبري وطرق الطعن — فيها","الفرع الثالث — في طرق الطعن في أحكام التحكيم الدولي"],"g":"","t":"يرفع الطعن بالبطلان في حكم التحكيم المنصوص عليه في المادة 1058 أعلاه، أمام المجلس القضائي الذي صدر حكم التحكيم في دائرة اختصاصه.ويقبل الطعن ابتداء من تاريخ النطق بحكم التحكيم.\nلا يقبل هذا الطعن بعد أجل شهر واحد ) (1 من تاريخ التبليغ الرسمي للأمر القاضي بالتنفيذ.\nالطعون وأجل ممارستها، المنصوص عليها في"},{"n":"1060","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل السادس — في الأحكام الخاصة بالتحكيم التجاري الدولي","القسم الثالث — في الاعتراف بأحكام التحكيم الدولي وتنفيذها الجبري وطرق الطعن — فيها","الفرع الثالث — في طرق الطعن في أحكام التحكيم الدولي"],"g":"","t":"يوقف تقديم ّ المواد 1055 و 1056 و 1058، تنفيذ أحكام التحكيم."},{"n":"1061","p":["الكتاب الخامس — في الطرق البديلة لحل النزاعات","الباب الثاني — في التحكيم","الفصل السادس — في الأحكام الخاصة بالتحكيم التجاري الدولي","القسم الثالث — في الاعتراف بأحكام التحكيم الدولي وتنفيذها الجبري وطرق الطعن — فيها","الفرع الثالث — في طرق الطعن في أحكام التحكيم الدولي"],"g":"","t":"تكون القرارات الصادرة تطبيقا للمواد 1055 و 1056 و 1058 أعلاه، قابلة للطعن بالنقض."},{"n":"1062","p":["أحكام انتقالية وختامية"],"g":"","t":"يسري مفعول هذا القانون، بعد سنة ) (1 من تاريخ نشره في الجريدة الرسمية."},{"n":"1063","p":["أحكام انتقالية وختامية"],"g":"","t":"تبقى قواعد الاختصاص النوعي والإقليمي المنصوص عليها في المادة 3 ) 40 و ( 4 من هذا القانون، سارية المفعول إلى حين تنصيب الأقطاب المتخصصة."},{"n":"1064","p":["أحكام انتقالية وختامية"],"g":"","t":"تلغى بمجرد سريان مفعول هذا القانون، أحكام الأمر رقم – 154 66 المؤرخ في 18 صفر عام 1386 الموافق 8 يونيو سنة 1966 والمتضمن قانون الإجراءات المدنية، المعدل والمتمم.\nالجزائرية للجمهورية سمية"},{"n":"1065","p":["أحكام انتقالية وختامية"],"g":"","t":"ينشر هذا القانون في الجريدة الرسمية للجمهورية الجزائرية الديمقراطية الشعبية."},{"n":"أحكام أخرى","p":["أحكام أخرى — المادة 13 من القانون 13-22"],"g":"","t":"المادة 13 من القانون 13-22 المعدل لقانون الاجراءات المدنية والادارية:\nتسري قواعد الاختصاص النوعي والإقليمي المنصوص عليها في هذا القانون، الخاصة بالجهات القضائية الإدارية والمحاكم التجارية المتخصصة ابتداء من تاريخ تنصيب الجهات القضائية الجديدة.\nوتبقى الجهات القضائية الإدارية والأقسام التجارية مختصة بالفصل في الدعاوى المرفوعة أمامها قبل تاريخ تنصيب الجهات القضائية الجديدة."}]</script>
<script>
const D=JSON.parse(document.getElementById('d').textContent),$=s=>document.querySelector(s);
const norm=s=>s.replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632);
D.forEach((a,i)=>{a.i=i;a.k=norm(a.t);a.nn=a.n.split(' ')[0]});
let S={fav:{},rev:{},note:{},fs:19,th:''};
try{Object.assign(S,JSON.parse(localStorage.getItem('cpca')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('cpca',JSON.stringify(S))}catch(e){}};
const applyUI=()=>{document.documentElement.style.setProperty('--fs',S.fs+'px');S.th?document.documentElement.dataset.theme=S.th:delete document.documentElement.dataset.theme};applyUI();
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const V={'ا':'اأإآٱ','ي':'يىئ','ه':'هة','و':'وؤ'},DI='[\\u064B-\\u065F\\u0670\\u0640]*';
const rx=ts=>ts.length?new RegExp(ts.map(t=>[...t].map(c=>V[c]?'['+V[c]+']':c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join(DI)).join('|'),'g'):null;
const hl=(t,ts)=>{const r=rx(ts);return t.split('\n').map(x=>'<p>'+(r?esc(x).replace(r,m=>'<mark>'+m+'</mark>'):esc(x))+'</p>').join('')};
const books=[...new Set(D.map(a=>a.p[0]).filter(Boolean))];
books.forEach(b=>$('#bk').insertAdjacentHTML('beforeend','<option>'+esc(b)+'</option>'));
const card=(a,ts)=>`<article class="c"><header><b class="n">المادة ${a.n}</b>${a.g?`<span class="tg">${a.g}</span>`:''}<span class="sp"></span>
<button data-a="fav" data-i="${a.i}" class="${S.fav[a.n]?'on':''}" title="مفضلة">★</button><button data-a="rev" data-i="${a.i}" class="${S.rev[a.n]?'on':''}" title="تمت مراجعتها">✓</button><button data-a="note" data-i="${a.i}" title="ملاحظة">✎</button><button data-a="cp" data-i="${a.i}" title="نسخ">⧉</button></header>
<div class="bc">${esc(a.p.join(' ‹ '))}</div><div class="t">${hl(a.t,ts)}</div><textarea class="nb ${S.note[a.n]?'v':''}" data-n="${a.n}" placeholder="ملاحظتك على هذه المادة…">${esc(S.note[a.n]||'')}</textarea></article>`;
let tab='s',page=1,scope=null,sub='fav',nodes=[],fc={m:'all',d:'n',cur:null,sh:false};
const inScope=a=>scope&&scope.path.every((s,i)=>a.p[i]===s);
const M=$('#m');
function show(arr,ts){const n=page*40;M.insertAdjacentHTML('beforeend',arr.slice(0,n).map(a=>card(a,ts)).join('')+(arr.length>n?`<button data-a="more" style="width:100%">عرض المزيد (${arr.length-n})</button>`:''))}
function results(){const raw=$('#q').value.trim(),bk=$('#bk').value,q=norm(raw).replace(/\s+/g,' ');
 let pool=D.filter(a=>(!bk||a.p[0]===bk)&&(!scope||inScope(a)));let r,ts=[];
 if(!q){r=pool}else{const nm=q.match(/^(?:الماده|ماده|م)?\s*(\d+)$/);ts=$('#ex').checked?[q]:q.split(' ');
  const score=a=>ts.reduce((s,t)=>s+a.k.split(t).length-1,0);
  r=pool.filter(a=>ts.every(t=>a.k.includes(t))).sort((a,b)=>score(b)-score(a));
  if(nm){const ex=pool.filter(a=>a.nn===nm[1]);r=[...ex,...pool.filter(a=>!ex.includes(a)&&a.k.includes(nm[1]))];ts=[nm[1]];if(ex.length)ts=[]}}
 return{r,ts,q}}
function drawS(){const{r,ts,q}=results();M.innerHTML=(scope?`<div class="chip">النطاق: ${esc(scope.path[scope.path.length-1])} <button data-a="clr">✕</button></div>`:'')+`<div class="inf">${q?r.length+' نتيجة':'تصفح '+r.length+' مادة'} ${q?'<button data-a="ask">🤖 ابحث بالمعنى واشرح</button>':''}</div>`;show(r,ts)}
function tree(){nodes=[];const root={c:new Map,l:[]};D.forEach(a=>{let n=root;a.p.forEach((s,d)=>{if(!n.c.has(s))n.c.set(s,{c:new Map,l:[],s,path:a.p.slice(0,d+1)});n=n.c.get(s);n.l.push(a)})});
 const h=n=>[...n.c.values()].map(x=>{nodes.push(x);const id=nodes.length-1;return`<details><summary><span>${esc(x.s)}</span><small>${x.l[0].nn}–${x.l[x.l.length-1].nn}</small><button data-a="scope" data-i="${id}">عرض</button></summary>${h(x)}</details>`}).join('');return h(root)}
function drawT(){M.innerHTML='<div class="inf">اضغط على أي عنوان لفتحه، وعلى «عرض» لقراءة موادّه.</div>'+tree()}
function drawR(){const tot=D.length,rv=D.filter(a=>S.rev[a.n]).length,fv=D.filter(a=>S.fav[a.n]).length,nt=D.filter(a=>S.note[a.n]).length;
 const sel=(id,v,o)=>`<select id="${id}">${o.map(([k,l])=>`<option value="${k}"${k===v?' selected':''}>${l}</option>`).join('')}</select>`;
 let h=`<div class="c"><b>تقدّم المراجعة: ${rv} / ${tot}</b><div class="bar"><i style="width:${rv/tot*100}%"></i></div><span class="inf">★ ${fv} مفضلة · ✎ ${nt} ملاحظة</span></div>
<div class="c fc"><div class="row" style="justify-content:center">${sel('fm2',fc.m,[['all','كل المواد'],['new','غير المراجَعة'],['fav','المفضلة'],['scope','النطاق المختار']])}${sel('fd',fc.d,[['n','أرى الرقم ← أتذكّر النص'],['t','أرى النص ← أخمّن الرقم']])}</div>`;
 if(!fc.cur)nextC();const a=fc.cur;
 if(!a)h+='<p class="inf">لا توجد مواد في هذه المجموعة.</p>';else{
  h+=fc.d==='n'?`<div class="big">المادة ${a.n}</div><div class="bc">${esc(a.p.join(' ‹ '))}</div>`+(fc.sh?`<div class="t">${hl(a.t,[])}</div>`:''):`<div class="t">${hl(fc.sh?a.t:a.t.slice(0,900),[])}</div>`+(fc.sh?`<div class="big">المادة ${a.n}</div><div class="bc">${esc(a.p.join(' ‹ '))}</div>`:'');
  h+=`<div class="acts">${fc.sh?`<button class="on" data-a="know">✓ أعرفها</button><button data-a="skip">↻ التالية</button>`:`<button class="on" data-a="rv">إظهار الإجابة</button><button data-a="skip">تخطّي</button>`}</div>`}
 h+=`</div><div class="row" style="margin-bottom:10px"><button data-a="sub" data-s="fav" class="${sub==='fav'?'on':''}">★ المفضلة</button><button data-a="sub" data-s="note" class="${sub==='note'?'on':''}">✎ ملاحظاتي</button><button data-a="sub" data-s="rev" class="${sub==='rev'?'on':''}">✓ المراجَعة</button></div>`;
 M.innerHTML=h;const L=D.filter(a=>sub==='fav'?S.fav[a.n]:sub==='note'?S.note[a.n]:S.rev[a.n]);
 if(!L.length)M.insertAdjacentHTML('beforeend','<div class="inf">لا شيء هنا بعد.</div>');else show(L,[])}
function nextC(){const p=D.filter(a=>fc.m==='fav'?S.fav[a.n]:fc.m==='new'?!S.rev[a.n]:fc.m==='scope'?inScope(a):1);fc.cur=p.length?p[Math.random()*p.length|0]:null;fc.sh=false}
function draw(){page=page||1;M.className=tab==='c'?'wide':'';tab==='s'?drawS():tab==='c'?drawC():tab==='t'?drawT():drawR()}
function go(t){tab=t;page=1;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));draw();scrollTo(0,0)}
document.addEventListener('click',e=>{const t=e.target.closest('nav button');if(t)return go(t.dataset.t);
 const b=e.target.closest('[data-a]');if(!b)return;const A=b.dataset.a,a=D[+b.dataset.i];
 if(A==='fav'||A==='rev'){const k=A==='fav'?'fav':'rev';S[k][a.n]?delete S[k][a.n]:S[k][a.n]=1;save();b.classList.toggle('on');if(tab==='r'&&A!=='x')drawR()}
 else if(A==='note'){const n=b.closest('.c').querySelector('.nb');n.classList.toggle('v');n.focus()}
 else if(A==='cp'){try{navigator.clipboard.writeText('المادة '+a.n+': '+a.t);b.textContent='✔';setTimeout(()=>b.textContent='⧉',1200)}catch(x){}}
 else if(A==='more'){page++;draw()}
 else if(A==='scope'){e.preventDefault();scope={path:nodes[+b.dataset.i].path};$('#q').value='';go('s')}
 else if(A==='clr'){scope=null;draw()}
 else if(A==='sub'){sub=b.dataset.s;drawR()}
 else if(A==='rv'){fc.sh=true;drawR()}
 else if(A==='know'){S.rev[fc.cur.n]=1;save();nextC();drawR()}
 else if(A==='skip'){nextC();drawR()}});
document.addEventListener('input',e=>{const n=e.target.dataset.n;if(n){e.target.value.trim()?S.note[n]=e.target.value:delete S.note[n];save()}});
document.addEventListener('change',e=>{if(e.target.id==='fm2'){fc.m=e.target.value;nextC();drawR()}if(e.target.id==='fd'){fc.d=e.target.value;fc.sh=false;drawR()}});
let tm;$('#q').addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(()=>{page=1;tab!=='s'?go('s'):draw()},180)});
$('#bk').onchange=$('#ex').onchange=()=>{page=1;tab!=='s'?go('s'):draw()};
$('#fm').onclick=()=>{S.fs=Math.min(30,S.fs+2);applyUI();save()};$('#fl').onclick=()=>{S.fs=Math.max(14,S.fs-2);applyUI();save()};
$('#th').onclick=()=>{const dk=document.documentElement.dataset.theme==='dark'||(!S.th&&matchMedia('(prefers-color-scheme:dark)').matches);S.th=dk?'light':'dark';applyUI();save()};
/* ===== الباحث الذكي (محلي، بلا إنترنت) ===== */
const byN=new Map(D.map(a=>[a.n,a]));
const PL={اجال:'اجل',مواعيد:'ميعاد',دعاوي:'دعوي',احكام:'حكم',قرارات:'قرار',اوامر:'امر',عقود:'عقد',محاكم:'محكمه',شهود:'شاهد',خصوم:'خصم',طعون:'طعن',اطراف:'طرف',وثايق:'وثيقه',مستندات:'مستند',اجراءات:'اجراء',جلسات:'جلسه',عرايض:'عريضه',تبليغات:'تبليغ'};
const stem=w=>{w=w.replace(/^(وال|بال|كال|فال|لل|ال)/,'');return PL[w]||w};
const tok=s=>norm(s).replace(/[^\u0621-\u064A0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>1).map(stem).filter(w=>w.length>1);
const SW=new Set(tok('ما ماذا هي هو هل كم كيف متى اين لماذا في من الى على عن ان او ثم هذا هذه ذلك التي الذي كان يكون تكون عند اذا لا بعد قبل بين مع حول خلال يجب يمكن يجوز القانون مادة المادة اريد اعطني اشرح لي ماهو ماهي وما ايضا كل اي بدون فيما بها به له لها وهل حالة حاله'));
const GR=[['استئناف','مجلس قضائي،الدرجة الثانية'],['نقض','المحكمة العليا،أوجه الطعن'],['أجل،آجال،مهلة،ميعاد،مواعيد','أيام،شهر،ابتداء،تاريخ'],['تبليغ،إعلان','محضر قضائي،تكليف بالحضور،تسليم'],['دعوى،دعاوى','عريضة،افتتاح،رفع،قيد،رسم'],['اختصاص','محكمة،إقليمي،نوعي،موطن'],['خبرة،خبير','تقرير،ندب'],['شهادة،شهود،شاهد','تحقيق،سماع،يمين'],['تنفيذ','سند تنفيذي،حجز،جبري،محضر'],['استعجال،استعجالي،استعجالية','أمر على عريضة،تدبير،وقتي'],['صلح،وساطة','تسوية،ودية'],['تحكيم،محكم','اتفاق التحكيم'],['بطلان،عدم قبول','دفع،شكل،طائلة'],['مصاريف،رسوم،غرامة','نفقات،كفالة'],['مساعدة قضائية','إعفاء،محامي،تمثيل'],['إداري،إدارية','الدولة،ولاية،بلدية،شخص معنوي'],['حكم،قرار','منطوق،تسبيب،حجية'],['غيابي،غياب،معارضة','تخلف،حضور'],['إشكال','وقف التنفيذ،نفاذ معجل'],['إيجار،طرد،إخلاء','سكن'],['طلاق،نفقة،حضانة،زواج','شؤون الأسرة'],['تجاري،تجارية،إفلاس','قسم تجاري،شركة'],['إثبات،تزوير','سند،كتابة،ورقة رسمية'],['تقادم،سقوط','انقضاء الخصومة،تنازل،شطب'],['نيابة','النيابة العامة،وكيل الجمهورية'],['التماس','إعادة النظر'],['تدخل،إدخال','ضمان،الغير'],['جلسة،تأجيل','مرافعة،مناقشة'],['تنحي،مخاصمة،تجريح','رد القاضي']].map(([h,e])=>[new Set(tok(h)),new Set(tok(e))]);
let IX=null;
function buildIx(){const inv=new Map,len=[];D.forEach((a,i)=>{const ts=tok(a.t+' '+a.p.join(' ')),c=new Map;ts.forEach(t=>c.set(t,(c.get(t)||0)+1));len[i]=ts.length||1;c.forEach((tf,t)=>{let l=inv.get(t);if(!l)inv.set(t,l=[]);l.push([i,tf])})});IX={inv,len,avg:len.reduce((a,b)=>a+b,0)/len.length,vocab:[...inv.keys()]}}
const sim=(v,t)=>v===t||(t.length>=4&&v.length>=4&&(v.startsWith(t)||t.startsWith(v)));
function retrieve(W,k,base){if(!IX)buildIx();const sc=new Map,N=D.length;
 W.forEach((w0,t)=>IX.vocab.forEach(v=>{if(!sim(v,t))return;const l=IX.inv.get(v),idf=Math.log(1+(N-l.length+.5)/(l.length+.5)),w=w0*(v===t?1:.6);l.forEach(([i,tf])=>sc.set(i,(sc.get(i)||0)+w*idf*tf*2.2/(tf+1.2*(.25+.75*IX.len[i]/IX.avg))))}));
 const cand=[...sc.entries()].sort((a,b)=>b[1]-a[1]).slice(0,40);
 if(base&&base.length>1)cand.forEach(x=>{const a=D[x[0]],ts=a.ts||(a.ts=[...new Set(tok(a.t+' '+a.p.join(' ')))]);x[1]*=.4+.6*base.filter(t=>ts.some(v=>sim(v,t))).length/base.length});
 return cand.sort((a,b)=>b[1]-a[1]).slice(0,k).map(x=>D[x[0]])}
function analyze(q,prev){const base=tok(q).filter(t=>!SW.has(t)),W=new Map;base.forEach(t=>W.set(t,Math.max(W.get(t)||0,1)));
 const ex=new Set();GR.forEach(([h,e])=>{if(base.some(t=>[...h].some(x=>sim(x,t)||x===t)))[...h,...e].forEach(x=>{if(!W.has(x))ex.add(x)})});ex.forEach(x=>W.set(x,.35));
 if(prev&&base.length<=2&&!/\d/.test(q))tok(prev).filter(t=>!SW.has(t)&&!W.has(t)).forEach(t=>W.set(t,.4));
 return{W,base}}
const sents=a=>a.t.split(/\n|(?<=[.؟!:؛])\s+/).map(s=>s.trim()).filter(s=>s.length>20);
function bestSent(a,W){let b='',bs=-1;sents(a).forEach(s=>{const ts=new Set(tok(s));let sc=0;W.forEach((w,t)=>{if([...ts].some(x=>sim(x,t)))sc+=w});sc=sc/Math.sqrt(ts.size+8);if(sc>bs){bs=sc;b=s}});return(b||a.t).slice(0,260)}
const DL=/(?:في أجل|خلال أجل|خلال|في ظرف|أجل|مهلة|بعد)\s[^.،؛:]{0,45}?(?:يوما|يوم|أيام|شهرين|شهر|أشهر|سنتين|سنة|سنوات|ساعة|ساعات)(?:\s*واحد)?/;
let hist=[],paneArts=[],paneTs=[];
const findA=n=>{n=String(n).replace(/\s+/g,' ').trim();return byN.get(n)||D.find(x=>x.nn===n)};
const fmt=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[م:\s*([^\]]+?)\]/g,(m,n)=>`<button class="ch" data-a="open" data-n="${n.replace(/"/g,'')}">م ${n}</button>`).replace(/\n/g,'<br>');
const msgHtml=m=>m.role==='user'?`<div class="msg u">${esc(m.text)}</div>`:`<div class="msg b">${m.sum?`<div class="sum"><b>الملخص</b>${fmt(m.sum)}</div>`:''}${m.ans?`<div>${fmt(m.ans)}</div>`:''}${m.arts&&m.arts.length?`<div class="chips">${m.arts.map(x=>`<button data-a="open" data-n="${esc(x.n).replace(/"/g,'')}">م ${esc(x.n)}</button>`).join('')}</div>`:''}${m.sum?'<div class="inf" style="margin:8px 0 0">بحث آلي داخل نص القانون؛ راجع نص المادة كاملًا قبل الاعتماد عليه.</div>':''}</div>`;
function upd(){const e=$('#msgs');if(!e||tab!=='c')return;e.innerHTML=hist.length?hist.map(msgHtml).join(''):`<div class="msg b">أنا باحثك الذكي داخل القانون. اكتب سؤالك بلغتك العادية وسأبحث بالمعنى (مع المرادفات والمصطلحات القانونية)، وألخّص، وأعرض المواد في النافذة الجانبية.<div class="chips">${['ما هي آجال الطعن بالاستئناف؟','متى يُقبل الطعن بالنقض؟','ما شروط قبول الدعوى؟','كيف يتم التبليغ الرسمي؟'].map(x=>`<button data-a="ex" data-q="${x}">${x}</button>`).join('')}</div></div>`;
 const l=e.lastElementChild;if(hist.length&&l)l.scrollIntoView({block:'nearest'})}
function drawPane(){const p=$('#pane');if(!p)return;p.innerHTML=`<div class="ph"><b>📖 المواد ذات الصلة</b><span class="inf">${paneArts.length}</span></div>`+(paneArts.length?paneArts.map(x=>{const a=findA(x.n);return a?`<div id="pa-${a.i}">${x.why?`<div class="why">💡 ${esc(x.why)}</div>`:''}${card(a,paneTs)}</div>`:''}).join(''):'<div class="inf">ستظهر هنا المواد المطابقة لسؤالك، وعند الضغط على رقم مادة في الجواب.</div>')}
function drawC(){M.innerHTML='<div class="g"><section><div id="msgs"></div><div class="ask"><textarea id="cq" rows="2" placeholder="اسأل: مثلاً ما مهلة الطعن في أمر استعجالي؟"></textarea><button class="on" data-a="send">بحث</button></div></section><aside id="pane"></aside></div>';upd();drawPane()}
function send(txt){txt=(txt||'').trim();if(!txt)return;
 const prev=[...hist].reverse().find(m=>m.role==='user'),u={role:'user',text:txt},b={role:'bot'};hist.push(u,b);
 const nm=norm(txt).match(/(?:الماده|ماده|م)\s*(\d+)/),{W,base}=analyze(txt,prev&&prev.text);paneTs=base;
 let c=retrieve(W,12,base);const ex=nm?D.filter(a=>a.nn===nm[1]):[];c=[...ex,...c.filter(a=>!ex.includes(a))].slice(0,10);
 if(!c.length){b.sum='لم أجد مواد مطابقة. جرّب كلمات أخرى أو مصطلحًا قانونيًا أدق.';paneArts=[]}
 else{const top=c.slice(0,4);b.sum=top.map(a=>`• [م:${a.n}] ${bestSent(a,W)}`).join('\n');
  const dl=[];c.slice(0,8).forEach(a=>{const m=a.t.match(DL);if(m)dl.push(`• [م:${a.n}] ${m[0].replace(/\s*\)\s*\(\d+\)?/g,'')}`)});
  b.ans=(dl.length&&/اجل|مهله|ميعاد|كم|متي|مده/.test(norm(txt))?'**الآجال الواردة في المواد الأقرب:**\n'+dl.slice(0,6).join('\n')+'\n\n':'')+`**موضع هذه الأحكام:** ${top[0].p.join(' › ')}\n**عدد المواد المطابقة المعروضة:** ${c.length}`;
  b.arts=c.slice(0,8).map(a=>({n:a.n}));paneArts=c.map(a=>({n:a.n,why:bestSent(a,W)}))}
 upd();drawPane()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const A=b.dataset.a;
 if(A==='send'){const t=$('#cq');const v=t.value;t.value='';send(v)}
 else if(A==='ex')send(b.dataset.q);
 else if(A==='ask'){const v=$('#q').value;go('c');send(v)}
 else if(A==='open'){const a=findA(b.dataset.n);if(!a)return;if(!paneArts.some(x=>x.n===a.n))paneArts.unshift({n:a.n,why:''});drawPane();const el=$('#pa-'+a.i);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.querySelector('.c').classList.add('fl')}}});
document.addEventListener('keydown',e=>{if(e.target.id==='cq'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();const v=e.target.value;e.target.value='';send(v)}});

draw();
</script></body></html>
