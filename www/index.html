ر.\nعقود الإيجار التي ليس لها تاريخ ثابت، وعقود الإيجار التي أبرمها المدين المحجوز عليه بعد قيد أمر الحجز، لا تكون نافذة في حق الدائن الحاجز.\nغير أنه يجوز للمدين المحجوز عليه، أن يطلب استصدار أمر على عريضة، يرخص له إيجار العقارات و /أو الحقوق العينية العقارية، إذا كان ذلك يزيد من إيرادات العقار ولا يضر بمصالح أطراف الحجز، دون الإخلال بالأحكام المتعلقة بعقود الإيجار الواجبة الشهر."},{"n":"732","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم الرابع — في قيد أمر الحجز بالمحافظة العقارية وآثاره"],"g":"","t":"تلحق بالعقار و /أو الحق العيني العقاري، ثماره وإيراداته من تاريخ قيد أمر الحجز بالمحافظة العقارية.\nوللمدين المحجوز عليه أن يبيع ثمار العقار الملحق به متى كان ذلك من أعمال الإدارة الحسنة، ويودع الثمن بأمانة ضبط المحكمة.\nيجوز للدائن الحاجز أن يطلب من رئيس المحكمة الترخيص له بأمر على عريضة، بحصاد المحاصيل الزراعية وجني الثمار والفواكه وبيعها بالمزاد العلني أو بيعها عن طريق وسيط أو بأية طريقة أخرى، ويودع ثمنها بأمانة ضبط المحكمة."},{"n":"733","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم الرابع — في قيد أمر الحجز بالمحافظة العقارية وآثاره"],"g":"","t":"إذا قام المدين المحجوز عليه أو حائز العقار أو الكفيل العيني باختلاس أو إتلاف الأموال المذكورة في المادة 732 أعلاه، تعرض إلى العقوبات المقررة في قانون العقوبات للجرائم المتعلقة بالأموال المحجوزة، فضلا عن التعويضات المدنية، عند الاقتضاء."},{"n":"734","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم الرابع — في قيد أمر الحجز بالمحافظة العقارية وآثاره"],"g":"","t":"إذا كان العقار و /أو الحق العيني العقاري، مثقلا بتأمين عيني وانتقلت ملكيته بعقد رسمي مشهر إلى الغير قبل قيد أمر الحجز، وجب إنذار الغير الحائز وتكليفه بدفع مبلغ الدين أو تخليته العقار، وإلا بيع العقار جبرا عليه.\nيجب أن يشتمل الإنذار، فضلا عن البيانات المعتادة، على ما يأتي:\n1- بيان السند التنفيذي والإجراءات التالية له،\n2- بيان أمر الحجز وتاريخ القيد،\n3- إنذار الحائز وتكليفه بالوفاءبم بلغ الدين خلال أجل شهر واحد ) (1 من تاريخ التبليغ الرسمي، وإلا بيع العقار جبرا عليه.\nتطبق جميع الأحكام المنصوص عليها في المواد 731 و 732 و 733 أعلاه، عند إنذار الحائز وتكليفه بالوفاء."},{"n":"735","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم الرابع — في قيد أمر الحجز بالمحافظة العقارية وآثاره"],"g":"","t":"لا يجوز للمدين المحجوز عليه، ولا لحائز العقار، ولا للكفيل العيني، بعد قيد أمر الحجز بالمحافظة العقارية، أن ينقل ملكية العقار و /أو الحق العيني العقاري المحجوز، ولا أن يرتب تأمينات عينية عليه، وإلا كان تصرفه قابلا للإبطال.\nغير أنه يجوز لبائع العقار المحجوز ومقرض ثمنه والشريك المقاسم، أن يقيد حق الامتياز على العقار في الآجال والأوضاع المنصوص عليها في القانون المدني."},{"n":"736","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم الرابع — في قيد أمر الحجز بالمحافظة العقارية وآثاره"],"g":"","t":"إذا أودع المدين المحجوز عليه، أو حائز العقار، أو الكفيل العيني بأمانة الضبط، أو بين يدي المحضر القضائي، قبل جلسة المزايدة، مبلغا كافيا للوفاء بأصل الدين والمصاريف المترتبة عليه للدائنين المقيدين في الشهادة العقارية والحاجزين، فإن كل التصرفات الواردة على العقار والمتعلقة بنقل الملكية أو بترتيب تأمينات عينية عليه، تكون نافذة."},{"n":"737","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم الخامس — في قائمة شروط البيع"],"g":"","t":"إذا لم يقم المدين المحجوز عليه بالوفاء خلال أجل ثلاثين ) (30 يوما من تاريخ التبليغ الرسمي لأمر الحجز، يحرر المحضر القضائي قائمة شروط البيع ويودعها بأمانة ضبط المحكمة التي يوجد في دائرة اختصاصها العقار المحجوز.\nفي حالة تعدد العقارات و /أو الحقوق العينية العقارية المحجوزة، تودع قائمة شروط البيع في أمانة ضبط المحكمة التي يوجد فيها أحد هذه العقارات.\nيجب أن تتضمن قائمة شروط البيع، فضلا عن البيانات المعتادة، ما يأتي:\n1- اسم ولقب كل من الدائنين المقيدين والحاجز والمدين المحجوز عليه، وموطن كل منهم،\n2- السند التنفيذي الذي تم الحجزبم قتضاه ومبلغ الدين،\n3- أمر الحجز وتاريخ تبليغه الرسمي وقيده، وتاريخ إنذار الحائز أو الكفيل العيني إن وجد،\n4- تعيين العقار و /أو الحق العيني العقاري المحجوز، تعيينا دقيقا، لا سيما موقعه وحدوده ونوعه ومشتملاته ومساحته ورقم القطعة الأرضية واسمها عند الاقتضاء، مفرزا أو مشاعا، وغيرها من البيانات التي تفيد في تعيينه، وإن كان العقار بناية، يبين الشارع ورقمه وأجزاء العقارات،\n5- تحديد شاغل العقار وصفته وسبب الشغل، أو أنه شاغر،\n6- شروط البيع والثمن الأساسي والمصاريف،\n7- تجزئة العقار إلى أجزاء، إن كان في ذلك فائدة أفضل عند البيع، مع تحديد الثمن الأساسي لكل جزء، وتوضيح الترتيب الذي سيجري فيه البيع، عند الاقتضاء، وإذا كان محل الحجز وحدة استغلال اقتصادية أو مجموعة فلاحية، لا يجوز تجزئتها،\n8- بيان المحكمة التي سيتم أمامها البيع.يؤشر رئيس المحكمة المختص إقليميا على محضر إيداع قائمة شروط البيع، ويحدد فيه جلسة للاعتراضات وجلسة لاحقة للبيع وتاريخ وساعة انعقادهما.\nإذا خلت قائمة شروط البيع من أحد هذه البيانات، كانت قابلة للإبطال بناء على طلب كل ذي مصلحة خلال أجل أقصاه جلسة الاعتراضات وإلا سقط حقه.\nفي حالة إلغاء قائمة شروط البيع، يعاد تجديدها على نفقة المحضر القضائي."},{"n":"738","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم الخامس — في قائمة شروط البيع"],"g":"","t":"ترفق مع قائمة شروط البيع المستندات الآتية:\n1- نسخة من السند التنفيذي الذي تم الحجز بمقتضاه،\n2- نسخة من أمر الحجز،\n3- نسخة من محضر التبليغ الرسمي للمحجوز عليه أو الحائز أو الكفيل العيني إن وجد،\n4- شهادة عقارية تتضمن القيود التي حصلت إلى غاية تاريخ الحجز،\n5- مستخرج جدول الضريبة العقارية."},{"n":"739","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم السادس — في تحديد الثمن الأساسي"],"g":"","t":"يحدد الثمن الأساسي، الذي يبدأ به البيع بالمزاد العلني والقيمة التقريبية له في السوق، للعقار و /أو الحق العيني العقاري المحجوز، جملة أو على أجزاء من طرف خبير عقاري، يعين بأمر على عريضة، بناء على طلب المحضر القضائي أو الدائن الحاجز، بعد إثبات إيداع أتعاب الخبير بأمانة الضبط والمحددة مسبقا من طرف رئيس المحكمة.\nيجب على الخبير إيداع تقرير التقييم بأمانة الضبط خلال الأجل الذي يحدده رئيس المحكمة، على أن لا يتجاوز هذا الأجل عشرة ) (10 أيام من تاريخ تعيينه وإلا استبدل بغيره."},{"n":"740","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم السابع — في التبليغ الرسمي لقائمة شروط البيع"],"g":"","t":"يجب على المحضر القضائي خلال خمسة عشر ) (15 يوما الموالية لإيداع قائمة شروط البيع بأمانة الضبط، أن يبلغ رسميا الأشخاص الآتية:\n1- المدين المحجوز عليه،\n2- الكفيل العيني والحائز للعقار و /أو الحق العيني العقاري إن وجدا،\n3- المالك ين على الشيوع إن كان العقار و /أو الحق العيني العقاري مشاعا،\n4- الدائنين المقيدين كلبم فرده،\n5- بائع العقار أو مقرض ثمنه أو الشريك المقاسم أو المقايض به، إن وجد، وفي حالة الوفاة، يكون التبليغ الرسمي إلى ورثة هؤلاء بصفة جماعية، دون تحديد الأسماء والصفات، في موطنهم، فإن لم يكن لهم موطن معروف ففي موطن المتوفى."},{"n":"741","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم السابع — في التبليغ الرسمي لقائمة شروط البيع"],"g":"","t":"يتضمن محضر التبليغ الرسمي لقائمة شروط البيع، فضلا عن البيانات المعتادة، ما يأتي:\n1- تاريخ إيداع قائمة شروط البيع،\n2- تعيين العقارات و /أو الحقوق العينية العقارية المحجوزة بالإجمال،\n3- الثمن الأساسي المحدد جملة أو لكل جزء،\n4- تاريخ وساعة الجلسة المحددة للنظر في الاعتراضات المحتملة، وتاريخ وساعة جلسة البيع بالمزاد العلني،\n5- إنذار المبلغ لهم بالاطلاع على قائمة شروط البيع لإبداء الملاحظات والاعتراضات المحتملة، وإلا سقط حقهم في التمسك بها."},{"n":"742","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم الثامن — في الأعتراضات وطلب وقف بيع العقار"],"g":"","t":"تقدم الاعتراضات بعريضة من طرف الأشخاص المشار إليهم في المادة 740 أعلاه، أو من ورثتهم إلى رئيس المحكمة، قبل جلسة الاعتراضات بثلاثة ) (3 أيام على الأقل، وإلا سقط حقهم في التمسك بها.\nتسجل العريضة في سجل خاص بعد دفع الرسوم حسب تاريخ ورودها، وتعقد جلسة الاعتراضات في غرفة المشورة بحضور المعترض والحاجز والمحضر القضائي.\nيفصل رئيس المحكمة في الاعتراضات، بأمر غير قابل لأي طعن، في أجل أقصاه ثمانية ) (8 أيام.\nإذا لم يقدم أي اعتراض بالجلسة، يؤشر أمين الضبط بذلك في السجل الخاص به، ويشرع المحضر القضائي في إجراءات الإعلان عن البيع بالمزاد العلني."},{"n":"743","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم الثامن — في الأعتراضات وطلب وقف بيع العقار"],"g":"","t":"يجوز لكل من المدين المحجوز عليه أو الحائز أو الكفيل العيني، أن يطلب بطريق الاستعجال، وقف إجراءات البيع مؤقتا على عقار و /أو حق عيني عقاري أو أكثر من العقارات المحجوزة، إذا أثبت أن قيمة إحدى هذه العقارات و / أو الحق العيني العقاري كاف للوفاء بديون جميع الدائنين.\nيحدد الأمر الاستعجالي العقارات و /أو الحقوق العينية العقارية محل التوقيف المؤقت للبيع.\nمع ذلك يجوز لكل دائن حتى بعد الحكم برسو المزاد أن يستمر في بيع تلك العقارات و /أو الحقوق العينية العقارية إذا لم يكف الثمن الناتج عن البيع للوفاء بدينه."},{"n":"744","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم الثامن — في الأعتراضات وطلب وقف بيع العقار"],"g":"","t":"يجوز للمدين المحجوز عليه أو الحائز أو الكفيل العيني، أن يطلب بطريق الاستعجال، تأجيل إجراءات بيع العقار و /أو الحق العيني العقاري، إذا أثبت أن الإيرادات السنوية لهذا العقار و /أو الحق العيني العقاري لسنة واحدة كافية للوفاء بديون جميع الدائنين يحدد الأمر الفاصل بتأجيل البيع، الأجل الذي يستأنف فيه إجراءات البيع إذا لم يتم الوفاء، مراعيا في ذلك المهلة اللازمة للمدين المحجوز عليه للوفاء، على أن لا تتجاوز سنة واحدة ).(1"},{"n":"745","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم الثامن — في الأعتراضات وطلب وقف بيع العقار"],"g":"","t":"إذا وجد بين الدائنين بائع العقار و /أو الحق العيني العقاري أو أحد المقايض ين به أو الشريك المقاسم، بلغ له المحضر القضائي إنذارا بأنه في حالة عدم رفع دعوى الفسخ لعدم دفع الثمن أو الفرق في الثمن أو طلب إعادة البيع عن طريق المزاد العلني والتأشير بذلك على قائمة شروط البيع قبل الجلسة المحددة للاعتراضات بثلاثة ) (3 أيام على الأقل، وإلا سقط حقه في ذلك.\nغير أنه إذا رفع دعوى الفسخ أو قدم طلبا لإعادة البيع بالمزاد العلني في الأجل المحدد في الفقرة الأولى أعلاه، قام المحضر القضائي بتأشير ذلك على قائمة شروط البيع، وتوقف عن الاستمرار في إجراءات البيع إلى ح ين الفصل في هذه الدعوى من طرف قاضي الموضوع."},{"n":"746","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم الثامن — في الأعتراضات وطلب وقف بيع العقار"],"g":"","t":"ترفع دعوى الفسخ وفقا للإجراءات العادية أمام المحكمة المختصة ببيع العقار و /أو الحق العيني العقاري."},{"n":"747","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم التاسع — في إجراءات البيع بالمزاد العلني"],"g":"","t":"إذا لم يتم تحديد تاريخ ومكان جلسة البيع بالمزاد العلني مسبقا، يتم تحديدها بموجب أمر على عريضة، بناء على طلب المحضر القضائي أو أي دائن طرف في الحجز.\nيصدر رئيس المحكمة الأمر بعد التحقق من الفصل في جميع الاعتراضات التي سجلت.\nيخطر المحضر القضائي جميع الدائنين المقيدين والمدين المحجوز عليه والحائز والكفيل العيني إن وجد، بتاريخ وساعة ومكان جلسة البيع بالمزاد العلني، ثمانية ) (8 أيام قبل الجلسة على الأقل."},{"n":"748","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم التاسع — في إجراءات البيع بالمزاد العلني"],"g":"","t":"يقوم المحضر القضائي، بعد إيداع قائمة شروط البيع، بنشر مستخرج من هذه القائمة في جريدة يومية وطنية والتعليق في لوحة الإعلانات بالمحكمة خلال ثمانية ) (8 أيام التالية لآخر تبليغ رسمي بإيداع القائمة وترفق صورة من الإعلان في الجريدة ونسخة من محضر التعليق مع ملف التنفيذ.\nيجوزلكل شخص الاطلاع على قائمة شروط البيع في مكتب المحضر القضائي أو في أمانة ضبط المحكمة."},{"n":"749","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم التاسع — في إجراءات البيع بالمزاد العلني"],"g":"","t":"يحرر المحضر القضائي قبل جلسة البيع بالمزاد العلني بثلاثين ) (30 يوما على الأكثر وعشرين ) (20 يوما على الأقل، مستخرجا من مضمون موقعا منه، ويقوم بنشر الإعلان عن البيع السند التنفيذي وقائمة شروط البيع ّ بالمزاد العلني على نفقة طالب التنفيذ.\nيتضمن المستخرج، فضلا عن البيانات المعتادة ما يأتي:\nاسم ولقب كل من الدائن الحاجز والمدين المحجوز عليه والحائز والكفيل العيني إن وجد وموطن كل منهم، تعيين العقار كما ورد في قائمة شروط البيع، الثمن الأساسي لكل جزء من العقار و /أو الحق العيني العقاري، تاريخ وساعة البيع بالمزاد العلني، تعيين المحكمة التي يجري فيها البيع أو أي مكان آخر للبيع."},{"n":"750","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم التاسع — في إجراءات البيع بالمزاد العلني"],"g":"","t":"يتم تعليق ونشر الإعلان عن البيع بالمزاد العلني وفق ما يأتي:\nفي باب أو مدخل كل عقار من العقارات المحجوزة أرضا أو مباني، في جريدة يومية وطنية أو أكثر حسب أهمية العقار المحجوز، في لوحة الإعلانات بالمحكمة التي يتم فيها البيع، في لوحة الإعلانات بقباضة الضرائب والبلدية التي يوجد فيها العقار، في الساحات والأماكن العمومية، وفي أي مكان آخر يحتمل أن يضمن جلب أكبر عدد من المزايدين.\nيثبت نشر وتعليق الإعلان بتقديم صورة من الجريدة، أو تأشيرة الموظف المؤهل على هامش الإعلان المنشور ويرفق مع ملف التنفيذ."},{"n":"751","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم التاسع — في إجراءات البيع بالمزاد العلني"],"g":"","t":"يمكن للدائنين الحاجزين والدائنين المتدخلين في الحجز، والمدين المحجوز عليه، والحائز والكفيل العيني، تقديم عريضة إلى رئيس المحكمة لطلب إلغاء إجراءات النشر والتعليق قبل جلسة البيع بثلاثة ) (3 أيام على الأقل، وإلا سقط حقهم في ذلك.\nيفصل رئيس المحكمة في طلب الإلغاء يوم البيع وقبل افتتاح البيع بالمزاد العلني، بأمر غير قابل لأي طعن.\nإذا قرر إلغاء إجراءات النشر والتعليق، أجل البيع إلى جلسة لاحقة وأمر بإعادة هذه الإجراءات على نفقة المحضر القضائي.\nإذا فصل برفض طلب الإلغاء، أمر بافتتاح البيع بالمزاد العلني فورا."},{"n":"752","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم التاسع — في إجراءات البيع بالمزاد العلني"],"g":"","t":"يقدر رئيس المحكمة مصاريف إجراءات التنفيذ بما فيها أتعاب المحضر القضائي بموجب أمر على عريضة، تقدم من طرف هذا الأخير أو من أحد الدائنين ويعلن عن هذا التقدير قبل افتتاح المزاد العلني، وينوه عنها في حكم رسو المزاد فيما بعد."},{"n":"753","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم العاشر — في جلسة البيع بالمزاد العلني"],"g":"","t":"يجري البيع بالمزاد العلني في جلسة علنية برئاسة رئيس المحكمة أو القاضي الذي يعينه لهذا الغرض بمقر المحكمة التي أودعت فيها قائمة شروط البيع، في التاريخ والساعة المحددين لذلك، وتكون بحضور المحضر القضائي وأمين الضبط، وحضورالدائنين المقيدين والمدين المحجوز عليه والحائز والكفيل العيني إن وجد، أو بعد إخبارهم بثمانية ) (8 أيام على الأقل قبل تاريخ الجلسة، وحضور عدد من المزايدين لا يقل عن ثلاثة ) (3 أشخاص.\nيجوز تأجيل البيع بالمزاد العلني بطلب من أطراف الحجز إذا كان للتأجيل أسباب جدية، لاسيما قلة المزايدين وضعف العروض.\nتعاد إجراءات النشر والتعليق على نفقة طالب التأجيل."},{"n":"754","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم العاشر — في جلسة البيع بالمزاد العلني"],"g":"","t":"بعد افتتاح جلسة البيع، يقوم الرئيس بالتحقق من حضور أو غياب أطراف الحجز وإتمام إجراءات التبليغ الرسمي والنشر والتعليق.\nإذا كانت هذه الإجراءات صحيحة، يأمر بافتتاح المزاد العلني، ويذكر بشروط البيع ونوع العقار و /أو الحق العيني العقاري المعروض للبيع، والثمن الأساسي والرسوم والمصاريف، ثم يحدد مبلغ التدرج في المزايدة حسب أهمية العقار و / أو الحق العيني العقاري، وفي جميع الأحوال لا يقل عن عشرة آلاف دينار )10.000 دج( في كل عرض.\nإذا لم يتوفر النصاب من المزايدين أو كان العرض أقل من الثمن الأساسي للمزايدة، أو لم يتقدم أحد بأي عرض خلال خمس عشرة ) (15 دقيقة، أثبت الرئيس ذلك في سجل الجلسة، وقرر تأجيل البيع إلى جلسة لاحقة بذات الثمن الأساسي.\nفي الجلسة الجديدة، وبغض النظر عن عدد المزايدين، إذا كانت العروض أقل من قيمة الثمن الأساسي وغير كافية لقيمة الدين والمصاريف، قرر الرئيس تأجيل البيع وإنقاص عشر الثمن الأساسي مع إعادة النشر والتعليق وفقا للمادة 750 أعلاه.في الجلسات الموالية، يباع العقار و /أو الحق العيني العقاري لمن تقدم بأعلى عرض ولو كان أقل من الثمن الأساسي، إلا إذا قبل الدائن الحاجز أو أحد الدائنين المتدخلين في الحجز استيفاء الدين عينا بالعقار و /أو الحق العيني العقاري، بالثمن الأساسي المحدد له."},{"n":"755","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم العاشر — في جلسة البيع بالمزاد العلني"],"g":"","t":"يجب أن يحدد في الأمر الصادر بتأجيل البيع، تاريخ جلسة لاحقة للبيع خلال فترة لا تقل عن ثلاثين ) (30 يوما ولا تزيد عن خمسة وأربعين ) (45 يوما من تاريخ التأجيل.\nوفي هذه الحالة، يعاد النشر والتعليق عن البيع بالكيفيات المنصوص عليها في المادتين 749 و 750 أعلاه."},{"n":"756","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم العاشر — في جلسة البيع بالمزاد العلني"],"g":"","t":"يجري بيع العقارات و /أو الحقوق العينية العقارية بالتتابع، وإذا تناول البيع عدة عقارات و /أو حقوق عينية عقارية تقع في دوائر محاكم مختلفة، يتم البيع حسب تتابع قيد الحجز المنصوص عليه في المادة 724 أعلاه.\nغير أنه إذا كان الثمن الناتج من بيع عقار و /أو حق عيني عقاري واحد أو أكثر، كافيا للوفاء بأصل الدين والمصاريف القضائية، يأمر الرئيس الذي أشرف على البيع بالتوقف عن بيع باقي العقارات و /أو الحقوق العينية العقارية المحجوزة ورفع الحجز عنها تلقائيا."},{"n":"757","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم العاشر — في جلسة البيع بالمزاد العلني"],"g":"","t":"يرسو المزاد على من تقدم من المزايدين بأعلى عرض وكان آخر مزايد.\nيعتمد الرئيس العرض الذي لا يزاد عليه بعد النداء به ثلاث ) (3 مرات متتالية، تفصل بين كل نداء دقيقة واحدة.\nيجب على الراسي عليه المزاد أن يدفع حال انعقاد الجلسة، خمس الثمن والمصاريف والرسوم المستحقة، ويدفع المبلغ الباقي في أجل أقصاه ثمانية ) (8 أيام بأمانة ضبط المحكمة.\nإذا لم يودع الراسي عليه المزاد باقي الثمن كاملا في المدة المحددة في الفقرة أعلاه، يتم إعذاره بالدفع خلال خمسة ) (5 أيام، وإلا أعيد البيع بالمزاد العلني على ذمته."},{"n":"758","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم العاشر — في جلسة البيع بالمزاد العلني"],"g":"","t":"يلزم الراسي عليه المزاد المتخلف عن دفع الثمن في أجل ثمانية ) (8 أيام المنصوص عليه في المادة 757 أعلاه، بفرق الثمن إذا أعيد بيع العقار بثمن أقل من الثمن الراسي به المزاد، ولا يكون له الحق في الزيادة إذا بيع بثمن أعلى.\nوفي هذه الحالة، يتضمن منطوق الحكم الصادر برسو المزاد للبيع الثاني، إلزام المزايد المتخلف بفرق الثمن إن وجد."},{"n":"759","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم العاشر — في جلسة البيع بالمزاد العلني"],"g":"","t":"إذا كان من رسا عليه المزاد دائنا وكان مبلغ دينه ومرتبته مع بقية الدائنين تبرران إعفاءه من دفع ثمن المبيع وفقا للمادة 757 أعلاه، يقرر الرئيس اعتبار دينه ثمنا للبيع."},{"n":"760","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم الحادي عشر — في إعادة البيع بالمزاد العلني"],"g":"","t":"إذا بيع العقار و /أو الحق العيني العقاري بثمن أقل من الثمن الأساسي المحدد في قائمة شروط البيع، يجوز لكل شخص في أجل ثمانية ) (8 أيام التالية لتاريخ حكم رسو المزاد، تقديم عريضة موقعة منه، يطلب فيها إعادة البيع بالمزاد العلني.في هذه الحالة، يتعهد المزايد الجديد بزيادة السدس ) (6/1 عن الثمن الراسي به المزاد على الأقل، مع إيداعه الثمن الكامل مع المصاريف القضائية والرسوم المستحقة بأمانة الضبط مقابل وصل، ويعاد البيع بالمزاد العلني بنفس الكيفيات المنصوص عليها في المواد من 749 إلى 757 أعلاه، ويتحمل طالب تجديد البيع بالمزاد العلني جميع النفقات."},{"n":"761","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم الحادي عشر — في إعادة البيع بالمزاد العلني"],"g":"","t":"يجوز للمزايد الجديد طلب إيقاف إعادة البيع المقرر على ذمته قبل الحكم برسو المزاد الجديد، إذا قام بإيداع المصاريف الإضافية المترتبة على تراجعه، بأمانة ضبط المحكمة.\nيقدم طلب إيقاف إعادة البيع في شكل عريضة مرفقا بوصل إيداع المصاريف الإضافية، إلى رئيس المحكمة الذي يفصل فيه بأمر غير قابل لأي طعن."},{"n":"762","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم الثاني عشر — في حكم رسو المزاد وآثاره"],"g":"","t":"تنقل إلى الراسي عليه المزاد كل حقوق المدين المحجوز عليه التي كانت له على العقارات و /أو الحقوق العينية العقارية المباعة بالمزاد العلني، وكذلك كل الارتفاقات العالقة بها، ويعتبر حكم رسو المزاد سندا للملكية.\nيتعين على المحضر القضائي قيد حكم رسو المزاد بالمحافظة العقارية من أجل إشهاره خلال أجل شهرين ) (2 من تاريخ صدوره."},{"n":"763","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم الثاني عشر — في حكم رسو المزاد وآثاره"],"g":"","t":"يتضمن حكم رسو المزاد، فضلا عن بيانات الأحكام المألوفة وأسماء وألقاب الأطراف ما يأتي:\n1- السند التنفيذي الذيبموجبه تم الحجز والإجراءات التي تلته، لاسيما تاريخ كل من التبليغ الرسمي والتكليف بالوفاء وإعلان البيع.\n2- تعيين العقار و /أو الحق العيني العقاري المباع ومشتملاته والارتفاقات العالقة به إن وجدت، كما هو مع ين في قائمة شروط البيع،\n3- تحديد الثمن الأساسي للعقار و /أو الحق العيني العقاري المباع،\n4- إجراءات البيع بالمزاد العلني،\n5- الهوية الكاملة للراسي عليه المزاد شخصا طبيعيا أو معنويا،\n6- الثمن الراسي به المزاد وتاريخ الدفع.\n7- إلزام المحجوز عليه أوالحائز أو الكفيل العيني أو الحارس، حسب الأحوال، بتسليم العقار و /أو الحق العيني العقاري لمن رسا عليه المزاد."},{"n":"764","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم الثاني عشر — في حكم رسو المزاد وآثاره"],"g":"","t":"لا يبلغ حكم رسو المزاد لأطراف الحجز، ويتم تنفيذه جبرا على الأشخاص المذكورين في المادة 7- 763 أعلاه.\nيترتب على قيد حكم رسو المزاد بالمحافظة العقارية تطهير العقار و /أو الحق العيني العقاري من كل التأمينات العينية."},{"n":"765","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم الثاني عشر — في حكم رسو المزاد وآثاره"],"g":"","t":"حكم رسو المزاد غير قابل لأي طعن."},{"n":"766","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل السادس — في الحجز على العقارات غير المشهرة","القسم الأول — أحكام عامة"],"g":"","t":"يجوز للدائن وفقا لأحكام المادة 721 أعلاه، الحجز على عقارات مدينه غير المشهرة، إذا كان لها مقرر إداري أو سند عرفي ثابت التاريخ وفقا لأحكام القانون المدني.\nتتم إجراءات الحجز في هذه الحالة وفقا للمادتين 722 و 723 أعلاه، ويرفق مع طلب الحجز:\n1- نسخة من السند التنفيذي المتضمن مبلغ الدين،\n2- محضر عدم كفاية الأموال المنقولة أو عدم وجودها،\n3- مستخرج من السند العرفي أو المقرر الإداري للعقار المراد حجزه."},{"n":"767","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل السادس — في الحجز على العقارات غير المشهرة","القسم الأول — أحكام عامة"],"g":"","t":"يتم التبليغ الرسمي لأمر الحجز إلى المدين وإلى حائز العقار إن وجد طبقا للمادة 688 وما يليها من هذا القانون."},{"n":"768","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل السادس — في الحجز على العقارات غير المشهرة","القسم الأول — أحكام عامة"],"g":"","t":"يفتتح بأمانة ضبط المحكمة التي يوجد في دائرة اختصاصها العقار، سجل خاص لقيد الحجوز العقارية وقيد الدائنين الحاجزين والدائنين الذين لهم سندات تنفيذية في مواجهة المدين المحجوز عليه."},{"n":"769","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل السادس — في الحجز على العقارات غير المشهرة","القسم الأول — أحكام عامة"],"g":"","t":"فيما يخص حجز الثمار وعدم نفاذ تصرفات المدين على العقارات غير المشهرة، تطبق أحكام المواد 731 و 732 و 733 أعلاه."},{"n":"770","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل السادس — في الحجز على العقارات غير المشهرة","القسم الأول — أحكام عامة"],"g":"","t":"يحرر المحضر القضائي قائمة شروط البيع وفقا لأحكام المادة 737 أعلاه، وترفق معها المستندات المحددة في المادة 766 أعلاه.\nتطبق على تحديد الثمن الأساسي والتبليغ الرسمي لقائمة شروط البيع وتقديم الاعتراضات أحكام المواد من 739 إلى 742 أعلاه.\nيخضع نشر الإعلان عن البيع بالمزاد العلني لأحكام المادتين 748 و 750 أعلاه."},{"n":"771","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل السادس — في الحجز على العقارات غير المشهرة","القسم الأول — أحكام عامة"],"g":"","t":"يقدم طلب إلغاء إجراءات النشر وفقا لأحكام المادتين 751 و 752 أعلاه، وتخضع إجراءات البيع بالمزاد العلني لأحكام المواد من 753 إلى 759 أعلاه، وفي حالة إعادة البيع بالمزاد العلني تطبق أحكام المادتين 760 و 761 أعلاه."},{"n":"772","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل السادس — في الحجز على العقارات غير المشهرة","القسم الثاني — في طلب استحقاق العقار المحجوز"],"g":"","t":"يجوز لحائز العقار بسند ملكية كما يجوز للغير الحائز لسند ملكية، طلب بطلان إجراءات الحجز مع طلب استحقاق العقار المحجوز كله أو بعضه ولو بعد انتهاء الآجال المحددة للاعتراض على قائمة شروط البيع، وذلك بدعوى استعجالية ترفع ضد الدائن الحاجز والمدين المحجوز عليه بحضور المحضر القضائي.\nيفصل رئيس المحكمة في الدعوى الاستعجالية في أجل أقصاه ثلاثون )(30 يوما من تاريخ تسجيل الدعوى.\nإذا حل التاريخ المعين للبيع قبل أن يفصل رئيس المحكمة في دعوى الاستعجال، فلرافع الدعوى أن يطلب وقف البيع بعريضة تقدم إلى رئيس المحكمة قبل جلسة البيع بثلاثة ) (3 أيام على الأقل، بشرط إيداع كفالة يحددها الرئيس بأمر على عريضة تغطي مصاريف إعادة النشر والتعليق، عند الاقتضاء."},{"n":"773","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل السادس — في الحجز على العقارات غير المشهرة","القسم الثاني — في طلب استحقاق العقار المحجوز"],"g":"","t":"إذا اقتصرت دعوى الاستعجال على جزء من العقارات المحجوزة، فلا يوقف البيع بالنسبة لباقي الأجزاء الأخرى."},{"n":"774","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل السادس — في الحجز على العقارات غير المشهرة","القسم الثاني — في طلب استحقاق العقار المحجوز"],"g":"","t":"مع مراعاة أحكام المواد من 762 إلى 765 أعلاه، تتم إجراءات شهر حكم رسو المزاد العلني بالمحافظة العقارية الواقع في دائرة اختصاصها موقع العقار دون مراعاة لأصل الملكية."},{"n":"775","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل السابع — في الحجز على الأجور والمداخيل والمرتبات"],"g":"","t":"لا يجوز الحجز على الأجور والمداخيل والمرتبات إلا بموجب سند تنفيذي وفي حدود النسب المذكورة في المادة 776 أدناه."},{"n":"776","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل السابع — في الحجز على الأجور والمداخيل والمرتبات"],"g":"","t":"يجوز لمن بيده سند تنفيذي الحجز على الأجور والمداخيل والمرتبات التي يتقاضاها المدين وفقا للإجراءات التالية، وفي حدود النسب المبينة أسفله:\n% 10 إذا كان المرتب الصافي يساوي أو يقل عن قيمة الأجر الوطني الأدنى المضمون، % 15 إذا كان المرتب الصافي يفوق قيمة الأجر الوطني الأدنى المضمون ويساوي أو يقل عن ضعف قيمته، % 20 إذا كان المرتب الصافي يفوق ضعف الأجر الوطني الأدنى المضمون ويساوي أو يقل بثلاث ) (3 مرات عن قيمته، % 25 إذا كان المرتب الصافي يفوق ثلاث ) (3 مرات قيمة الأجر الوطني الأدنى المضمون ويساوي أو يقل بأربع ) (4 مرات عن قيمته، % 30 إذا كان المرتب الصافي يفوق أربع ) (4 مرات قيمة الأجر الوطني الأدنى المضمون ويساوي أو يقل بخمس ) (5 مرات عن قيمته، % 40 إذا كان المرتب الصافي يفوق خمس ) (5 مرات قيمة الأجر الوطني الأدنى المضمون ويساوي أو يقل بست ) (6 مرات عن قيمته، % 50 إذا كان المرتب الصافي يفوق ست ) (6 مرات قيمة الأجر الوطني الأدنى المضمون.\nتستثنى المنح العائلية عند حساب الدخل الصافي في النسب المذكورة أعلاه، ولا يجوز الحجز عليها."},{"n":"777","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل السابع — في الحجز على الأجور والمداخيل والمرتبات"],"g":"","t":"يجوز الحجز على الأجر أو المرتب بقيمة النفقة الغذائية، إذا كان الدين المحجوز من أجله يتعلق بنفقة غذائية للقصر أو الوالدين أو الزوجة أو كل من تجب نفقتهم قانونا.\nوفي جميع الأحوال، لا يجوز أن يتجاوز الحجز نصف الأجر أو المرتب."},{"n":"778","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل السابع — في الحجز على الأجور والمداخيل والمرتبات"],"g":"","t":"يتم الحجز على الأجور والمداخيل والمرتبات، بأمر على عريضة، تقدم من الدائن أو الزوجة أو الوصي أو الحاضن، حسب الحالة، إلى رئيس المحكمة التي يوجد في دائرة اختصاصها الموطن أو المقر الاجتماعي للمحجوز لديه أو مركز دفع الأجر أو المرتب للمحجوز عليه.\nيتم التبليغ الرسمي لأمر الحجز، إلى المحجوز عليه شخصيا، أو إلى أحد أفراد عائلته البالغ ين المقيم ين معه في موطنه الحقيقي، أو يتم في موطنه المختار، ويبلغ إلى المحجوز لديه شخصيا إذا كان شخصا طبيعيا، ويبلغ إلى الممثل القانوني أو الاتفاقي أو المفوض إذا كان شخصا معنويا، مع تسليمه نسخة من أمر الحجز والتنويه بذلك في محضر التبليغ الرسمي."},{"n":"779","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل السابع — في الحجز على الأجور والمداخيل والمرتبات"],"g":"","t":"إذا تعدد الحاجزون، أو ظهر دائنون بيدهم سندات تنفيذية بعد إجراء الحجز الأول، فإنهم يشتركون بحصص متساوية في نسبة الحجز المشار إليها في المادة 776 أعلاه.\nيتم قيد بقية الحاجزين مع الحاجز الأول بأمانة الضبط، بأمر على عريضة بمجرد إثبات صفتهم.\nتبقى للديون المتعلقة بالنفقة الغذائية حق الأولوية على باقي الديون عند الاستيفاء وفقا للترتيب المنصوص عليه في القانون المدني."},{"n":"780","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل السابع — في الحجز على الأجور والمداخيل والمرتبات"],"g":"","t":"يتولى المحضر القضائي دعوة الدائن الحاجز والمدين المحجوز عليه للحضور أمام رئيس المحكمة في أجل أقصاه ثمانية ) (8 أيام من تاريخ التبليغ الرسمي لأمر الحجز.\nيقوم رئيس المحكمة بمحاولة الصلح بين الطرف ين في أجل أقصاه شهر واحد (1)، ويحرر محضرا يثبت فيه حضورهما أو غيابهما.\nإذا حصل صلح، يقيد رئيس المحكمة الشروط المتفق عليها في محضر، ويأمر برفع الحجز تلقائيا.\nإذا لم يحصل الصلح، يثبت ذلك في محضر ويصدر أمرا بالتحويل لفائدة الدائن الحاجز، يحدد فيه، فضلا عن البيانات المعتادة، ما يأتي:\n1- اسم ولقب وصفة الدائن الحاجز وتاريخ الميلاد ومكانه وموطنه،\n2- اسم ولقب المدين المحجوز عليه،\n3- اسم ولقب وصفة المحجوز لديه وعنوانه،\n4- مبلغ الدين المحجوز من أجله،\n5- تحديد النسبة المحجوزة وتقدير المبلغ المقتطع من المرتب أو الأجر،\n6- أمر المحجوز لديه بتسليم المبلغ المقتطع إلى الدائن الحاجز نقدا مقابل وصل أو دفعه في حساب جار، أو بحوالة بريدية."},{"n":"781","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل السابع — في الحجز على الأجور والمداخيل والمرتبات"],"g":"","t":"إذا كان مبلغ الدين محددا بصفة نهائية في السند التنفيذي، يقتصر أمر التحويل وجوبا على مبلغ الدين.\nوإذا كان مبلغ الدين نفقة غذائية، يتضمن أمر التحويل، الاستمرار في الدفع شهريا إلى الدائن الحاجز، إلى غاية انقضائه قانونا أو صدور أمر مخالف."},{"n":"782","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل السابع — في الحجز على الأجور والمداخيل والمرتبات"],"g":"","t":"يتم التبليغ الرسمي لأمر التحويل المشار إليه في المادتين 780 و 781 أعلاه، إلى المدين المحجوز عليه وإلى المحجوز لديه.\nيجب على المحجوز لديه تنفيذ أمر التحويل لفائدة الدائن الحاجز ابتداء من الشهر التالي لتاريخ التبليغ الرسمي."},{"n":"783","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثامن — في بعض البيوع العقارية الخاصة","القسم الأول — في البيوع العقارية للمفقود وناقص الأهلية والمفلس"],"g":"","t":"يتم بيع العقارات و /أو الحقوق العينية العقارية المرخص ببيعها قضائيا بالمزاد العلني، للمفقود وناقص الأهلية والمفلس، حسب قائمة شروط البيع، تودع بأمانة ضبط المحكمة، يعدها المحضر القضائي بناء على طلب المقدم أو الوصي أو الولي، أو يعدها وكيل التفليسة، حسب الحالة.\nتتضمن قائمة شروط البيع البيانات الآتية:\n1- الإذن الصادر بالبيع،\n2- تعيين العقار و /أو الحق العيني العقاري، تعيينا دقيقا، لا سيما موقعه وحدوده ونوعه ومشتملاته ومساحته ورقم القطعة الأرضية واسمها، عند الاقتضاء، مفرزا أو مشاعا، وغيرها من البيانات التي تفيد في تعيينه، وإن كان العقار بناية، يبين الشارع ورقمه وأجزاء العقارات،\n3- شروط البيع والثمن الأساسي،\n4- تجزئة العقار إلى أجزاء إذا اقتضت الضرورة ذلك، مع ذكر الثمن الأساسي لكل جزء،\n5- بيان سندات الملكية."},{"n":"784","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثامن — في بعض البيوع العقارية الخاصة","القسم الأول — في البيوع العقارية للمفقود وناقص الأهلية والمفلس"],"g":"","t":"ترفق مع قائمة شروط البيع المستندات الآتية:\n1- مستخرج جدول الضريبة العقارية.\n2- مستخرج من عقد الملكية، والإذن بالبيع عند الاقتضاء.\n3- الشهادة العقارية."},{"n":"785","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثامن — في بعض البيوع العقارية الخاصة","القسم الأول — في البيوع العقارية للمفقود وناقص الأهلية والمفلس"],"g":"","t":"يقوم المحضر القضائي بالتبليغ الرسمي عن إيداع قائمة شروط البيع، إلى الدائنين أصحاب التأمينات العينية، وإخطار النيابة العامة، ولهؤلاء حق طلب إلغاء قائمة شروط البيع عن طريق الاعتراض عليها، عند الاقتضاء، طبقا لأحكام هذا القانون."},{"n":"786","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثامن — في بعض البيوع العقارية الخاصة","القسم الثاني — في البيوع العقارية المملوكة على الشيوع"],"g":"","t":"إذا تقرر بحكم أو قرار قضائي بيع العقار و /أو الحق العيني العقاري المملوك على الشيوع لعدم إمكان القسمة بغير ضرر أو لتعذر القسمة عينا، بيع العقار عن طريق المزاد العلني بناء على قائمة شروط البيع، يعدها المحضر القضائي، وتودع بأمانة ضبط المحكمة التي يوجد فيها العقار، بناء على طلب من يهمه التعجيل من المالك ين على الشيوع.\nتشتمل قائمة شروط البيع فضلا عن البيانات المذكورة في المادة 783 أعلاه، على ذكر جميع المالك ين على الشيوع وموطن كل منهم، ويرفق بها فضلا عن الوثائق المذكورة في المادة 784 أعلاه، نسخة من الحكم أو القرار الصادر بإجراء البيع بالمزاد العلني."},{"n":"787","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثامن — في بعض البيوع العقارية الخاصة","القسم الثاني — في البيوع العقارية المملوكة على الشيوع"],"g":"","t":"يقوم المحضر القضائي بالتبليغ الرسمي عن إيداع قائمة شروط البيع، إلى الدائنين أصحاب التأمينات العينية، وجميع المالك ين على الشيوع، ولهؤلاء حق طلب إلغاء قائمة شروط البيع بطريق الاعتراض على القائمة، عند الاقتضاء، طبقا لأحكام هذا القانون."},{"n":"788","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثامن — في بعض البيوع العقارية الخاصة","القسم الثالث — في بيع العقارات المثقلة بتأمين عيني"],"g":"","t":"يجوز لمالك العقار و /أو الحق العيني العقاري المثقل بتأمين عيني الذي يرغب في الوفاء بديونه، إذا لم يسع الدائنون إلى طلب ديونهم ولم يباشروا إجراءات التنفيذ عليه، أن يطلب بيعه بالمزاد العلني، بناء على قائمة شروط البيع، يعدها محضر قضائي، وتودع بأمانة ضبط المحكمة التي يوجد فيها العقار.\nيبلغ رسميا المحضر القضائي قائمة شروط البيع إلى الدائنين أصحاب التأمينات العينية، ولهؤلاء حق طلب إلغاء قائمة شروط البيع بطريق الاعتراض على القائمة، عند الاقتضاء، طبقا لأحكام هذا القانون."},{"n":"789","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثامن — في بعض البيوع العقارية الخاصة","القسم الثالث — في بيع العقارات المثقلة بتأمين عيني"],"g":"","t":"تطبق على البيوع المشار إليها في المواد 783 و 786 و 788 أعلاه، إجراءات النشر والتعليق الخاصة ببيع العقارات المحجوزة، المنصوص عليها في هذا القانون."},{"n":"790","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب السادس — في توزيع المبالغ المتحصلة من التنفيذ"],"g":"","t":"إذا تم الحجز على مبالغ مالية لدى المدين، أو تم بيع الأموال المحجوزة، استلم الدائن الحاجز المبالغ المتحصلة من التنفيذ مباشرة من المحضر القضائي أو محافظ البيع."},{"n":"791","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب السادس — في توزيع المبالغ المتحصلة من التنفيذ"],"g":"","t":"في حالة تعدد الدائنين وكانت المبالغ المتحصلة من التنفيذ كافية للوفاء بحقوق جميع الدائنين الحاجزين والدائنين المتدخلين في الحجز، يجب على المحضر القضائي أو محافظ البيع أو على من تكون لديه هذه المبالغ أن يؤدي لكل دائن دينه بعد تقديم سنده التنفيذي.\nيجوز الوفاء أيضا بالدين لجميع الدائنين الذين ليست لهم سندات تنفيذية، بعد موافقة كتابية من المدين المحجوز عليه.\nترد المبالغ المالية المتبقية إلى المدين المحجوز عليه، بعد سداد الديون والمصاريف."},{"n":"792","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب السادس — في توزيع المبالغ المتحصلة من التنفيذ"],"g":"","t":"إذا كانت المبالغ المالية المتحصلة من التنفيذ غير كافية للوفاء بحقوق جميع الدائنين الحاجزين والدائنين المتدخلين في الحجز، يجب على المحضر القضائي أو محافظ البيع وعلى كل من تكون لديه المبالغ المتحصلة من التنفيذ، إيداعها بأمانة ضبط المحكمة التي تم في دائرة اختصاصها التنفيذ مع إرفاق جدول عن الأموال المحجوزة ومحضر رسو المزاد.\nوفي هذه الحالة، يقوم رئيس أمانة الضبط بإخطار رئيس المحكمة كتابيا من أجل توزيع المبالغ المتحصلة من التنفيذ."},{"n":"793","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب السادس — في توزيع المبالغ المتحصلة من التنفيذ"],"g":"","t":"في حالة وجود عدة حجوز على أموال نفس المدين المحجوز عليه أمام جهات قضائية مختلفة، يجب على المحضرين القضائيين أو على محافظي البيع، وعلى كل من كانت لديه المبالغ المتحصلة من التنفيذ، إيداعها بأمانة ضبط المحكمة التي تم في دائرة اختصاصها الحجز الأول أو البيع الأول للأموال المحجوزة."},{"n":"794","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب السادس — في توزيع المبالغ المتحصلة من التنفيذ"],"g":"","t":"يعد رئيس المحكمة خلال خمسة عشر ) (15 يوما من تاريخ إخطاره، قائمة مؤقتة لتوزيع المبالغ المالية المتحصلة من التنفيذ بين الدائنين المقيدين، ويأمر بإيداعها بأمانة الضبط وتعليق مستخرج منها."},{"n":"795","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب السادس — في توزيع المبالغ المتحصلة من التنفيذ"],"g":"","t":"يتولى رئيس أمانة الضبط تعليق مستخرج من القائمة المؤقتة للتوزيع المشار إليها في المادة 794 أعلاه، بلوحة إعلانات المحكمة لمدة ثلاثين ) (30 يوما.\nيجوز لكل دائن بيده سند دين، أن يتقدم خلال عشرة ) (10 أيام من تاريخ انتهاء أجل التعليق، إلى أمانة الضبط لطلب قيده مع بقية الدائنين وإلا سقط حقه في الانضمام إلى القائمة المشار إليها في المادة 794 أعلاه."},{"n":"796","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب السادس — في توزيع المبالغ المتحصلة من التنفيذ"],"g":"","t":"يتم تكليف الدائنين الحاجزين والدائنين المتدخلين في الحجز من طرف المحضر القضائي بناء على طلب من يهمه التعجيل، بالحضور إلى جلسة التسوية الودية أمام رئيس المحكمة.\nفي الجلسة المحددة، يتحقق الرئيس من صفة الدائنين وصحة تكليف الأطراف بالحضور وصحة التوكيلات وصحة طلبات التسجيل، ثم يقرر قيد من تثبت صفته في قائمة التوزيع وشطب من لم تثبت صفته.\nإذا حضر الأطراف وحصل الاتفاق على قائمة التوزيع المؤقتة، بتسوية ودية، أثبت الرئيس اتفاقهم في محضر يوقعه وأمين الضبط والحاضرون، ويكون لهذا المحضر قوة السند التنفيذي.\nإذا تخلف جميع الدائنين عن حضور الجلسة المحددة للتسوية الوديةّ، أشر الرئيس على القائمة المؤقتة وتصبح بذلك نهائية.\nوفي الحالت، ين يصدر الرئيس أمرا ولائيا إلى رئيس أمانة الضبطبم نح المبالغ المستحقة لكل دائن حسب القائمة."},{"n":"797","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب السادس — في توزيع المبالغ المتحصلة من التنفيذ"],"g":"","t":"إذا تغيب أحد الأطراف عن حضور جلسة التسوية الودية، يجوز توزيع المبالغ المتحصلة من التنفيذ على الدائنين الحاضرين، مع حفظ حقوق الدائن المتخلف في القائمة المؤقتة.\nلا يجوز للدائن المتخلف تقديم أي طعن في قائمة توزيع التسوية الودية التي أشر عليها الرئيس."},{"n":"798","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب السادس — في توزيع المبالغ المتحصلة من التنفيذ"],"g":"","t":"إذا لم تتم التسوية الودية، بسبب اعتراض أحد الدائنين على قائمة التوزيع المؤقتة، يأمر الرئيس بتثبيت الاعتراض في محضر، ويفصل فيه بأمر خلال أجل ثمانية ) (8 أيام.\nيجوز استئناف الأمر الصادر عن الاعتراض خلال عشرة ) (10 أيام، إذا كان المبلغ المتنازع عليه يزيد عن مائتي ألف دينار ) ( 200.000 دج.\nيرفع الاستئناف أمام رئيس المجلس القضائي ويفصل فيه في أقرب الآجال.\nلا يخضع هذا الاستئناف للتمثيل الو جوبي بمحام.\nالاستئناف ليس له أثر موقف، ولا يم نع الرئيس من تسليم أوامر توزيع المبالغ المالية إلى مستحقيها من الدائنين."},{"n":"799","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب السادس — في توزيع المبالغ المتحصلة من التنفيذ"],"g":"","t":"لا يترتب على إفلاس المدين المحجوز عليه وقف إجراءات التوزيع ولو حدد التوقف عن الدفع بتاريخ سابق على الشروع في التوزيع."},{"n":"800","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الأول — في الاختصاص","القسم الأول — في الاختصاص النوعي"],"g":"معدلة · ق 13-22","t":"المحاكم الإدارية هي جهات الولاية العامة في المنازعات الإدارية، باستثناء المنازعات الموكلة إلى جهات قضائية أخرى.\nتختص المحاكم الادارية بالفصل في أول درجة بحكم قابل للاستئناف في جميع القضايا التي تكون الدولة أو الولاية أو البلدية أو إحدى المؤسسات العمومية ذات الصبغة الإدارية أو الهيئات العمومية الوطنية والمنظمات المهنية الوطنية طرفا فيها."},{"n":"801","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الأول — في الاختصاص","القسم الأول — في الاختصاص النوعي"],"g":"معدلة · ق 13-22","t":"تختص المحاكم الإدارية كذلك بالفصل في:\n1- دعاوى إلغاء وتفسير وفحص مشروعية القرارات الإدارية الصادرة عن:\n– الولاية والمصالح غير الممركزة للدولة على مستوى الولاية،\n– البلدية.\n– المنظمات المهنية الجهوية،\n– المؤسسات العمومية المحلية ذات الصبغة الإدارية،\n2- دعاوى القضاء الكامل،\n3- القضايا المخولة لها بموجب نصوص خاصة."},{"n":"802","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الأول — في الاختصاص","القسم الأول — في الاختصاص النوعي"],"g":"","t":"خلافا لأحكام المادتين 800 و 801 أعلاه، يكون من اختصاص المحاكم العادية المنازعات الآتية:\n1- مخالفات الطرق.\n2- المنازعات المتعلقة بكل دعوى خاصة بالمسؤولية الرامية إلى طلب تعويض الأضرار الناجمة عن مركبة تابعة للدولة، أو لإحدى الولايات أو البلديات أو المؤسسات العمومية ذات الصبغة الإدارية."},{"n":"803","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الأول — في الاختصاص","القسم الثاني — في الاختصاص الإقليمي"],"g":"","t":"يتحدد الاختصاص الإقليمي للمحاكم الإدارية طبقا للمادتين 37 و 38 من هذا القانون."},{"n":"804","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الأول — في الاختصاص","القسم الثاني — في الاختصاص الإقليمي"],"g":"معدلة · ق 13-22","t":"خلافا لأحكام المادة 803 أعلاه، ترفع الدعاوى وجوبا أمام المحاكم الإدارية في المواد المبينة أدناه:\n1- في مادة الضرائب أو الرسوم، أمام المحكمة التي يقع في دائرة اختصاصها مكان فرض الضريبة أو الرسم،\n2- في مادة الأشغال العمومية، أمام المحكمة التي يقع في دائرة اختصاصها مكان تنفيذ الأشغال،\n3- في مادة العقود الإدارية، مهما كانت طبيعتها، أمام المحكمة التي يقع في دائرة اختصاصها مكان إبرام العقد أو تنفيذه،\n4- في مادة المنازعات المتعلقة بالموظفين أو أعوان الدولة أو غيرهم من الأشخاص العاملين في المؤسسات العمومية الإدارية، أمام المحكمة التي يقع في دائرة اختصاصها مكان ممارسة وظيفتهم،\n5- في مادة الخدمات الطبية، أمام المحكمة التي يقع في دائرة اختصاصها مكان تقديم الخدمات،\n6- في مادة التوريدات أو الأشغال أو تأجير خدمات فنية أو صناعية، أمام المحكمة التي يقع في دائرة اختصاصها مكان إبرام الاتفاق أو مكان تنفيذه إذا كان أحد الأطراف مقيما به،\n7- في مادة تعويض الضرر الناجم عن جناية أو جنحة أو فعل تقصيري، أمام المحكمة التي يقع في دائرة اختصاصها مكان وقوع الفعل الضار،\n8- في مادة إشكالات تنفيذ الأحكام الصادرة عن الجهات القضائية الإدارية، أمام رئيس الجهة القضائية الإدارية التي صدر عنها الحكم موضوع الإشكال، ويفصل في هذا الأخير وفقا للإجراءات المنصوص عليها في المواد من 631 ألى 635 من هذا القانون."},{"n":"805","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الأول — في الاختصاص","القسم الثاني — في الاختصاص الإقليمي"],"g":"معدلة · ق 13-22","t":"تكون المحكمة الإدارية المختصة إقليميا بالنظر في الطلبات الأصلية، مختصة في الطلبات الإضافية أو العارضة أو المقابلة التي تدخل في اختصاص المحاكم الإدارية.\nتختص المحكمة الإدارية أيضا بالنظر في المسائل الفرعية التي تكون من اختصاص الجهة القضائية الإدارية."},{"n":"806","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الأول — في الاختصاص","القسم الثاني — في الاختصاص الإقليمي"],"g":"","t":"تحدد مقرات المحاكم الإدارية عن طريق التنظيم."},{"n":"807","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الأول — في الاختصاص","القسم الثالث — في طبيعة الاختصاص"],"g":"","t":"الاختصاص النوعي والاختصاص الإقليمي للمحاكم الإدارية من النظام العام.\nيجوز إثارة الدفع بعدم الاختصاص من أحد الخصوم في أية مرحلة كانت عليها الدعوى.\nيجب إثارته تلقائيا من طرف القاضي."},{"n":"808","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الأول — في الاختصاص","القسم الرابع — في تنازع الاختصاص"],"g":"معدلة · ق 13-22","t":"يؤول الفصل في تنازع الاختصاص بين محكمتين إداريتين تابعتين لدائرة اختصاص نفس المحكمة الادارية للاستئناف إلى رئيس هذه الأخيرة.\nيؤول الفصل في تنازع الاختصاص بين محكمتين إداريتين تابعتين لاختصاص محكمتين إداريتين للاستئناف إلى رئيس مجلس الدولة.\nيؤول الفصل في تنازع الاختصاص بين محكمة إدارية و محكمة إدارية للاستئناف إلى رئيس مجلس الدولة.\nيؤول الفصل في تنازع الاختصاص بين محكمتين إداريتين للاستئناف أو بين محكمة إدارية للاستئناف ومجلس الدولة إلى اختصاص هذا الأخير بكل غرفه مجتمعة"},{"n":"809","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الأول — في الاختصاص","القسم الخامس — في الارتباط"],"g":"معدلة · ق 13-22","t":"عندما تخطر المحكمة الإدارية بطلبات مستقلة في نفس الدعوى، لكنها مرتبطة، بعضها يعود إلى اختصاصها والبعض الآخر يعود إلى اختصاص المحكمة الادارية للاستئناف، يحيل رئيس المحكمة الادارية جميع هذه الطلبات إلى المحكمة الادارية للاستئناف.\nعندما تخطر المحكمة الإدارية بطلبات، بمناسبة النظر في دعوى تدخل في اختصاصها، وتكون في نفس الوقت مرتبطة بطلبات مقدمة في دعوى أخرى مرفوعة أمام المحكمة الادارية للاستئناف، وتدخل في اختصاصها، يحيل رئيس المحكمة الادارية تلك الطلبات أمام المحكمة الادارية للاستئناف."},{"n":"810","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الأول — في الاختصاص","القسم الخامس — في الارتباط"],"g":"","t":"تختص المحكمة الإدارية إقليميا بالفصل في الطلبات التي تعود إلى اختصاصها الإقليمي، وفي الطلبات المرتبطة بها التي يعود الاختصاص الإقليمي فيها إلى محكمة إدارية أخرى."},{"n":"811","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الأول — في الاختصاص","القسم الخامس — في الارتباط"],"g":"معدلة · ق 13-22","t":"عندما تخطر محكمتان إداريتان في آن واحد بطلبات مستقلة، لكنها مرتبطة وتدخل في الاختصاص الإقليمي لكل منهما، يرفع رئيسا المحكمتين تلك الطلبات إلى رئيس المحكمة الادارية للاستئناف.\nواذا كان الارتباط يخص محكمتين اداريتين للاستئناف، يرفع رئيسا المحكمتين تلك الطلبات أمام رئيس مجلس الدولة.\nيخطر رئيس كل جهة قضائية إدارية الرئيس الآخر بأمر الإحالة.\nيفصل رئيس مجلس المحكمة الادارية للاستئناف بأمر في الارتباط إن وجد، ويحدد المحكمة أو المحاكم المختصة للفصل في الطلبات، ويكون الامر قابلا للطعن أمام رئيس مجلس الدولة.\nيفصل رئيس مجلس الدولة بأمر في الارتباط، إن وجد، ويحدد المحكمة أو المحاكم الإدارية للاستئناف المختصة للفصل في الطلبات.\nيبلغ الأمر الفاصل في الارتباط إلى الجهات القضائية الادارية المعنية."},{"n":"812","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الأول — في الاختصاص","القسم الخامس — في الارتباط"],"g":"معدلة · ق 13-22","t":"يترتب على أوامر الإحالة المنصوص عليها أعلاه، إرجاء الفصل في الخصومة، تكون الأوامر الصادرة عن رؤساء المحاكم الادارية للاستئناف المذكورة أعلاه، قابلة للطعن أمام مجلس الدولة.\nوتكون الأوامر الصادرة عن رئيس مجلس الدولة المذكورة أعلاه، غير قابلة لأي طعن."},{"n":"813","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الأول — في الاختصاص","القسم السادس — في تسوية مسائل الاختصاص"],"g":"معدلة · ق 13-22","t":"عندما تخطر إحدى المحاكم الإدارية بطلبات ترى أنها من اختصاص المحكمة الادارية للاستئناف، يحول رئيس المحكمة الادارية الملف في أقرب الآجال إلى المحكمة الادارية للاستئناف.\nتفصل المحكمة الادارية للاستئناف في الاختصاص وتفصل في الموضوع إذا رأت أن النزاع يدخل في اختصاصها، وتحيل القضية، عند الاقتضاء، الى المحكمة الإدارية المعنية للفصل في كل الطلبات أو في جزء منها إذا رأت عكس ذلك."},{"n":"814","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الأول — في الاختصاص","القسم السادس — في تسوية مسائل الاختصاص"],"g":"معدلة · ق 13-22","t":"عندما تفصل المحكمة الادارية للاستئناف في الاختصاص، تحيل القضية أمام المحكمة الإدارية المختصة، ولا يجوز لهذه الأخيرة التصريح بعدم اختصاصها.\nعندما يفصل مجلس الدولة في الاختصاص، يحيل القضية أمام المحكمة الإدارية للاستئناف المختصة، ولا يجوز لهذه الأخيرة التصريح بعدم اختصاصها."},{"n":"814 مكرر","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الأول مكرر — في التشكيلة"],"g":"مدرجة · ق 13-22","t":"ما لم ينص القانون على خلاف ذلك، تفصل المحاكم الإدارية بتشكيلة جماعية، تتكون من ثلاثة ) (3 قضاة، على الأقل، من بينهم رئيس ومساعدان اثنان ).(2"},{"n":"815","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الأول — في رفع الدعوى"],"g":"معدلة · ق 13-22","t":"ترفع الدعوى أمام المحكمة الإدارية بعريضة ورقية أو بالطريق الالكتروني.."},{"n":"816","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الأول — في رفع الدعوى"],"g":"","t":"يجب أن تتضمن عريضة افتتاح الدعوى البيانات المنصوص عليها في المادة 15 من هذا القانون."},{"n":"817","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الأول — في رفع الدعوى"],"g":"","t":"يجوز للمدعي تصحيح العريضة التي لا تثير أي وجه، بإيداع مذكرة إضافية خلال أجل رفع الدعوى المشار إليه في المادتين 829 و 830 أدناه."},{"n":"818","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الأول — في رفع الدعوى"],"g":"","t":"تودع العريضة مع نسخة منها بملف القضية، وعند الضرورة، يأمر رئيس تشكيلة الحكم الخصوم بتقديم نسخ إضافية."},{"n":"819","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الأول — في رفع الدعوى"],"g":"","t":"يجب أن يرفق مع العريضة الرامية إلى إلغاء أو تفسير أو تقدير مدى مشروعية القرار الإداري، تحت طائلة عدم القبول، القرار الإداري المطعون فيه، ما لم يوجد مانع مبرر.\nوإذا ثبت أن هذا المانع يعود إلى امتناع الإدارة من تمكين المدعي من القرار المطعون فيه، أمرها القاضي المقرر بتقد يمه في أول جلسة، ويستخلص النتائج القانونية المترتبة على هذا الامتناع."},{"n":"820","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الأول — في رفع الدعوى"],"g":"","t":"عندما يرفق الخصوم مستندات تدعيما لعرائضهم ومذكراتهم، يعدون في نفس الوقت جردا مفصلا عنها، ما لم يوجد مانع يحول دون ذلك، بسبب عددها أو حجمها أو خصائصها.\nوفي جميع الحالات يؤشر أمين الضبط على الجرد."},{"n":"821","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الأول — في رفع الدعوى"],"g":"","t":"تودع العريضة بأمانة ضبط المحكمة الإدارية مقابل دفع الرسم القضائي، ما لم ينص القانون على خلاف ذلك."},{"n":"822","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الأول — في رفع الدعوى"],"g":"","t":"في الحالة التي يجب أن تفصل فيها المحكمة الإدارية في أجل محدد بنص خاص، لا يسري هذا الأجل إلا ابتداء من تاريخ إيداع العريضة بأمانة الضبط."},{"n":"823","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الأول — في رفع الدعوى"],"g":"","t":"تقيد العريضة عند إيداعها بسجل خاص يم سك بأمانة ضبط المحكمة الإدارية.\nيسلم أمين الضبط للمدعي وصلا يثبت إيداع العريضة، كما يؤشر على إيداع مختلف المذكرات والمستندات."},{"n":"824","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الأول — في رفع الدعوى"],"g":"","t":"تقيد العرائض وترقم في السجل حسب ترتيب ورودها.\nيقيد التاريخ ورقم التسجيل على العريضة وعلى المستندات المرفقة بها."},{"n":"825","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الأول — في رفع الدعوى"],"g":"","t":"يفصل رئيس المحكمة الإدارية في الإشكالات المتعلقة بالإعفاء من الرسم القضائي والإشكالات المتعلقة بإيداع وجرد المذكرات والمستندات، بأمر غير قابل لأي طعن."},{"n":"826","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الأول — في رفع الدعوى"],"g":"ملغاة · ق 13-22","t":"مادة ملغاة."},{"n":"827","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الأول — في رفع الدعوى"],"g":"","t":"تعفى الدولة والأشخاص المعنوية المذكورة في المادة 800 أعلاه، من التمثيل الوجوبي بمحام في الادعاء أو الدفاع أو التدخل.\nتوقع العرائض ومذكرات الدفاع ومذكرات التدخل المقدمة باسم الدولة أو باسم الأشخاص المشار إليهم أعلاه، من طرف الممثل القانوني."},{"n":"828","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الأول — في رفع الدعوى"],"g":"معدلة · ق 13-22","t":"مع مراعاة النصوص الخاصة، عندما تكون الدولة أو الولاية أو البلدية أو المؤسسة العمومية ذات الصبغة الإدارية أو الهيئات العمومية الوطنية والمنظمات المهنية الوطنية والجهوية، طرفا في الدعوى بصفة مدع أو مدعى عليه، تمثل، على التوالي، بواسطة الوزير المعني أو الوالي أو رئيس المجلس الشعبي البلدي والممثل القانوني بالنسبة للمؤسسة ذات الصبغة الإدارية.والهيئات العمومية الوطنية والمنظمات المهنية الوطنية والجهوية."},{"n":"829","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الأول — في رفع الدعوى","الفرع الأول — في الآجال"],"g":"","t":"يحدد أجل الطعن أمام المحكمة الإدارية بأربعة ) (4 أشهر، يسري من تاريخ التبليغ الشخصي بنسخة من القرار الإداري الفردي، أو من تاريخ نشر القرار الإداري الجماعي أو التنظيمي."},{"n":"830","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الأول — في رفع الدعوى","الفرع الأول — في الآجال"],"g":"","t":"يجوز للشخص المعني بالقرار الإداري، تقديم تظلم إلى الجهة الإدارية مصدرة القرار في الأجل المنصوص عليه في المادة 829 أعلاه.\nيعد سكوت الجهة الإدارية المتظلم أمامها عن الرد، خلال شهرين ) (2 بمثابة قرار بالرفض ويبدأ هذا الأجل من تاريخ تبليغ التظلم.\nوفي حالة سكوت الجهة الإدارية، يستفيد المتظلم من أجل شهرين(2)، لتقديم طعنه القضائي، الذي يسري من تاريخ انتهاء أجل الشهرين ) (2 المشار إليه في الفقرة أعلاه.\nفي حالة رد الجهة الإدارية خلال الأجل الممنوح لها، يبدأ سريان أجل شهرين ) (2 من تاريخ تبليغ الرفض.\nيثبت إيداع التظلم أمام الجهة الإدارية بكل الوسائل المكتوبة، ويرفق مع العريضة."},{"n":"831","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الأول — في رفع الدعوى","الفرع الأول — في الآجال"],"g":"","t":"لا يحتج بأجل الطعن المنصوص عليه في المادة 829 أعلاه، إلا إذا أشير إليه في تبليغ القرار المطعون فيه."},{"n":"832","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الأول — في رفع الدعوى","الفرع الأول — في الآجال"],"g":"معدلة · ق 13-22","t":"تنقطع آجال الطعن في الحالتين الآتيتين:\n1- الطعن أمام جهة قضائية غير مختصة،\n2- وفاة المدعي أو تغير أهليته، و توقف آجال الطعن في الحالتين الآتيتين:\n1- طلب المساعدة القضائية،\n2- القوة القاهرة أو الحادث الفجائي."},{"n":"833","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الأول — في رفع الدعوى","الفرع الثاني — في وقف التنفيذ"],"g":"معدلة · ق 13-22","t":"لا توقف الدعوى المرفوعة أمام الجهة القضائية الإدارية تنفيذ القرار الإداري المتنازع فيه، ما لم ينص القانون على خلاف ذلك.\nغير أنه يمكن الجهة القضائية الإدارية أن تأمر، بناء على طلب الطرف المعني، بوقف تنفيذ القرار الإداري."},{"n":"834","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الأول — في رفع الدعوى","الفرع الثاني — في وقف التنفيذ"],"g":"معدلة · ق 13-22","t":"تقدم الطلبات الرامية إلى وقف التنفيذ المذكور في المادة 833 أعلاه، بدعوى مستقلة طبقا للمادة 919 من هذا القانون.\nلا يقبل طلب وقف تنفيذ القرار الإداري، ما لم يكن متزامنا مع دعوى مرفوعة في الموضوع، أو في حالة التظلم المشار إليه في المادة 830 أعلاه."},{"n":"835","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الأول — في رفع الدعوى","الفرع الثاني — في وقف التنفيذ"],"g":"ملغاة · ق 13-22","t":"مادة ملغاة."},{"n":"836","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الأول — في رفع الدعوى","الفرع الثاني — في وقف التنفيذ"],"g":"ملغاة · ق 13-22","t":"مادة ملغاة."},{"n":"837","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الأول — في رفع الدعوى","الفرع الثاني — في وقف التنفيذ"],"g":"معدلة · ق 13-22","t":"يتم تبليغ الأمر القاضي بوقف تنفيذ القرار الإداري، بجميع الوسائل، خلال أجل أربع وعشرين ) (24 ساعة من صدوره، إلى الخصوم المعنيين وإلى الجهة الإدارية التي أصدرت القرار الإداري المطعون فيه.\nتوقف آثار القرار الإداري المطعون فيه ابتداء من تاريخ وساعة التبليغ الرسمي أو تبليغ أمر وقف التنفيذ إلى الجهة التي أصدرته.\nيجوز استئناف أمر وقف التنفيذ أمام المحكمة الادارية للاستئناف أو مجلس الدولة خلال أجل خمسة عشر ) (15 يوما من تاريخ تبليغه."},{"n":"838","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الثاني — في الخصومة","الفرع الأول — في التحقيق — – 1أحكام عامة:"],"g":"","t":"تودع المذكرات والوثائق المقدمة من الخصوم بأمانة ضبط المحكمة الإدارية.\nيتم التبليغ الرسمي لعريضة افتتاح الدعوى عن طريق محضر قضائي، ويتم تبليغ المذكرات ومذكرات الرد مع الوثائق المرفقة بها إلى الخصوم عن طريق أمانة الضبط تحت إشراف القاضي المقرر."},{"n":"839","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الثاني — في الخصومة","الفرع الأول — في التحقيق — – 1أحكام عامة:"],"g":"","t":"يجوز تبليغ الأعمال الإجرائية إلى ممثلي الأطراف."},{"n":"840","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الثاني — في الخصومة","الفرع الأول — في التحقيق — – 1أحكام عامة:"],"g":"معدلة · ق 13-22","t":"تبلغ كل الإجراءات المتخذة وتدابير التحقيق إلى الخصوم بكل الوسائل المتاحة قانونا بما فيها الالكترونية.\nيتم أيضا تبليغ طلبات التسوية و الإعذارات وأوامر الاختتام وتاريخ الجلسة بنفس الأشكال.\nيشار في تبليغ العرائض والمذكرات إلى أنه في حالة عدم مراعاة الأجل المحدد من طرف القاضي لتقديم مذكرات الرد يمكن اختتام التحقيق دون إشعار مسبق."},{"n":"841","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الثاني — في الخصومة","الفرع الأول — في التحقيق — – 1أحكام عامة:"],"g":"","t":"تبلغ نسخ الوثائق المرفقة للعرائض والمذكرات إلى الخصوم بنفس الأشكال المقررة لتبليغ المذكرات.\nعندما يحول عدد الوثائق أو حجمها أو خصائصها دون استخراج نسخ عنها، يبلغ جرد مفصل لها إلى الخصوم أو إلى ممثليهم، للاطلاع عليها بأمانة الضبط، وأخذ نسخ عنها على نفقتهم."},{"n":"842","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الثاني — في الخصومة","الفرع الأول — في التحقيق — – 1أحكام عامة:"],"g":"","t":"يجوز لرئيس المحكمة الإدارية أن يرخص في حالة الضرورة الملحة، بتسليم هذه الوثائق مؤقتا إلى الخصوم أو ممثليهم خلال أجل يحدده."},{"n":"843","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الثاني — في الخصومة","الفرع الأول — في التحقيق — – 1أحكام عامة:"],"g":"","t":"عندما يتبين لرئيس تشكيلة الحكم، أن الحكم يمكن أن يكون مؤسسا على وجه مثار تلقائيا، يعلم الخصوم قبل جلسة الحكم، بهذا الوجه، ويحدد الأجل الذي يمكن فيه تقديم ملاحظاتهم على الوجه المثار، دون خرق آجال اختتام التحقيق.\nلا تطبق أحكام هذه المادة على الأوامر.\n2- دور المقرر:"},{"n":"844","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الثاني — في الخصومة","الفرع الأول — في التحقيق — – 1أحكام عامة:"],"g":"","t":"يعين رئيس المحكمة الإدارية التشكيلة التي يؤول إليها الفصل في الدعوى بمجرد قيد عريضة افتتاح الدعوى بأمانة الضبط.\nيحدد، بناء على ظروف يعين رئيس تشكيلة الحكم، القاضي المقرر الذي القضية، الأجل الممنوح للخصوم من أجل تقديم المذكرات الإضافية والملاحظات وأوجه الدفاع والردود، ويجوز له أن يطلب من الخصوم كل مستند أو أية وثيقة تفيد في فض النزاع.\nيجوز لرئيس تشكيلة الحكم، عندما تقتضي ظروف القضية، أن يحدد فور تسجيل العريضة، التاريخ الذي يختتم فيه التحقيق، ويعلم الخصوم به عن طريق أمانة الضبط."},{"n":"845","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الثاني — في الخصومة","الفرع الأول — في التحقيق — – 1أحكام عامة:"],"g":"","t":"يتم تبليغ الطلبات والأعمال الإجرائية المختلفة أثناء التحقيق إلى الأطراف أو ممثليهم.\n3- إبلاغ محافظ الدولة:"},{"n":"846","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الثاني — في الخصومة","الفرع الأول — في التحقيق — – 1أحكام عامة:"],"g":"","t":"عندما تكون القضية مهيأة للجلسة، أو عندما تقتضي القيام بالتحقق عن طريق خبرة أو سماع شهود أو غيرها من الإجراءات، يرسل الملف إلى محافظ الدولة لتقديم التماساته بعد دراسته من قبل القاضي المقرر.\n4- الإعفاء من التحقيق:"},{"n":"847","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الثاني — في الخصومة","الفرع الأول — في التحقيق — – 1أحكام عامة:"],"g":"","t":"يجوز لرئيس المحكمة الإدارية أن يقرر بألا وجه للتحقيق في القضية عندما يتبين له من العريضة أن حلها مؤكد، ويرسل الملف إلى محافظ الدولة لتقديم التماساته.\nفي هذه الحالة يأمر الرئيس بإحالة الملف أمام تشكيلة الحكم بعد تقديم التماسات محافظ الدولة.\n5- التسوية والأعذار:"},{"n":"848","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الثاني — في الخصومة","الفرع الأول — في التحقيق — – 1أحكام عامة:"],"g":"معدلة · ق 13-22","t":"عندما تكون العريضة مشوبة بعيب يرتب عدم القبول، وتكون قابلة للتصحيح، لا يجوز للمحكمة الإدارية أن ترفضها وإثارة عدم القبول تلقائيا، إلا بعد دعوة المعني إلى تصحيحها.\nيشار في أمر التصحيح، إلى أنه في حالة عدم القيام بهذا الإجراء يمكن رفض الطلبات بعد انقضاء الأجل المحدد الذي لا يقل عن خمسة عشر ) (15 يوما، باستثناء حالة الاستعجال."},{"n":"849","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الثاني — في الخصومة","الفرع الأول — في التحقيق — – 1أحكام عامة:"],"g":"معدلة · ق 13-22","t":"عندما لا يحترم أحد الخصوم الأجل الممنوح له لتقديم مذكرة أو ملاحظات، يجوز للقاضي المقرر أن يوجه له إعذارا بكل الوسائل المتاحة قانونا.\nفي حالة القوة القاهرة أو الحادث الفجائي، يجوز منح أجل جديد وأخير."},{"n":"850","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الثاني — في الخصومة","الفرع الأول — في التحقيق — – 1أحكام عامة:"],"g":"","t":"إذا لم يقدم المدعي، رغم الإعذار الموجه له، المذكرة الإضافية التي أعلن عن تقد يمها، أو لم يقم بتحضير الملف يعتبر متنازلا."},{"n":"851","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الثاني — في الخصومة","الفرع الأول — في التحقيق — – 1أحكام عامة:"],"g":"معدلة · ق 13-22","t":"إذا لم يقدم المدعى عليه، رغم إعذاره، أية مذكرة، يعتبر متنازلا عن حقه في الرد.\n6- اختتام التحقيق:"},{"n":"852","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الثاني — في الخصومة","الفرع الأول — في التحقيق — – 1أحكام عامة:"],"g":"معدلة · ق 13-22","t":"عندما تكون القضية مهيأة للفصل، يحدد رئيس تشكيلة الحكم تاريخ اختتام التحقيق بموجب أمر غير قابل لأي طعن.\nيبلغ الأمر إلى جميع الخصوم بكل الوسائل المتاحة قانونا، في أجل لا يقل عن خمسة عشر ) (15 يوما قبل تاريخ الاختتام المحدد في الأمر."},{"n":"853","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الثاني — في الخصومة","الفرع الأول — في التحقيق — – 1أحكام عامة:"],"g":"","t":"إذا لم يصدر رئيس تشكيلة الحكم الأمر باختتام التحقيق، يعتبر التحقيق منتهيا ثلاثة ) (3 أيام قبل تاريخ الجلسة المحددة."},{"n":"854","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الثاني — في الخصومة","الفرع الأول — في التحقيق — – 1أحكام عامة:"],"g":"","t":"المذكرات الواردة بعد اختتام التحقيق، لا تبلغ ويصرف النظر عنها من طرف تشكيلة الحكم.\nإذا قدم الخصوم بعد تحديد تاريخ اختتام التحقيق، طلبات جديدة أو أوجها جديدة، لا تقبل ما لم تأمر تشكيلة الحكم بتمديد التحقيق.\n7- إعادة السير في التحقيق:"},{"n":"855","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الثاني — في الخصومة","الفرع الأول — في التحقيق — – 1أحكام عامة:"],"g":"","t":"يجوز لرئيس تشكيلة الحكم في حالة الضرورة، أن يقرر إعادة السير في التحقيق بموجب أمر غير مسبب وغير قابل لأي طعن.\nيبلغ هذا الأمر بنفس شروط تبليغ أمر اختتام التحقيق المنصوص عليه في المادة 852 أعلاه."},{"n":"856","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الثاني — في الخصومة","الفرع الأول — في التحقيق — – 1أحكام عامة:"],"g":"","t":"يمكن إعادة السير في التحقيق بناء على حكم يأمر بتحقيق تكميلي."},{"n":"857","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","القسم الثاني — في الخصومة","الفرع الأول — في التحقيق — – 1أحكام عامة:"],"g":"","t":"تبلغ المذكرات المقدمة إلى الخصوم خلال المرحلة الفاصلة بين اختتام التحقيق وإعادة السير فيه."},{"n":"858","p":["الكتاب الرابع — في الإجراءات المتبعة أمام الجهات القضائية الإدارية","الباب الأول — في الإجراءات المتبعة أمام المحاكم الإدارية","الفصل الثاني — في الدعوى","
