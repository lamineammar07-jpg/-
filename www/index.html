لباب الخامس — في التدخل","الفصل الثاني — في التدخل الاختياري"],"g":"","t":"يكون التدخل أصليا عندما يتضمن ادعاءات لصالح المتدخل."},{"n":"198","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الخامس — في التدخل","الفصل الثاني — في التدخل الاختياري"],"g":"","t":"يكون التدخل فرعيا عندما يدعم ادعاءات أحد الخصوم في الدعوى.\nلا يقبل التدخل إلا لمن كانت له مصلحة للمحافظة على حقوقه في مساندة هذا الخصم."},{"n":"199","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الخامس — في التدخل","الفصل الثالث — في الإدخال في الخصومة"],"g":"","t":"يجوز لأي خصم إدخال الغير الذي يمكن مخاصمته كطرف أصلي في الدعوى للحكم ضده كما يجوز لأي خصم القيام بذلك من أجل أن يكون الغير ملزما بالحكم الصادر."},{"n":"200","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الخامس — في التدخل","الفصل الثالث — في الإدخال في الخصومة"],"g":"","t":"يجب إدخال الغير قبل إقفال باب المرافعات."},{"n":"201","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الخامس — في التدخل","الفصل الثالث — في الإدخال في الخصومة"],"g":"","t":"يمكن للقاضي، ولو من تلقاء نفسه، أن يأمر أحد الخصوم، عند الاقتضاء، تحت طائلة غرامة تهديدية، بإدخال من يرى أن إدخاله مفيد لحسن سير العدالة أو لإظهار الحقيقة."},{"n":"202","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الخامس — في التدخل","الفصل الثالث — في الإدخال في الخصومة"],"g":"","t":"لا يجوز للغير المدخل في الخصام أن يثير الدفع بعدم الاختصاص الإقليمي للجهة القضائية المكلف بالحضور أمامها، حتى ولو استند على شرط محدد للاختصاص."},{"n":"203","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الخامس — في التدخل","الفصل الثالث — في الإدخال في الخصومة"],"g":"","t":"الإدخال في الضمان هو الإدخال الوجوبي الذي يمارسه أحد الخصوم في الخصومة ضد الضامن."},{"n":"204","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الخامس — في التدخل","الفصل الثالث — في الإدخال في الخصومة"],"g":"","t":"يمكن للقاضي أن يمنح أجلا للخصوم لإدخال الضامن.\nيستأنف سير الخصومة بمجرد انقضاء هذا الأجل."},{"n":"205","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الخامس — في التدخل","الفصل الثالث — في الإدخال في الخصومة"],"g":"","t":"يمكن للقاضي أن يمنح أجلا للضامن لتحضير وسائل دفاعه."},{"n":"206","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الخامس — في التدخل","الفصل الثالث — في الإدخال في الخصومة"],"g":"","t":"يفصل القاضي في طلب الضمان وفي الدعوى الأصلية بحكم واحد، إلا إذا دعت الضرورة الفصل فيهما كل على حده."},{"n":"207","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل الأول — في ضم الخصومات وفصلها"],"g":"","t":"إذا وجد ارتباط بين خصومتين أو أكثر، معروضة أمام نفس القاضي، جاز له ولحسن سير العدالة، ضمهما من تلقاء نفسه، أو بطلب من الخصوم والفصل فيهما بحكم واحد."},{"n":"208","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل الأول — في ضم الخصومات وفصلها"],"g":"","t":"يمكن للقاضي، ولحسن سير العدالة، أن يأمر بفصل الخصومة إلى خصومتين أو أكثر."},{"n":"209","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل الأول — في ضم الخصومات وفصلها"],"g":"","t":"تعد أحكام الضم أو الفصل من الأعمال الولائية، وهي غير قابلة لأي طعن."},{"n":"210","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل الثاني — في انقطاع الخصومة — De l’interruption de l’instance"],"g":"","t":"تنقطع الخصومة في القضايا التي تكون غير مهيأة للفصل للأسباب الآتية:\n1- تغير في أهلية التقاضي لأحد الخصوم،\n2- وفاة أحد الخصوم، إذا كانت الخصومة قابلة للانتقال،\n3- وفاة أو استقالة أو توقيف أو شطب أو تنحي المحامي، إلا إذا كان التمثيل جوازيا."},{"n":"211","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل الثاني — في انقطاع الخصومة — De l’interruption de l’instance"],"g":"","t":"يدعو القاضي شفاهة، فور علمه بسبب انقطاع الخصومة، كل من له صفة ليقوم باستئناف السير فيها أو يختار محام جديد.\nكما يمكن للقاضي دعوة الخصم الذي يعينه لاستئناف سير الخصومة عن طريق التكليف بالحضور."},{"n":"212","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل الثاني — في انقطاع الخصومة — De l’interruption de l’instance"],"g":"","t":"إذا لم يحضر الخصم المكلف بالحضور في إعادة السير في الخصومة، يفصل في النزاع غيابيا تجاهه."},{"n":"213","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل الثالث — في وقف الخصومة — De la suspension de l’instance"],"g":"","t":"توقف الخصومة بإرجاء الفصل فيها أو شطبها من الجدول."},{"n":"214","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل الثالث — في وقف الخصومة — De la suspension de l’instance"],"g":"","t":"يؤمر بإرجاء الفصل في الخصومة، بناء على طلب الخصوم، ماعدا الحالات المنصوص عليها في القانون."},{"n":"215","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل الثالث — في وقف الخصومة — De la suspension de l’instance"],"g":"","t":"يتم إرجاء الفصل في الخصومة بأمر قابل للاستئناف في أجل عشرين ) (20 يوما، يحسب من تاريخ النطق به.\nيخضع استئناف هذا الأمر والفصل في القضية للقواعد المطبقة في مواد الاستعجال."},{"n":"216","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل الثالث — في وقف الخصومة — De la suspension de l’instance"],"g":"","t":"يمكن للقاضي أن يأمر بشطب القضية، بسبب عدم القيام بالإجراءات الشكلية المنصوص عليها في القانون، أو تلك التي أمر بها.\nكما يمكن له الأمر بشطب القضية بناء على طلب مشترك من الخصوم."},{"n":"217","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل الثالث — في وقف الخصومة — De la suspension de l’instance"],"g":"","t":"يتم إعادة السير في الخصومة بموجب عريضة افتتاح دعوى، تودع بأمانة الضبط، بعد إثبات القيام بالإجراء الشكلي الذي كان سببا في شطبها."},{"n":"218","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل الثالث — في وقف الخصومة — De la suspension de l’instance"],"g":"","t":"تطبق القواعد المتعلقة بسقوط الخصومة على الأمر القاضي بالشطب."},{"n":"219","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل الثالث — في وقف الخصومة — De la suspension de l’instance"],"g":"","t":"يعد الأمر بشطب القضية من الجدول من الأعمال الولائية، وهو غير قابل لأي طعن."},{"n":"220","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل الرابع — في انقضاء الخصومة — De l’extinction de l’instance"],"g":"","t":"تنقضي الخصومة تبعا لانقضاء الدعوى، بالصلح أو بالقبول بالحكم أو بالتنازل عن الدعوى.\nيمكن أيضا أن تنقضي الخصومة بوفاة أحد الخصوم، ما لم تكن الدعوى قابلة للانتقال."},{"n":"221","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل الرابع — في انقضاء الخصومة — De l’extinction de l’instance"],"g":"","t":"تنقضي الخصومة أصلا، بسبب سقوطها أو التنازل عنها.\nفي هذه الحالات لا مانع من الاختصام من جديد، ما لم تكن الدعوى قد انقضت لأسباب أخرى."},{"n":"222","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل الخامس — في سقوط الخصومة — De la péremption de l’instance"],"g":"","t":"تسقط الخصومة نتيجة تخلف الخصوم عن القيام بالمساعي اللازمة.\nيجوز للخصوم تقديم طلب السقوط، إما عن طريق دعوى أو عن طريق دفع يثيره أحدهم قبل أية مناقشة في الموضوع."},{"n":"223","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل الخامس — في سقوط الخصومة — De la péremption de l’instance"],"g":"","t":"تسقط الخصومة بمرور سنتين ) (2 تحسب من تاريخ صدور الحكم أو صدور أمر القاضي، الذي كلف أحد الخصوم القيام بالمساعي.\nتتمثل المساعي في كل الإجراءات التي تتخذ بهدف مواصلة القضية وتقدمها."},{"n":"224","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل الخامس — في سقوط الخصومة — De la péremption de l’instance"],"g":"","t":"يسري أجل سقوط الخصومة على أي شخص طبيعي، ولو كان ناقص الأهلية، كما يسري على الدولة والجماعات الإقليمية والمؤسسات العمومية ذات الصبغة الإدارية، وعلى أي شخص معنوي آخر."},{"n":"225","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل الخامس — في سقوط الخصومة — De la péremption de l’instance"],"g":"","t":"لا يجوز للقاضي إثارة سقوط الخصومة تلقائيا."},{"n":"226","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل الخامس — في سقوط الخصومة — De la péremption de l’instance"],"g":"","t":"لا يؤدي سقوط الخصومة إلى انقضاء الدعوى، إنما يترتب عليه انقضاء الخصومة، وعدم الاحتجاج بأي إجراء من إجراءات الخصومة المنقضية أو التمسك به."},{"n":"227","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل الخامس — في سقوط الخصومة — De la péremption de l’instance"],"g":"","t":"إذا تقرر سقوط الخصومة في مرحلة الاستئناف أو المعارضة، حاز الحكم المطعون فيه بالاستئناف أو المعارضة، قوة الشيء المقضي به، حتى ولو لم يتم تبليغه رسميا."},{"n":"228","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل الخامس — في سقوط الخصومة — De la péremption de l’instance"],"g":"","t":"ينقطع سريان أجل سقوط الخصومة بأحد الأسباب المنصوص عليها في المادة 210 أعلاه.\nساريا في حالة وقف الخصومة، ما عدا في حالة إرجاء الفصل في يبقى الأجل القضية."},{"n":"229","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل الخامس — في سقوط الخصومة — De la péremption de l’instance"],"g":"","t":"يسري أجل سقوط الخصومة المنصوص عليه في المادة 223 أعلاه، في حالة الإحالة بعد النقض، ابتداء من تاريخ النطق بقرار النقض من طرف المحكمة العليا."},{"n":"230","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل الخامس — في سقوط الخصومة — De la péremption de l’instance"],"g":"","t":"إذا تم النطق بسقوط الخصومة يتحمل المصاريف القضائية الطرف الذي خسرها."},{"n":"231","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل السادس — في التنازل عن الخصومة"],"g":"","t":"التنازل هو إمكانية مخولة للمدعي لإنهاء الخصومة، ولا يترتب عليه التخلي عن الحق في الدعوى.\nيتم التعبير عن التنازل، إما كتابيا وإما بتصريح يثبت بمحضر يحرره رئيس أمناء الضبط."},{"n":"232","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل السادس — في التنازل عن الخصومة"],"g":"","t":"يكون تنازل المدعي معلقا على قبول المدعى عليه إذا قدم هذا الأخير، عند التنازل، طلبا مقابلا أو استئنافا فرعيا أو دفوعا بعدم القبول أو دفوعا في الموضوع."},{"n":"233","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل السادس — في التنازل عن الخصومة"],"g":"","t":"يجب أن يؤسس رفض التنازل من طرف المدعى عليه على أسباب مشروعة.\nيحمل الحكم القاضي بالتنازل المدعي مصاريف إجراءات الخصومة،"},{"n":"234","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل السادس — في التنازل عن الخصومة"],"g":"","t":"وعند الاقتضاء، التعويضات المطلوبة من المدعى عليه، ما لم يوجد اتفاق مخالف."},{"n":"235","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل السادس — في التنازل عن الخصومة"],"g":"","t":"تطبق المواد من 231 إلى 234 و 238 من هذا القانون على التنازل المتعلق بالاستئناف والمعارضة والطعن بالنقض."},{"n":"236","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل السادس — في التنازل عن الخصومة"],"g":"","t":"يعتبر التنازل عن المعارضة أو الاستئناف، قبولا بالحكم.\nلا ينتج التنازل أثره إذا عارض أو استأنف أحد الخصوم الحكم لاحقا."},{"n":"237","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل السابع — في القبول بالطلبات وبالحكم"],"g":"","t":"القبول هو تخلي أحد الخصوم عن حقه في الاحتجاج على طلب كليا.\nجزئيا أو ً خصمه، أو على حكم سبق صدوره.ويكون إما ً"},{"n":"238","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل السابع — في القبول بالطلبات وبالحكم"],"g":"","t":"القبول بطلب الخصم يعد اعترافا بصحة ادعاءاته، وتخليا من المدعى عليه، ما لم يطعن في الحكم لاحقا."},{"n":"239","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل السابع — في القبول بالطلبات وبالحكم"],"g":"","t":"القبول بالحكم هو تنازل الخصوم عن ممارسة حقهم في الطعن، إلا إذا قام خصم آخر بممارسة حقه في الطعن لاحقا."},{"n":"240","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السادس — في عوارض الخصومة","الفصل السابع — في القبول بالطلبات وبالحكم"],"g":"","t":"يجب التعبير عن القبول صراحة وبدون لبس، سواء أمام القاضي أو أمام المحضر القضائي أثناء التنفيذ."},{"n":"241","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السابع — في الرد والإحالة","الفصل الأول — في رد القضاة","القسم الأول — في حالات الرد"],"g":"","t":"يجوز رد قاضي الحكم، ومساعد القاضي في الحالات الآتية:\nإذا كان له أو لزوجه مصلحة شخصية في النزاع، إذا وجدت قرابة أو مصاهرة بينه أو بين زوجه وبين أحد الخصوم أو أحد المحامين أو وكلاء الخصوم، حتى الدرجة الرابعة، إذا كان له أو لزوجه أو أصولهما أو فروعهما خصومة سابقة أو قائمة مع أحد الخصوم، إذا كان هو شخصيا أو زوجه أو أحد أصوله أو أحد فروعه، دائنا أو مدينا لأحد الخصوم، إذا سبق له أن أدلى بشهادة في النزاع، إذا كان ممثلا قانونيا لأحد الخصوم في النزاع أو سبق له ذلك، إذا كان أحد الخصوم في خدمته، إذا كان بينه وبين أحد الخصوم علاقة صداقة حميمة، أو عداوة بينة."},{"n":"242","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السابع — في الرد والإحالة","الفصل الأول — في رد القضاة","القسم الثاني — في إجراءات الرد"],"g":"","t":"يقدم طلب الرد بعريضة إلى رئيس الجهة القضائية، بعد دفع الرسوم القضائية وقبل إقفال باب المرافعات.\nإذا كان الرد متعلقا بقاض في المحكمة، تقدم العريضة إلى رئيس المحكمة الذي يبلغها بدوره إلى القاضي المطلوب رده.ويجب على هذا الأخير أن يصرح كتابة خلال ثلاثة ) (3 أيام، بقبول الرد أو رفض التنحي، وفي هذه الحالة الأخيرة، عليه أن يجيب عن أوجه الرد.\nفي حالة رفض التنحي عن النظر في القضية، أو عدم تقديم الجواب في الأجل المحدد في الفقرة السابقة، يحيل رئيس المحكمة طلب الرد إلى رئيس المجلس القضائي في أجل ثمانية ) (8 أيام الموالية للرفض أو عدم الإجابة مرفقا بكل المستندات المفيدة.\nيتم الفصل في طلب الرد في غرفة المشورة، برئاسة رئيس المجلس القضائي بمساعدة رئيسي غرفة على الأقل، وذلك في أقرب الآجال.\nإذا كان الرد متعلقا بقاض في المجلس القضائي، تقدم العريضة إلى رئيس هذه الجهة القضائية الذي يبلغه بدوره للقاضي المطلوب رده.ويجب على هذا الأخير أن يصرح كتابة خلال ثلاثة ) (3 أيام، بقبول الرد أو رفض التنحي، وفي هذه الحالة الأخيرة عليه أن يجيب عن أوجه الرد.\nفي حالة رفض التنحي، يحال الطلب إلى الرئيس الأول للمحكمة العليا، مرفقا بكل المستندات المفيدة.\nيتم الفصل في طلب الرد في غرفة المشورة، برئاسة الرئيس الأول للمحكمة العليا بمساعدة رئيسي غرفة على الأقل، وذلك في أقرب الآجال.\nفي الحالة التي يكون فيها المطلوب رده مساعدا، يقدم الطلب إلى رئيس المحكمة المختصة الذي يفصل فيه بأمر.\nفي جميع الحالات، يكون القرار أو الأمر الفاصل في الرد، غير قابل لأي طعن."},{"n":"243","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السابع — في الرد والإحالة","الفصل الأول — في رد القضاة","القسم الثاني — في إجراءات الرد"],"g":"","t":"إذا كان القاضي المطلوب رده رئيس محكمة، يقدم طلب الرد مباشرة إلى رئيس المجلس القضائي الذي يتبعه، ويفصل فيه وفقا للفقرة 4 من المادة 242 أعلاه.\nإذا كان القاضي المطلوب رده رئيس مجلس قضائي، يقدم الطلب مباشرة إلى الرئيس الأول للمحكمة العليا، ويفصل فيه وفقا للفقرة 6 من المادة 242 أعلاه."},{"n":"244","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السابع — في الرد والإحالة","الفصل الأول — في رد القضاة","القسم الثاني — في إجراءات الرد"],"g":"","t":"يقدم طلب الرد المتعلق بأحد قضاة المحكمة العليا على شكل عريضة توجه إلى الرئيس الأول لهذه المحكمة، ويودع لدى أمانة الضبط التابعة لها.\nتبلغ العريضة فورا إلى القاضي المعني بمعرفة الرئيس الأول للمحكمة العليا.\nيجب على القاضي المطلوب رده أن يقدم جوابه خلال ثمانية ) (8 أيام، وإذا رفض التنحي عن نظر القضية أو لم يقدم جوابه في الأجل المحدد، يفصل في الطلب خلال أجل شهرين ) (2 في غرفة المشورة برئاسة الرئيس الأول للمحكمة العليا ومساعدة رؤساء غرف هذه الجهة القضائية."},{"n":"245","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السابع — في الرد والإحالة","الفصل الأول — في رد القضاة","القسم الثاني — في إجراءات الرد"],"g":"","t":"يجب على القاضي المطلوب رده أن يمتنع عن الفصل في القضية إلى حين الفصل في طلب الرد.\nغير أن العقود القضائية والإجراءات التي تمت قبل تبليغ طلب الرد للقاضي المعني تبقى صحيحة."},{"n":"246","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السابع — في الرد والإحالة","الفصل الأول — في رد القضاة","القسم الثاني — في إجراءات الرد"],"g":"","t":"يجب على القاضي الذي يعلم أنه في وضعية تجعله قابلا للرد بمفهوم المادة 241 أعلاه، أن يقدم طلبا لرئيس الجهة القضائية التابع لها بغرض استبداله.\nيتم النظر في هذا الطلب وفقا للإجراءات المنصوص عليها في المواد 242 و 243 و 244 من هذا القانون."},{"n":"247","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السابع — في الرد والإحالة","الفصل الأول — في رد القضاة","القسم الثاني — في إجراءات الرد"],"g":"","t":"يحكم على طالب الرد الذي رفض طلبه، بغرامة مدنية لا تقل عن عشرة آلاف دينار ) (10.000 د.ج، دون الإخلال بحق المطالبة بالتعويض."},{"n":"248","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السابع — في الرد والإحالة","الفصل الثاني — في الإحالة بسبب الأمن العام"],"g":"","t":"يمكن للنائب العام لدى المحكمة العليا، إذا أخطر بطلب إحالة قضية لسبب يتعلق بالأمن العام، أن يقدم التماسات إلى المحكمة العليا تهدف إلى تلبية هذا الطلب.\nيفصل في هذا الطلب خلال ثمانية ) (8 أيام في غرفة المشورة من قبل الرئيس الأول ورؤساء الغرف."},{"n":"249","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السابع — في الرد والإحالة","الفصل الثالث — في الإحالة بسبب الشبهة المشروعة"],"g":"","t":"يهدف طلب الإحالة بسبب الشبهة المشروعة إلى التشكيك في حياد الجهة القضائية المعروضة أمامها القضية."},{"n":"250","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السابع — في الرد والإحالة","الفصل الثالث — في الإحالة بسبب الشبهة المشروعة"],"g":"","t":"يقدم طلب الإحالة بسبب الشبهة المشروعة طبقا لنفس الأشكال المقررة لعريضة افتتاح الدعوى، ويفصل رئيس الجهة القضائية المعنية في هذا الطلب بأمر خلال ثمانية ) (8 أيام.\nإذا رأى رئيس الجهة القضائية أن الطلب مؤسس، يقوم إما بتعيين تشكيلة جديدة، أو يرفع الطلب إلى رئيس الجهة القضائية الأعلى مباشرة، لتعيين جهة الإحالة.\nهذا الأمر غير قابل لأي طعن."},{"n":"251","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السابع — في الرد والإحالة","الفصل الثالث — في الإحالة بسبب الشبهة المشروعة"],"g":"","t":"إذا اعترض الرئيس على الطلب، يحيل القضية مع بيان أسباب الاعتراض إلى رئيس الجهة القضائية الأعلى مباشرة، تفصل هذه الجهة في قرار الرفض، في غرفة المشورة، خلال شهر، دون حاجة إلى استدعاء الخصوم.\nتتولى الجهة القضائية المقدم إليها الطلب، إرسال نسخة من قرارها إلى الجهة القضائية المطلوب تخليها عن النظر في القضية.\nيتولى الخصم الذي يهمه التعجيل، القيام بالتبليغ الرسمي لهذا القرار لبقية الخصوم."},{"n":"252","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السابع — في الرد والإحالة","الفصل الثالث — في الإحالة بسبب الشبهة المشروعة"],"g":"","t":"إذا كان الطلب مبررا، تأمر الجهة القضائية التي عرضت عليها القضية بإحالتها أمام جهة قضائية أخرى من نفس الدرجة لتلك التي تقرر تنحيتها عن النظر في القضية."},{"n":"253","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السابع — في الرد والإحالة","الفصل الثالث — في الإحالة بسبب الشبهة المشروعة"],"g":"","t":"لا يكون طلب تنحية جهة قضائية موقفا لسير الخصومة ما لم يقرر رئيس الجهة القضائية المختصة خلاف ذلك."},{"n":"254","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب السابع — في الرد والإحالة","الفصل الثالث — في الإحالة بسبب الشبهة المشروعة"],"g":"","t":"يؤدي رفض الطلب إلى تطبيق المادة 247 من هذا القانون."},{"n":"255","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة"],"g":"","t":"تصدر أحكام المحاكم بقاض فرد، ما لم ينص القانون على خلاف ذلك.وتصدر قرارات جهة الاستئناف بتشكيلة مكونة من ثلاثة قضاة، ما لم ينص القانون على خلاف ذلك.\nمدعيا كطرف أصلي أو"},{"n":"256","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة"],"g":"","t":"يمكن لممثل النيابة العامة أن يكون يتدخل كطرف منضم."},{"n":"257","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة"],"g":"","t":"تتدخل النيابة العامة تلقائيا في القضايا التي يحددها القانون، أو للدفاع عن النظام العام."},{"n":"258","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة"],"g":"","t":"يجب على ممثل النيابة العامة تقديم طلباته كتابيا وحضور الجلسة في القضايا التي يكون طرفا أصليا فيها."},{"n":"259","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة"],"g":"","t":"يكون ممثل النيابة العامة طرفا منضما في القضايا الواجب إبلاغه بها، ويبدي رأيه بشأنها كتابيا حول تطبيق القانون."},{"n":"260","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة","القسم الأول — في سير الجلسة"],"g":"","t":"يجب إبلاغ النيابة العامة عشرة ) (10 أيام على الأقل قبل تاريخ الجلسة بالقضايا الآتية:\nلقضايا التي تكون الدولة أو إحدى الجماعات الإقليمية أو المؤسسات العمومية ذات الصبغة الإدارية طرفا فيها، تنازع الاختصاص بين القضاة، رد القضاة، الحالة المدنية، حماية ناقصي الأهلية، الطعن بالتزوير، الإفلاس والتسوية القضائية، المسؤولية المالية للمسيرين الاجتماعيين.\nويجوز لممثل النيابة العامة الاطلاع على جميع القضايا الأخرى التي يرى تدخله فيها ضروريا.\nيمكن أيضا للقاضي تلقائيا، أن يأمر بإبلاغ ممثل النيابة العامة بأية قضية أخرى."},{"n":"261","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة","القسم الأول — في سير الجلسة"],"g":"","t":"يحدد رئيس القسم أو التشكيلة جدول القضايا لكل جلسة، ويتم إبلاغه إلى ممثل النيابة العامة، ويعلق في المكان المعين لذلك."},{"n":"262","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة","القسم الأول — في سير الجلسة"],"g":"","t":"ضبط الجلسة منوط برئيسها، لضمان الهدوء والرصانة والوقار الواجب لهيئة المحكمة."},{"n":"263","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة","القسم الأول — في سير الجلسة"],"g":"","t":"يتم الاستماع إلى الخصوم ووكلائهم ومحاميهم وجاهيا."},{"n":"264","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة","القسم الأول — في سير الجلسة"],"g":"","t":"إذا تعذر على أحد الخصوم حضور الجلسة يمكن للقاضي تأجيل القضية إلى جلسة لاحقة، إذا رأى أن التخلف عن الحضور مبرر."},{"n":"265","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة","القسم الأول — في سير الجلسة"],"g":"","t":"يمكن للقاضي دعوة الخصوم إلى تقديم توضيحات بشأن المسائل القانونية أو بشأن الوقائع، إذا تبين له أن ذلك ضروري أو أن هناك غموضا."},{"n":"266","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة","القسم الأول — في سير الجلسة"],"g":"","t":"عندما تكون النيابة العامة طرفا منضما في القضية، يكون لها الحق في إبداء ملاحظات."},{"n":"267","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة","القسم الأول — في سير الجلسة"],"g":"","t":"لا يمكن للخصوم تقديم طلبات أو الإدلاء بملاحظات، بعد إقفال باب المرافعات."},{"n":"268","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة","القسم الأول — في سير الجلسة"],"g":"","t":"يجوز للجهة القضائية المعروض أمامها النزاع، بعد إقفال باب المرافعات، أن تعيد القضية إلى الجدول، كلما دعت الضرورة لذلك.\nكما يمكن أن تقوم بذلك بناء على طلب أحد الخصوم أو بسبب تغيير في تشكيلتها.\nتفتح المرافعات من جديد، بناء على أمر شفوي من رئيس التشكيلة المعني."},{"n":"269","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة","القسم الأول — في سير الجلسة"],"g":"","t":"تتم المداولات في السرية، وتكون وجوبا بحضور كل قضاة التشكيلة، دون حضور ممثل النيابة العامة والخصوم ومحاميهم وأمين الضبط."},{"n":"270","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة","القسم الثاني — في إصدار الأحكام"],"g":"","t":"يصدر الحكم الفاصل في النزاع بأغلبية الأصوات."},{"n":"271","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة","القسم الثاني — في إصدار الأحكام"],"g":"","t":"يتم النطق بالحكم في الحال أو في تاريخ لاحق، ويبلغ الخصوم بهذا التاريخ خلال الجلسة.\nفي حالة التأجيل، يجب أن يحدد تاريخ النطق بالحكم للجلسة الموالية.\nلا يجوز تمديد المداولة إلا إذا اقتضت الضرورة الملحة ذلك، على ألا تتجاوز جلستين متتاليتين."},{"n":"272","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة","القسم الثاني — في إصدار الأحكام"],"g":"","t":"يتم النطق بالأحكام الفاصلة في النزاع علنيا.\nيصرح بالأوامر الولائية بغير ذلك."},{"n":"273","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة","القسم الثاني — في إصدار الأحكام"],"g":"","t":"يقتصر النطق بالحكم على تلاوة منطوقه في الجلسة من طرف الرئيس وبحضور قضاة التشكيلة الذين تداولوا في القضية."},{"n":"274","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة","القسم الثاني — في إصدار الأحكام"],"g":"","t":"تاريخ الحكم هو تاريخ النطق به."},{"n":"275","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة","القسم الثاني — في إصدار الأحكام"],"g":"","t":"يجب أن يشمل الحكم، تحت طائلة البطلان، العبارة الآتية:\nالجمهورية الجزائرية الديمقراطية الشعبية باسم الشعب الجزائري."},{"n":"276","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة","القسم الثاني — في إصدار الأحكام"],"g":"","t":"يجب أن يتضمن الحكم البيانات الآتية:\n1- الجهة القضائية التي أصدرته،\n2- أسماء وألقاب وصفات القضاة الذين تداولوا في القضية،\n3- تاريخ النطق به،\n4- اسم ولقب ممثل النيابة العامة عند الاقتضاء،\n5- اسم ولقب أمين الضبط الذي حضر مع تشكيلة الحكم،\n6- أسماء وألقاب الخصوم وموطن كل منهم، وفي حالة الشخص المعنوي تذكر طبيعته وتسميته ومقره الاجتماعي وصفة ممثله القانوني أو الاتفاقي،\n7- أسماء وألقاب المحامين أو أي شخص قام بتمثيل أو مساعدة الخصوم،\n8- الإشارة إلى عبارة النطق بالحكم في جلسة علنية."},{"n":"277","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة","القسم الثاني — في إصدار الأحكام"],"g":"","t":"لا يجوز النطق بالحكم إلا بعد تسبيبه، ويجب أن يسبب الحكم من حيث الوقائع والقانون، وأن يشار إلى النصوص المطبقة.\nيجب أيضا أن يستعرض بإيجاز، وقائع القضية وطلبات وادعاءات الخصوم ووسائل دفاعهم.\nويجب أن يرد على كل الطلبات والأوجه المثارة.\nيتضمن ما قضى به في شكل منطوق."},{"n":"278","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة","القسم الثاني — في إصدار الأحكام"],"g":"","t":"يوقع على أصل الحكم، الرئيس وأمين الضبط والقاضي المقرر عند الاقتضاء، ويحفظ أصل الحكم في أرشيف الجهة القضائية.\nيحفظ أيضا ملف القضية في أرشيف الجهة القضائية.\nيستعيد الخصوم الوثائق المملوكة لهم، بناء على طلبهم مقابل وصل بالاستلام."},{"n":"279","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة","القسم الثاني — في إصدار الأحكام"],"g":"","t":"إذا تعذر التوقيع على أصل الحكم من طرف القاضي الذي أصدره، أو أمين الضبط، يعين رئيس الجهة القضائية المعنية بموجب أمر، قاضيا آخر و / أو أمين ضبط آخر ليقوم بذلك بدله."},{"n":"280","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة","القسم الثاني — في إصدار الأحكام"],"g":"","t":"بعد تسجيل الحكم يسلم أمين الضبط نسخة تنفيذية أو نسخة عادية بمجرد طلبها."},{"n":"281","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة","القسم الثاني — في إصدار الأحكام"],"g":"","t":"النسخة التنفيذية، هي النسخة الممهورة بالصيغة التنفيذية.\nتوقع وتسلم من طرف أمين الضبط إلى المستفيد من الحكم الذي يرغب في متابعة تنفيذه، وتحمل النسخة التنفيذية العبارة التالية \" نسخة مطابقة للأصل مسلمة للتنفيذ\" وكذا ختم الجهة القضائية."},{"n":"282","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة","القسم الثاني — في إصدار الأحكام"],"g":"","t":"لا تسلم إلا نسخة تنفيذية واحدة.\nإلا أن الخصم المستفيد الذي أضاع قبل التنفيذ النسخة التنفيذية أو تعذر عليه التنفيذ، لاسيما بسبب إتلافها أو تمزيقها يمكنه الحصول على نسخة تنفيذية ثانية، وفقا لأحكام المادتين 602 و 603 من هذا القانون."},{"n":"283","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة","القسم الثاني — في إصدار الأحكام"],"g":"","t":"لا يترتب على إغفال أو عدم صحة أحد البيانات المقررة لصحة الحكم بطلانه، إذا ثبت من وثائق ملف القضية أو من سجل الجلسات أنه تم فعلا مراعاة القواعد القانونية."},{"n":"284","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة","القسم الثاني — في إصدار الأحكام"],"g":"","t":"يكون للحكم حجية العقد الرسمي مع مراعاة أحكام المادة 283 أعلاه."},{"n":"285","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة","القسم الثاني — في إصدار الأحكام"],"g":"","t":"إن تفسير الحكم بغرض توضيح مدلوله أو تحديد مضمونه، من اختصاص الجهة القضائية التي أصدرته.\nيقدم طلب تفسير الحكم بعريضة من أحد الخصوم أو بعريضة مشتركة منهم، وتفصل الجهة القضائية، بعد سماع الخصوم أو بعد صحة تكليفهم بالحضور."},{"n":"286","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة","القسم الثاني — في إصدار الأحكام"],"g":"","t":"يجوز للجهة القضائية التي أصدرت الحكم، ولو بعد حيازة ذلك الحكم قوة الشيء المقضي به، أن تصحح الخطأ المادي أو الإغفال الذي يشوبه، كما يجوز للجهة القضائية التي يطعن في الحكم أمامها القيام بتصحيحه.\nيقدم طلب التصحيح إلى الجهة القضائية، بعريضة من أحد الخصوم أو بعريضة مشتركة منهم، وفقا للأشكال المقررة في رفع الدعوى، و يمكن للنيابة العامة تقديم هذا الطلب، لاسيما إذا تبين لها أن الخطأ المادي يعود إلى مرفق العدالة.\nيفصل في طلب التصحيح بعد سماع الخصوم أو بعد صحة تكليفهم بالحضور.\nيؤشر بحكم التصحيح على أصل الحكم المصحح وعلى النسخ المستخرجة منه، ويبلغ الخصوم المعنيون بحكم التصحيح.\nعندما يصبح الحكم المصحح حائزا لقوة الشيء المقضي به، فلا يمكن الطعن في الحكم القاضي بالتصحيح إلا عن طريق الطعن بالنقض."},{"n":"287","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الأول — أحكام عامة","القسم الثاني — في إصدار الأحكام"],"g":"","t":"يقصد بالخطأ المادي عرض غير صحيح لواقعة مادية أو تجاهل وجودها.\nغير أن تصحيح الخطأ المادي أو الإغفال لا يؤدي إلى تعديل ما قضى به الحكم من حقوق والتزامات للأطراف."},{"n":"288","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الثاني — في الأحكام الحضورية"],"g":"","t":"يكون الحكم حضوريا، إذا حضر الخصوم شخصيا أو ممثلين بوكلائهم أو محاميهم أثناء الخصومة أو قدموا مذكرات حتى ولو لم يبدوا ملاحظات شفوية."},{"n":"289","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الثاني — في الأحكام الحضورية"],"g":"","t":"إذا لم يحضر المدعي لسبب مشروع، جاز للقاضي تأجيل القضية إلى الجلسة الموالية لتمكينه من الحضور."},{"n":"290","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الثاني — في الأحكام الحضورية"],"g":"","t":"إذا لم يحضر المدعي دون سبب مشروع، جاز للمدعى عليه طلب الفصل في موضوع الدعوى، ويكون الحكم في هذه الحالة حضوريا."},{"n":"291","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الثاني — في الأحكام الحضورية"],"g":"","t":"إذا امتنع أحد الخصوم الحاضر عن القيام بإجراء من الإجراءات المأمور بها في الآجال المحددة، يفصل القاضي بحكم حضوري بناء على عناصر الملف."},{"n":"292","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الثالث — في الأحكام الغيابية والأحكام المعتبرة حضوريا"],"g":"","t":"إذا لم يحضر المدعى عليه أو وكيله أو محاميه، رغم صحة التكليف بالحضور، يفصل القاضي غيابيا."},{"n":"293","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الثالث — في الأحكام الغيابية والأحكام المعتبرة حضوريا"],"g":"","t":"إذا تخلف المدعى عليه المكلف بالحضور شخصيا أو وكيله أو محاميه عن الحضور، يفصل بحكم اعتباري حضوري."},{"n":"294","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الثالث — في الأحكام الغيابية والأحكام المعتبرة حضوريا"],"g":"","t":"يكون الحكم الغيابي قابلا للمعارضة."},{"n":"295","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الثالث — في الأحكام الغيابية والأحكام المعتبرة حضوريا"],"g":"","t":"الحكم المعتبر حضوريا غير قابل للمعارضة."},{"n":"296","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الرابع — في الأحكام الفاصلة في الموضوع"],"g":"","t":"الحكم في الموضوع هو الحكم الفاصل كليا أو جزئيا في موضوع النزاع أو في دفع شكلي أو في دفع بعدم القبول أو في أي طلب عارض.\nويكون هذا الحكم بمجرد النطق به، حائزا لحجية الشيء المقضي فيه في النزاع المفصول فيه."},{"n":"297","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الرابع — في الأحكام الفاصلة في الموضوع"],"g":"","t":"يتخلى القاضي عن النزاع الذي فصل فيه بمجرد النطق بالحكم.\nغير أنه يمكن للقاضي الرجوع عن حكمه في حالة الطعن بالمعارضة أو اعتراض الغير الخارج عن الخصومة أو التماس إعادة النظر، ويجوز له أيضا تفسير حكمه أو تصحيحه طبقا للمادتين 285 و 286 من هذا القانون."},{"n":"298","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الخامس — في الأحكام الأخرى","القسم الأول — في الأحكام الصادرة قبل الفصل في الموضوع"],"g":"","t":"الحكم الصادر قبل الفصل في الموضوع هو الحكم الآمر بإجراء تحقيق أو بتدبير مؤقت.\nلا يحوز هذا الحكم حجية الشيء المقضي فيه.\nلا يترتب على هذا الحكم تخلي القاضي عن النزاع."},{"n":"299","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الخامس — في الأحكام الأخرى","القسم الثاني — في الاستعجال والأوامر الاستعجالية"],"g":"","t":"في جميع أحوال الاستعجال، أو إذا اقتضى الأمر الفصل في إجراء يتعلق بالحراسة القضائية أو بأي تدبير تحفظي غير منظم بإجراءات خاصة، يتم عرض القضية بعريضة افتتاحية أمام المحكمة الواقع في دائرة اختصاصها الإشكال أو التدبير المطلوب، وينادى عليها في أقرب جلسة.\nيجب الفصل في الدعاوى الاستعجالية في أقرب الآجال."},{"n":"300","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الخامس — في الأحكام الأخرى","القسم الثاني — في الاستعجال والأوامر الاستعجالية"],"g":"","t":"يكون قاضي الاستعجال مختصا أيضا في المواد التي ينص القانون صراحة على أنها من اختصاصه، وفي حالة الفصل في الموضوع يحوز الأمر الصادر فيه حجية الشيء المقضي فيه."},{"n":"301","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الخامس — في الأحكام الأخرى","القسم الثاني — في الاستعجال والأوامر الاستعجالية"],"g":"","t":"يجوز تخفيض آجال التكليف بالحضور في مواد الاستعجال إلى أربع وعشرين ) (24 ساعة.\nفي حالة الاستعجال القصوى، يجوز أن يكون أجل التكليف بالحضور من ساعة إلى ساعة، بشرط أن يتم التبليغ الرسمي للخصم شخصيا أو إلى ممثله القانوني أو الاتفاقي."},{"n":"302","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الخامس — في الأحكام الأخرى","القسم الثاني — في الاستعجال والأوامر الاستعجالية"],"g":"","t":"في حالة الاستعجال القصوى، يجوز تقديم الطلب إلى قاضي الاستعجال خارج ساعات وأيام العمل بمقر الجهة القضائية حتى قبل قيد العريضة في سجل أمانة الضبط.\nيحدد القاضي تاريخ الجلسة، ويسمح عند الضرورة، بتكليف الخصم بالحضور من ساعة إلى ساعة.\nو يمكنه الفصل خارج ساعات العمل وحتى خلال أيام العطل."},{"n":"303","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الخامس — في الأحكام الأخرى","القسم الثاني — في الاستعجال والأوامر الاستعجالية"],"g":"","t":"لا يمس الأمر الاستعجالي أصل الحق، وهو معجل النفاذ بكفالة أو بدونها رغم كل طرق الطعن.كما أنه غير قابل للمعارضة ولا للاعتراض على النفاذ المعجل.\nفي حالة الاستعجال القصوى، يأمر القاضي بالتنفيذ بموجب النسخة الأصلية للأمر حتى قبل تسجيله."},{"n":"304","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الخامس — في الأحكام الأخرى","القسم الثاني — في الاستعجال والأوامر الاستعجالية"],"g":"","t":"تكون الأوامر الاستعجالية الصادرة في أول درجة قابلة للاستئناف.\nوتكون الأوامر الاستعجالية الصادرة غيابيا في آخر درجة، قابلة للمعارضة.\nيرفع الاستئناف والمعارضة خلال خمسة عشر ) (15 يوما من تاريخ التبليغ الرسمي للأمر، ويجب أن يفصل في ذلك في أقرب الآجال."},{"n":"305","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الخامس — في الأحكام الأخرى","القسم الثاني — في الاستعجال والأوامر الاستعجالية"],"g":"","t":"يمكن لقاضي الاستعجال الحكم بالغرامات التهديدية وتصفيتها.\nيفصل، عند الاقتضاء، في المصاريف القضائية."},{"n":"306","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الخامس — في الأحكام الأخرى","القسم الثالث — في أوامر الأداء"],"g":"","t":"خلافا للقواعد المقررة في رفع الدعاوى، يجوز للدائن بدين من النقود، مستحق وحال الأداء ومعين المقدار وثابت بالكتابة، لاسيما الكتابة العرفية المتضمنة الاعتراف بدين أو التعهد بالوفاء أو فاتورة مؤشر عليها من المدين، تقديم طلب في شكل عريضة على نسختين، إلى رئيس المحكمة التي يوجد في دائرة اختصاصها موطن المدين، وتحتوي على:\n1- اسم ولقب الدائن وموطنه الحقيقي أو المختار في الجزائر،\n2- اسم ولقب المدين وموطنه الحقيقي أو المختار في الجزائر،\n3- ذكر تسمية وطبيعة الشخص المعنوي ومقره الاجتماعي وصفة ممثله القانوني أو الاتفاقي.\n4- عرض موجز عن سبب الدين ومقداره، ترفق جميع المستندات المثبتة للدين مع العريضة."},{"n":"307","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الخامس — في الأحكام الأخرى","القسم الثالث — في أوامر الأداء"],"g":"","t":"يفصل الرئيس في الطلب بأمر، خلال أجل أقصاه خمسة ) (5 أيام من تاريخ إيداع الطلب.\nإذا تبين أن الدين ثابت، أمر المدين بالوفاء بمبلغ الدين والمصاريف، وإلا رفض الطلب.\nالأمر بالرفض غير قابل لأي طعن، دون المساس بحق الدائن في رفع دعوى وفقا للقواعد المقررة لها."},{"n":"308","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الخامس — في الأحكام الأخرى","القسم الثالث — في أوامر الأداء"],"g":"","t":"يسلم رئيس أمناء الضبط إلى الدائن نسخة رسمية من أمر الأداء.\nيتم التبليغ الرسمي وتكليف المدين بالوفاء بأصل الدين والمصاريف في أجل خمسة عشر ) (15 يوما.\nيجب أن يشار في التكليف بالوفاء، تحت طائلة البطلان، بأن للمدين حق الاعتراض على أمر الأداء في أجل خمسة عشر ) (15 يوما تبدأ من تاريخ التبليغ الرسمي.\nيقدم الاعتراض على أمر الأداء بطريق الاستعجال أمام القاضي الذي أصدره.\nللاعتراض أثر موقف لتنفيذ أمر الأداء."},{"n":"309","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الخامس — في الأحكام الأخرى","القسم الثالث — في أوامر الأداء"],"g":"","t":"إذا لم يرفع الاعتراض في الأجل المحدد، يحوز أمر الأداء قوة الشيء المقضي به، وفي هذه الحالة يقوم رئيس أمناء الضبط بمنح الصيغة التنفيذية لطالب التنفيذ بعد تقديم شهادة عدم الاعتراض.\nكل أمر أداء لم يطلب إمهاره بالصيغة التنفيذية خلال سنة واحدة ) (1 من تاريخ صدوره، يسقط ولا يرتب أي أثر."},{"n":"310","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الخامس — في الأحكام الأخرى","القسم الرابع — في الأوامر على العرائض"],"g":"","t":"الأمر على عريضة أمر مؤقت، يصدر دون حضور الخصم، ما لم ينص القانون على خلاف ذلك.\nتقدم الطلبات الرامية إلى إثبات الحالة أو توجيه إنذار أو إجراء استجواب في موضوع لا يمس بحقوق الأطراف، إلى رئيس الجهة القضائية المختصة، ليفصل فيها خلال أجل أقصاه ثلاثة ) (3 أيام من تاريخ إيداع الطلب."},{"n":"311","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الخامس — في الأحكام الأخرى","القسم الرابع — في الأوامر على العرائض"],"g":"","t":"تقدم العريضة من نسختين ويجب أن تكون معللة، وتتضمن الإشارة إلى الوثائق المحتج بها، وإذا كانت العريضة مقدمة بشأن خصومة قائمة، فيجب ذكر المحكمة المعروضة أمامها الخصومة.\nيجب أن يكون الأمر على عريضة مسببا، ويكون قابلا للتنفيذ بناء على النسخة الأصلية.\nكل أمر على عريضة لم ينفذ خلال أجل ثلاثة ) (3 أشهر من تاريخ صدوره، يسقط ولا يرتب أي أثر."},{"n":"312","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثامن — في الأحكام والقرارات","الفصل الخامس — في الأحكام الأخرى","القسم الرابع — في الأوامر على العرائض"],"g":"","t":"في حالة الاستجابة إلى الطلب يمكن الرجوع إلى القاضي الذي أصدر الأمر، للتراجع عنه أو تعديله.\nوفي حالة عدم الاستجابة إلى الطلب، يكون الأمر بالرفض قابلا للاستئناف أمام رئيس المجلس القضائي.\nيرفع الاستئناف خلال خمسة عشر ) (15 يوما من تاريخ أمر الرفض.\nيجب على رئيس المجلس القضائي أن يفصل في هذا الاستئناف في أقرب الآجال.\nلا يخضع هذا الاستئناف للتمثيل الو جوبي بمحام.\nتحفظ النسخة الثانية من الأمر ضمن أصول الأحكام بأمانة ضبط الجهة القضائية المعنية."},{"n":"313","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الأول — القواعد العامة"],"g":"","t":"طرق الطعن العادية هي الاستئناف والمعارضة.\nطرق الطعن غير العادية هي اعتراض الغير الخارج عن الخصومة والتماس إعادة النظر والطعن بالنقض.\nيبدأ سريان أجل الطعن ابتداء من تاريخ التبليغ الرسمي للحكم.\nويسري هذا الأجل كذلك في حق من قام بالتبليغ الرسمي.\nيعتبر الاعتراف كتابة بالتبليغ الرسمي أثناء سير الخصومة بمثابة التبليغ الرسمي."},{"n":"314","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الأول — القواعد العامة"],"g":"","t":"لا يكون الحكم الحضوري الفاصل في موضوع النزاع والحكم الفاصل في أحد الدفوع الشكلية أو الدفع بعدم القبول أو أي دفع من الدفوع الأخرى التي تنهي الخصومة، قابلا لأي طعن بعد انقضاء سنتين ) (2 من تاريخ النطق به، ولو لم يتم تبليغه رسميا."},{"n":"315","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الأول — القواعد العامة"],"g":"","t":"لا يؤثر التكييف الخاطئ للحكم على حق ممارسة الطعن."},{"n":"316","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الأول — القواعد العامة"],"g":"","t":"في حالة الحكم على الخصوم بالتضامن أو في نزاع غير قابل للتجزئة، فإن أجل الطعن لا يسري إلا على من تم تبليغه رسميا.\nعندما يكون الحكم لصالح عدة أطراف متضامنين أو معنيين بالتزام غير قابل للتجزئة، جاز لكل منهم التمسك بالتبليغ الرسمي الذي قام به أحدهم."},{"n":"317","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الأول — القواعد العامة"],"g":"","t":"لا يسري الأجل على شخص موضوع تحت نظام الولاية، إلا من تاريخ التبليغ الرسمي للحكم، إلى وليه أو وصيه أو المقدم عليه، وفي حالة وجود تضارب بين مصلحته ومصلحة أحدهم، يتم التبليغ الرسمي إلى المتصرف الخاص."},{"n":"318","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الأول — القواعد العامة"],"g":"","t":"في حالة وقوع تغيير في أهلية المحكوم ضده، لا يسري الأجل، إلا بعد تبليغ رسمي جديد إلى الشخص الذي أصبحت له الصفة لاستلامه."},{"n":"319","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الأول — القواعد العامة"],"g":"","t":"في حالة وفاة المحكوم عليه، لا يستأنف سريان الأجل إلا بعد التبليغ الرسمي للورثة، ويكون التبليغ الرسمي صحيحا إذا تم في مسكن المتوفى.\nيكون التبليغ الرسمي صحيحا إذا سلم إلى الورثة جملة ودون تحديد أسمائهم وصفاتهم."},{"n":"320","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الأول — القواعد العامة"],"g":"","t":"في حالة وفاة الخصم الذي قام بالتبليغ الرسمي للحكم، يبلغ الطعن إلى الورثة في مسكن المتوفى، طبقا للمادة 319 أعلاه.\nغير أنه لا يمكن للخصم المطالبة بالحكم ضد الورثة، إلا إذا أدخلوا في الخصام."},{"n":"321","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الأول — القواعد العامة"],"g":"","t":"يكون التبليغ الرسمي للطعن صحيحا إذا تم في العنوان المذكور في الحكم."},{"n":"322","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الأول — القواعد العامة"],"g":"","t":"كل الآجال المقررة في هذا القانون من أجل ممارسة حق، أو من أجل حق الطعن، يترتب على عدم مراعاتها سقوط الحق، أو سقوط ممارسة حق الطعن، باستثناء حالة القوة القاهرة أو وقوع أحداث من شأنها التأثير في السير العادي لمرفق العدالة.\nيتم تقديم طلب رفع السقوط إلى رئيس الجهة القضائية المعروض أمامها النزاع، يفصل فيه بموجب أمر على عريضة غير قابل لأي طعن، وذلك بحضور الخصوم، أو بعد صحة تكليفهم بالحضور."},{"n":"323","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثاني — في طرق الطعن العادية"],"g":"","t":"يوقف تنفيذ الحكم خلال أجل الطعن العادي كما يوقف بسبب ممارسته.\nباستثناء الأحكام الواجبة التنفيذ بقوة القانون، يؤمر بالنفاذ المعجل، رغم المعارضة أو الاستئناف، عند طلبه في جميع الحالات التي يحكم فيها بناء على عقد رسمي أو وعد معترف به أو حكم سابق حاز قوة الشيء المقضي به، أو في مادة النفقة أو منح مسكن الزوجية لمن أسندت له الحضانة.\nيجوز للقاضي في جميع الأحوال الأخرى، أن يأمر في حالة الاستعجال بالنفاذ المعجل بكفالة أو بدون كفالة."},{"n":"324","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثاني — في طرق الطعن العادية"],"g":"","t":"يجوز رفع الاعتراض على النفاذ المعجل، أمام رئيس الجهة القضائية المعروض أمامها الاستئناف أو المعارضة، ويجوز له توقيف النفاذ المعجل، عن طريق الاستعجال، إذا رأى أن الاستمرار فيه قد تترتب عليه آثار بالغة أو آثار يتعذر استدراكها.\nيفصل رئيس الجهة القضائية في الاعتراض على النفاذ المعجل في أقرب جلسة."},{"n":"325","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثاني — في طرق الطعن العادية"],"g":"","t":"لا يقبل الاعتراض على النفاذ المعجل، إلا إذا ثبت أن الحكم الذي أمر به طعن فيه بالاستئناف أو المعارضة."},{"n":"326","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثاني — في طرق الطعن العادية"],"g":"","t":"لا يقبل أي طعن في الأحكام الفاصلة في الاعتراض على النفاذ المعجل."},{"n":"327","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثاني — في طرق الطعن العادية","القسم الأول — في المعارضة"],"g":"","t":"تهدف المعارضة المرفوعة من قبل الخصم المتغيب، إلى مراجعة الحكم أو القرار الغيابي.\nيفصل في القضية من جديد من حيث الوقائع والقانون، ويصبح الحكم أو القرار المعارض فيه كأن لم يكن، ما لم يكن هذا الحكم أو القرار مشمولا بالنفاذ المعجل."},{"n":"328","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثاني — في طرق الطعن العادية","القسم الأول — في المعارضة"],"g":"","t":"يكون الحكم أو القرار الغيابي، قابلا للمعارضة أمام نفس الجهة القضائية التي أصدرته، ما لم ينص القانون على خلاف ذلك."},{"n":"329","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثاني — في طرق الطعن العادية","القسم الأول — في المعارضة"],"g":"","t":"لا تقبل المعارضة إلا إذا رفعت في أجل شهر واحد ) (1 ابتداء من تاريخ التبليغ الرسمي للحكم أو القرار الغيابي."},{"n":"330","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثاني — في طرق الطعن العادية","القسم الأول — في المعارضة"],"g":"","t":"ترفع المعارضة حسب الأشكال المقررة لعريضة افتتاح الدعوى.\nيجب أن يتم التبليغ الرسمي للعريضة إلى كل أطراف الخصومة.\nيجب أن تكون العريضة المقدمة أمام الجهة القضائية مرفقة، تحت طائلة عدم القبول شكلا، بنسخة من الحكم المطعون فيه."},{"n":"331","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثاني — في طرق الطعن العادية","القسم الأول — في المعارضة"],"g":"","t":"يكون الحكم الصادر في المعارضة حضوريا في مواجهة جميع الخصوم، وهو غير قابل للمعارضة من جديد."},{"n":"332","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثاني — في طرق الطعن العادية","القسم الثاني — في الاستئناف"],"g":"","t":"يهدف الاستئناف إلى مراجعة أو إلغاء الحكم الصادر عن المحكمة."},{"n":"333","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثاني — في طرق الطعن العادية","القسم الثاني — في الاستئناف"],"g":"","t":"تكون الأحكام الصادرة في جميع المواد قابلة للاستئناف، عندما تفصل في موضوع النزاع أو في دفع شكلي أو في دفع بعدم القبول أو أي دفع عارض آخر ينهي الخصومة، ما لم ينص القانون على خلاف ذلك."},{"n":"334","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثاني — في طرق الطعن العادية","القسم الثاني — في الاستئناف"],"g":"","t":"الأحكام الفاصلة في جزء من موضوع النزاع أو التي تأمر بالقيام بإجراء من إجراءات التحقيق أو تدبير مؤقت، لا تقبل الاستئناف إلا مع الحكم الفاصل في أصل الدعوى برمتها، ما لم ينص القانون على خلاف ذلك.\nيتم الاستئناف في الحكم الصادر قبل الفصل في الموضوع والحكم الفاصل في موضوع الدعوى بموجب نفس عريضة الاستئناف.\nيترتب على عدم قبول استئناف الحكم الفاصل في موضوع الدعوى، عدم قبول استئناف الحكم الصادر قبل الفصل في الموضوع."},{"n":"335","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثاني — في طرق الطعن العادية","القسم الثاني — في الاستئناف"],"g":"","t":"حق الاستئناف مقرر لجميع الأشخاص الذين كانوا خصوما على مستوى الدرجة الأولى أو لذوي حقوقهم.\nكما يحق للأشخاص الذين تم تمثيلهم على مستوى الدرجة الأولى، بسبب نقص الأهلية ممارسة الاستئناف إذا زال سبب ذلك.\nويجوز رفع الاستئناف من طرف المتدخل الأصلي أو المدخل في الخصام في الدرجة الأولى.\nيجب أن تتوفر المصلحة في المستأنف لممارسة الاستئناف."},{"n":"336","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثاني — في طرق الطعن العادية","القسم الثاني — في الاستئناف"],"g":"","t":"يحدد أجل الطعن بالاستئناف بشهر واحد ) (1 ابتداء من تاريخ التبليغ الرسمي للحكم إلى الشخص ذاته.\nو يمدد أجل الاستئناف إلى شهرين ) (2 إذا تم التبليغ الرسمي في موطنه الحقيقي أو المختار.\nلا يسري أجل الاستئناف في الأحكام الغيابية إلا بعد انقضاء أجل المعارضة."},{"n":"337","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثاني — في طرق الطعن العادية","القسم الثاني — في الاستئناف"],"g":"","t":"يجوز للمستأنف عليه، استئناف الحكم فرعيا في أية حالة كانت عليها الخصومة، ولو بلغ رسميا بالحكم دون تحفظ وحتى في حالة سقوط حقه في رفع الاستئناف الأصلي.\nلا يقبل الاستئناف الفرعي إذا كان الاستئناف الأصلي غير مقبول.\nيترتب على التنازل في الاستئناف الأصلي عدم قبول الاستئناف الفرعي إذا وقع بعد التنازل."},{"n":"338","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثاني — في طرق الطعن العادية","القسم الثاني — في الاستئناف"],"g":"","t":"يجوز للأشخاص الذين لم تكن لهم صفة الخصم أو لم يكونوا ممثلين في الخصومة أمام الدرجة الأولى، التدخل في الاستئناف إذا كانت لهم مصلحة في ذلك.\nإذا تعلق الاستئناف بحكم صادر في موضوع غير قابل للتجزئة أو في التزام بالتضامن بين الخصوم، لا يكون ذلك الاستئناف مقبولا ضد أحدهم إلا إذا تم استدعاء بقية الخصوم لحضور الجلسة.\nإذا كان موضوع الحكم غير قابل للتجزئة، أو صدر في التزام بالتضامن، فإن الاستئناف الذي يرفعه أحد الخصوم، يترتب عليه إدخال بقية الخصوم."},{"n":"339","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثاني — في طرق الطعن العادية","القسم الثالث — في آثار الاستئناف"],"g":"","t":"تفصل جهة الاستئناف من جديد من حيث الوقائع والقانون."},{"n":"340","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثاني — في طرق الطعن العادية","القسم الثالث — في آثار الاستئناف"],"g":"","t":"ينقل الاستئناف إلى المجلس القضائي مقتضيات الحكم التي يشير إليها هذا الاستئناف صراحة أو ضمنيا أو المقتضيات الأخرى المرتبطة بها.\nيمكن أن يقتصر الاستئناف على بعض مقتضيات الحكم.\nيتم نقل الخصومة برمتها عندما يهدف الاستئناف إلى إلغاء الحكم أو إذا كان موضوع النزاع غير قابل للتجزئة."},{"n":"341","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثاني — في طرق الطعن العادية","القسم الثالث — في آثار الاستئناف"],"g":"","t":"لا تقبل الطلبات الجديدة في الاستئناف، ما عدا الدفع بالمقاصة وطلبات استبعاد الادعاءات المقابلة أو الفصل في المسائل الناتجة عن تدخل الغير أو حدوث أو اكتشاف واقعة."},{"n":"342","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثاني — في طرق الطعن العادية","القسم الثالث — في آثار الاستئناف"],"g":"","t":"يجوز للخصوم أيضا طلب الفوائد القانونية وما تأخر من الديون وبدل الإيجار والملحقات الأخرى المستحقة بعد صدور الحكم المستأنف، وكذا التعويضات الناتجة عن الأضرار اللاحقة به منذ صدور الحكم."},{"n":"343","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثاني — في طرق الطعن العادية","القسم الثالث — في آثار الاستئناف"],"g":"","t":"لا تعتبر طلبات جديدة، الطلبات المرتبطة مباشرة بالطلب الأصلي والتي ترمي إلى نفس الغرض حتى ولو كان أساسها القانوني مغايرا."},{"n":"344","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثاني — في طرق الطعن العادية","القسم الثالث — في آثار الاستئناف"],"g":"","t":"يجوز للخصوم التمسك بوسائل قانونية جديدة وتقديم مستندات وأدلة جديدة تأييدا لطلباتهم."},{"n":"345","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثاني — في طرق الطعن العادية","القسم الثالث — في آثار الاستئناف"],"g":"","t":"يجوز تقديم الطلبات المقابلة خلال النظر في الاستئناف."},{"n":"346","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثاني — في طرق الطعن العادية","القسم الثالث — في آثار الاستئناف"],"g":"","t":"عند الفصل في استئناف حكم فاصل في أحد الدفوع الشكلية قضى بإنهاء الخصومة، يجوز للمجلس القضائي التصدي للمسائل غير المفصول فيها، إذا تبين له، ولحسن سير العدالة، إعطاء حل نهائي للنزاع، وذلك بعد الأمر بإجراء تحقيق عند الاقتضاء."},{"n":"347","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثاني — في طرق الطعن العادية","القسم الثالث — في آثار الاستئناف"],"g":"","t":"يجوز للمجلس القضائي إذا تبين له أن الاستئناف تعسفي أو الغرض منه الإضرار بالمستأنف عليه، أن يحكم على المستأنف بغرامة مدنية من عشرة آلاف دينار ) (10.000 د ج إلى عشرين ألف دينار ) (20.000 د ج دون الإخلال بالتعويضات التي يمكن أن يحكم بها للمستأنف عليه."},{"n":"348","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية"],"g":"","t":"ليس لطرق الطعن غير العادية ولا لآجال ممارسته أثر موقف، ما لم ينص القانون على خلاف ذلك."},{"n":"349","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع الأول — في الأحكام والقرارات القابلة للطعن بالنقض"],"g":"","t":"تكون قابلة للطعن بالنقض، الأحكام والقرارات الفاصلة في موضوع النزاع والصادرة في آخر درجة عن المحاكم والمجالس القضائية."},{"n":"350","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع الأول — في الأحكام والقرارات القابلة للطعن بالنقض"],"g":"","t":"تكون قابلة للطعن بالنقض، الأحكام والقرارات الصادرة في آخر درجة، والتي تنهي الخصومة بالفصل في أحد الدفوع الشكلية أو بعدم القبول أو أي دفع عارض آخر."},{"n":"351","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع الأول — في الأحكام والقرارات القابلة للطعن بالنقض"],"g":"","t":"لا يقبل الطعن بالنقض في الأحكام الأخرى الصادرة في آخر درجة إلا مع الأحكام والقرارات الفاصلة في الموضوع."},{"n":"352","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع الأول — في الأحكام والقرارات القابلة للطعن بالنقض"],"g":"","t":"لا يقبل الطعن في ذات الوقت بالتماس إعادة النظر في الأحكام والقرارات المطعون فيها بالنقض."},{"n":"353","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع الأول — في الأحكام والقرارات القابلة للطعن بالنقض"],"g":"","t":"لا يقبل الطعن بالنقض إلا إذا قدم من أحد الخصوم أو من ذوي الحقوق.\nغير أنه، إذا علم النائب العام لدى المحكمة العليا، بصدور حكم أو قرار في آخر درجة من محكمة أو مجلس قضائي، وكان هذا الحكم أو القرار مخالفا للقانون، ولم يطعن فيه أحد الخصوم بالنقض في الأجل، فله أن يعرض الأمر بعريضة بسيطة على المحكمة العليا.\nوفي حالة نقض هذا الحكم أو القرار، لا يجوز للخصوم التمسك بالقرار الصادر من المحكمة العليا للتخلص مما قضى به الحكم أو القرار المنقوض."},{"n":"354","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع الثاني — في آجال الطعن بالنقض"],"g":"","t":"يرفع الطعن بالنقض في أجل شهرين ) (2 يبدأ من تاريخ التبليغ الرسمي للحكم المطعون فيه إذا تم شخصيا.\nو يمدد أجل الطعن بالنقض إلى ثلاثة ) (3 أشهر، إذا تم التبليغ الرسمي في موطنه الحقيقي أو المختار."},{"n":"355","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع الثاني — في آجال الطعن بالنقض"],"g":"","t":"لا يسري أجل الطعن بالنقض في الأحكام والقرارات الغيابية، إلا بعد انقضاء الأجل المقرر للمعارضة."},{"n":"356","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع الثاني — في آجال الطعن بالنقض"],"g":"","t":"يترتب على تقديم طلب المساعدة القضائية، توقيف سريان أجل الطعن بالنقض أو أجل إيداع المذكرة الجوابية."},{"n":"357","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع الثاني — في آجال الطعن بالنقض"],"g":"","t":"يستأنف سريان أجل الطعن بالنقض، أو أجل إيداع المذكرة الجوابية للمدة المتبقية، ابتداء من تاريخ تبليغ المعني بقرار مكتب المساعدة القضائية بواسطة رسالة مضمنة مع إشعار بالاستلام."},{"n":"358","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع الثالث — في أوجه الطعن"],"g":"","t":"لا يبنى الطعن بالنقض إلا على وجه واحد أو أكثر من الأوجه الآتية:\nمخالفة قاعدة جوهرية في الإجراءات، إغفال الأشكال الجوهرية للإجراءات، عدم الاختصاص، تجاوز السلطة، مخالفة القانون الداخلي، مخالفة القانون الأجنبي المتعلق بقانون الأسرة، مخالفة الاتفاقيات الدولية، انعدام الأساس القانوني، انعدام التسبيب، قصور التسبيب، تناقض التسبيب مع المنطوق، تحريف المضمون الواضح والدقيق لوثيقة معتمدة في الحكم أو القرار، تناقض أحكام أو قرارات صادرة في آخر درجة، عندما تكون حجية الشيء المقضي فيه قد أثيرت بدون جدوى، وفي هذه الحالة يوجه الطعن بالنقض ضد آخر حكم أو قرار من حيث التاريخ، وإذا تأكد هذا التناقض، يفصل بتأكيد الحكم أو القرار الأول، تناقض أحكام غير قابلة للطعن العادي.في هذه الحالة يكون الطعن بالنقض مقبولا، ولو كان أحد الأحكام موضوع طعن بالنقض سابق انتهى بالرفض.\nوفي هذه الحالة يرفع الطعن بالنقض حتى بعد فوات الأجل المنصوص عليه في المادة 354 أعلاه، ويجب توجيهه ضد الحكمين، وإذا تأكد التناقض، تقضي المحكمة العليا بإلغاء أحد الحكمين أو الحكمين معا، وجود مقتضيات متناقضة ضمن منطوق الحكم أو القرار، الحكم بما لم يطلب أو بأكثر مما طلب، السهو عن الفصل في أحد الطلبات الأصلية، إذا لم يدافع عن ناقصي الأهلية."},{"n":"359","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع الثالث — في أوجه الطعن"],"g":"","t":"لا تقبل أوجه جديدة للطعن بالنقض، باستثناء الأوجه القانونية المحضة أو تلك الناتجة عن الحكم أو القرار المطعون فيه."},{"n":"360","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع الثالث — في أوجه الطعن"],"g":"","t":"يجوز للمحكمة العليا أن تثير من تلقاء نفسها وجها أو عدة أوجه للنقض."},{"n":"361","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع الرابع — في آثار الطعن بالنقض"],"g":"","t":"لا يترتب على الطعن بالنقض وقف تنفيذ الحكم أو القرار، ما عدا في المواد المتعلقة بحالة الأشخاص أو أهليتهم وفي دعوى التزوير."},{"n":"362","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع الرابع — في آثار الطعن بالنقض"],"g":"","t":"إذا كان موضوع الدعوى غير قابل للتجزئة، فإن رفع الطعن بالنقض من أحد الخصوم ينتج آثاره بالنسبة إلى الباقي حتى ولو لم يطعنوا بالنقض.\nوإذا رفع الطعن بالنقض ضد أحد الخصوم في موضوع غير قابل للتجزئة، لا يكون ذلك الطعن مقبولا، ما لم يتم استدعاء باقي الخصوم."},{"n":"363","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع الرابع — في آثار الطعن بالنقض"],"g":"","t":"يتم نقض الحكم أو القرار المطعون فيه كليا أو جزئيا.\nويكون النقض جزئيا إذا تعلق بجزء من الحكم أو القرار، قابل للانفصال عن الأجزاء الأخرى."},{"n":"364","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع الرابع — في آثار الطعن بالنقض"],"g":"","t":"إذا نقض الحكم أو القرار المطعون فيه، تحيل المحكمة العليا القضية، إما أمام الجهة القضائية التي أصدرت الحكم أو القرار بتشكيلة جديدة، وإما أمام جهة قضائية أخرى من نفس النوع والدرجة.\nيعيد قرار النقض الخصوم إلى الحالة التي كانوا عليها قبل الحكم أو القرار المنقوض فيما يتعلق بالنقاط التي شملها النقض.\nكما يترتب على النقض، وبدون حاجة لاستصدار حكم جديد، الإلغاء بالنتيجة، لكل حكم صدر بعد الحكم أو القرار المنقوض، جاء تطبيقا أو تنفيذا له أو كان له ارتباط ضروري به."},{"n":"365","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع الرابع — في آثار الطعن بالنقض"],"g":"","t":"إذا كان قرار المحكمة العليا، فيما فصل فيه من نقاط قانونية، لا يترك من النزاع ما يتطلب الحكم فيه، فإن النقض يكون بدون إحالة.\nيجوز كذلك النقض بدون إحالة، والفصل في النزاع نهائيا، عندما يكون قضاة الموضوع قد عاينوا وقدروا الوقائع بكيفية تسمح للمحكمة العليا أن تطبق القاعدة القانونية الملائمة.\nيجوز للمحكمة العليا، أن تمدد النقض بدون إحالة إلى أحكام سابقة للحكم أو القرار المطعون فيه، إذا ترتب على نقضهما إلغاء تلك الأحكام بالتبعية.\nفي هذه الحالات، تفصل المحكمة العليا بتحديد من يتحمل المصاريف القضائية المترتبة على مراحل الخصومة أمام قضاة الموضوع.\nويكون قرار المحكمة العليا قابلا للتنفيذ."},{"n":"366","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع الرابع — في آثار الطعن بالنقض"],"g":"","t":"يقتصر أثر النقض على مجال الوجه الذي أسس عليه، ماعدا في حالة عدم قابلية تجزئة موضوع الدعوى أو التبعية الضرورية."},{"n":"367","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع الرابع — في آثار الطعن بالنقض"],"g":"","t":"تخطر جهة الإحالة بموجب عريضة، تتضمن البيانات المطلوبة في عريضة افتتاح الدعوى، مرفقة بقرار النقض، ويجب إيداع العريضة، تحت طائلة عدم القبول المثار تلقائيا، قبل انتهاء أجل شهرين ) (2 من التبليغ الرسمي لقرار المحكمة العليا للخصم شخصيا، و يمدد هذا الأجل إلى ثلاثة ) (3 أشهر، عندما يتم التبليغ الرسمي إلى الموطن الحقيقي أو المختار.\nيسري أجل الشهرين ) (2 حتى في مواجهة من بادر بالتبليغ الرسمي.\nيترتب على عدم إعادة السير في الدعوى أمام جهة الإحالة في الآجال أو عدم قابلية إعادة السير فيها، إضفاء قوة الشيء المقضي به للحكم الصادر في أول درجة، عندما يكون القرار المنقوض قد قضى بإلغاء الحكم المستأنف.\nتستأنف جهة الإحالة، النظر في الدعوى في مرحلة الإجراءات التي لم يشملها النقض."},{"n":"368","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع الرابع — في آثار الطعن بالنقض"],"g":"","t":"يجوز للأطراف إثارة أوجه جديدة لتدعيم ادعاءاتهم.\nلا تقبل الأوجه الرامية إلى عدم قبول الاستئناف، إذا لم يثرها الخصم الذي قدم طلباته في الموضوع أمام الجهة القضائية التي أصدرت الحكم أو القرار المنقوض."},{"n":"369","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع الرابع — في آثار الطعن بالنقض"],"g":"","t":"يخضع قبول الطلبات الجديدة لنفس القواعد المطبقة أمام الجهة القضائية التي أصدرت الحكم أو القرار المنقوض."},{"n":"370","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع الرابع — في آثار الطعن بالنقض"],"g":"","t":"يعتبر الخصوم الذين لم يثيروا أوجها أو ادعاءات جديدة، متمسكين بالأوجه والطلبات التي سبق إثارتها أمام الجهة القضائية التي أصدرت الحكم أو القرار المنقوض.\nوتطبق نفس القاعدة على الخصوم المتخلفين عن الحضور."},{"n":"371","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع الخامس — في الإحالة"],"g":"","t":"لا يقبل تدخل الغير أمام جهة الإحالة."},{"n":"372","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع الخامس — في الإحالة"],"g":"","t":"يمكن للأشخاص الذين كانوا خصوما أمام الجهة القضائية المنقوض حكمها، ولم يكونوا طرفا أمام المحكمة العليا، أن يستدعوا في الخصومة الجديدة، كما يمكنهم التدخل الاختياري فيها إذا ترتب على نقض الحكم أو القرار مساس بحقوقهم."},{"n":"373","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع الخامس — في الإحالة"],"g":"","t":"يمكن للأشخاص المذكورين في المادة 372 أعلاه، طبقا لنفس الشروط، المبادرة بإخطار جهة الإحالة.\nيقوم الرئيس الأول للمحكمة العليا بتسوية كل إشكال قد يطرأ بشأن تسليم نسخ من قرار النقض لهؤلاء الأشخاص."},{"n":"374","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع الخامس — في الإحالة"],"g":"","t":"تفصل جهة الإحالة من جديد في القضية، من حيث الوقائع، ومن حيث القانون، باستثناء المسائل غير المشمولة بالنقض.\nيجب على جهة الإحالة أن تطبق قرار الإحالة فيما يتعلق بالمسائل القانونية التي فصلت فيها المحكمة العليا.\nإذا لم تمتثل جهة الإحالة لقرار المحكمة العليا الفاصل في مسألة قانونية، يجوز لهذه الأخيرة، وبمناسبة النظر في الطعن بالنقض الثاني، البت في موضوع النزاع.\nيجب على المحكمة العليا، أن تفصل من حيث الوقائع والقانون عند النظر في طعن ثالث بالنقض.\nويكون قرارها هذا قابلا للتنفيذ."},{"n":"375","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع السادس — في قرارات المحكمة العليا"],"g":"","t":"في حالة رفض الطعن بالنقض، أو عدم قبوله، لا يجوز للطاعن أن يطعن بالنقض من جديد في نفس القرار، أو يطعن فيه بالتماس إعادة النظر."},{"n":"376","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع السادس — في قرارات المحكمة العليا"],"g":"","t":"يجوز للمحكمة العليا، أن تستبدل سببا قانونيا خاطئا تضمنه الحكم أو القرار المطعون فيه بالنقض، بسبب قانوني صحيح، وترفض الطعن اعتمادا على ذلك.\nكما يجوز لها أيضا رفض الطعن بصرف النظر عن السبب القانوني الخاطئ إذا كان زائدا."},{"n":"377","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع السادس — في قرارات المحكمة العليا"],"g":"","t":"يجوز للمحكمة العليا إذا رأت أن الطعن تعسفي أو الغرض منه الإضرار بالمطعون ضده، أن تحكم على الطاعن بغرامة مدنية من عشرة آلاف دينار ) (10.000 د ج إلى عشرين ألف دينار ) ( 20.000 د ج دون الإخلال بالتعويضات التي يمكن أن يحكم بها للمطعون ضده."},{"n":"378","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع السادس — في قرارات المحكمة العليا"],"g":"","t":"تقضي المحكمة العليا على الخصم الذي خسر الدعوى بالمصاريف القضائية.\nكما يمكنها أن تحكم بجعل تلك المصاريف على عاتق الخزينة العمومية."},{"n":"379","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الأول — في الطعن بالنقض","الفرع السادس — في قرارات المحكمة العليا"],"g":"","t":"لا تقبل المعارضة في قرارات المحكمة العليا."},{"n":"380","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الثاني — في اعتراض الغير الخارج عن الخصومة"],"g":"","t":"يهدف اعتراض الغير الخارج عن الخصومة، إلى مراجعة أو إلغاء الحكم أو القرار أو الأمر الاستعجالي الذي فصل في أصل النزاع.\nيفصل في القضية من جديد من حيث الوقائع والقانون."},{"n":"381","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الثاني — في اعتراض الغير الخارج عن الخصومة"],"g":"","t":"يجوز لكل شخص له مصلحة ولم يكن طرفا ولا ممثلا في الحكم أو القرار أو الأمر المطعون فيه، تقديم اعتراض الغير الخارج عن الخصومة."},{"n":"382","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الثاني — في اعتراض الغير الخارج عن الخصومة"],"g":"","t":"إذا كان الحكم أو القرار أو الأمر صادرا في موضوع غير قابل للتجزئة، لا يكون اعتراض الغير الخارج عن الخصومة مقبولا، إلا إذا تم استدعاء جميع أطراف الخصومة."},{"n":"383","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الثاني — في اعتراض الغير الخارج عن الخصومة"],"g":"","t":"يجوز لدائني أحد الخصوم أو خلفهم، حتى ولو كانوا ممثلين في الدعوى، تقديم اعتراض الغير الخارج عن الخصومة على الحكم أو القرار أو الأمر، بشرط أن يكون الحكم أو القرار أو الأمر المطعون فيه قد مس بحقوقهم بسبب الغش."},{"n":"384","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الثاني — في اعتراض الغير الخارج عن الخصومة"],"g":"","t":"يبقى أجل اعتراض الغير الخارج عن الخصومة على الحكم أو القرار أو الأمر، قائما لمدة خمس عشرة ) (15 سنة، تسري من تاريخ صدوره، ما لم ينص القانون على خلاف ذلك.\nغير أن هذا الأجل يحدد بشهرين )، (2 عندما يتم التبليغ الرسمي للحكم أو القرار أو الأمر إلى الغير، ويسري هذا الأجل من تاريخ التبليغ الرسمي الذي يجب أن يشار فيه إلى ذلك الأجل وإلى الحق في ممارسة اعتراض الغير الخارج عن الخصومة."},{"n":"385","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الثاني — في اعتراض الغير الخارج عن الخصومة"],"g":"","t":"يرفع اعتراض الغير الخارج عن الخصومة وفقا للأشكال المقررة لرفع الدعوى، ويقدم أمام الجهة القضائية التي أصدرت الحكم أو القرار أو الأمر المطعون فيه، ويجوز الفصل فيه من طرف نفس القضاة.\nلا يقبل اعتراض الغير الخارج عن الخصومة، ما لم يكن مصحوبا بوصل يثبت إيداع مبلغ لدى أمانة الضبط، يساوي الحد الأقصى من الغرامة المنصوص عليها في المادة 388 أدناه."},{"n":"386","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الثاني — في اعتراض الغير الخارج عن الخصومة"],"g":"","t":"يجوز لقاضي الاستعجال أن يوقف تنفيذ الحكم أو القرار أو الأمر المطعون فيه، باعتراض الغير الخارج عن الخصومة حسب الأشكال المقررة في مادة الاستعجال."},{"n":"387","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الثاني — في اعتراض الغير الخارج عن الخصومة"],"g":"","t":"إذا قبل القاضي اعتراض الغير الخارج عن الخصومة على الحكم أو القرار أو الأمر، يجب أن يقتصر في قضائه على إلغاء أو تعديل مقتضيات الحكم أو القرار أو الأمر، التي اعترض عليها الغير والضارة به، ويحتفظ الحكم أو القرار أو الأمر المعترض فيه بآثاره إزاء الخصوم الأصليين حتى فيما يتعلق بمقتضياته المبطلة، ماعدا في حالة عدم قابلية الموضوع للتجزئة المنصوص عليها في المادة 382 أعلاه."},{"n":"388","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الثاني — في اعتراض الغير الخارج عن الخصومة"],"g":"","t":"إذا قضي برفض اعتراض الغير الخارج عن الخصومة، جاز للقاضي الحكم على المعترض بغرامة مدنية من عشرة آلاف دينار ) 10.000 د ج( إلى عشرين ألف دينار ) 20.000 د ج( دون الإخلال بالتعويضات المدنية التي قد يطالب بها الخصوم.\nوفي هذه الحالة يقضي بعدم استرداد مبلغ الكفالة."},{"n":"389","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الثاني — في اعتراض الغير الخارج عن الخصومة"],"g":"","t":"يجوز الطعن في الحكم أو القرار أو الأمر الصادر في اعتراض الغير الخارج عن الخصومة بنفس طرق الطعن المقررة للأحكام."},{"n":"390","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الثالث — في التماس إعادة النظر"],"g":"","t":"يهدف التماس إعادة النظر إلى مراجعة الأمر الاستعجالي أو الحكم أو القرار الفاصل في الموضوع، والحائز لقوة الشيء المقضي به، وذلك للفصل فيه من جديد من حيث الوقائع والقانون."},{"n":"391","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الثالث — في التماس إعادة النظر"],"g":"","t":"لا يجوز تقديم التماس إعادة النظر، إلا ممن كان طرفا في الحكم أو القرار أو الأمر، أو تم استدعاؤه قانونا."},{"n":"392","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الثالث — في التماس إعادة النظر"],"g":"","t":"يمكن تقديم التماس إعادة النظر لأحد السببين الآتيين:\n1- إذا بني الحكم أو القرار أو الأمر على شهادة شهود، أو على وثائق اعترف بتزويرها، أو ثبت قضائيا تزويرها بعد صدور ذلك الحكم أو القرار أو الأمر وحيازته قوة الشيء المقضي به،\n2- إذا اكتشفت بعد صدور الحكم أو القرار أو الأمر الحائز لقوة الشيء المقضي به، أوراق حاسمة في الدعوى، كانت محتجزة عمدا لدى أحد الخصوم."},{"n":"393","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الثالث — في التماس إعادة النظر"],"g":"","t":"يرفع التماس إعادة النظر في أجل شهرين )، (2 يبدأ سريانه من تاريخ ثبوت تزوير شهادة الشاهد، أو ثبوت التزوير، أو تاريخ اكتشاف الوثيقة المحتجزة.\nلا يقبل التماس إعادة النظر، إلا إذا كانت العريضة مرفقة بوصل يثبت إيداع كفالة بأمانة ضبط الجهة القضائية، لا تقل عن الحد الأقصى للغرامة المنصوص عليها في المادة 397 أدناه."},{"n":"394","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الثالث — في التماس إعادة النظر"],"g":"","t":"يرفع التماس إعادة النظر أمام الجهة القضائية التي أصدرت الحكم أو القرار أو الأمر الملتمس فيه وفقا للأشكال المقررة لرفع الدعوى، بعد استدعاء كل الخصوم قانونا."},{"n":"395","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الثالث — في التماس إعادة النظر"],"g":"","t":"تقتصر المراجعة في التماس إعادة النظر على مقتضيات الحكم أو القرار أو الأمر التي تبرر مراجعتها، ما لم توجد مقتضيات أخرى مرتبطة بها."},{"n":"396","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الثالث — في التماس إعادة النظر"],"g":"","t":"لا يجوز تقديم التماس إعادة النظر من جديد في الحكم أو القرار أو الأمر الفاصل في الالتماس."},{"n":"397","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب التاسع — في طرق الطعن","الفصل الثالث — في طرق الطعن غير العادية","القسم الثالث — في التماس إعادة النظر"],"g":"","t":"يجوز للقاضي الحكم على الملتمس الذي خسر الدعوى بغرامة مدنية من عشرة آلاف دينار ) (10.000 د ج إلى عشرين ألف دينار ) (20.000 د ج، دون الإخلال بالتعويضات التي قد يطالب بها.\nوفي هذه الحالة تطبق أحكام الفقرة الثانية من المادة 388 أعلاه."},{"n":"398","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب العاشر — في تنازع الاختصاص بين القضاة"],"g":"","t":"يكون ثمة تنازع في الاختصاص بين القضاة، عندما تقضي جهتان قضائيتان أو أكثر في نفس النزاع بالاختصاص أو بعدم الاختصاص."},{"n":"399","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب العاشر — في تنازع الاختصاص بين القضاة"],"g":"","t":"إذا كانت المحاكم تابعة لنفس المجلس القضائي، تقدم عريضة"},{"n":"400","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب العاشر — في تنازع الاختصاص بين القضاة","الفصل في التنازع أمام هذه الجهة التي تحدد الجهة القضائية المختصة، — وتحيل القضية عليها لتفصل فيها طبقا للقانون. — وإذا كانت هذه المحاكم تابعة لمجالس قضائية مختلفة ،تقدم العريضة أمام"],"g":"","t":"إذا قضى مجلسان قضائيان باختصاصهما أو بعدم اختصاصهما، أو إذا وقع تنازع بين محكمة ومجلس قضائي، تقدم العريضة أمام الغرفة المدنية للمحكمة العليا.\nتعين المحكمة العليا الجهة القضائية المختصة، ولا يجوز لهذه الأخيرة التصريح بعدم الاختصاص."},{"n":"401","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب العاشر — في تنازع الاختصاص بين القضاة","الفصل في التنازع أمام هذه الجهة التي تحدد الجهة القضائية المختصة، — وتحيل القضية عليها لتفصل فيها طبقا للقانون. — وإذا كانت هذه المحاكم تابعة لمجالس قضائية مختلفة ،تقدم العريضة أمام"],"g":"","t":"تقدم عريضة الفصل في تنازع الاختصاص بين القضاة، أمام الجهة القضائية المختصة في أجل شهرين )، (2 ويسري ابتداء من تاريخ التبليغ الرسمي لآخر حكم إلى الخصم المحكوم عليه.\nتقدم عريضة الفصل في تنازع الاختصاص بين القضاة أمام المجلس القضائي، وفقا للقواعد المقررة لرفع عريضة الاستئناف، وتخضع العريضة التي تقدم أمام المحكمة العليا للقواعد المقررة لعريضة الطعن بالنقض."},{"n":"402","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب العاشر — في تنازع الاختصاص بين القضاة","الفصل في التنازع أمام هذه الجهة التي تحدد الجهة القضائية المختصة، — وتحيل القضية عليها لتفصل فيها طبقا للقانون. — وإذا كانت هذه المحاكم تابعة لمجالس قضائية مختلفة ،تقدم العريضة أمام"],"g":"","t":"تبلغ عريضة الفصل في تنازع الاختصاص بين القضاة، إلى ممثل النيابة العامة لتقديم طلباته."},{"n":"403","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب العاشر — في تنازع الاختصاص بين القضاة","الفصل في التنازع أمام هذه الجهة التي تحدد الجهة القضائية المختصة، — وتحيل القضية عليها لتفصل فيها طبقا للقانون. — وإذا كانت هذه المحاكم تابعة لمجالس قضائية مختلفة ،تقدم العريضة أمام"],"g":"","t":"يمكن للجهة القضائية المعروض عليها التنازع، أن تأمر عند الاقتضاء، بإيقاف إجراءات التنفيذ المتبعة أمام الجهات القضائية التي ظهر أمامها التنازع.\nباستثناء الإجراءات التحفظية، يكون مشوبا بالبطلان كل إجراء تم خرقا لوقف التنفيذ المأمور به."},{"n":"404","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الحادي عشر — في الآجال وعقود التبليغ الرسمي","الفصل الأول — في الآجال"],"g":"","t":"تمدد لمدة شهرين ) (2 آجال المعارضة والاستئناف والتماس إعادة النظر والطعن بالنقض المنصوص عليها في هذا القانون، للأشخاص المقيمين خارج الإقليم الوطني."},{"n":"405","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الحادي عشر — في الآجال وعقود التبليغ الرسمي","الفصل الأول — في الآجال"],"g":"","t":"تحسب كل الآجال المنصوص عليها في هذا القانون كاملة، ولا يحسب يوم التبليغ أو التبليغ الرسمي ويوم انقضاء الأجل.\nيعتد بأيام العطل الداخلة ضمن هذه الآجال عند حسابها.\nتعتبر أيام عطلة بمفهوم هذا القانون، أيام الأعياد الرسمية وأيام الراحة الأسبوعية طبقا للنصوص الجاري بها العمل.\nإذا كان اليوم الأخير من الأجل ليس يوم عمل كليا أو جزئيا يمدد الأجل إلى أول يوم عمل موالي."},{"n":"406","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الحادي عشر — في الآجال وعقود التبليغ الرسمي","الفصل الثاني — في عقود التبليغ الرسمي"],"g":"","t":"يقصد بالتبليغ الرسمي، التبليغ الذي يتم ب
