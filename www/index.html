t":"يقدم عرض الوفاء بواسطة محضر قضائي في الموطن الحقيقي أو المختار للدائن، ويبلغ رسميا وفقا لأحكام هذا القانون.\nيتضمن محضر العرض:\n1- اسم ولقب المدين وموطنه،\n2- اسم ولقب الدائن وموطنه الحقيقي أو المختار،\n3- وصف الشيء المعروض بحيث لا يمكن استبداله بغيره، وإن كان الشيء المعروض نقودا يحدد مقدارها ونوعها،\n4- ذكر أسباب العرض،\n5- رفض أو قبول الدائن للعرض،\n6- توقيع الدائن أو الشخص المبلغ له العرض، أو الإشارة إلى رفض التوقيع أو عدم قدرته على ذلك،\n7- تنبيه الدائن بأنه في حالة رفض العرض سيتم الإيداع في المكان واليوم والساعة المحددة في طلب العرض، وأنه سيسقط حقه في المطالبة به، بعد مضي سنة واحدة ) (1 تسري من تاريخ الإيداع."},{"n":"585","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الأول — في عرض الوفاء والأيداع"],"g":"","t":"إذا رفض الدائن العرض، جاز للمدين إيداع المبلغ أو الشيء المعروضبم كتب المحضر القضائي، وعند الاقتضاء بأمانة ضبط المحكمة.\nيفصل رئيس المحكمة في كل الإشكالات التي قد تثار بأمر غير قابل لأي طعن.\nيترتب على إيداع العرض، سقوط حق الدائن في المطالبة بالحق محل العرض والإيداع، بعد مضي أجل سنة واحدة ) (1 من تاريخ إيداع العرض.\nيمكن للمدين استرجاع المبلغ أو الشيء المعروض والمودع، بعد انقضاء هذا الأجل، بأمر على عريضة."},{"n":"586","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الثاني — في إيداع الكفالة وقبول الكفيل"],"g":"","t":"تحدد الأحكام والقرارات القاضية بتقديم كفيل أو كفالة، تاريخ تقديم الكفيل أو تاريخ إيداع الكفالة، ما لم يكن هذا التقديم أو هذا الإيداع قد حصل قبل صدور الحكم أو القرار.\nيتم إيداع الكفالة بأمانة الضبط، ويحصل تقديم الكفيل بالجلسة بعد إيداع المستندات الدالة على ملاءته في أمانة الضبط، عند الاقتضاء."},{"n":"587","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الثاني — في إيداع الكفالة وقبول الكفيل"],"g":"","t":"كل منازعة تتعلق بقبول الكفيل تقدم من الخصم في أول جلسة، ويفصل فيها في الحال.\nإذا وقعت المنازعة، يخطر أطراف الخصومة بتاريخ الجلسة التي سيتم الفصل فيها.\nالحكم الصادر في المنازعة واجب النفاذ رغم المعارضة أو الاستئناف."},{"n":"588","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الثاني — في إيداع الكفالة وقبول الكفيل"],"g":"","t":"تصح الكفالة بمجرد تقديم الكفيل أو بعد الفصل في المنازعة المتعلقة به، إن وجدت."},{"n":"589","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الثاني — في إيداع الكفالة وقبول الكفيل"],"g":"","t":"تكون الكفالة المنصوص عليها في المادة 588 أعلاه، واجبة النفاذ دون حاجة إلى صدور حكم بذلك."},{"n":"590","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الثالث — في دعاوى المحاسبة"],"g":"","t":"إذا أمرت أية جهة قضائية بتقديم حساب لتصفية حسابات أموال القاصر أو حسابات أموال الشركات المدنية يمكنها ندب قاض وتحديد أجل لتقديم الحساب.\nيقوم القاضي المنتدب بتحرير محضر عن أعماله."},{"n":"591","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الثالث — في دعاوى المحاسبة"],"g":"","t":"يتضمن الحساب بيان الإيرادات والمصروفات الفعلية، ويختتم بموازنة تلك الإيرادات والمصروفات مع تخصيص باب للأموال المطلوب تحصيلها، ويرفق بالحساب جميع المستندات المثبتة، ويقوم الملزم بالحساب بتقد يمه والموافقة عليه إما شخصيا أو بواسطة وكيل خاص في الأجل المحدد، ويبلغ طالبو الحساب بالحضور في اليوم الذي يحدده القاضي المنتدب، ويكون هذا التبليغ إما شخصيا أو في الموطن."},{"n":"592","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الثالث — في دعاوى المحاسبة"],"g":"","t":"إذا انقضى الأجل، تحجز أموال الملزم بتقديم الحساب وتباع حتى استيفاء المبلغ الذي تحدده المحكمة."},{"n":"593","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الثالث — في دعاوى المحاسبة"],"g":"","t":"إذا تجاوزت الإيرادات مقدار المصروفات عند تقديم الحساب الموافق عليه، جاز لطالب الحساب، أن يستصدر من القاضي المنتدب، أمر تنفيذيا باسترداد الفائض دون انتظار المصادقة على هذا الحساب."},{"n":"594","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الثالث — في دعاوى المحاسبة"],"g":"","t":"يقدم الخصوم ملاحظاتهم حول المحض أمام القاضي المنتدب، وذلك في التاريخ والساع المحددين من طرفه.\nإذا تخلف الخصوم عن الحضور أو حضروا ولميتفقوا فيما بينهم تحال القضية إلى الجلسة."},{"n":"595","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الثالث — في دعاوى المحاسبة"],"g":"","t":"الحكم الذي يفصل في الحساب يتضمن بيان حساب الإيرادات والمصروفات ويحدد مبلغ الرصيد الباقي عند الاقتضاء."},{"n":"596","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الثالث — في دعاوى المحاسبة"],"g":"","t":"لا يعاد النظر في أي حساب بعد الحكم فيه، إلا من قبل الخصوم في حالة وجود أخطاء أو إغفالات أو تكرار، ولهم أن يقدموا طلباتهم أمام نفس القاضي."},{"n":"597","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الثالث — في دعاوى المحاسبة"],"g":"","t":"إذا صدر الحكم غيابيا في حق طالب الحساب، تصادق المحكمة على بنود الحساب إن كانت مبررة وإذا تجاوزت الإيرادات مقدار المصروفات يودع الملزم المبلغ الفائض بأمانة الضبط."},{"n":"598","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الثالث — في دعاوى المحاسبة"],"g":"","t":"إذا رفع استئناف في الحكم القاضي برفض طلب تقديم الحساب، فإن القرار الذي يقضي بالإلغاء، يحيل مراجعة المحاسبة والحكم الفاصل في الحساب إلى الجهة القضائية التي قدم إليها الطلب، أو إلى الجهة القضائية التي يحددها القرار.\nفي حالة إلغاء الحكم الفاصل في الحساب المقدم أمام المحكمة، فإن تنفيذ قرار الإلغاء يعود إما إلى المجلس القضائي الذي أصدره، أو إلى الجهة القضائية التي حددها هذا القرار."},{"n":"599","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الثالث — في دعاوى المحاسبة"],"g":"","t":"تكون مخاصمة المحاسبين المنتدبين بمعرفة القضاء أمام الجهة القضائية التي انتدبتهم، وتكون مخاصمة الأوصياء أمام الجهة القضائية التي قدم إليها طلب تعيين الوصي، وتكون مخاصمة بقية المحاسبين أمام الجهة القضائية التي يوجد في دائرة اختصاصها موطنهم."},{"n":"600","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الأول — في السندات التنفيذية"],"g":"معدلة · ق 13-22","t":"لا يجوز التنفيذ الجبري إلا بسند تنفيذي.\nوالسندات التنفيذية هي:\n1- أحكام المحاكم التي استنفذت طرق الطعن العادية والأحكام المشمولة بالنفاذ المعجل.\n2- الأوامر الاستعجالية،\n3- أوامر الأداء،\n4- الأوامر على العرائض،\n5- أوامر تحديد المصاريف القضائية،\n6- قرارات المجالس القضائية وقرارات المحكمة العليا المتضمنة إلتزاما بالتنفيذ،\n7- أحكام المحاكم الإدارية وقرارات المحاكم الادارية للاستئناف ومجلس الدولة،\n8- محاضر الصلح أو الاتفاق المؤشر عليها من طرف القضاة والمودعة بأمانة الضبط،\n9- أحكام التحكيم المأمور بتنفيذها من قبل رؤساء الجهات القضائية والمودعة بأمانة الضبط، 1-0 الشيكات والسفاتج، بعد التبليغ الرسمي للاحتجاجات إلى المدين، طبقا لأحكام القانون التجاري، 1-1 العقود التوثيقية، لاسيما المتعلقة بالإيجارات التجارية والسكنية المحددة المدة، وعقود القرض والعارية والهبة والوقف والبيع والرهن والوديعة، 1-2 محاضر البيع بالمزاد العلني، بعد إيداعها بأمانة الضبط، 1-3 أحكام رسو المزاد على العقار، وتعتبر أيضا سندات تنفيذية كل العقود والأوراق الأخرى التي يعطيها القانون صفة السند التنفيذي."},{"n":"601","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الأول — في السندات التنفيذية"],"g":"","t":"لا يجوز التنفيذ في غير الأحوال المستثناة بنص في القانون، إلا بموجب نسخة من السند التنفيذي، ممهورة بالصيغة التنفيذية الآتية:\nالجمهورية الجزائرية الد يمقراطية الشعبية باسم الشعب الجزائري وتنتهي بالصيغة الآتية:\nأ – في المواد المدنية:\nوبناء على ما تقدم، فإن الجمهورية الجزائرية الد يمقراطية الشعبية، تدعو وتأمر جميع المحضري وكذا كل الأعوان الذين طلب إليهم ذلك، تنفيذ هذا الحكم، القرار...، وعلى النواب العامين ووكلاء الجمهورية لدى المحاكم مد يد المساعدة اللازمة لتنفيذه، وعلى جميع قادة وضباط القوة العمومية تقديم المساعدة اللازمة لتنفيذه بالقوة عند الاقتضاء، إذا طلب إليهم ذلك بصفة قانونية.\nوقع هذا الحكم.\nوبناء عليه ّ ب – في المواد الأدارية:\nالجمهورية الجزائرية الد يمقراطية الشعبية، تدعو وتأمر الوزير أو الوالي أو رئيس المجلس الشعبي البلدي، وكل مسؤول إداري آخر، كل فيما يخصه، وتدعو وتأمر كل المحضرين المطلوب إليهم ذلك، فيما يتعلق بالإجراءات المتبعة ضد الخصوم الخواص، أن يقوموا بتنفيذ هذا الحكم، القرار..."},{"n":"602","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الأول — في السندات التنفيذية"],"g":"","t":"لكل مستفيد من سند تنفيذي، الحق في الحصول على نسخة ممهورة بالصيغة التنفيذية المنصوص عليها في المادة 601 أعلاه، تسمى \" النسخة التنفيذية\".\nولا تسلم إلا للمستفيد شخصيا أو لوكيل عنه بوكالة خاصة.\nيمهر ويوقع على النسخة التنفيذية رئيس أمناء الضبط أو الضابط العمومي، حسب الحالة، وتحمل عبارة \" نسخة تنفيذية مطابقة للأصل \" وتختم بالختم الرسمي للجهة التي أصدرته.\nيجب على رئيس أمناء الضبط أو الضابط العمومي أن يؤشر على النسخة الأصلية المحفوظة لديه بتسليم نسخة تنفيذية وتاريخ التسليم واسم الشخص الذي استلمها.\nويؤشر أيضا بهذا التسليم في سجل خاص بالنسخ التنفيذية المسلمة مع توقيع وصفة المستلم."},{"n":"603","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الأول — في السندات التنفيذية"],"g":"","t":"لا تسلم إلا نسخة تنفيذية واحدة لكل مستفيد، وإذا فقدت هذه النسخة ممن تسلمها قبل التنفيذ يمكنه الحصول على نسخة تنفيذية أخرى بأمر على عريضة بالشروط الآتية:\n1- تقديم عريضة معللة، مؤرخة وموقعة منه،\n2- استدعاء جميع الأطراف استدعاء صحيحا بسعي من الطالب، للحضور أمام رئيس الجهة القضائية المختصة، لإبداء ملاحظاتهم التي يجب أن تدون في محضر يرفق مع أصل الأمر الذي سيصدر.\nفي جميع الحالات، يجب أن يكون الأمر الصادر عن رئيس الجهة القضائية مسببا.\nيمكن مراجعة أمر الرفض، متى استوفت شروط منح نسخة تنفيذية ثانية."},{"n":"604","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الأول — في السندات التنفيذية"],"g":"","t":"جميع السندات التنفيذية قابلة للتنفيذ في الإقليم الجزائري.\nولأجل التنفيذ الجبري للسندات التنفيذية، يجب على قضاة النيابة العامة تسخير استعمال القوة العمومية، في أجل أقصاه عشرة ) (10 أيام من تاريخ إيداع طلب التسخيرة.\nيسجل طلب التسخيرة في سجل خاص يمسك لهذا الغرض، ويسلم وصل للطالب يثبت إيداع هذا الطلب."},{"n":"605","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الثاني — في السندات التنفيذية الأجنبية"],"g":"","t":"لا يجوز تنفيذ الأوامر والأحكام والقرارات الصادرة من جهات قضائية أجنبية، في الإقليم الجزائري، إلا بعد منحها الصيغة التنفيذية من إحدى الجهات القضائية الجزائرية متى استوفت الشروط الآتية:\n1- ألا تتضمن ما يخالف قواعد الاختصاص،\n2- حائزة لقوة الشيء المقضي به طبقا لقانون البلد الذي صدرت فيه،\n3- ألا تتعارض مع أمر أو حكم أو قرار سبق صدوره من جهات قضائية جزائرية، وأثير من المدعى عليه،\n4- ألا تتضمن ما يخالف النظام العام والآداب العامة في الجزائر."},{"n":"606","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الثاني — في السندات التنفيذية الأجنبية"],"g":"","t":"لا يجوز تنفيذ العقود والسندات الرسمية المحررة في بلد أجنبي، في الإقليم الجزائري، إلا بعد منحها الصيغة التنفيذية من إحدى الجهات القضائية الجزائرية متى استوفت الشروط الآتية:\n1 توافر الشروط المطلوبة لرسمية السند وفقا لقانون البلد الذي حرر فيه،\n2- توفره على صفة السند التنفيذي وقابليته للتنفيذ وفقا لقانون البلد الذي حرر فيه،\n3- خلوه مما يخالف القوانين الجزائرية والنظام العام والآداب العامة في الجزائر."},{"n":"607","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الثاني — في السندات التنفيذية الأجنبية"],"g":"","t":"يقدم طلب منح الصيغة التنفيذية للأوامر والأحكام والقرارات والعقود والسندا التنفيذية الأجنبية، أمام محكمة مقر المجلس التي يوجد في دائرة اختصاصها موطن المنفذ عليه أو محل التنفيذ."},{"n":"608","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الثاني — في السندات التنفيذية الأجنبية"],"g":"","t":"إن العمل بالقواعد المنصوص عليها في المادتين 605 و 606 أعلاه، لا يخل بأحكام المعاهدات الدولية والاتفاقيات القضائية التي تبرم بين الجزائر وغيرها من الدول."},{"n":"609","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الثالث — أحكام مشتركة في التنفيذ الجبري"],"g":"","t":"الأحكام والقرارات القضائية لا تكون قابلة للتنفيذ، إلا بعد انقضاء آجال المعارضة أو الاستئناف، وتقديم شهادة بذلك من أمانة ضبط الجهة القضائية المعنية، تتضمن تاريخ التبليغ الرسمي للحكم أو القرار إلى المحكوم عليه، وتثبت عدم حصول معارضة أو استئناف.\nفي حالات الطعن بالنقض الموقف للتنفيذ تطلب شهادة عدم الطعن بالنقض.\nغير أن الأحكام المشمولة بالنفاذ المعجل والأوامر الاستعجالية تكون قابلة للتنفيذ رغم المعارضة أوالاستئناف."},{"n":"610","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الثالث — أحكام مشتركة في التنفيذ الجبري"],"g":"","t":"إذا تعرض الضابط العمومي المكلف بالتنفيذ إلى إهانة، أثناء أداء وظيفته، وجب عليه تحرير محضر، يبين فيه مناسبة أداء مهمته، والتاريخ والساعة ومكان المهمة، ونوع الإهانة والألفاظ الصادرة ضده، وأسماء وألقاب الأطراف والشهود الحاضرين أثناء الواقعة.\nوتتبع في هذا الشأن الأحكام المقررة في قانون العقوبات."},{"n":"611","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الثالث — أحكام مشتركة في التنفيذ الجبري"],"g":"","t":"يتم التنفيذ من طرف المحضرين القضائيين بناء على طلب المستفيد من السند التنفيذي أومن ممثله القانوني أو الاتفاقي.\nتثبت علاقة الدائن بممثله طبقا لما يقرره القانون."},{"n":"612","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الثالث — أحكام مشتركة في التنفيذ الجبري","القسم الأول — في التكليف بالوفاء"],"g":"","t":"يجب أن يسبق التنفيذ الجبري، التبليغ الرسمي للسند التنفيذي وتكليف المنفذ عليه بالوفاء بما تضمنه السند التنفيذي في أجل خمسة عشر ) (15 يوما.\nتطبق في التبليغ الرسمي للتكليف بالوفاء أحكام المواد من 406 إلى 416 من هذا القانون."},{"n":"613","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الثالث — أحكام مشتركة في التنفيذ الجبري","القسم الأول — في التكليف بالوفاء"],"g":"","t":"يجب أن يشتمل التكليف بالوفاء، تحت طائلة القابلية للإبطال، فضلا عن البيانات المعتادة، على ما يأتي:\n1- اسم ولقب طالب التنفيذ وصفته، شخصا طبيعيا أو معنويا، وموطنه الحقيقي وموطن مختار له في دائرة اختصاص محكمة التنفيذ.\n2- اسم ولقب وموطن المنفذ عليه،\n3- تكليف المنفذ عليه بالوفاء بما تضمنه السند التنفيذي، خلال أجل أقصاه خمسة عشر ) (15 يوما، وإلا نفذ عليه جبرا.\n4- بيان المصاريف التي يلزم بها المنفذ عليه،\n5- بيان مصاريف التنفيذ والأتعاب المستحقة للمحضرين القضائيين،\n6- توقيع وختم المحضر القضائي.\nيمكن طلب إبطال التكليف بالوفاء، أمام قاضي الاستعجال، خلال أجل خمسة عشر ) (15 يوما الموالية لتاريخ التبليغ الرسمي للتكليف بالوفاء، ليفصل فيه في أجل أقصاه خمسة عشر ) (15 يوما."},{"n":"614","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الثالث — أحكام مشتركة في التنفيذ الجبري","القسم الأول — في التكليف بالوفاء"],"g":"","t":"يجوز إجراء التنفيذ الجبري بمجرد التبليغ الرسمي للتكليف بالوفاء بما تضمنه السند التنفيذي، دون مراعاة الآجال المنصوص عليها في المادة 612 أعلاه، فيما يأتي:\n1- إذا كان التنفيذ يتم بموجب أمر استعجالي،\n2- إذا كان التنفيذ يتم بموجب حكم مشمول بالنفاذ المعجل."},{"n":"615","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الثالث — أحكام مشتركة في التنفيذ الجبري","القسم الثاني في حالة وفاة أحد أطراف التنفيذ"],"g":"","t":"إذا توفي المستفيد من السند التنفيذي قبل البدء في إجراءات التنفيذ أو قبل إتمامه، يجب على ورثته الذين يطلبون التنفيذ إثبات صفتهم بفريضة.\nإذا فقد المستفيد أهليته في إحدى هاتين المرحلتين يقوم مقامه من ينوبه قانونا ويثبت ذلك بالطرق التي يحددها القانون.\nإذا حصلت المنازعة في صفة الورثة أو في النيابة القانونية وأثبت أحد الطرفين أنه رفع دعوى حول الصفة أمام قاضي الموضوع، يقوم المحضر القضائي بتحرير محضر بذلك يسلم نسخة منه إلى الطرفين ويدعوهما إلى متابعة دعواهما أمام الجهة القضائية المعنية.\nيجوز للدائن في الحالات المذكورة في الفقرات أعلاه، حفاظا على حقوقه، أن يقوم بإجراءات الحجز التحفظي على أموال مدينه، والحجز في هذه الحالة لا يخضع للتثبيت، ويبقى صحيحا إلى حين الفصل في دعوى المنازعة في الصفة."},{"n":"616","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الثالث — أحكام مشتركة في التنفيذ الجبري","القسم الثاني في حالة وفاة أحد أطراف التنفيذ"],"g":"","t":"يجوز أن يستكمل التنفيذ من طرف جميع ورثة الدائن مجتمعين أو من أحدهم دون تفويض من باقي الورثة.\nفي هذه الحالة تبرأ ذمة المنفذ عليه تجاه الورثة الآخرين الذين تنتقل حقوقهم إلى الشخص الذي سعى إلى التنفيذ."},{"n":"617","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الثالث — أحكام مشتركة في التنفيذ الجبري","القسم الثاني في حالة وفاة أحد أطراف التنفيذ"],"g":"","t":"إذا توفي المنفذ عليه قبل البدء في إجراءات التنفيذ، فلا يجوز التنفيذ ضد ورثته، إلا بعد التبليغ الرسمي للتكليف بالوفاء إلى ورثته جملة، أو إلى أحدهم في موطن مورثهم، وإلزامهم بالوفاء وفقا لأحكام المادتين 612 و 613 أعلاه.\nإذا فقد المنفذ عليه أهليته أو زالت صفة من كان يباشر الإجراءات نيابة عنه قبل البدء في إجراءات التنفيذ أو قبل إتمامه، فلا يجوز التنفيذ، إلا بعد التبليغ الرسمي للتكليف بالوفاء لمن قام مقامه في موطن المنفذ عليه، وإلزامه بالوفاء وفقا للمادتين 612 و 613 أعلاه."},{"n":"618","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الثالث — أحكام مشتركة في التنفيذ الجبري","القسم الثاني في حالة وفاة أحد أطراف التنفيذ"],"g":"","t":"إذا كانت إجراءات التنفيذ الجبري قد بدأت ضد المنفذ عليه قبل وفاته، فتستمر على تركته.\nوإذا اقتضى الأمر اتخاذ إجراء من إجراءات التنفيذ بحضور المنفذ عليه، وكان الورثة غير معلومين أو لا يعرف محل إقامتهم يمكن لطالب التنفيذ أن يستصدر من رئيس المحكمة، التي توجد فيها التركة، أمرا على عريضة بتعيين وكيل خاص لتمثيل الورثة.\nوتسري نفس الأحكام إذا توفي المنفذ عليه قبل البدء في إجراءات التنفيذ وكان الورثة غير معلومين أو كان محل إقامتهم غير معروف."},{"n":"619","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الثالث — أحكام مشتركة في التنفيذ الجبري","القسم الثالث — في التنفيذ على المدين المحبوس"],"g":"","t":"إذا كان المنفذ عليه محبوسا في جناية، أو محكوما عليه نهائيا في جنحة بعقوبة سنتين فأكثر، ولم يكن له نائب يتولى إدارة أمواله، جاز لطالب التنفيذ أن يستصدر من قاضي الاستعجال أمرا بتعيين وكيل خاص من عائلة المنفذ عليه أو من الغير، يحل محله أثناء التنفيذ على أمواله."},{"n":"620","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الثالث — أحكام مشتركة في التنفيذ الجبري","القسم الرابع — في محل التنفيذ"],"g":"","t":"يتم التنفيذ على الأموال المنقولة، فإن كان مقدارها لا يغطي الدين والمصاريف، انتقل التنفيذ إلى العقارات.\nوإذا لم يكن للمنفذ عليه عقارات فيتم التنفيذ على أمواله المنقولة مهما كانت قيمتها، مع مراعاة أحكام المادتين 622 و 636 أدناه.\nأما أصحاب حقوق الامتيازات الخاصة أو التخصيص أو الدائنين المرتهنين فيمكنهم التنفيذ مباشرة على العقارات."},{"n":"621","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الثالث — أحكام مشتركة في التنفيذ الجبري","القسم الرابع — في محل التنفيذ"],"g":"","t":"لا يجوز أن يتجاوز التنفيذ، عند القيام بعمل، أو الامتناع عن عمل، أو عند البيع بالمزاد العلني، أو عند التخصيص، القدر الضروري الذي يقتضيه حق الدائن الأصلي وما استلزمه من المصاريف.\nويجب رد الأشياء التي لم يتناولها التنفيذ إلى المحجوز عليه أو وضعها تحت تصرفه لمدة ثمانية ) (8 أيام، فإذا رفض استلامها بعد إنذاره بذلك من طرف المحضر القضائي، يحرر هذا الأخير محضرا برفض الاستلام.\nوفي هذه الحالة، يقوم المحضر القضائي باستصدار أمر على عريضة لبيع هذه الأشياء بالمزاد العلني، ويودع المتحصل من بيعها بأمانة ضبط المحكمة بعد استيفاء المصاريف.\nإذا تعذر بيعها لأي سبب كان، تعد من الأموال المتخلى عنها وتوضع في المحشر."},{"n":"622","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الثالث — أحكام مشتركة في التنفيذ الجبري","القسم الرابع — في محل التنفيذ"],"g":"","t":"لا يباشر التنفيذ إذا لم يكن من المنتظر أن يتحصل من بيع الأشياء المحجوزة ما يزيد عن مقدار مصاريف هذا التنفيذ.وفي هذه الحالة، يحرر محضر عدم وجود."},{"n":"623","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الثالث — أحكام مشتركة في التنفيذ الجبري","القسم الرابع — في محل التنفيذ"],"g":"","t":"إذا كان المنفذ عليه ملزما بتسليم شيء منقول أو كمية من الأشياء المنقولة المعينة أو أشياء مثلية، فإن هذه الأشياء تسلم إلى طالب التنفيذ.\nوفي حالة تعدد طالبي التنفيذ، يعمل بأحكام المواد من 791 إلى 799 من هذا القانون."},{"n":"624","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الثالث — أحكام مشتركة في التنفيذ الجبري","القسم الرابع — في محل التنفيذ"],"g":"","t":"إذا كان التنفيذ متعلقا بإلزام المنفذ عليه بتسليم عقار أو التنازل عنه أو تركه، تنقل الحيازة المادية لهذا العقار إلى طالب التنفيذ."},{"n":"625","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الثالث — أحكام مشتركة في التنفيذ الجبري","القسم الرابع — في محل التنفيذ"],"g":"","t":"دون الإخلال بأحكام التنفيذ الجبري، إذا رفض المنفذ عليه تنفيذ التزام بعمل، أو خالف التزاما بالامتناع عن عمل، يحرر المحضر القضائي محضر امتناع عن التنفيذ، ويحيل صاحب المصلحة إلى المحكمة للمطالبة بالتعويضات، أوالمطالبة بالغرامات التهديدية ما لم يكن قد قضي بها من قبل.\nيمكن لطالب التنفيذ القيام بالعمل موضوع الالتزام على نفقة المحكوم عليه، وتنجز الأعمال المأمور بها تحت مراقبة محضر قضائي ويحرر محضرا بذلك."},{"n":"626","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الثالث — أحكام مشتركة في التنفيذ الجبري","القسم الرابع — في محل التنفيذ"],"g":"","t":"لا يجوز للغير الحائز للشيء محل التنفيذ، أن يعترض على الحجز بادعائه أن له حق امتياز على هذا الشيء، إ نما له أن يثبت حقوقه وقت توزيع الثمن."},{"n":"627","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الثالث — أحكام مشتركة في التنفيذ الجبري","القسم الخامس — التنفيذ في حالة غياب المنفذ عليه"],"g":"","t":"في حالة غياب المنفذ عليه، عند مباشرة إجراءات التنفيذ، يجوز الترخيص للمحضر القضائي بناء على طلبه، وبأمر على عريضة يصدره رئيس المحكمة التي يباشر في دائرة اختصاصها التنفيذ، بعد إبلاغ ممثل النيابة العامة بفتح أو كسر أبواب المحلات أو المنازل المغلقة وفض أقفال الغرف في حدود ما تستلزمه مقتضيات التنفيذ، وذلك بحضور أحد أعوان الضبطية القضائية، وفي حالة تعذر ذلك يتم الفتح بحضور شاهدين.\nيتعين تحرير محضر فتح وجرد للأشياء الموجودة بالمحل المفتوح وتوقيعه من المحضر القضائي وعون الضبطية القضائية أو الشاهدين، وإلا كان قابلا للإبطال تحت المسؤولية المدنية للمحضر القضائي."},{"n":"628","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الثالث — أحكام مشتركة في التنفيذ الجبري","القسم السادس — في البحث عن أموال المدين"],"g":"","t":"يسمح للمحضر القضائي في إطار مهمته، بالدخول إلى الإدارات والمؤسسات العمومية أو الخاصة، للبحث عن حقوق مالية عينية للمنفذ عليه أو أموال أخرى قابلة للتنفيذ، وعلى هذه المؤسسات تقديم يد المساعدة لإنجاز الغرض المطلوب منها.\nفي هذه الحالة، يحرر محضر جرد لهذه الحقوق و /أو الأموال، ثم مباشرة التنفيذ عليها."},{"n":"629","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الثالث — أحكام مشتركة في التنفيذ الجبري","القسم السابع — في أوقات التنفيذ"],"g":"","t":"لا يجوز مباشرة التنفيذ خارج أو بعد الوقت القانوني المحدد في المادة 416 أعلاه، ولا في أيام العطل إلا في حالة الضرورة، وفي هذه الحالة يرخص للمحضر القضائي بإجراء التنفيذ بأمر على عريضة من رئيس المحكمة التي يباشر فيها التنفيذ.\nغير أنه، إذا بدأ التنفيذ ولم ينته في أوقات العمل الرسمية، فإنه يجوز أن يستمر إلى غاية الانتهاء منه.\nيجب أن ينوه في كل محضر تنفيذ عن تاريخ وساعة بدايته وساعة نهايته، وإلا كان قابلا للإبطال، ويترتب على ذلك المسؤولية المدنية للمحضرالقضائي."},{"n":"630","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الثالث — أحكام مشتركة في التنفيذ الجبري","القسم الثامن — في تقادم السندات التنفيذية"],"g":"","t":"تتقادم الحقوق التي تتضمنها السندات التنفيذية بمضي خمس عشرة ) (15 سنة كاملة ابتداء من تاريخ قابليتها للتنفيذ.\nيقطع التقادم بكل إجراء من إجراءات التنفيذ."},{"n":"631","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الرابع — في إجراءات تسوية إشكالات التنفيذ"],"g":"","t":"في حالة وجود إشكال في تنفيذ أحد السندات التنفيذية المنصوص عليها في هذا القانون، يحرر المحضر القضائي محضرا عن الإشكال، ويدعو الخصوم لعرض الإشكال على رئيس المحكمة التي يباشر في دائرة اختصاصها التنفيذ عن طريق الاستعجال.\nتخضع إشكالات التنفيذ المتعلقة بالحجوز للقواعد الخاصة بأحكام الحجوز."},{"n":"632","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الرابع — في إجراءات تسوية إشكالات التنفيذ"],"g":"","t":"ترفع دعوى الإشكال في التنفيذ من طرف المستفيد من السند التنفيذي أو المنفذ عليه أو الغير الذي له مصلحة، بحضور المحضر القضائي المكلف بالتنفيذ.\nفي حالة رفض المحضر القضائي تحرير محضر عن الإشكال الذي يثيره أحد الأطراف، يجوز لأحدهم تقديم طلب وقف التنفيذ إلى رئيس المحكمة، عن طريق دعوى استعجالية من ساعة إلى ساعة وتكليف المحضر القضائي وباقي الأطراف بالحضور أمام الرئيس.\nتوقف إجراءات التنفيذ إلى غاية الفصل في الإشكال أو في طلب وقف التنفيذ من طرف رئيس المحكمة."},{"n":"633","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الرابع — في إجراءات تسوية إشكالات التنفيذ"],"g":"","t":"يتعين على رئيس المحكمة أن يفصل في دعوى الإشكال أو في طلب وقف التنفيذ، في أجل أقصاه خمسة عشر ) (15 يوما من تاريخ رفع الدعوى، بأمر مسبب غير قابل لأي طعن.\nيكون للأمر الصادر عن رئيس المحكمة طابع مؤقت ولا يمس أصل الحق ولا يفسر السند التنفيذي.\n)قرار المجلس الدستوري رقم 2 في 5 ديسمبر 2021 ج ر رقم 4 قرر دستورية الفقرة الاولى من المادة (633"},{"n":"634","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الرابع — في إجراءات تسوية إشكالات التنفيذ"],"g":"","t":"في حالة قبول دعوى الإشكال أو طلب وقف التنفيذ، يأمر الرئيس بوقف التنفيذ لمدة محددة لا تتجاوز ستة ) (6 أشهر ابتداء من تاريخ رفع الدعوى.\nفي حالة رفض دعوى الإشكال أو طلب وقف التنفيذ يأمر بمواصلة التنفيذ.\nوفي حالة رفض طلب وقف التنفيذ، يحكم القاضي على المدعي بغرامة مدنية لا تقل عن ثلاثين ألف دينار ) (30.000 دج، دون المساس بالتعويضات المدنية التي يمكن منحها للمدعى عليه.\nتبقى جميع عقود وإجراءات التنفيذ السابقة قائمة وصحيحة وتستمر من آخر إجراء."},{"n":"635","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الرابع — أحكام عامة — في التنفيذ الجبري للسندات التنفيذية","الفصل الرابع — في إجراءات تسوية إشكالات التنفيذ"],"g":"","t":"إذا سبق الفصل في إشكال التنفيذ أو في طلب وقف التنفيذ، فلا يجوز رفع دعوى ثانية من نفس الأطراف حول نفس الموضوع."},{"n":"636","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الأول — أحكام خاصة ومشتركة","القسم الأول — في الأموال غير القابلة للحجز"],"g":"","t":"فضلا عن الأموال التي تنص القوانين الخاصة على عدم جواز الحجز عليها، لا يجوز الحجز عل الأموال الآتية:\n1- الأموال العامة المملوكة للدولة، أو للجماعات الإقليمية، أو للمؤسسات العمومية ذات الصبغة الإدارية، مالم ينص القانون على خلاف ذلك،\n2- الأموال الموقوفة وقفا عاما أو خاصا، ماعدا الثمار والإيرادات،\n3- أموال السفارات الأجنبية،\n4- النفقات المحكوم بها قضائيا إذا كانت قيمتها لا تتجاوز ثلثي 2/3 الأجر الوطني الأدنى المضمون،\n5- الأموال التي يملكها المدين ولا يجوز له التصرف فيها،\n6- الأثاث وأدوات التدفئة والفراش الضروري المستعمل يوميا للمحجوز عليه ولأولاده الذين يعيشون معه، والملابس التي يرتدونها،\n7- الكتب اللازمة لمتابعة الدراسة أو لمهنة المحجوز عليه في حدود مبلغ يساوي ثلاث مرات الأجر الوطني الأدنى المضمون، والخيار للمحجوز عليه في ذلك،\n8- أدوات العمل الشخصية والضرورية لأداء مهنة المحجوز عليه والتي لا تتجاوز قيمتها مائة ألف دينار ) (100.000 دج والخيار له في ذلك،\n9- المواد الغذائية اللازمة لمعيشة المحجوز عليه ولعائلته لمدة شهر واحد )، (1\n10- الأدوات المنزلية الضرورية، ثلاجة، مطبخ أو فرن الطبخ، ثلاث ) (3 قارورات غاز، والأواني المنزلية العادية الخاصة بالطهي والأكل للمحجوز عليه ولأولاده القصر الذين يعيشون معه،\n11- الأدوات الضرورية للمعاقين، الق َّصر وناقصي الأهلية،\n12- لوازم ُ\n13- ومن الحيوانات الأليفة، بقرة أو ناقة أو ست نعاج أو عشر عنزات، حسب اختيار المحجوز عليه، وما يلزم من التبن والعلف والحبوب لغذائها لمدة شهر واحد ) (1 وفراش الإسطبل."},{"n":"637","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الأول — أحكام خاصة ومشتركة","القسم الأول — في الأموال غير القابلة للحجز"],"g":"","t":"إن الأموال المنقولة المذكورة في المادة 11 ) 636 و ( 12 أعلاه، غير قابلة للحجز ولو من أجل استيفاء دين مستحق للدولة أو للجماعات الإقليمية.\nغير أن هذه الأموال قابلة للحجز، إذا كان هذا الحجز من أجل استيفاء مبلغ القرض الذي منح من أجل اكتسابها أو ثمن إنتاجها أو ثمن تصليحها."},{"n":"638","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الأول — أحكام خاصة ومشتركة","القسم الأول — في الأموال غير القابلة للحجز"],"g":"","t":"لا يجوز الحجز على الأدوات الضرورية للمعاقين المشار إليهم في المادة 11 – 636 أعلاه، حتى ولو كان الحجز من أجل استيفاء ثمنها أو ثمن إنتاجها أو ثمن إصلاحها."},{"n":"639","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الأول — أحكام خاصة ومشتركة","القسم الأول — في الأموال غير القابلة للحجز"],"g":"","t":"لا يجوز الحجز على الأجور والمرتبات ومعاشات التقاعد أو العجز الجسماني، إلا في الحدود المنصوص عليها في هذا القانون."},{"n":"640","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الأول — أحكام خاصة ومشتركة","القسم الثاني — في الأيداع والتخصيص"],"g":"","t":"يجوز للمحجوز عليه أو من يمثله في أية حالة كانت عليها الإجراءات، قبل مباشرة البيع أو أثناءه وقبل رسو المزاد، إيداع مبلغ من النقود يساو الدين المحجوز من أجله والمصاريف.\nيودع هذا المبلغ بين يدي المحضر القضائي أو بأمانة ضبط المحكمة التي يباشر في دائرة اختصاصها التنفيذ مقابل وصل.\nيترتب على هذا الإيداع زوال الحجز عن الأموال المحجوزة وانتقاله إلى المبلغ المودع الذي يبقى خالصا للدائن الحاجز دون مزاحمة بقية الدائنين له في ذلك.\nإذا وقعت حجوز أخرى على أموال المدين بعد الإيداع، فلا يكون لها أثر في حق الدائن الذي خصص له هذا المبلغ."},{"n":"641","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الأول — أحكام خاصة ومشتركة","القسم الثاني — في الأيداع والتخصيص"],"g":"","t":"يجوز للمحجوز عليه أن يطلب بدعوى استعجالية في أية حالة كانت عليها الإجراءات، تقدير مبلغ من النقود أو ما يقوم مقامها، يودعه بأمانة ضبط المحكمة يبقى على ذمة الوفاء للحاجز.\nيترتب على هذا الإيداع زوال الحجز عن الأموال المحجوزة وانتقاله إلى المال المودع لفائدة الدائن وحده عند الإقرار له به أو الحكم له بثبوته."},{"n":"642","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الأول — أحكام خاصة ومشتركة","القسم الثاني — في الأيداع والتخصيص"],"g":"","t":"يجوز للدائن الحجز على جميع أموال المدين حفاظا على الضمان العام لديونه.\nغير أنه إذا كانت قيمة الدين المحجوز من أجله لاتتناسب مع قيمة الأموال المحجوزة، جاز للمدين أن يطلب بدعوى استعجالية، الحكم له بقصر الحجز على بعض هذه الأموال التي تغطي مبلغ الدين ومصاريفه.\nوالدائن الذي تقرر قصر الحجز لصالحه، له الأولوية على غيره من الدائنين عند استيفاء حقه من الأموال التي يقصر الحجز عليها."},{"n":"643","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الأول — أحكام خاصة ومشتركة","القسم الثالث — في إبطال إجراءات الحجز"],"g":"","t":"إذا كان إجراء من إجراءات التنفيذ أو الحجز، قابلا للإبطال، يجوز للمحجوز عليه، أو لكل ذي مصلحة، أن يطلب بدعوى استعجالية ضد الحاجز والمحضر القضائي، الحكم ببطلان الإجراء وزوال ما ترتب عليه من آثار، وذلك خلال أجل شهر واحد ) (1 من تاريخ الإجراء، وإلا سقط الحق في طلب الإبطال واعتبر صحيحا.\nإذا تبين للقاضي أن طلب الإبطال تعسفي، جاز الحكم عليه بغرامة مدنية لا تقل عن عشرين ألف دينار) (20.000 دج."},{"n":"644","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الأول — أحكام خاصة ومشتركة","القسم الثالث — في إبطال إجراءات الحجز"],"g":"","t":"إذا لم يتم الحجز في يوم واحد، جاز إتمامه في اليوم الموالي، وعلى المحضر القضائي أن يتخذ من الإجراءات ما يلزم للمحافظة على الأموال المحجوزة، والأموال المطلوب حجزها إلى أن يتم محضر الجرد والحجز.\nإذا اقتضى الحال الاستمرار في إجراءات الحجز بعد أوقات العمل الرسمية، أو صادف اليوم الموالي عطلة رسمية، جاز للمحضر القضائي إتمام الحجز دون ترخيص من رئيس المحكمة.\nيجب أن ينوه في محضر الحجز عن تاريخ وساعة بدايته وتاريخ وساعة إنهائه، تحت طائلة القابلية للإبطال."},{"n":"645","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الأول — أحكام خاصة ومشتركة","القسم الثالث — في إبطال إجراءات الحجز"],"g":"","t":"لا يجوز أن يتقدم إلى المزاد العلني، المدين والقضاة الذين نظروا القضية والمحضرون القضائيون ومحافظو البيع المعنيون بالتنفيذ، وأمناء الضبط الذين شاركوا في الإجراءات والمحامون الممثلون للأطراف، والوكلاء الذين باشروا الإجراءات باسم المدين أو بواسطة غيرهم، وإلا كان البيع بالمزاد العلني قابلا للإبطال.\nيجوز للدائن المشاركة في المزاد العلني."},{"n":"646","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثاني — في الحجوز التحفظية","القسم الأول — أحكام عامة"],"g":"","t":"الحجز التحفظي هو وضع أموال المدين المنقولة المادية والعقارية تحت يد القضاء ومنعه من التصرف فيها، ويقع الحجز على مسؤولية الدائن."},{"n":"647","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثاني — في الحجوز التحفظية","القسم الأول — أحكام عامة"],"g":"","t":"يجوز للدائن، بدين محقق الوجود، حال الأداء، أن يطلب بعريضة مسببة، مؤرخة وموقعة منه أو ممن ينوبه، استصدار أمر بالحجز التحفظي على منقولات أو عقارات مدينه، إذا كان حاملا لسند دين أو كان لديه ُم َس ِّوغات ظاهرة ترجح وجود الدين، ويخشى فقدان الضمان لحقوقه."},{"n":"648","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثاني — في الحجوز التحفظية","القسم الأول — أحكام عامة"],"g":"","t":"يجوز توقيع الحجز التحفظي، خلال وجود دعوى أمام قاضي الموضوع، وفي هذه الحالة، يقدم طلب تثبيت الحجز أمام نفس قاضي الموضوع بمذكرة إضافية تضم إلى أصل الدعوى للفصل فيهما معا وبحكم واحد، دون مراعاة الأجل المنصوص عليه في المادة 662 أدناه."},{"n":"649","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثاني — في الحجوز التحفظية","القسم الأول — أحكام عامة"],"g":"","t":"يتم الحجز التحفظي بموجب أمر على عريضة من رئيس المحكمة التي يوجد في دائرة اختصاصها موطن المدين أو مقر الأموال المطلوب حجزها.\nيلزم رئيس المحكمة بالفصل في طلب الحجز في أجل أقصاه خمسة ) (5 أيام من تاريخ إيداع العريضة بأمانة الضبط."},{"n":"650","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثاني — في الحجوز التحفظية","القسم الثاني — في الحجز التحفظي على الحقوق الصناعية والتجارية"],"g":"","t":"يجوز لكل من له ابتكار أو إنتاج مسجل ومحمي قانونا، أن يحجز تحفظيا على عينة من السلع أو نماذج من المصنوعات المقلدة.\nيحرر المحضر القضائي، محضر الحجز، يبين فيه المنتوج أو العينة أو النموذج المحجوز، ويضعه في حرز مختوم ومشمع، وإيداعه مع نسخة من المحضر بأمانة ضبط المحكمة المختصة إقليميا."},{"n":"651","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثاني — في الحجوز التحفظية","القسم الثاني — في الحجز التحفظي على الحقوق الصناعية والتجارية"],"g":"","t":"يجوز للدائن أن يحجز تحفظيا على القاعدة التجارية للمدين ويقيد أمر الحجز خلال أجل خمسة عشر ) (15 يوما من تاريخ صدوره بالإدارة المكلفة بالسجل التجاري، وينشر في النشرة الرسمية للإعلانات القانونية، وإلا كان الحجز باطلا."},{"n":"652","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثاني — في الحجوز التحفظية","القسم الثالث — في الحجز التحفظي على العقارات"],"g":"","t":"يجوز للدائن أن يحجز تحفظيا على عقارات مدينه.\nيقيد أمر الحجز التحفظي على العقارات بالمحافظة العقارية التي يوجد بدائرة اختصاصها العقار خلال أجل خمسة عشر ) (15 يوما من تاريخ صدوره وإلا كان الحجز باطلا."},{"n":"653","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثاني — في الحجوز التحفظية","القسم الرابع — في حجز المؤجر على أموال المستأجر"],"g":"","t":"يجوز لمؤجر المباني أن يحجز تحفظيا على منقولات مستأجريه الموجودة في هذه المباني وفاء للأجرة المستحقة عن الإيجار."},{"n":"654","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثاني — في الحجوز التحفظية","القسم الرابع — في حجز المؤجر على أموال المستأجر"],"g":"","t":"يجوزلمؤجر الأراضي الزراعية أو الحقول أو البساتين أن يحجز تحفظيا على المزروعات والثمار الموجودة في تلك الأراضي، وفاء للأجرة المستحقة عن إيجارها."},{"n":"655","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثاني — في الحجوز التحفظية","القسم الرابع — في حجز المؤجر على أموال المستأجر"],"g":"","t":"يجوز للمؤجر أن يحجز تحفظيا على المنقولات الموجودة بالمبنى أو المزرعة إذا نقلت من مكانها بغير رضاء المؤجر والتي له عليها حق الامتياز المنصوص عليه في القانون، ما لم يكن قد مضى على نقلها مدة ستين يوما ).(60"},{"n":"656","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثاني — في الحجوز التحفظية","القسم الرابع — في حجز المؤجر على أموال المستأجر"],"g":"","t":"يجوز للمؤجر أن يحجز تحفظيا على منقولات المستأجرين الفرعيين للمباني أو الأراضي الزراعية أو الحقول أو البساتين الموجودة في الأمكنة التي يشغلونها.\nويجوز أيضا الحجز تحفظيا على ثمار تلك الأراضي وفاء للأجرة المستحقة."},{"n":"657","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثاني — في الحجوز التحفظية","القسم الخامس — في حجز المؤجر على منقولات المدين المتنقل"],"g":"","t":"يجوز للدائن سواء كان بيده سند أم لا، أن يحجز تحفظيا على منقولات مدينه المتنقل الموجودة في المنطقة التي يقيم فيها الدائن.\nوإذا كانت المنقولات المحجوزة تحت يد الدائن، عين حارسا عليها، وإلا يعين غيره حارسا عليها بناء على طلب منه."},{"n":"658","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثاني — في الحجوز التحفظية","القسم السادس — في الحجز الأستحقاقي"],"g":"","t":"يجوز لمالك المنقول أو من له حق الحبس عليه، قبل رفع دعوى استرداد المنقول، أن يحجز تحفظيا على ذلك المنقول عند حائزه، وفي هذه الحالة، يجب تعيين المنقول في الطلب وفي أمر الحجز.\nوإذا اعترض حائز المنقول المراد حجزه على الحجز، وجب على المحضر القضائي وقف إجراءات الحجز وتحرير محضر إشكال يسلمه للأطراف لعرضه على رئيس المحكمة في أجل أقصاه ثلاثة ) (3 أيام من تاريخ الاعتراض."},{"n":"659","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثاني — في الحجوز التحفظية","القسم السابع — في آثار الحجز التحفظي"],"g":"","t":"يبلغ رسميا أمر الحجز التحفظي إلى المدين وفقا للمادة 688 أدناه، ويتبع فورا بالحجز، وعلى المحضر القضائي تحرير محضر حجز وجرد للأموال الموجودة تحت يد المدين وإلا كان الحجز باطلا.\nيمكن الاستعانة بالقوة العمومية لتنفيذ أمر الحجز، عند الاقتضاء."},{"n":"660","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثاني — في الحجوز التحفظية","القسم السابع — في آثار الحجز التحفظي"],"g":"","t":"تبقى الأموال المحجوزة تحت يد المحجوز عليه إلى حين الحكم بتثبيت الحجز أو الأمر برفعه.وله أن ينتفع بها انتفاع أب الأسرة الحريص وأن يمتلك ثمارها مع المحافظة عليها."},{"n":"661","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثاني — في الحجوز التحفظية","القسم السابع — في آثار الحجز التحفظي"],"g":"","t":"كل تصرف قانوني من المدين في الأموال المحجوزة، لا يكون نافذا.ويترتب على التصرفات القانونية أو الأعمال المادية المضرة بالحاجز، تعرضه للعقوبات المتعلقة بجرائم الأموال المحجوزة المنصوص عليها في قانون العقوبات.\nغير أنه يجوز للمدين أن يؤجر الأموال المحجوزة بترخيص من رئيس المحكمة الذي أمر بالحجز وذلك بأمر على عريضة."},{"n":"662","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثاني — في الحجوز التحفظية","القسم الثامن في — تثبيت الحجز التحفظي"],"g":"","t":"يجب على الدائن الحاجز أن يرفع دعوى تثبيت الحجز أمام قاضي الموضوع في أجل أقصاه خمسة عشر ) (15 يوما من تاريخ صدور أمر الحجز، وإلا كان الحجز والإجراءات التالية له باطلين."},{"n":"663","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثاني — في الحجوز التحفظية","القسم الثامن في — تثبيت الحجز التحفظي"],"g":"","t":"يتم رفع الحجز التحفظي، بدعوى استعجالية، في الحالات الآتية:\n1- إذا لم يسع الدائن إلى رفع دعوى تثبيته في الأجل المنصوص عليه في المادة 662 أعلاه.\n2- إذا قام المدين بإيداع مبالغ مالية بأمانة ضبط المحكمة أوبمكتب المحضر القضائي لتغطية أصل الدين والمصاريف.\n3- في كل حالة يثبت فيها المستأجر أو المستأجر الفرعي أنه دفع الأجرة المستحقة في حالة حجز المؤجر على منقولات المستأجر."},{"n":"664","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثاني — في الحجوز التحفظية","القسم الثامن في — تثبيت الحجز التحفظي"],"g":"","t":"إذا تعلق الحجز بسندات تجارية محررة لفائدة المدين، يجب أن تعين في محضر الحجز، وتودع في أمانة ضبط المحكمة مع أصل المحضر مقابل وصل."},{"n":"665","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثاني — في الحجوز التحفظية","القسم الثامن في — تثبيت الحجز التحفظي"],"g":"","t":"إذا وقع الحجز التحفظي على أموال منقولة موجودة تحت يد المدين، يحرر المحضر القضائي محضر الحجز والجرد، ويسلم نسخة منه للمدين، ويعينه حارسا عليها.\nإذا وقع الحجز على َم ُصوغات أو سبائك ذهبية أو فضية أو معادن نفيسة أخرى أو حلي أو أحجار كريمة، وجب على المحضر القضائي، أن يبين في محضر الحجز، نوع المعدن والوزن الحقيقي وأوصافه وتقدير قيمته بمعرفة خبير يعين بأمر على عريضة، أومن طرف الإدارة المكلفة بدمغ المعادن الثمينة، وهذا بحضور المدين أو ممثله القانوني، أو بعد صحة تكليفه بالحضور.\nوفي كل الأحوال، يرفق تقرير الخبير الخاص بالتقدير والوزن بمحضر الحجز.\nويجب، بعد الوزن والتقييم، أن توضع في حرز مختوم ومشمع، وأن يذكر ذلك في محضر الحجز مع وصف الأختام وإيداعها بأمانة ضبط المحكمة مقابل وصل."},{"n":"666","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثاني — في الحجوز التحفظية","القسم الثامن في — تثبيت الحجز التحفظي"],"g":"","t":"إذا فصلت المحكمة في دعوى تثبيت الحجز التحفظي بإثبات الدين، قضت بصحة الحجز التحفظي وتثبيته، كما يمكنها أن تقضي برفع الحجز كليا أو جزئيا، إذا برر المدين طلبه بأسباب جدية ومشروعة.\nإذا فصلت المحكمة برفض الدعوى لعدم إثبات الدين، قضت وجوبا برفع الحجز، وفصلت في طلب التعويضات المدنية، عند الاقتضاء.\nيجوز الحكم أيضا على الحاجز بغرامة مدنية لا تقل عن عشرين ألف دينار ) (20.000 دج."},{"n":"667","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثالث — في حجز ما للمدين لدى الغير"],"g":"","t":"يجوز لكل دائن بيده سند تنفيذي، أن يحجز حجزا تنفيذيا، على ما يكون لمدينه لدى الغير من الأموال المنقولة المادية أو الأسهم أو حصص الأرباح في الشركات أو السندات المالية أو الديون، ولو لم يحل أجل استحقاقها، وذلك بموجب أمر على عريضة من رئيس المحكمة التي توجد فيها الأموال."},{"n":"668","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثالث — في حجز ما للمدين لدى الغير"],"g":"","t":"إذا لم يكن بيد الدائن سند تنفيذي لكن له ُم َس ِّوغات ظاهرة، جاز له أن يحجز حجزا تحفظيا على ما يكون لمدينه لدى الغير من الأموال المشار إليها في المادة 667 أعلاه وبنفس الإجراء.\nيجب على الدائن الحاجز، رفع دعوى تثبيت الحجز، وفقا للإجراءات والآجال المنصوص عليها في المادة 662 أعلاه، وإلا كان الحجز والإجراءات التالية له باطلين.\nيجوز أيضا للدائن، إجراء هذا الحجز، إذا كانت دعوى الدين مرفوعة أمام قاضي الموضوع وفي هذه الحالة، تقدم مذكرة إضافية في ملف الموضوع لتثبيت الحجز أمام نفس قاضي الموضوع ليفصل فيهما معا وبحكم واحد، ولا يعتد بالأجل المنصوص عليه في المادة 662 أعلاه."},{"n":"669","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثالث — في حجز ما للمدين لدى الغير","القسم الأول — في التبليغ الرسمي لأمر الحجز ورفعه"],"g":"","t":"يبلغ أمر الحجز إلى الغير المحجوز لديه شخصيا إذا كان شخصا طبيعيا، وإذا كان شخصا معنويا يبلغ إلى الممثل القانوني، مع تسليمه نسخة من أمر الحجز والتنويه بذلك في المحضر.\nيقوم المحضر القضائي على الفور بجرد الأموال المراد حجزها وتعيينها تعيينا ويعين المحجوز لديه حارسا عليها وعلى ثمارها، دقيقا في محضر الحجز والجرد، فينوه في هذه الحالة عن فضل هذا الأخير تسليمها للمحضر القضائي إلا إذا ّ ذلك في المحضر.\nينوه في محضر الحجز على إعذار المحجوز لديه بعدم التخلي عن يجب أن ّ الأموال المحجوزة وعدم تسليمها إلى المدين أو غيره، إلا بصدور أمر مخالف."},{"n":"670","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثالث — في حجز ما للمدين لدى الغير","القسم الأول — في التبليغ الرسمي لأمر الحجز ورفعه"],"g":"","t":"إذا كان المدين المحجوز عليه مقيما خارج الوطن، وجب تبليغ أمر الحجز لشخصه أو إلى موطنه في الخارج حسب الأوضاع المقررة في البلد الذي يقيم فيه."},{"n":"671","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثالث — في حجز ما للمدين لدى الغير","القسم الأول — في التبليغ الرسمي لأمر الحجز ورفعه"],"g":"","t":"إذا كان للمحجوز لديه عدة فروع، فلا ينتج الحجز أثره، إلا بالنسبة للفرع الذي عينه الحاجز وتضمنه أمر الحجز."},{"n":"672","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثالث — في حجز ما للمدين لدى الغير","القسم الأول — في التبليغ الرسمي لأمر الحجز ورفعه"],"g":"","t":"يعتبر التبليغ الرسمي لأمر الحجز إلى المحجوز لديه في الحالة المنصوص عليها في المادة 674 أدناه بمثابة إنذار له لتقديم تصريح عن الأموال المملوكة للمدين والمودعة لديه.\nإن عدم التصريح في الآجال المنصوص عليها في المادة 677 أدناه، يرتب المسؤولية المهنية والمدنية للمحجوز لديه بما تسبب فيه من ضرر مادي لحق بالدائن."},{"n":"673","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثالث — في حجز ما للمدين لدى الغير","القسم الأول — في التبليغ الرسمي لأمر الحجز ورفعه"],"g":"","t":"إذا كلف المحجوز لديه بالحضور في دعوى تثبيت الحجز التحفظي، فلا يجوز له أن يطلب إخراجه منها، والحكم الصادر فيها لا يرتب أثرا في مواجهته إلا فيما يتعلق بتثبيت الحجز."},{"n":"674","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثالث — في حجز ما للمدين لدى الغير","القسم الأول — في التبليغ الرسمي لأمر الحجز ورفعه"],"g":"","t":"يجب أن يتم التبليغ الرسمي لمحضر الحجز إلى المدين المحجوز عليه خلال أجل ثمانية ) (8 أيام التالية لإجراء الحجز، مرفقا بنسخة من أمر الحجز مع التنويه على ذلك في محضر التبليغ، وإلا كان الحجز قابلا للإبطال.\nكما يتعين على الدائن الحاجز اختيار موطن له في دائرة اختصاص المحكمة التي يوجد في دائرة اختصاصها الأموال المحجوزة."},{"n":"675","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثالث — في حجز ما للمدين لدى الغير","القسم الأول — في التبليغ الرسمي لأمر الحجز ورفعه"],"g":"","t":"يجوز للمحجوز عليه أن يطلب رفع الحجز كليا أو جزئيا وفقا لأحكام المادة 663 أعلاه."},{"n":"676","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثالث — في حجز ما للمدين لدى الغير","القسم الثاني — في التزامات المحجوز لديه"],"g":"","t":"إذا كانت للمدين أموال تحت يد الدولة أو إحدى الجماعات الإقليمية أو مؤسسة عمومية أو هيئة عمومية وطنية، وجب عليها أن تسلم للدائن الحاجز أو المحضر القضائي بناء على طلبه شهادة تثبت ما لديها من أموال للمدين المحجوز عليه."},{"n":"677","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثالث — في حجز ما للمدين لدى الغير","القسم الثاني — في التزامات المحجوز لديه"],"g":"","t":"يجب على المحجوز لديه أن يقدم تصريحا مكتوبا عن الأموال المحجوزة لديه، يسلمه إلى المحضر القضائي أو إلى الدائن الحاجز خلال أجل أقصاه ثمانية ) (8 أيام التالية من تبليغه الرسمي لأمر الحجز، مرفقا بالمستندات المؤيدة له، ويبين فيه جميع الحجوز الواقعة تحت يده إن وقعت، مرفقا بنسخ منها.\nإذا كان الحجز متعلقا بأموال منقولة مادية، يجب على المحجوز لديه أن يقدم تصريحا مكتوبا يبين فيه قائمة المنقولات الموجودة لديه، الخاصة بالمحجوز عليه.\nوإذا كان الحجز متعلقا بدين للمحجوز عليه في ذمة المحجوز لديه، يجب أن يبين في التصريح مبلغ الدين ومحله وأسباب انقضائه إذا كان قد انقضى.\nوإذا كان الحجز متعلقا بمبلغ مالي مودع في حساب جاري أو بنكي أو وديعة، يجب أن يبين التصريح مقدار المبلغ المالي الموجود أو انعدامه.\nوإذا كان الحجز متعلقا بالأسهم أو حصص الأرباح أو السندات المالية، يبين التصريح قيمتها ومكان إصدارها وتاريخ استحقاقها."},{"n":"678","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثالث — في حجز ما للمدين لدى الغير","القسم الثاني — في التزامات المحجوز لديه"],"g":"","t":"إذا توفي المحجوز لديه أو فقد أهليته أو زالت صفته أو زالت صفة من يمثله، وجب على الحاجز أن يبلغ نسخة من محضر وأمر الحجز إلى ورثة المحجوز لديه أو إلى ممثلهم الاتفاقي أو القانوني، ويكلفهم بتقديم تصريح بما في حيازتهم، إن لم يكن تم إعداده من قبل، خلال أجل أقصاه عشرة )(10 أيام من تاريخ التبليغ الرسمي."},{"n":"679","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثالث — في حجز ما للمدين لدى الغير","القسم الثاني — في التزامات المحجوز لديه"],"g":"","t":"إذا لم يصرح المحجوز لديه بما عنده كما هو مبين في المادة 677 أعلاه، أو قدم تصريحا بغير الحقيقة أو أخفى الأوراق الواجب إيداعها لتأييد التصريح، جاز الحكم عليه بالمبلغ المحجوز من أجله لصالح الدائن الحاجز الذي حصل على سند تنفيذي، وذلك بدعوى استعجالية.\nويجب في جميع الأحوال إلزام المحجوز لديه بالمصاريف القضائية، و يمكن الحكم عليه بالتعويضات المترتبة على تقصيره أو تأخيره في تقديم التصريح."},{"n":"680","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثالث — في حجز ما للمدين لدى الغير","القسم الثاني — في التزامات المحجوز لديه"],"g":"","t":"يحق للمحجوز لديه في جميع الأحوال أن يطلب خصم مما في ذمته قدر ما أنفقه من المصاريف.\nيتم الخصم وتقدير المصاريف بأمر على عريضة مسبب يصدره رئيس المحكمة التي يوجد في دائرة اختصاصها مكان التنفيذ.\nلا يمكن تنفيذ أمر الخصم إلا بعد أن يتم التبليغ الرسمي للمحجوز عليه والحاجز، وهو قابل للاعتراض عليه أمام قاضي الاستعجال."},{"n":"681","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثالث — في حجز ما للمدين لدى الغير","القسم الثالث — في الحجز التنفيذي على أموال المدين الموجودة عند الغير وآثاره"],"g":"","t":"إذا كان الحجز تنفيذيا يتعلق بمنقولات مادية أو سندات مالية أو أسهم أو حصص الأرباح المستحقة ولم يحصل الوفاء بأصل الدين والمصاريف خلال عشرة ) (10 أيام التالية للتبليغ الرسمي للحجز إلى المحجوز عليه، تباع الأموال المحجوزة وفقا لإجراءات بيع المنقول المنصوص عليها في هذا القانون."},{"n":"682","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثالث — في حجز ما للمدين لدى الغير","القسم الثالث — في الحجز التنفيذي على أموال المدين الموجودة عند الغير وآثاره"],"g":"","t":"يمنع على المحجوز لديه الوفاء من المبالغ المحجوزة للمدين المحجوز عليه من تاريخ توقيع الحجز."},{"n":"683","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثالث — في حجز ما للمدين لدى الغير","القسم الثالث — في الحجز التنفيذي على أموال المدين الموجودة عند الغير وآثاره"],"g":"","t":"يستمر المحجوز لديه في دفع أجرة المحجوز عليه أو المرتب المخصص لمعاشه أو أجرة عماله رغم الحجز."},{"n":"684","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثالث — في حجز ما للمدين لدى الغير","القسم الثالث — في الحجز التنفيذي على أموال المدين الموجودة عند الغير وآثاره"],"g":"","t":"عندما يباشر الحجز على أموال المدين لدى الغير بسند تنفيذي على مبلغ مالي أو دين، يكلف الدائن الحاجز والمدين المحجوز عليه والغير المحجوز لديه بالحضور أمام رئيس المحكمة في أجل أقصاه عشرة ) (10 أيام من تاريخ التبليغ الرسمي، لأجل الفصل في المبلغ المالي المحجوز.\nإذا كان تصريح المحجوز لديه يؤكد وجود مبلغ الدين، أصدر رئيس المحكمة أمرا بتخصيص المبلغ المطلوب في حدود أصل الدين والمصاريف المترتبة عليه، وأمر برفع الحجز عما زاد عن ذلك.\nإذا كان المبلغ المحجوز أقل من مبلغ الدين، بقي المدين المحجوز عليه ملزما بتكملة باقي المبلغ.\nإذا كان تصريح المحجوز لديه يؤكد عدم وجود مبلغ مالي للمدين، يصرف الدائن الحاجز إلى ما يراه مناسبا.\nإذا لم يقدم المحجوز لديه التصريح بما في ذمته، بعد التبليغ الرسمي وإلى غاية جلسة التخصيص، يلزم بدفع المبلغ المطلوب من ماله، وله في هذه الحالة حق الرجوع على المدين بما دفعه."},{"n":"685","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثالث — في حجز ما للمدين لدى الغير","القسم الرابع — في تعدد الدائنين"],"g":"","t":"إذا تقدم دائنون آخرون بعد حجز ما للمدين لدى الغير، وكانت لهم سندات تنفيذية، ولم يصدر أمر التخصيص بعد، يقيدون كدائنين مع الحاجز الأول، ويتم التبليغ الرسمي للحاجز والمحجوز عليه والمحجوز لديه بذلك، وتؤجل جلسة التخصيص إلى غاية حضور جميع الأطراف أو انقضاء الأجل المحدد في التبليغ الرسمي."},{"n":"686","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الثالث — في حجز ما للمدين لدى الغير","القسم الرابع — في تعدد الدائنين"],"g":"","t":"إذا كانت المبالغ المالية المحجوزة كافية للوفاء بحقوق جميع الدائنين يتم الوفاء بموجب أمر تخصيص بين الدائنين كل حسب قيمة دينه.\nوإذا كانت المبالغ المالية غير كافية، يجري تقسيمها بين الدائنين قسمة غرماء."},{"n":"687","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم الأول — في إجراءات الحجز"],"g":"","t":"إذا لم يقم المدين بالوفاء بعد انقضاء أجل خمسة عشر ) (15 يوما من تاريخ تكليفه بالوفاء وفقا للمادة 612 أعلاه، يجوز للمستفيد من السند التنفيذي، الحجز على جميع المنقولات و /أو الأسهم و /أو حصص الأرباح في الشركات و /أو السندات المالية للمدين.\nيتم الحجز بأمر على عريضة يصدره رئيس المحكمة التي توجد في دائرة اختصاصها الأموال المراد حجزها، وعند الاقتضاء، في موطن المدين، وذلك بناء على طلب الدائن أو ممثله القانوني أو الاتفاقي.\nيمكن الاستعانة بالقوة العمومية لتنفيذ أمر الحجز عند الاقتضاء."},{"n":"688","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم الأول — في إجراءات الحجز"],"g":"","t":"يتم التبليغ الرسمي لأمر الحجز إلى المحجوز عليه شخصيا أو إلى أحد أفراد عائلته البالغين المقيم ين معه، إذا كان شخصا طبيعيا، ويبلغ إلى الممثل القانوني أو الاتفاقي إذا كان شخصا معنويا، ويقوم المحضر القضائي على الفور بجرد الأموال وتعيينها تعيينا دقيقا مع وصفها وتحرير محضر حجز وجرد لها.\nوفي جميع الأحوال، يجب أن تسلم نسخة من محضر الحجز والجرد إلى المحجوز عليه في أجل أقصاه ثلاثة ) (3 أيام، وإذا رفض الاستلام ينوه عنه في المحضر.\nإذا تم الحجز في غياب المدين أو لم يكن له موطن معروف، يتم التبليغ الرسمي بالحجز وفقا لأحكام المادة 412 من هذا القانون."},{"n":"689","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم الأول — في إجراءات الحجز"],"g":"","t":"إذا كان المحجوز عليه مقيما خارج الوطن، وجب تبليغه بأمر الحجز ومحضر الحجز والجرد في موطنه بالخارج، حسب الأوضاع المقررة في البلد الذي يقيم فيه، مع مراعاة الآجال المنصوص عليها في هذا القانون.\nوفي هذه الحالة، لا يتم البيع إلا بعد انقضاء مدة عشرة ) (10 أيام من تاريخ التبليغ."},{"n":"690","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم الأول — في إجراءات الحجز"],"g":"","t":"إذا لم يبلغ أمر الحجز أو بلغ ولم يتم الحجز في أجل شهرين ) (2 من تاريخ صدوره، اعتبر الأمر لاغيا بقوة القانون.\nيمكن تجديد طلب الحجز بعد هذا الأجل."},{"n":"691","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم الثاني — في محضر الحجز والجرد"],"g":"","t":"يجب أن يتضمن محضر الحجز والجرد، فضلا عن البيانات المعتادة، ما يأتي:\n1- بيان السند التنفيذي والأمر الذيبموجبه تم الحجز،\n2- مبلغ الدين المحجوز من أجله،\n3- اختيار موطن للدائن الحاجز في دائرة اختصاص المحكمة التي يوجد في دائرة اختصاصها مكان التنفيذ،\n4- بيان مكان الحجز وما قام به المحضر القضائي من إجراءات، أو ما لقيه من صعوبات أو اعتراضات أثناء الحجز، وما اتخذه من تدابير،\n5- تعيين الأشياء المحجوزة بالتفصيل مع تحديد نوعها وأوصافها ومقدارها ووزنها ومقاسها وقيمتها بالتقريب.\nو يختم المحضر بالتوقيع عليه مع المحجوز عليه إن كان حاضرا أو التنويه عن غيابه أو رفضه التوقيع.\nإذا خلا محضر الحجز والجرد من أحد هذه البيانات، كان قابلا للإبطال خلال أجل عشرة ( ) 10 أيام من تاريخه.\nيرفع طلب الإبطال من كل ذي مصلحة عن طريق الاستعجال، يفصل فيه رئيس المحكمة خلال أجل أقصاه خمسة عشر ) (15 يوما."},{"n":"692","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم الثاني — في محضر الحجز والجرد"],"g":"","t":"يجوز الحجز على الثمار المتصلة أو المزروعات القائمة قبل نضجها.\nويجب أن يتضمن محضر الحجز، موقع البستان والأرض واسمهما ورقم المسح إن وجد ومساحة الأرض التقريبية وحدودها ونوع الثمار والمزروعات أو نوع الأشجار المثمرة وعددها والمقدار التقريبي لما يمكن أن يحصد أو يجنى أو ينتج منها وقيمته على وجه التقريب.\nيشرع في جني الثمار أو حصاد المزروعات وبيعها بموجب أمر على عريضة بناء على طلب الحارس أو الحاجز أو المحجوز عليه.\nكما يجوز بيع الثمار أو المزروعات وهي قائمة في أرضها إذا كان ذلك يحقق نفعا أوفر وفقا للإجراء المنصوص عليه في الفقرة أعلاه."},{"n":"693","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم الثاني — في محضر الحجز والجرد"],"g":"","t":"إذا وقع الحجز على مصوغات أو سبائك ذهبية أو فضية أو حلي أو أحجار كريمة أو معادن نفيسة أخرى، تطبق الإجراءات المنصوص عليها في المادة 665 أعلاه."},{"n":"694","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم الثاني — في محضر الحجز والجرد"],"g":"","t":"إذا وقع الحجز على لوحات فنية أو أشياء ذات قيمة خاصة، وجب وصفها وتقييمها بمعرفة خبير يعين بموجب أمر على عريضة."},{"n":"695","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم الثاني — في محضر الحجز والجرد"],"g":"","t":"إذا وقع الحجز على مبالغ مالية موجودة في مسكن المدين أو في محله التجاري، يجب على المحضر القضائي أن يبين مقدارها في محضر الحجز، ويقوم على الفور بالوفاء بقيمة الدين للدائن الحاجز مقابل وصل.\nوإذا وقع الحجز على مبالغ مالية بعملة أجنبية قابلة للتداول، يجب على المحضر القضائي أن يبين نوعها ومقدارها، ويقوم بتحويلها في بنك الجزائر مقابل قيمتها بالدينار، ويفي بقيمة الدين والمصاريف للحاجز."},{"n":"696","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم الثاني — في محضر الحجز والجرد"],"g":"","t":"إذا وقع الحجز على حيوانات، يجب تعيين نوعها وفصيلتها وعددها ووصف سنها وقيمته التقريبية، وتبقى في حراسة المحجوز عليه."},{"n":"697","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم الثالث — في حراسة الأموال المحجوزة"],"g":"","t":"يعين المحضر القضائي، بعد الحجز، المحجوز عليه حارسا على الأموال المحجوزة وعلى ثمارها إذا كانت في مسكنه أو في محله التجاري.\nإذا كانت الأشياء المحجوزة في غير المحل أو المسكن ولم يجد في مكان الحجز من يقبل الحراسة، ولم يأت الحاجز ولا المحجوز عليه بشخص مقتدر، وجب تكليف المحجوز عليه بالحراسة مؤقتا إن كان حاضرا ولا يعتد برفضه، وإن لم يكن حاضرا كلف الحاجز بالحراسة مؤقتا للمحافظة على الأموال المحجوزة.\nوفي الحالات المنصوص عليها في الفقرة السابقة، يرفع المحضر القضائي الأمر فورا إلى رئيس المحكمة، ليقرر بأمر على عريضة، إما نقلها وإيداعها عند حارس يختاره الحاجز أو المحضر القضائي وإما تعيين الحاجز أو المحجوز عليه حارسا عليها."},{"n":"698","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم الثالث — في حراسة الأموال المحجوزة"],"g":"","t":"إذا كان الحارس موجودا وقت الحجز، وسلمت له الأشياء المحجوزة في مكان حجزها، يوقع على محضر الجرد وتسلم له نسخة منه، أما إذا كان غائبا أو عين فيما بعد، وجب إعادة الجرد أمامه ثم يوقع باستلامه، ويعد ذلك بمثابة تبليغ ببدء الحراسة.\nللحارس، ماعدا المحجوز عليه والحاجز، الحق في أجر عن الحراسة، ويكون لهذا الأجر امتياز المصروفات القضائية على المنقولات المحجوزة.يقدر رئيس المحكمة أجر الحراسة بأمر على عريضة."},{"n":"699","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم الثالث — في حراسة الأموال المحجوزة"],"g":"","t":"إذا كانت الحراسة بأجر، لا يجوز للحارس أن يستعمل أو يستغل أو تعرض إلى العقوبة يعير الأموال المحجوزة إلا بأمر مخالف من القضاء، وإلا ّ المقررة في قانون العقوبات للجرائم المتعلقة بالأموال المحجوزة.\nإذا كان الحارس مالكا لها أو صاحب حق انتفاع، جاز له حق الاستعمال فيما خصصت له دون الاستغلال، وإذا بددها تعرض إلى العقوبة المقررة في قانون العقوبات للجرائم المتعلقة بالأموال المحجوزة.\nإذا كانت الحراسة على حيوانات أو أدوات عمل أو آلات لازمة لاستغلال أرض أو مصنع أو مؤسسة أخرى أو غيرها يمكن للحاجز أو المحجوز عليه، أن يطلب من رئيس المحكمة استصدار أمر على عريضة يسمح للحارس باستغلال الأموال إذا كان ذلك يحقق زيادة في قيمة الحجز."},{"n":"700","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم الرابع — في تعدد الدائنين"],"g":"","t":"إذا وقع الحجز من دائن ولم يتم البيع، وعلم الدائنون الآخرون بالحجز الأول قبل البيع، جاز لهم أن يتقدموا بسنداتهم أمام المحضر القضائي لتسجيلهم وانضمامهم إلى الدائن الحاجز الأول، وإعادة جرد الأموال المحجوزة، وطلب مواصلة إجراءات البيع إذا تقاعس الحاجز الأول، وتوزيع المتحصل منه بينهم."},{"n":"701","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم الرابع — في تعدد الدائنين"],"g":"","t":"إذا لم يعلم الدائنون الآخرون بالحجز الأول، جاز لهم إجراء حجوز أخرى على أموال المدين، وأثناء مباشرة الحجز الثاني، يجب على الحارس المعين في الحجز الأول أن يظهر نسخة من محضر هذا الحجز والأموال المحجوزة، وعلى المحضر القضائي في هذه الحالة جرد هذه الأموال في محضر، ويحجز الأموال التي لم يسبق حجزها، ويعين حارس الحجز الأول حارسا عليها إذا كانت في نفس المحل أو حارسا آخر إذا خيف أن الحارس الأول ليس باستطاعته المحافظة عليها.\nيجب أن يبلغ رسميا محضر الحجز الثاني إلى كل من الحاجز الأول والمحجوز عليه والحارس، وإشعار المحضر القضائي الذي قام بالحجز الأول في أجل أقصاه عشرة ) (10 أيام، وإلا كان قابلا للإبطال.\nإذا صرح ببطلان الحجز الأول، فلا يؤثر ذلك على الحجوز اللاحقة له على نفس المنقولات إذا كانت صحيحة."},{"n":"702","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم الخامس — في آثار الحجز التنفيذي على المنقول"],"g":"","t":"يتعرض الحارس للعقوبة المقررة في قانون العقوبات للجرائم المتعلقة بالأموال المحجوزة، إذا تسبب في تبديد أو ضياع هذه الأموال أو تخلى عنها لغيره بغير أمر من القضاء، أو تعمد عدم إظهار صورة من محضر الحجز السابق للمحضر القضائي، وترتب على ذلك ضرر بالحاجز أو المحجوز عليه."},{"n":"703","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم الخامس — في آثار الحجز التنفيذي على المنقول"],"g":"","t":"يكون الحجز والإجراءات التالية له قابلين للإبطال، إذا لم يتم البيع خلال أجل ستة ) (6 أشهر ابتداء من تاريخ التبليغ الرسمي للحجز إلى المحجوز عليه، ما لم يكن قد تم إيقاف البيع باتفاق الخصوم أو بحكم قضائي.\nإذا تسبب المحضر القضائي أو محافظ البيع في هذا البطلان، يجوز إلزامهما بالتعويضات المدنية للحاجز."},{"n":"704","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم السادس — في إجراءات بيع المنقولأت المحجوزة"],"g":"","t":"تباع الأموال المحجوزة بالمزاد العلني، بعد إعادة جردها، إما بالتجزئة أو بالجملة، وفقا لمصلحة المدين.\nيجري البيع بعد مضي مدة عشرة ) (10 أيام من تاريخ تسليم نسخة من محضر الحجز وتبليغه رسميا، إلا إذا اتفق الحاجز والمحجوز عليه على تحديد أجل آخر لا تزيد مدته القصوى على ثلاثة ) (3 أشهر.\nغير أنه إذا كانت الأموال المحجوزة، بضائع قابلة للتلف أو بضائع عرضة لتقلب الأسعار أو بضائع على وشك انقضاء مدة صلاحية استهلاكها، فلرئيس المحكمة أن يأمر بإجراء البيع بمجرد الانتهاء من الحجز والجرد وفي المكان الذي يراه مناسبا إذا كان يضمن أحسن عرض، وذلك بأمر على عريضة تقدم إليه من الحاجز أو المحجوز عليه أو المحضر القضائي أو الحارس."},{"n":"705","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم السادس — في إجراءات بيع المنقولأت المحجوزة"],"g":"","t":"يتم البيع بالمزاد العلني من طرف المحضر القضائي، ويجوز أن يتخلى عنه إلى محافظ البيع، وفي هذه الحالة يتولى المحضر القضائي شخصيا تسليم أوراق التنفيذ ومحضر الجرد للأموال المحجوزة إلى محافظ البيع مقابل وصل إبراء.\nوفي جميع الأحوال لايتحمل الدائن الحاجز المصاريف الإضافية الناتجة عن التخلي."},{"n":"706","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم السادس — في إجراءات بيع المنقولأت المحجوزة"],"g":"","t":"يجري البيع في المكان الذي توجد فيه الأموال المحجوزة أو في أقرب مكان عمومي أو في محل مخصص لذلك، ويجوز أن يجري البيع في مكان آخر بأمر على عريضة إذا كان يضمن أحسن عرض.\nيعلن عن البيع بالمزاد العلني بكل وسائل النشر، ويتضمن الإعلان على الخصوص، اسم المحجوز عليه وتاريخ البيع وساعته والمكان الذي يجري فيه ونوع الأموال المحجوزة ومكان وجودها وأوقات معاينتها وشروط البيع والثمن الأساسي للبيع الذي لا يقل عن قيمة الدين."},{"n":"707","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم السادس — في إجراءات بيع المنقولأت المحجوزة"],"g":"","t":"ينشر إعلان البيع بكل وسائل النشر التي تتناسب وأهمية الأموال المحجوزة، لاسيما في:\n1- لوحة الإعلانات بالمحكمة التي وقع في دائرة اختصاصها الحجز،\n2- لوحة الإعلانات بكل من البلدية ومركز البريد وقباضة الضرائب التي توجد في دائرة اختصاصها الأموال المحجوزة،\n3- في جريدة يومية وطنية إذا كانت قيمة الأموال المحجوزة تتجاوز مائتي ألف دينار ) 200.000 دج(.\nكما يجوز أن يعلق الإعلان في الساحات والأماكن العمومية.\nيثبت تعليق الإعلان حسب الحالة، بتأشيرة رئيس أمناء الضبط ورئيس المجلس الشعبي البلدي أو أحد أعوانه وأحد الأعوان من الإدارات الأخرى، ويثبت النشر بنسخة من الجريدة."},{"n":"708","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم السادس — في إجراءات بيع المنقولأت المحجوزة"],"g":"","t":"لا يجري البيع بالمزاد العلني، إلا بعد إعادة جرد الأموال المحجوزة وتحرير محضر بذلك، يبين فيه المحضر القضائي أو محافظ البيع ما يكون قد نقص منها.\nولا يجري البيع إلا إذا حضر عدد من المزايدين يزيد عن ثلاثة ) (3 أشخاص، وإلا أجل البيع إلى تاريخ لاحق."},{"n":"709","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم السادس — في إجراءات بيع المنقولأت المحجوزة"],"g":"","t":"لا يجوز بيع المصوغات أو السبائك من الذهب أو الفضة أوالحلي أوالأحجار الكر يمة أو المعادن النفيسة الأخرى، بثمن أقل من قيمتها الحقيقية حسب تقدير الخبرة.\nإذا لم يتقدم أحد لشرائها بالقيمة المقدرة لها ولم يقبل الدائن استيفاء دينه منها عينا بهذه القيمة، أجل البيع إلى تاريخ آخر مع إعادة نشر الإعلان عن البيع والتعليق بشكل أوسع، وفي هذه الحالة تباع لمن يقدم أعلى عرض ولو بثمن أقل مما قدرت به."},{"n":"710","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم السادس — في إجراءات بيع المنقولأت المحجوزة"],"g":"","t":"إذا لم يسع الحاجز الأول لمباشرة إجراءات البيع، جاز لمن يهمه التعجيل من الحاجزين الآخرين، أن يطلب إجراء البيع بعد القيام بالنشر والإعلان المنصوص عليهما في المادة 707 أعلاه، وفي هذه الحالة يتم إخطار المحجوز عليه وبقية الحاجزين بتاريخ وساعة ومكان البيع."},{"n":"711","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم السادس — في إجراءات بيع المنقولأت المحجوزة"],"g":"","t":"إذا كان الطلب الثاني للحجز يتجاوز في مقداره الحجز الأول، يجري توحيد الحجزين، إلا إذا كانت الأموال المحجوزة في الحجز الأول قد بيعت، وفي هذه الحالة يعتبر الحجز الثاني بمثابة اعتراض على المتحصل من البيع، ويترتب عليه إجراء التوزيع بين الدائنين كل بنسبة دينه."},{"n":"712","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم السادس — في إجراءات بيع المنقولأت المحجوزة"],"g":"","t":"إذا لم يحصل البيع في التاريخ المعين في الإعلان لضعف العروض أو قلة المزايدين، يؤجل البيع لدة خمسة عشر ) (15 يوما، مع إعادة التعليق والنشر وفقا للمادة 707 أعلاه، وإخطار المحجوز عليه بتاريخ البيع.وفي هذا التاريخ تباع الأموال لمن يقدم أعلى عرض وبأي ثمن دون التقيد بعدد المزايدين المنصوص عليه في المادة 708 أعلاه."},{"n":"713","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم السادس — في إجراءات بيع المنقولأت المحجوزة"],"g":"","t":"يرسو المزاد على الشيء المباع لمن تقدم بأعلى عرض ولا يسلم له الشيء المباع إلا بعد دفع ثمنه.\nإذا نتج عن بيع جزء من الأموال المحجوزة مبلغ كاف للوفاء بالديون المحجوز من أجلها والمصاريف، يتوقف المحضر القضائي أو محافظ البيع عن المضي في بيع باقي المحجوزات، ويرفع الحجز عنها بقوة القانون.\nإذا لم يدفع الراسي عليه المزاد ثمن الشيء المباع فورا أو في الأجل المحدد في شروط البيع، وجب إعادة البيع بالمزاد على نفقته بأي ثمن، ويلزم بفرق الثمن بين الذي عرضه وثمن إعادة البيع، وليس له الحق في طلب الزيادة في الثمن إذا بيع بثمن أعلى."},{"n":"714","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم السابع — في محضر رسو المزاد وآثاره"],"g":"","t":"يعتبر محضر البيع برسو المزاد، سندا تنفيذيا بفرق الثمن تجاه الراسي عليه المزاد المتخلف عن دفع ثمن الشيء المباع.\nيكون المحضر القضائي أو محافظ البيع ملزما بالثمن، إذا لم يستوفه من الراسي عليه المزاد فورا أو في الأجل المحدد في شروط البيع، ولم يبادر إلى إعادة البيع خلال أجل أقصاه خمسة عشر ) (15 يوما من تاريخ البيع.\nويعتبر محضر البيع برسو المزاد سندا تنفيذيا تجاه من أشرف منهما على البيع."},{"n":"715","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم السابع — في محضر رسو المزاد وآثاره"],"g":"","t":"يثبت رسو المزاد بمحضر البيع بالمزاد العلني لمن تقدم بأعلى عرض بعد المناداة ثلاث ) (3 مرات متتالية، يفصل بين كل منها مدة دقيقة على الأقل.\nيتضمن محضر رسو المزاد، فضلا عن البيانات المعتادة، ما يأتي:\n1- السند التنفيذي الذي بموجبه تم الحجز والإجراءات التي تلته، لاسيما تاريخ التبليغ الرسمي والتكليف بالوفاء وتاريخ إعلان البيع،\n2- أسماء وألقاب الأطراف،\n3- إجراءات البيع بالمزاد العلني،\n4- مبلغ الدين،\n5- الأموال المباعة بالتفصيل مع تحديد نوعها،\n6- حضور المحجوز عليه أو غيابه،\n7- الثمن الراسي به المزاد وتاريخ الدفع والهوية الكاملة لمن رسى عليه المزاد شخصا طبيعيا أو معنويا.\nيختتم محضر رسو المزاد بالتوقيع عليه مع الراسي عليه المزاد، وتودع النسخة الأصلية بأمانة ضبط المحكمة."},{"n":"716","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم الثامن — في طلب استرداد الأموال المحجوزة"],"g":"","t":"إذا ادعى الغير ملكية منقولات محجوزة، وقام برفع دعوى استردادها، يوقف البيع وجوبا من المحضر القضائي أو محافظ البيع."},{"n":"717","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم الثامن — في طلب استرداد الأموال المحجوزة"],"g":"","t":"ترفع دعوى الاسترداد المشار إليها في المادة 716 أعلاه، أمام قاضي الاستعجال ضد الدائن الحاجز والمحجوز عليه والحاجزين المتدخلين إن وجدوا، بحضور المحضر القضائي أو محافظ البيع، وتشتمل العريضة على بيان واف لسندات الملكية وترفق بالوثائق المؤيدة لها.\nيفصل قاضي الاستعجال في أجل خمسة عشر ) (15 يوما، باسترداد المنقولات المحجوزة ورفع الحجز أو رفض طلب الاسترداد ومواصلة التنفيذ."},{"n":"718","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم الثامن — في طلب استرداد الأموال المحجوزة"],"g":"","t":"إذا خسر طالب الاسترداد دعواه، جاز للدائن الحاجز أن يرجع عليه أمام قاضي الموضوع بطلب التعويضات المدنية عما لحقه من ضرر."},{"n":"719","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم التاسع — في حجز وبيع السندات التجارية والقيم المنقولة"],"g":"","t":"تحجز السندات التجارية الموجودة لدى المدين إذا كانت لحاملها أو قابلة للتظهير وفقا للأحكام المقررة للحجزالتنفيذي على المنقول تحت يد المدين.\nوتحجز القيم المنقولة وإيرادات الأسهم الاسمية وحصص الأرباح المستحقة الموجودة في ذمة الأشخاص المعنوية طبقا للأحكام المقررة لحجز ما للمدين لدى الغير، ويترتب على ذلك، الحجز على ثمارها وفوائدها إلى تاريخ البيع."},{"n":"720","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الرابع — في الحجز التنفيذي على المنقول","القسم التاسع — في حجز وبيع السندات التجارية والقيم المنقولة"],"g":"","t":"تباع القيم المنقولة والأسهم بواسطة أحد البنوك أو أية مؤسسة مؤهلة قانونا، تعين من طرف رئيس المحكمة بأمر على عريضة، بناء على طلب الدائن الحاجز، يبين في الأمر ما يلزم اتخاذه من إجراءات النشر والتعليق."},{"n":"721","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم الأول — في استصدار أمر الحجز وقيده"],"g":"","t":"يجوز للدائن الحجز على العقارات و /أو الحقوق العينية العقارية لمدينه، مفرزة كانت أو مشاعة، إذا كان بيده سند تنفيذي وأثبت عدم كفاية الأموال المنقولة لم دينه أو عدم وجودها.\nغير أن الدائن المرتهن أو صاحب حق الامتياز الخاص على عقار أو صاحب حق التخصيص على عقار، الذي بيده سندا تنفيذيا، يجوز له الحجز على العقارات و /أو على الحقوق العينية العقارية لمدينه مباشرة حتى لو انتقلت ملكيتها إلى الغير."},{"n":"722","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم الأول — في استصدار أمر الحجز وقيده"],"g":"","t":"يقدم طلب الحجز على العقار و /أو الحقوق العينية العقارية، إلى رئيس المحكمة التي يوجد في دائرة اختصاصها العقار، من طرف الدائن أو من ممثله القانوني أو الاتفاقي.ويتضمن الطلب على الخصوص:\n1- اسم ولقب الدائن وموطنه الحقيقي وموطنه المختار في دائرة اختصاص المحكمة التي يوجد فيها العقار و /أو الحق العيني العقاري،\n2- اسم ولقب المدين وموطنه،\n3- وصف العقار و /أو الحق العيني العقاري المطلوب حجزه، مع بيان موقعه، وأية بيانات أخرى تفيد في تعيينه، طبقا لما هو ثابت في مستخرج سند الملكية، يجوز للدائن أن يستصدر أمرا على عريضة، يسمح للمحضر القضائي بدخول العقار، للحصول على البيانات اللازمة لوصف العقار ومشتملاته، وهذا الأمر غير قابل لأي طعن."},{"n":"723","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم الأول — في استصدار أمر الحجز وقيده"],"g":"","t":"يرفق طلب الحجز المشار إليه في المادة 722 أعلاه، بالوثائق الآتية:\n1- نسخة من السند التنفيذي المتضمن مبلغ الدين، ونسخة من محضر التبليغ الرسمي والتكليف بالوفاء،\n2- محضر عدم كفاية الأموال المنقولة أو عدم وجودها بالنسبة للدائن العادي،\n3- مستخرج عقد الرهن أو أمر التخصيص على عقار أو مستخرج من قيد حق الامتياز، بالنسبة لأصحاب التأمينات العينية،\n4- مستخرج من سند ملكية المدين للعقار،\n5- شهادة عقارية.\nإذا لم يرفق الطلب بإحدى هذه الوثائق، رفض طلب الحجز، و يمكن تجديده عند استكمال الوثائق المطلوبة."},{"n":"724","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم الأول — في استصدار أمر الحجز وقيده"],"g":"","t":"يتم الحجز على العقار و /أو الحق العيني العقاري، بموجب أمر على عريضة، يصدره رئيس المحكمة التي يوجد في دائرة اختصاصها هذا العقار و / أو الحق العيني العقاري، في أجل أقصاه ثمانية ) (8 أيام من تاريخ إيداع الطلب.\nإذا كان للمدين عدة عقارات و /أو حقوق عينية عقارية تقع في دوائر اختصاص مختلفة، يجوز للدائن استصدار أمر واحد بالحجز عليها من طرف رئيس المحكمة التي يقع في دائرة اختصاصها إحدى هذه العقارات و /أو الحقوق العينية العقارية.\nيجب أن يتضمن أمر الحجز، فضلا عن البيانات المعتادة، ما يأتي:\n1- نوع السند التنفيذي الذي بموجبه تم الحجز وتاريخه والجهة التي أصدرته ومبلغ الدين المطلوب الوفاء به،\n2- تاريخ التبليغ الرسمي للسند التنفيذي، وتاريخ تكليف المدين بالوفاء بقيمة الدين،\n3- تعيين العقار و /أو الحق العيني العقاري المحجوز، تعيينا دقيقا، لا سيما موقعه وحدوده ونوعه ومشتملاته ومساحته ورقم القطعة الأرضية واسمها عند الاقتضاء، مفرزا أو مشاعا، وغيرها من البيانات التي تفيد في تعيينه، وإذا كان العقار بناية، يبين الشارع ورقمه وأجزاء العقارات.\nوإذا خلا الأمر من أحد البيانات الثلاثة أعلاه، كان قابلا للإبطال."},{"n":"725","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم الثاني — في التبليغ الرسمي لأمر الحجز العقاري"],"g":"","t":"يقوم المحضر القضائي بالتبليغ الرسمي لأمر الحجز إلى المدين، وإذا كان العقار و /أو الحق العيني العقاري مثقلا بتأمين عيني للغير، وجب القيام بالتبليغ الرسمي لأمر الحجز إلى هذا الأخير مع إخطار إدارة الضرائب بالحجز.\nينذر المدين بأنه إذا لم يدفع مبلغ الدين في أجل شهر واحد ) (1 من تاريخ التبليغ الرسمي، يباع العقار و /أو الحق العيني العقاري جبرا عليه.\nيودع أمر الحجز على الفور، أو في اليوم الموالي للتبليغ الرسمي كأقصى أجل في مصلحة الشهر العقاري التابع لها العقار، لقيد أمر الحجز، ويعد العقار و /أو الحق العيني العقاري محجوزا من تاريخ القيد."},{"n":"726","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم الثاني — في التبليغ الرسمي لأمر الحجز العقاري"],"g":"","t":"إذا كان الدائن الحاجز، دائنا ممتازا، له تأمين عيني على العقارات المراد حجزها، يقوم بالتبليغ الرسمي لأمر الحجز إلى حائز العقار المرهون، وإلى الكفيل العيني إن وجد.\nلحائز العقار المرهون أو الكفيل العيني الخيار بين الوفاء بالدين أو التخلية أو قبول إجراءات الحجز والبيع."},{"n":"727","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم الثالث — في حالة تعدد الدائنين"],"g":"","t":"إذا تقدم دائن آخر بيده سند تنفيذي حائزا لقوة الشيء المقضي به، بعد قيد أمر الحجز، وجب على المحضر القضائي تسجيله مع الدائنين الحاجزين واستصدار أمر على عريضة يتضمن قيده بالمحافظة العقارية مع بقية الدائنين ويصبح منذ تاريخ التأشير به، طرفا في إجراءات التنفيذ.\nولا يجوز شطب التسجيلات والتأشيرات إلا بصدور أمر مخالف."},{"n":"728","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم الرابع — في قيد أمر الحجز بالمحافظة العقارية وآثاره"],"g":"","t":"يجب على المحافظ العقاري، قيد أمر الحجز من تاريخ الإيداع وتسليم شهادة عقارية إلى المحضر القضائي، أو إلى الدائن الحاجز، خلال أجل أقصاه ثمانية ) (8 أيام، وإلا تعرض للعقوبات التأديبية المنصوص عليها في التشريع الساري المفعول.\nتتضمن الشهادة العقارية جميع القيود والحقوق المثقلة للعقار أو الحق العيني العقاري وكذا أسماء الدائنين وموطن كل منهم."},{"n":"729","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم الرابع — في قيد أمر الحجز بالمحافظة العقارية وآثاره"],"g":"","t":"عند قيام المحافظ العقاري بقيد أمر الحجز، يجب ذكر تاريخ وساعة الإيداع، وينوه بهامشه وبترتيب ورود كل أمر حجز سبق قيده، مع ذكر اسم ولقب وموطن كل الدائنين والجهة القضائية التي أصدرت أمر الحجز."},{"n":"730","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم الرابع — في قيد أمر الحجز بالمحافظة العقارية وآثاره"],"g":"","t":"إذا لم يكن العقار المحجوز مؤجرا وقت قيد أمر الحجز، استمر المدين المحجوز عليه حائزا له بصفته حارسا إلى أن يتم البيع، ما لم يؤمر بخلاف ذلك.\nللمدين المحجوز عليه الساكن في العقار أن يبقى ساكنا فيه بدون أجرة إلى أن يتم البيع.\nإذا كان العقار مؤجرا وقت قيد أمر الحجز، اعتبرت الأجرة المستحقة محجوزة تحت يد المستأجر بمجرد تبليغه الرسمي بأمر الحجز، و يمنع عليه الوفاء بها لمالك العقار.\nإذا سبق للمستأجر أن دفع الأجرة للمدين المحجوز عليه قبل تبليغه الرسمي صح وفاؤه، ويسأل عنها المدين بصفته حائزا لها."},{"n":"731","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الخامس — في الحجوز","الفصل الخامس — في الحجز التنفيذي على العقارات والحقوق العينية العقارية المشهرة","القسم الرابع — في قيد أمر الحجز بالمحافظة العقارية وآثاره"],"g":"","t":"تبقى عقود الإيجار التي أبرمها المدين المحجوز عليه، ولها تاريخ ثابت قبل قيد أمر الحجز، نافذة في حق الحاجزين والدائنين الذين لهم حقوق مقيدة، إلا إذا أثبت الدائن أو الراسي عليه المزاد ولو بعد البيع، وقوع غش من المدين المحجوز عليه أو المستأجر في هذا الإيجار، ففي هذه الحالة يمكن فسخ الإيجا
