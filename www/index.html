موجب محضر يعده المحضر القضائي.\nيمكن أن يتعلق التبليغ الرسمي بعقد قضائي أو عقد غير قضائي أو أمر أو حكم أو قرار.\nيجوز التبليغ الرسمي للعقود القضائية وغير القضائية والسندات التنفيذية، بتسليم نسخة منها إلى المطلوب تبليغه أينما وجد، ما لم ينص القانون على خلاف ذلك.\nيقوم المحضر القضائي بالتبليغ الرسمي بناء على طلب الشخص المعني أو ممثله القانوني أو الاتفاقي، ويحرر بشأنه محضرا في عدد من النسخ مساو لعدد الأشخاص الذين يتم تبليغهم رسميا.\nلا يعد التبليغ الرسمي ولو بدون تحفظ قبولا بالحكم.\nيكون التبليغ الرسمي صحيحا إلى الشخص الذي يقيم في الخارج إذا تم في الموطن الذي اختاره في الجزائر."},{"n":"407","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الحادي عشر — في الآجال وعقود التبليغ الرسمي","الفصل الثاني — في عقود التبليغ الرسمي"],"g":"","t":"يجب أن يتضمن محضر التبليغ الرسمي في أصله ونسخه، البيانات الآتية:\nاسم ولقب المحضر القضائي وعنوانه المهني وتوقيعه وختمه.\nتاريخ التبليغ بالحروف وساعته.\nاسم ولقب طالب التبليغ وموطنه.\nإذا كان طالب التبليغ شخصا معنويا، تذكر تسميته وطبيعته ومقره الاجتماعي وصفة ممثله القانوني أو الاتفاقي.\nإسم ولقب وموطن الشخص الذي تلقى التبليغ.وإذا تعلق الأمر بشخص معنوي يشار إلى طبيعته وتسميته ومقره الاجتماعي واسم ولقب وصفة الشخص الذي تلقى التبليغ الرسمي.\nتوقيع الشخص الذي تلقى التبليغ وبيان طبيعة الوثيقة التي تثبت هويته ورقمها وتاريخ إصدارها، وإذا تعذر على المبلغ له التوقيع على المحضر، يجب عليه وضع بصمته.\nالإشارة إلى تسليم الوثيقة موضوع التبليغ الرسمي إلى المبلغ له.\nوإذا لم يتضمن محضر التبليغ الرسمي البيانات المشار إليها أعلاه، يجوز للمطلوب تبليغه الدفع ببطلانه قبل إثارته لأي دفع أو دفاع."},{"n":"408","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الحادي عشر — في الآجال وعقود التبليغ الرسمي","الفصل الثاني — في عقود التبليغ الرسمي"],"g":"","t":"يجب أن يتم التبليغ الرسمي شخصيا.\nويعتبر التبليغ الرسمي إلى الشخص المعنوي شخصيا، إذا سلم محضر التبليغ إلى ممثله القانوني أو الاتفاقي أو لأي شخص تم تعيينه لهذا الغرض.\nيتم التبليغ الرسمي، الموجه إلى الإدارات والجماعات الإقليمية والمؤسسات العمومية ذات الصبغة الإدارية، إلى الممثل المعين لهذا الغرض وبمقرها.\nيتم التبليغ الرسمي، الموجه إلى شخص معنوي في حالة تصفية، إلى المصفي."},{"n":"409","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الحادي عشر — في الآجال وعقود التبليغ الرسمي","الفصل الثاني — في عقود التبليغ الرسمي"],"g":"","t":"إذا عين أحد الخصوم وكيلا، فإن التبليغات الرسمية للوكيل تعد صحيحة."},{"n":"410","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الحادي عشر — في الآجال وعقود التبليغ الرسمي","الفصل الثاني — في عقود التبليغ الرسمي"],"g":"","t":"عند استحالة التبليغ الرسمي شخصيا للمطلوب تبليغه، فإن التبليغ يعد صحيحا إذا تم في موطنه الأصلي إلى أحد أفراد عائلته المقيمين معه أو في موطنه المختار.\nيجب أن يكون الشخص الذي تلقى التبليغ متمتعا بالأهلية، وإلا كان التبليغ قابلا للإبطال."},{"n":"411","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الحادي عشر — في الآجال وعقود التبليغ الرسمي","الفصل الثاني — في عقود التبليغ الرسمي"],"g":"","t":"إذا رفض الشخص المطلوب تبليغه رسميا، استلام محضر التبليغ الرسمي أو رفض التوقيع عليه أو رفض وضع بصمته، يدون ذلك في المحضر الذي يحرره المحضر القضائي، وترسل له نسخة من التبليغ الرسمي برسالة مضمنة مع الإشعار بالاستلام.\nويعتبر التبليغ الرسمي في هذه الحالة بمثابة التبليغ الشخصي، ويحسب الأجل من تاريخ ختم البريد."},{"n":"412","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الحادي عشر — في الآجال وعقود التبليغ الرسمي","الفصل الثاني — في عقود التبليغ الرسمي"],"g":"","t":"إذا كان الشخص المطلوب تبليغه رسميا، لا يملك موطنا معروفا، يحرر المحضر القضائي محضرا يضمنه الإجراءات التي قام بها، ويتم التبليغ الرسمي بتعليق نسخة منه بلوحة الإعلانات بمقر المحكمة ومقر البلدية التي كان له بها آخر موطن.\nإذا رفض الأشخاص، الذين لهم صفة تلقي التبليغ الرسمي، استلام محضر التبليغ، تطبق أحكام الفقرة الأولى أعلاه، وعلاوة على ذلك، يرسل التبليغ الرسمي برسالة مضمنة مع الإشعار بالاستلام إلى آخر موطن له.\nيثبت الإرسال المضمون، والتعليق، بختم إدارة البريد أو تأشيرة رئيس المجلس الشعبي البلدي أو موظف مؤهل لذلك، أو تأشيرة رئيس أمناء الضبط، حسب الحالة.\nوإذا كانت قيمة الالتزام تتجاوز خمسمائة ألف دينار (500.000 د ج )، يجب أن ينشر مضمون عقد التبليغ الرسمي في جريدة يومية وطنية، بإذن من رئيس المحكمة التي يقع فيها مكان التبليغ وعلى نفقة طالبه.\nوفي جميع الأحوال، يسري أجل التبليغ الرسمي من تاريخ آخر إجراء حصل وفق هذه الطرق.\nيعتبر التبليغ الرسمي بهذه الطرق بمثابة التبليغ الشخصي."},{"n":"413","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الحادي عشر — في الآجال وعقود التبليغ الرسمي","الفصل الثاني — في عقود التبليغ الرسمي"],"g":"","t":"إذا كان الشخص المطلوب تبليغه رسميا محبوسا يكون هذا التبليغ صحيحا إذا تم بمكان حبسه."},{"n":"414","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الحادي عشر — في الآجال وعقود التبليغ الرسمي","الفصل الثاني — في عقود التبليغ الرسمي"],"g":"","t":"يتم تبليغ الشخص الذي له موطن في الخارج، وفقا للإجراءات المنصوص عليها في الاتفاقيات القضائية."},{"n":"415","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الحادي عشر — في الآجال وعقود التبليغ الرسمي","الفصل الثاني — في عقود التبليغ الرسمي"],"g":"","t":"في حالة عدم وجود اتفاقية قضائية، يتم إرسال التبليغ بالطرق الدبلوماسية."},{"n":"416","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الحادي عشر — في الآجال وعقود التبليغ الرسمي","الفصل الثاني — في عقود التبليغ الرسمي"],"g":"","t":"لا يجوز القيام بأي تبليغ رسمي قبل الساعة الثامنة صباحا ولا بعد الثامنة مساء ولا أيام العطل، إلا في حالة الضرورة وبعد إذن من القاضي."},{"n":"417","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثاني عشر — في المصاريف القضائية"],"g":"","t":"يحدد التشريع المصاريف القضائية ومصاريف سير الخصومة.\nيعفى المستفيد من المساعدة القضائية من دفع المصاريف القضائية."},{"n":"418","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثاني عشر — في المصاريف القضائية"],"g":"","t":"تشمل المصاريف القضائية، الرسوم المستحقة للدولة، ومصاريف سير الدعوى، لاسيما مصاريف إجراءات التبليغ الرسمي والترجمة والخبرة وإجراءات التحقيق، ومصاريف التنفيذ، كما يحددها التشريع.\nوتشمل المصاريف القضائية أيضا أتعاب المحامي وفقا لما يحدده التشريع."},{"n":"419","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثاني عشر — في المصاريف القضائية"],"g":"","t":"يتحمل الخصم الذي خسر الدعوى المصاريف المترتبة عليها، ما لم يقرر القاضي تحميلها كليا أو جزئيا لخصم آخر مع تسبيب ذلك.\nوفي حالة تعدد الخصوم الخاسرين الدعوى، يجوز للقاضي الأمر بتحميل المصاريف لكل واحد منهم حسب النسب التي يحددها."},{"n":"420","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثاني عشر — في المصاريف القضائية"],"g":"","t":"يتحمل الخصوم المدينون بالتضامن المصاريف، عندما يحكم عليهم بسبب التزام تضامني."},{"n":"421","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثاني عشر — في المصاريف القضائية"],"g":"","t":"يتضمن القرار أو الحكم أو الأمر الفاصل في النزاع، تصفية مقدار المصاريف، إلا إذا تعذر تصفيتها قبل صدوره.\nفي الحالة الأخيرة تتم تصفية المصاريف بموجب أمر يصدره القاضي ويرفق بمستندات الدعوى."},{"n":"422","p":["الكتاب الأول الأحكام المشتركة لجميع الجهات القضائية","الباب الثاني عشر — في المصاريف القضائية"],"g":"","t":"يجوز للخصوم الاعتراض على تصفية المصاريف أمام رئيس الجهة القضائية التي أصدرت الحكم في أجل عشرة ) (10 أيام، من تاريخ التبليغ الرسمي إذا كان صادرا في آخر درجة.\nالأمر الفاصل في الاعتراض غير قابل لأي طعن."},{"n":"423","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الأول — في صلاحيات قسم شؤون الأسرة"],"g":"","t":"ينظر قسم شؤون الأسرة، على الخصوص في الدعاوى الآتية:\nالدعاوى المتعلقة بالخطبة والزواج والرجوع إلى بيت الزوجية وانحلال الرابطة الزوجية وتوابعها حسب الحالات والشروط المذكورة في قانون الأسرة، دعاوى النفقة والحضانة وحق الزيارة، دعاوى إثبات الزواج والنسب، الدعاوى المتعلقة بالكفالة، الدعاوى المتعلقة بالولاية وسقوطها والحجر والغياب والفقدان والتقديم."},{"n":"424","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الأول — في صلاحيات قسم شؤون الأسرة"],"g":"","t":"يتكفل قاضي شؤون الأسرة على الخصوص بالسهر على حماية مصالح القصر."},{"n":"425","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الأول — في صلاحيات قسم شؤون الأسرة"],"g":"","t":"يمارس رئيس قسم شؤون الأسرة الصلاحيات المخولة لقاضي الاستعجال، ويجوز له بالإضافة للصلاحيات المخولة له في هذا القانون، أن يأمر في إطار التحقيق بتعيين مساعدة اجتماعية أو طبيب خبير أو اللجوء إلى أية مصلحة مختصة في الموضوع بغرض الاستشارة.\nينتهي التحقيق بتحرير تقرير يتضمن المعاينات التي قام بها المحقق والحلول المقترحة.\nيطلع القاضي الأطراف على التقرير ويحدد لهم أجلا لتقديم طلب إجراء تحقيق مضاد.\nيمكن اللجوء إلى الاستشارة في أي وقت وحتى أثناء إجراءات الصلح."},{"n":"426","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الثاني — في الاختصاص الإقليمي"],"g":"","t":"تكون المحكمة مختصة إقليميا:\nفي موضوع العدول عن الخطبة بمكان وجود موطن المدعى عليه، في موضوع إثبات الزواج بمكان وجود موطن المدعى عليه، في موضوع الطلاق أو الرجوع بمكان وجود المسكن الزوجي، وفي الطلاق بالتراضي بمكان إقامة أحد الزوجين حسب اختيارهما.\nفي موضوع الحضانة وحق الزيارة والرخص الإدارية المسلمة للقاصر المحضون بمكان ممارسة الحضانة، في موضوع النفقة الغذائية بموطن الدائن بها، في موضوع متاع بيت الزوجية بمكان وجود المسكن الزوجي، في موضوع الترخيص بالزواج بمكان طالب الترخيص، في موضوع المنازعة حول الصداق بمكان موطن المدعى عليه، في موضوع الولاية بمكان ممارسة الولاية."},{"n":"427","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الثالث — في إجراءات الطلاق","الفرع الأول — في الطلاق بالتراضي"],"g":"","t":"الطلاق بالتراضي هو إجراء يرمي إلى حل الرابطة الزوجية بإرادة الزوجين المشتركة."},{"n":"428","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الثالث — في إجراءات الطلاق","الفرع الأول — في الطلاق بالتراضي"],"g":"","t":"في حالة الطلاق بالتراضي يقدم طلب مشترك في شكل عريضة وحيدة موقعة من الزوجين تودع بأمانة الضبط."},{"n":"429","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الثالث — في إجراءات الطلاق","الفرع الأول — في الطلاق بالتراضي"],"g":"","t":"يجب أن تتضمن العريضة الوحيدة ما يأتي:\nبيان الجهة القضائية المرفوع أمامها الطلب، اسم ولقب وجنسية كلا الزوج ين وموطن وتاريخ ومكان ميلادهما، تاريخ ومكان زواجهما، وعند الاقتضاء، عدد الأولاد القصر، عرض موجز يتضمن جميع شروط الاتفاق الحاصل بينهما حول توابع الطلاق.\nيجب أن يرفق مع العريضة، شهادة عائلية ومستخرج من عقد زواج المعنيين."},{"n":"430","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الثالث — في إجراءات الطلاق","الفرع الأول — في الطلاق بالتراضي"],"g":"","t":"يخطر أمين الضبط الطرفين في الحال، بتاريخ حضورهما أمام القاضي، ويسلم لهما استدعاء لهذا الغرض."},{"n":"431","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الثالث — في إجراءات الطلاق","الفرع الأول — في الطلاق بالتراضي"],"g":"","t":"يتأكد القاضي في التاريخ المحدد للحضور، من قبول العريضة، ويستمع إلى الزوجين على انفراد ثم مجتمعين ويتأكد من رضائهما، ويحاول الصلح بينهما إذا كان ذلك ممكنا.\nينظر مع الزوجين أو وكلائهما في الاتفاق، وله أن يلغي أو يعدل في شروطه، إذا كانت تتعارض مع مصلحة الأولاد أو خالفت النظام العام.\nيثبت القاضي إرادة الزوج، ين بإصدار حكم يتضمن المصادقة على الاتفاق النهائي ويصرح بالطلاق."},{"n":"432","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الثالث — في إجراءات الطلاق","الفرع الأول — في الطلاق بالتراضي"],"g":"","t":"لا يجوز تقديم طلب الطلاق بالتراضي، إذا كان أحد الزوجين تحت وضع التقديم أو إذا ظهر عليه اختلال في قدراته الذهنية تمنعه من التعبير عن إرادته.\nيجب إثبات اختلال القدرات الذهنية من قبل طبيب مختص."},{"n":"433","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الثالث — في إجراءات الطلاق","الفرع الأول — في الطلاق بالتراضي"],"g":"","t":"أحكام الطلاق بالتراضي غير قابلة للاستئناف."},{"n":"434","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الثالث — في إجراءات الطلاق","الفرع الأول — في الطلاق بالتراضي"],"g":"","t":"يسري أجل الطعن بالنقض من تاريخ النطق بالحكم."},{"n":"435","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الثالث — في إجراءات الطلاق","الفرع الأول — في الطلاق بالتراضي"],"g":"","t":"لا يوقف الطعن بالنقض تنفيذ الحكم."},{"n":"436","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الثالث — في إجراءات الطلاق","الفرع الثاني — في طلب الطلاق من أحد الزوجين"],"g":"","t":"ترفع دعوى الطلاق من أحد الزوجين أمام قسم شؤون الأسرة، بتقديم عريضة وفقا للأشكال المقررة لرفع الدعوى."},{"n":"437","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الثالث — في إجراءات الطلاق","الفرع الثاني — في طلب الطلاق من أحد الزوجين"],"g":"","t":"عندما يكون الزوج ناقص الأهلية، يقدم الطلب باسمه، من قبل وليه أو مقدمه، حسب الحالة."},{"n":"438","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الثالث — في إجراءات الطلاق","الفرع الثاني — في طلب الطلاق من أحد الزوجين"],"g":"","t":"يجب على المدعي في دعوى الطلاق، أن يبلغ رسميا المدعى عليه والنيابة العامة بنسخة من العريضة المشار إليها في المادة 436 أعلاه.\nويجوز له أيضا تبليغ النيابة العامة عن طريق أمانة الضبط."},{"n":"439","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الثالث — في إجراءات الطلاق","الفرع الثالث — في الصلح"],"g":"","t":"محاولات الصلح وجوبية، وتتم في جلسة سرية."},{"n":"440","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الثالث — في إجراءات الطلاق","الفرع الثالث — في الصلح"],"g":"","t":"في التاريخ المحدد لإجراء محاولة الصلح، يستمع القاضي إلى كل زوج على انفراد ثم معا.\nو يمكن بناء على طلب الزوج ين حضور أحد أفراد العائلة والمشاركة في محاولة الصلح.\nالمحدد أو حدث"},{"n":"441","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الثالث — في إجراءات الطلاق","الفرع الثالث — في الصلح"],"g":"","t":"إذا استحال على أحد الزوجين الحضور في التاريخ له مانع، جاز للقاضي إما تحديد تاريخ لاحق للجلسة، أو ندب قاض آخر لسماعه بموجب إنابة قضائية.\nغير أنه إذا تخلف أحد الزوج ين عن حضور الجلسة المحددة للصلح بدون عذر رغم تبليغه شخصيا، يحرر القاضي محضرا بذلك."},{"n":"442","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الثالث — في إجراءات الطلاق","الفرع الثالث — في الصلح"],"g":"","t":"يمكن للقاضي منح الزوجين مهلة تفكير لإجراء محاولة صلح جديدة، كما يجوز له اتخاذ ما يراه لازما من التدابير المؤقتة بموجب أمر غير قابل لأي طعن.\nفي جميع الحالات، يجب ألا تتجاوز محاولات الصلح ثلاثة ) (3 أشهر من تاريخ رفع دعوى الطلاق."},{"n":"443","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الثالث — في إجراءات الطلاق","الفرع الثالث — في الصلح"],"g":"","t":"يثبت الصلح بين الزوجين بموجب محضر، يحرر في الحال من أمين الضبط تحت إشراف القاضي.\nيوقع المحضر من طرف القاضي وأمين الضبط والزوجين ويودع بأمانة الضبط.\nيعد محضر الصلح سندا تنفيذيا.\nفي حالة عدم الصلح أو تخلف أحد الزوج ين بالرغم من مهلة التفكير الممنوحة له، يشرع في مناقشة موضوع الدعوى."},{"n":"444","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الثالث — في إجراءات الطلاق","الفرع الثالث — في الصلح"],"g":"","t":"يمكن للقاضي أن يأخذ بعين الاعتبار ما اتفق عليه الزوجان عند الأمر بالتدابير المؤقتة."},{"n":"445","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الثالث — في إجراءات الطلاق","الفرع الثالث — في الصلح"],"g":"","t":"يجوز للقاضي في حالة ظهور واقعة جديدة، وحسب الظروف، أن يلغي أو يعدل أو يتمم التدابير المؤقتة التي أمر بها، ما لم يتم الفصل في الموضوع.\nهذا الأمر غير قابل لأي طعن."},{"n":"446","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الثالث — في إجراءات الطلاق","الفرع الثالث — في الصلح"],"g":"","t":"إذا لم يثبت أي ضرر أثناء الخصومة، جاز للقاضي أن يعين حكمين اثنين لمحاولة الصلح بينهما حسب مقتضيات قانون الأسرة."},{"n":"447","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الثالث — في إجراءات الطلاق","الفرع الثالث — في الصلح"],"g":"","t":"يطلع الحكمان القاضي بما يعترضهما من إشكالات أثناء تنفيذ المهمة."},{"n":"448","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الثالث — في إجراءات الطلاق","الفرع الثالث — في الصلح"],"g":"","t":"إذا تم الصلح من طرف الحكمين يثبت ذلك في محضر، يصادق عليه القاضي بموجب أمر غير قابل لأي طعن."},{"n":"449","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الثالث — في إجراءات الطلاق","الفرع الثالث — في الصلح"],"g":"","t":"يجوز للقاضي إنهاء مهام الحكمين تلقائيا، إذا تبينت له صعوبة تنفيذ المهمة، وفي هذه الحالة، يعيد القضية إلى الجلسة وتستمر الخصومة."},{"n":"450","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الثالث — في إجراءات الطلاق","الفرع الرابع — في أحكام الطلاق"],"g":"","t":"يتأكد القاضي من إرادة الزوج في طلب الطلاق، ويأمر باتخاذ كل التدابير التي يراها لازمة في ذلك."},{"n":"451","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الثالث — في إجراءات الطلاق","الفرع الرابع — في أحكام الطلاق"],"g":"","t":"يعاين القاضي ويكيف الوقائع المعتمد عليها في تأسيس الأسباب المدعمة لطلب التطليق طبقا لأحكام قانون الأسرة.\nويفصل في مدى تأسيس الطلب، آخذا بعين الاعتبار الظروف التي قدم فيها.\nيمكن للقاضي أن يتخذ كل التدابير التي يراها ملائمة، لاسيما الأمر بالتحقيق أو بخبرة طبية أو الانتقال للمعاينة.\nيتعين على القاضي تسبيب الإجراء المأمور به إذا تعلق بخبرة طبية.\nيعاين القاضي أيضا ويكيف الوقائع المعتمد عليها في طلب الخلع طبقا لأحكام قانون الأسرة."},{"n":"452","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الثالث — في إجراءات الطلاق","الفرع الرابع — في أحكام الطلاق"],"g":"","t":"لا يوقف الطعن بالنقض تنفيذ أحكام الطلاق المنصوص عليها في المادتين 450 و 451 أعلاه."},{"n":"453","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الأول — في الولاية على نفس القاصر"],"g":"","t":"يقدم طلب إنهاء ممارسة الولاية على القاصر أو سحبها المؤقت، من قبل أحد الوالدين أو ممثل النيابة العامة أو من قبل كل من يهمه الأمر بدعوى استعجالية."},{"n":"454","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الأول — في الولاية على نفس القاصر"],"g":"","t":"يجوز للقاضي تلقائيا أو بطلب من أحد الوالدين أو ممثل النيابة العامة:\n1- سماع الأب والأم وسماع كل شخص آخر يرى فائدة في سماعه،\n2- سماع القاصر ما لم يكن سنه أو حالته لا تسمح بذلك،\n3- الأمر بإجراء تحقيق اجتماعي أو فحص طبي أو نفساني أو عقلي."},{"n":"455","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الأول — في الولاية على نفس القاصر"],"g":"","t":"يتم التبليغ الرسمي للأمر الاستعجالي الصادر وفقا للمادة 453 أعلاه، من طرف الخصم الذي يهمه التعجيل إلى باقي الخصوم خلال ثلاثين ) (30 يوما من تاريخ النطق به، تحت طائلة سقوط الأمر."},{"n":"456","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الأول — في الولاية على نفس القاصر"],"g":"","t":"يكون الأمر قابلا للاستئناف:\n1- من قبل الخصوم في أجل خمسة عشر ) (15 يوما من تاريخ التبليغ الرسمي،\n2- من قبل النيابة العامة خلال نفس المدة ابتداء من تاريخ النطق بالأمر."},{"n":"457","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الأول — في الولاية على نفس القاصر"],"g":"","t":"ينظر في الاستئناف ويفصل فيه في غرفة المشورة في آجال معقولة."},{"n":"458","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الأول — في الولاية على نفس القاصر"],"g":"","t":"تقدم الطلبات المشار إليها في المادة 453 أعلاه، حسب القواعد المقررة لرفع الدعوى الاستعجالية وذلك أمام محكمة مقر ممارسة الولاية.\nينظر في الطلبات ويفصل فيها في غرفة المشورة، بعد سماع ممثل النيابة العامة ومحامي الخصوم في ملاحظاتهم عند الاقتضاء."},{"n":"459","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الأول — في الولاية على نفس القاصر"],"g":"","t":"يجمع القاضي المعلومات التي يراها مفيدة حول أوضاع عائلة القاصر وسلوك الأبوين."},{"n":"460","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الأول — في الولاية على نفس القاصر"],"g":"","t":"يمكن للقاضي ومراعاة لمصلحة القاصر، أن يأمر بكل تدبير مؤقت له علاقة بممارسة الولاية.\nكما يجوز له أن يسند مؤقتا حضانة القاصر لأحد الأبوين، وإذا تعذر ذلك تسند لأحد الأشخاص المبينين في قانون الأسرة.\nيمكن أن يكون هذا الإجراء موضوع تعديل، إذا تطلبت مصلحة القاصر ذلك، إما تلقائيا من القاضي أو بناء على طلب الولي أو القاصر المميز أو ممثل النيابة العامة أو كل شخص آخر تتوفر فيه الصفة لحماية القاصر.\nيفصل القاضي في هذا الطلب بموجب أمر استعجالي."},{"n":"461","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الأول — في الولاية على نفس القاصر"],"g":"","t":"يجوز للقاضي إلغاء تدابير الإنهاء أو السحب المؤقت للحقوق المرتبطة بممارسة الولاية كليا أو جزئيا، بطلب من والد القاصر المسقطة عنه الولاية."},{"n":"462","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الأول — في الولاية على نفس القاصر"],"g":"","t":"يقدم الطلب المشار إليه في المادة 461 أعلاه، إلى المحكمة التي يوجد في دائرة اختصاصها مقر ممارسة الولاية."},{"n":"463","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الأول — في الولاية على نفس القاصر"],"g":"","t":"يتلقى القاضي في الجلسة تصريحات القاصر وتصريحات والده وأمه أو الحاضن أو أي شخص آخر يكون سماعه مفيدا.\nو يمكن إعفاء القاصر من الحضور.\nيقدم محامو الأطراف ملاحظاتهم عند الاقتضاء.\nينظر ويفصل في الطلب بغرفة المشورة، بعد تقديم طلبات ممثل النيابة العامة.\nيكون الأمر الفاصل في الطلب قابلا للاستئناف حسب الأوضاع المحددة في المادة 456 أعلاه."},{"n":"464","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الثاني — في الولاية على أموال القاصر"],"g":"","t":"يؤول الاختصاص الإقليمي إلى المحكمة التي يوجد في دائرة اختصاصها مكان ممارسة الولاية على أموال القاصر."},{"n":"465","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الثاني — في الولاية على أموال القاصر"],"g":"","t":"يمكن للقاضي مراقبة الولاية من تلقاء نفسه أو بناء على طلب ممثل النيابة العامة أو بطلب من أي شخص تهمه مصلحة من وضع تحت الولاية."},{"n":"466","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الثاني — في الولاية على أموال القاصر"],"g":"","t":"عند قيام القاضي، تلقائيا بمراقبة الولاية أو بناء على طلب النيابة العامة، يجوز له استدعاء كل شخص يرى سماعه مفيدا.\nوفي الحالات الأخرى، يكون التكليف بالحضور على عاتق المدعي."},{"n":"467","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الثاني — في الولاية على أموال القاصر"],"g":"","t":"يمكن للقاضي، قبل الفصل في الموضوع، أن يأمر باتخاذ التدابير المؤقتة لحماية مصالح القاصر.\nهذا الأمر غير قابل لأي طعن."},{"n":"468","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الثاني — في الولاية على أموال القاصر"],"g":"","t":"تخضع إدارة أموال القاصر في حالة وفاة الوالدين، إلى رقابة القاضي.\n1- في تعيين المقدم والوصي:"},{"n":"469","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الثاني — في الولاية على أموال القاصر"],"g":"","t":"يعين القاضي طبقا لأحكام قانون الأسرة، مقدما من بين أقارب القاصر، وفي حالة تعذر ذلك يعين شخصا آخر يختاره.\nيجب في الحالتين أن يكون المقدم أهلا للقيام بشؤون القاصر وقادرا على حماية مصالحه."},{"n":"470","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الثاني — في الولاية على أموال القاصر"],"g":"","t":"يقدم طلب تعيين المقدم في شكل عريضة، من قبل الأشخاص المؤهلين لهذا الغرض حسب قانون الأسرة، أو على شكل طلبات تقدمها النيابة العامة."},{"n":"471","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الثاني — في الولاية على أموال القاصر"],"g":"","t":"يعين القاضي المقدم بموجب أمر ولائي بعد التأكد من رضائه.\nيجب على المقدم أن يقدم دوريا وطبقا لما يحدده القاضي، عرضا عن إدارة أموال القاصر وعن أي إشكال أو طارئ له علاقة بهذه الإدارة."},{"n":"472","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الثاني — في الولاية على أموال القاصر"],"g":"","t":"يخطر القاضي من قبل الوصي أو ممثل النيابة العامة أو القاصر الذي بلغ سن التمييز أو كل شخص تهمه مصلحة القاصر بتثبيت الوصاية أو رفضها بعد وفاة الأب.\nفي حالة رفض الوصاية، يعين القاضي مقدما طبقا للمادة 471 أعلاه، أو يتخذ جميع الإجراءات التحفظية في انتظار تعيين المقدم.\nيجوز للقاضي وضع القاصر تحت وصاية الوصي المختار عندما تتوفر فيه الشروط المقررة قانونا.\nيفصل في جميع المنازعات الخاصة بتعيين الوصي بأمر استعجالي قابل لجميع طرق الطعن."},{"n":"473","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الثاني — في الولاية على أموال القاصر"],"g":"","t":"إذا قصر الولي أو الوصي أو المقدم في أداء مهامه، يتخذ القاضي جميع الإجراءات المؤقتة الضرورية لحماية مصالح القاصر بموجب أمر ولائي.\n2- في منازعات الولاية على أموال القاصر:"},{"n":"474","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الثاني — في الولاية على أموال القاصر"],"g":"","t":"ترفع المنازعات المتعلقة بالولاية على أموال القاصر أمام قاضي شؤون الأسرة.\nوفي حالة الاستعجال يفصل في الدعوى وفقا للإجراءات الاستعجالية."},{"n":"475","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الثاني — في الولاية على أموال القاصر"],"g":"","t":"تكون الأحكام الصادرة طبقا لمقتضيات المادة 474 أعلاه، قابلة لطرق الطعن."},{"n":"476","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الثاني — في الولاية على أموال القاصر"],"g":"","t":"ترفع جميع المنازعات المتعلقة بحسابات الولاية وإدارتها أمام قاضي شؤون الأسرة."},{"n":"477","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الثاني — في الولاية على أموال القاصر"],"g":"","t":"ترفع المنازعات المتعلقة بحسابات الولاية من قبل القاصر، بعد بلوغه أو ترشيده، أمام قاضي شؤون الأسرة."},{"n":"478","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الثاني — في الولاية على أموال القاصر"],"g":"","t":"ترفع المنازعات المتعلقة بتصرفات القاصر، بعد بلوغه سن التمييز أمام قاضي شؤون الأسرة.\n3- في الترخيص والترشيد:"},{"n":"479","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الثاني — في الولاية على أموال القاصر"],"g":"","t":"يمنح الترخيص المسبق المنصوص عليه قانونا، والمتعلق ببعض تصرفات الولي، من قبل قاضي شؤون الأسرة بموجب أمر على عريضة."},{"n":"480","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الثاني — في الولاية على أموال القاصر"],"g":"","t":"يقرر قاضي شؤون الأسرة ترشيد القاصر بأمر ولائي حسب الشروط المنصوص عليها قانونا."},{"n":"481","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الثالث — في حماية البالغين ناقصي الأهلية"],"g":"","t":"يصرح بموجب أمر يصدره قاضي شؤون الأسرة بافتتاح أو تعديل أو رفع التقديم عن ناقصي الأهلية."},{"n":"482","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الثالث — في حماية البالغين ناقصي الأهلية"],"g":"","t":"يجب أن تتضمن العريضة المقدمة من أجل افتتاح التقديم على ناقص الأهلية، فضلا عن البيانات العادية، عرضا عن الوقائع التي تبرر التقديم، ويجب أن ترفق بالملف الطبي للشخص المعني بالتقديم."},{"n":"483","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الثالث — في حماية البالغين ناقصي الأهلية"],"g":"","t":"إذا عاين القاضي أن الشخص المبين في العريضة ليس له محام، عين له محاميا تلقائيا."},{"n":"484","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الثالث — في حماية البالغين ناقصي الأهلية"],"g":"","t":"يتلقى القاضي تصريحات الشخص المعني بإجراء التقديم، بحضور محاميه والأشخاص المعنيين وإذا رأى ضرورة لذلك يتلقى هذه التصريحات بحضور الطبيب المعالج وممثل النيابة العامة.\nإذا استحال على القاضي سماع أقوال الشخص المعني بإجراء التقديم أو إذا كان سماعه من شأنه أن يضر بصحته، يجوز له صرف النظر عن هذا السماع."},{"n":"485","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الثالث — في حماية البالغين ناقصي الأهلية"],"g":"","t":"يحرر أمين الضبط، تحت إشراف القاضي، محضرا تدون فيه تصريحات الأشخاص الحاضرين وآرائهم إن اقتضى الأمر."},{"n":"486","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الثالث — في حماية البالغين ناقصي الأهلية"],"g":"","t":"يمكن للقاضي تلقي آراء أعضاء العائلة قبل الفصل في الطلب المقدم إليه.\nو يمكنه قبل اتخاذ القرار أن يأمر بخبرة طبية لتحديد الحالة الصحية للمعني وذلك بأمر ولائي."},{"n":"487","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الثالث — في حماية البالغين ناقصي الأهلية"],"g":"","t":"بمجرد إيداع تقرير الخبرة، عند الاقتضاء، ينظر ويفصل في القضية بغرفة المشورة."},{"n":"488","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الثالث — في حماية البالغين ناقصي الأهلية"],"g":"","t":"يتم التبليغ الرسمي للأمر الذي يصرح بافتتاح التقديم أو برفض الطلب، بتسخيرة من النيابة العامة، عن طريق المحضر القضائي بدون رسوم ومصاريف، إلى الشخص المعني وإلى من قدم الطلب.\nيرفع الاستئناف في هذا الأمر في أجل خمسة عشر ) (15 يوما.\nيسري هذا الأجل تجاه الأطراف ابتداء من تاريخ التبليغ الرسمي.\nو يسري ابتداء من تاريخ النطق به بالنسبة للنيابة العامة."},{"n":"489","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الرابع — في إجراءات الولاية","الفرع الثالث — في حماية البالغين ناقصي الأهلية"],"g":"","t":"يؤشر على هامش عقد ميلاد المعني في سجلات الحالة المدنية بمنطوق الأمر القاضي بافتتاح أو تعديل أو رفع التقديم بأمر من النيابة العامة.\nويعد هذا التأشير إشهارا."},{"n":"490","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الخامس — في دعاوى النسب"],"g":"","t":"ترفع دعوى الاعتراف بالنسب، بالبنوة أو بالأبوة أو بالأمومة لشخص مجهول النسب أو إنكار الأبوة، أمام محكمة موطن المدعى عليه."},{"n":"491","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم الخامس — في دعاوى النسب"],"g":"","t":"ينظر في الدعاوى المتعلقة بالمنازعات المنصوص عليها في المادة 490 أعلاه، بحضور ممثل النيابة العامة وفي جلسة سرية."},{"n":"492","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم السادس — في إجراءات الكفالة"],"g":"","t":"يقدم طلب الكفالة بعريضة من طالب الكفالة أمام قاضي شؤون الأسرة لمحكمة مقر موطن طالب الكفالة."},{"n":"493","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم السادس — في إجراءات الكفالة"],"g":"","t":"يفصل القاضي في طلب الكفالة بأمر ولائي."},{"n":"494","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم السادس — في إجراءات الكفالة"],"g":"","t":"ينظر في طلب الكفالة في غرفة المشورة بعد أخذ رأي ممثل النيابة العامة."},{"n":"495","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم السادس — في إجراءات الكفالة"],"g":"","t":"يتأكد قاضي شؤون الأسرة من توفر الشروط الشرعية المطلوبة في الكافل، وعند الاقتضاء، يأمر بإجراء تحقيق أو أي تدبير يراه مفيدا للتأكد من قدرة الكافل على رعاية المكفول والإنفاق عليه وتربيته."},{"n":"496","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم السادس — في إجراءات الكفالة"],"g":"","t":"ترفع دعوى إلغاء الكفالة أو التخلي عنها حسب قواعد الإجراءات العادية.\nينظر في الدعوى في جلسة سرية، بعد سماع ممثل النيابة العامة في طلباته.\nيتم استئناف هذا الحكم حسب الإجراءات العادية."},{"n":"497","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم السادس — في إجراءات الكفالة"],"g":"","t":"عند وفاة الكافل يتعين على ورثته أن يخبروا، دون تأخير، قاضي شؤون الأسرة الذي أمر بالكفالة.\nيتعين على القاضي أن يجمع الورثة في ظرف شهر لسماعهم حول الإبقاء على الكفالة.\nإذا التزم الورثة بالإبقاء عليها، يعين القاضي أحد الورثة كافلا.\nفي حالة الرفض ينهي القاضي الكفالة حسب نفس الأشكال المقررة لمنحها."},{"n":"498","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم السابع — في التركة"],"g":"","t":"يؤول الاختصاص في دعاوى التركة إلى المحكمة التي يقع فيها موطن المتوفى، حتى وإن وجدت بعض أملاك التركة خارج دائرة الاختصاص الإقليمي لهذه المحكمة، ما لم ينص القانون على خلاف ذلك."},{"n":"499","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الأول — في قسم شؤون الأسرة","القسم السابع — في التركة"],"g":"","t":"يجوز لقاضي شؤون الأسرة، وعن طريق الاستعجال، أن يتخذ جميع التدابير التحفظية، لاسيما الأمر بوضع الأختام، أو تعيين حارس قضائي لإدارة أموال المتوفى إلى غاية تصفية التركة."},{"n":"500","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثاني — في القسم الاجتماعي","القسم الأول — في الاختصاص النوعي"],"g":"","t":"يختص القسم الاجتماعي اختصاصا مانعا في المواد الآتية:\nإثبات عقود العمل والتكوين و التمهين، تنفيذ وتعليق وإنهاء عقود العمل والتكوين و التمهين، منازعات انتخاب مندوبي العمال، المنازعات المتعلقة بممارسة الحق النقابي، المنازعات المتعلقة بممارسة حق الإضراب، منازعات الضمان الاجتماعي والتقاعد، المنازعات المتعلقة بالاتفاقات والاتفاقيات الجماعية للعمل."},{"n":"501","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثاني — في القسم الاجتماعي","القسم الثاني — في الاختصاص الإقليمي"],"g":"","t":"يؤول الاختصاص الإقليمي إلى المحكمة التي تم في دائرة اختصاصها إبرام عقد العمل أو تنفيذه أو التي يوجد بها موطن المدعى عليه.\nغير أنه في حالة إنهاء أو تعليق عقد العمل بسبب حادث عمل أو مرض مهني، يؤول الاختصاص إلى المحكمة التي يوجد بها موطن المدعي."},{"n":"502","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثاني — في القسم الاجتماعي","القسم الثالث — في التشكيلة"],"g":"","t":"يتشكل القسم الاجتماعي، تحت طائلة البطلان، من قاض رئيسا ومساعدين طبقا لما ينص عليه تشريع العمل."},{"n":"503","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثاني — في القسم الاجتماعي","القسم الرابع — في رفع الدعوى أمام القسم الأجتماعي"],"g":"","t":"ترفع الدعوى أمام القسم الاجتماعي بعريضة افتتاح دعوى طبقا للقواعد المقررة قانونا."},{"n":"504","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثاني — في القسم الاجتماعي","القسم الرابع — في رفع الدعوى أمام القسم الأجتماعي"],"g":"","t":"يجب رفع الدعوى أمام القسم الاجتماعي في أجل لا يتجاوز ستة ) (6 أشهر من تاريخ تسليم محضر عدم الصلح، وذلك تحت طائلة سقوط الحق في رفع الدعوى."},{"n":"505","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثاني — في القسم الاجتماعي","القسم الخامس — في الخصومة"],"g":"","t":"تحدد أول جلسة في أجل أقصاه خمسة عشر ) (15 يوما من تاريخ رفع الدعوى.\nيجب على القاضي أن يفصل فيها في أقرب الآجال."},{"n":"506","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثاني — في القسم الاجتماعي","القسم الخامس — في الخصومة"],"g":"","t":"يمكن لرئيس القسم الاجتماعي أن يأمر استعجاليا باتخاذ كل الإجراءات المؤقتة أو التحفظية الرامية إلى وقف كل تصرف من شأنه أن يعرقل حرية العمل."},{"n":"507","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثاني — في القسم الاجتماعي","القسم الخامس — في الخصومة"],"g":"","t":"تكون الأوامر الصادرة عن رئيس القسم الاجتماعي قابلة للاستئناف.\nليس للاستئناف أثر موقف."},{"n":"508","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثاني — في القسم الاجتماعي","القسم الخامس — في الخصومة"],"g":"","t":"يجوز تقديم طلب التنفيذ الفوري إلى رئيس القسم الاجتماعي في الحالتين الآتيتين حالة الامتناع عن تنفيذ اتفاق المصالحة من قبل أحد الأطراف، حالة الامتناع عن التنفيذ الكلي أو الجزئي للاتفاق الجماعي للعمل، يكون فيه ممثلو العمال طرفا، وواحد أو أكثر من أصحاب العمل."},{"n":"509","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثاني — في القسم الاجتماعي","القسم الخامس — في الخصومة"],"g":"","t":"يأمر رئيس القسم الاجتماعي بالتنفيذ الفوري للأمر تحت طائلة غرامة تهديدية طبقا لما ينص عليه تشريع العمل.\nهذا الأمر قابل للتنفيذ بقوة القانون رغم استعمال كل طرق الطعن."},{"n":"510","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثاني — في القسم الاجتماعي","القسم السادس — أحكام خاصة"],"g":"","t":"تقبل الطلبات الإضافية المترتبة على الطلب الأصلي في جميع مراحل الدعوى، حتى ولو لم تكن موضوع محاولة صلح."},{"n":"511","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثالث — في القسم العقاري","القسم الأول — في صلاحيات القسم العقاري"],"g":"","t":"ينظر القسم العقاري في المنازعات المتعلقة بالأملاك العقارية."},{"n":"512","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثالث — في القسم العقاري","القسم الأول — في صلاحيات القسم العقاري"],"g":"","t":"ينظر القسم العقاري على الخصوص في القضايا الآتية:\nفي حق الملكية والحقوق العينية الأخرى والتأمينات العينية، في الحيازة والتقادم وحق الانتفاع وحق الاستعمال وحق الاستغلال وحق السكن.\nفي نشاط الترقية العقارية، في الملكية المشتركة للعقارات المبنية والملكية على الشيوع، في إثبات الملكية العقارية، في الشفعة، في الهبات والوصايا المتعلقة بالعقارات، في التنازل عن الملكية وحق الانتفاع، في القسمة وتحديد المعالم، في إيجار السكنات والمحلات المهنية، في الإيجارات الفلاحية."},{"n":"513","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثالث — في القسم العقاري","القسم الأول — في صلاحيات القسم العقاري"],"g":"","t":"ينظر القسم العقاري في المنازعات التي تنشأ بين المستغل ين الفلاحي ين أو مع الغير، بخصوص الأراضي الفلاحية التابعة للأملاك الوطنية وشغلها واستغلالها."},{"n":"514","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثالث — في القسم العقاري","القسم الأول — في صلاحيات القسم العقاري"],"g":"","t":"ينظر القسم العقاري في الدعاوى المقدمة من طرف عضو أو أكثر من أعضاء المجموعة الفلاحية ضد عضو أو أكثر من تلك المجموعة بسبب خرق الالتزامات القانونية أو الاتفاقية."},{"n":"515","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثالث — في القسم العقاري","القسم الأول — في صلاحيات القسم العقاري"],"g":"","t":"ينظر القسم العقاري في الدعاوى المتعلقة بإبطال أو فسخ أو تعديل أو نقض الحقوق المترتبة على عقود تم شهرها."},{"n":"516","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثالث — في القسم العقاري","القسم الأول — في صلاحيات القسم العقاري"],"g":"","t":"ينظر القسم العقاري في المنازعات المتعلقة بالترقيم المؤقت في السجل العقاري، القائمة بين الأشخاص الخاضع ين للقانون الخاص."},{"n":"517","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثالث — في القسم العقاري","القسم الأول — في صلاحيات القسم العقاري"],"g":"","t":"ينظر القسم العقاري في المنازعات المتعلقةبم قايضة عقارات تابعة للأملاك الخاصة للدولة مع عقارات تابعةلم لكية الخواص."},{"n":"518","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثالث — في القسم العقاري","القسم الثاني — في الاختصاص الأقليمي"],"g":"","t":"يؤول الاختصاص الإقليمي إلى المحكمة التي يوجد العقار في دائرة اختصاصها، ما لم ينص القانون على خلاف ذلك."},{"n":"519","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثالث — في القسم العقاري","القسم الثالث — في الخصومة"],"g":"","t":"ترفع الدعوى أمام القسم العقاري وينظر فيها حسب الإجراءات الواردة في هذا القانون، مع مراعاة الأحكام الخاصة بشهر دعاوى الفسخ أو الإبطال أو التعديل أو نقض حقوق قائمة على عقود تم شهرها."},{"n":"520","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثالث — في القسم العقاري","القسم الثالث — في الخصومة"],"g":"","t":"بعد غلق باب المرافعات، يضع الرئيس القضية في المداولة، ويحدد تاريخ النطق بالحكم."},{"n":"521","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثالث — في القسم العقاري","القسم الرابع — في صلاحيات رئيس القسم العقاري"],"g":"","t":"يمكن لرئيس القسم العقاري، وحتى في حالة وجود منازعة جدية، أن يتخذ عن طريق الاستعجال التدابير التحفظية اللازمة."},{"n":"522","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثالث — في القسم العقاري","القسم الرابع — في صلاحيات رئيس القسم العقاري"],"g":"","t":"تكون الأوامر الصادرة عن رئيس القسم العقاري قابلة للاستئناف حسب القواعد المحددة في مادة الاستعجال."},{"n":"523","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثالث — في القسم العقاري","القسم الرابع — في صلاحيات رئيس القسم العقاري"],"g":"","t":"يمكن لرئيس القسم العقاري أن يتخذ أي تدبير مستعجل بموجب أمر على عريضة، لا يتطلب المناقشة أو الوجاهية أو في الحالات المنصوص عليها قانونا."},{"n":"524","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثالث — في القسم العقاري","القسم الخامس — في دعاوى الحيازة"],"g":"","t":"يجوز رفع دعاوى الحيازة، فيما عدا دعوى استرداد الحيازة ممن كان حائزا بنفسه أو بواسطة غيره لعقار أو لحق عيني عقاري، وكانت حيازته هادئة وعلنية ومستمرة لا يشوبها انقطاع وغير مؤقتة، دون لبس، واستمرت هذه الحيازة لمدة سنة على الأقل.\nولا تقبل دعاوى الحيازة، ومن بينها دعوى استردادها، إذا لم ترفع خلال سنة من التعرض."},{"n":"525","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثالث — في القسم العقاري","القسم الخامس — في دعاوى الحيازة"],"g":"","t":"يجوز رفع دعوى استرداد الحيازة لعقار أو حق عيني عقاري ممن اغتصبت منه الحيازة بالتعدي أو الإكراه، وكان له، وقت حصول التعدي أو الإكراه، الحيازة المادية أو وضع اليد الهادئ العلني."},{"n":"526","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثالث — في القسم العقاري","القسم الخامس — في دعاوى الحيازة"],"g":"","t":"إذا أنكرت الحيازة أو أنكر التعرض لها فإن التحقيق الذي قد يؤمر به في هذا الخصوص لا يجوز أن يمس أصل الحق."},{"n":"527","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثالث — في القسم العقاري","القسم الخامس — في دعاوى الحيازة"],"g":"","t":"لا يجوز للمحكمة المطروح عليها دعوى الحيازة أن تفصل في الملكية."},{"n":"528","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثالث — في القسم العقاري","القسم الخامس — في دعاوى الحيازة"],"g":"","t":"إذا ادعى كل من المدعي والمدعى عليه الحيازة، وقدم كل منهما دليلا على حيازته، يجوز للقاضي إما أن يع ين حارسا قضائيا أو أن يسند حراسة المال المتنازع عليه إلى أحد أطراف الخصومة، مع إلزامه بتقديم حساب عن الثمار، عند الاقتضاء."},{"n":"529","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثالث — في القسم العقاري","القسم الخامس — في دعاوى الحيازة"],"g":"","t":"لا تقبل دعوى الحيازة ممن سلك طريق دعوى الملكية."},{"n":"530","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الثالث — في القسم العقاري","القسم الخامس — في دعاوى الحيازة"],"g":"","t":"لا يجوز للمدعى عليه في دعوى الحيازة أن يطالب بالملكية إلا بعد"},{"n":"531","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الرابع — في القسم التجاري — والمحكمة التجارية المتخصصة","القسم الأول — في القسم التجاري","الفرع الاول — في الاختصاص النوعي"],"g":"معدلة · ق 13-22","t":"يختص القسم التجاري بالنظر في المنازعات التجارية، باستثناء تلك المذكورة في المادة 536 مكرر من هذا القانون."},{"n":"532","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الرابع — في القسم التجاري — والمحكمة التجارية المتخصصة","القسم الأول — في القسم التجاري","الفرع الثاني — الأختصاص الأقليمي"],"g":"","t":"تطبق على القسم التجاري، أحكام الاختصاص الإقليمي المنصوص عليها في هذا القانون والقواعد الواردة في القانون التجاري والقانون البحري والنصوص الخاصة."},{"n":"533","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الرابع — في القسم التجاري — والمحكمة التجارية المتخصصة","القسم الأول — في القسم التجاري","الفرع الثالث — في التشكيلة"],"g":"","t":"يتشكل القسم التجاري من قاض فرد"},{"n":"534","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الرابع — في القسم التجاري — والمحكمة التجارية المتخصصة","القسم الأول — في القسم التجاري","الفرع الرابع — في الخصومة"],"g":"","t":"يجب على رئيس القسم التجاري عرض النزاع مسبقا على الوساطة.\nلا تخضع الوساطة أمام القسم التجاري إلى قبول الأطراف، خلافا لأحكام المادة 994 من هذا القانون.\nتطبق على الوساطة أمام القسم التجاري أحكام الوساطة المنصوص عليها في هذا القانون."},{"n":"535","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الرابع — في القسم التجاري — والمحكمة التجارية المتخصصة","القسم الأول — في القسم التجاري","الفرع الرابع — في الخصومة"],"g":"","t":"يفصل رئيس القسم التجاري، وفق الإجراءات الواردة في هذا القانون، والقانون التجاري والقوانين الخاصة."},{"n":"536","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الرابع — في القسم التجاري — والمحكمة التجارية المتخصصة","القسم الأول — في القسم التجاري","الفرع الرابع — في الخصومة"],"g":"","t":"يمكن لرئيس القسم التجاري، أن يتخذ عن طريق الاستعجال، الإجراءات المؤقتة أو التحفظية للحفاظ على الحقوق موضوع النزاع وفق الإجراءات المنصوص عليها في هذا القانون والنصوص الخاصة."},{"n":"536 مكرر","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الرابع — في القسم التجاري — والمحكمة التجارية المتخصصة","القسم الثاني — في المحكمة التجارية المتخصصة","الفرع الأول — في الاختصاص النوعي"],"g":"مدرجة · ق 13-22","t":"تختص المحكمة التجارية المتخصصة بالنظر في المنازعات المذكورة أدناه:\n– منازعات الملكية الفكرية،\n– منازعات الشركات التجارية، لا سيما منازعات الشركاء وحل وتصفية الشركات\n– التسوية القضائية والإفلاس،\n– منازعات البنوك والمؤسسات المالية مع التجار،\n– المنازعات البحرية والنقل الجوي ومنازعات التأمينات المتعلقة بالنشاط التجاري\n– المنازعات المتعلقة بالتجارة الدولية."},{"n":"536 مكرر 1","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الرابع — في القسم التجاري — والمحكمة التجارية المتخصصة","القسم الثاني — في المحكمة التجارية المتخصصة","الفرع الثاني — في الاختصاص الإقليمي"],"g":"مدرجة · ق 13-22","t":"تطبق على المحكمة التجارية المتخصصة أحكام الاختصاص الإقليمي المنصوص عليها في هذا القانون."},{"n":"536 مكرر 2","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الرابع — في القسم التجاري — والمحكمة التجارية المتخصصة","القسم الثاني — في المحكمة التجارية المتخصصة","الفرع الثالث — في تشكيلة المحكمة التجارية المتخصصة وتنظيمها"],"g":"مدرجة · ق 13-22","t":"تتشكل المحكمة التجارية المتخصصة من أقسام تحت رئاسة قاض وبمساعدة أربعة ) (4 مساعدين ممن لهم دراية واسعة بالمسائل التجارية ويكون لهم رأي تداولي، والذين يختارون وفقا للشروط والكيفيات المحددة عن طريق التنظيم.\nتنعقد المحكمة بصفة صحيحة، في حالة غياب أحد المساعدين.\nو في حالة غياب مساعدين اثنين ) (2 أو أكثر، يتم استخلافهم، على التوالي، بقاض ) (1 أو قاضيين ).(2"},{"n":"536 مكرر 3","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الرابع — في القسم التجاري — والمحكمة التجارية المتخصصة","القسم الثاني — في المحكمة التجارية المتخصصة","الفرع الثالث — في تشكيلة المحكمة التجارية المتخصصة وتنظيمها"],"g":"مدرجة · ق 13-22","t":"يحدد رئيس المحكمة التجارية المتخصصة، بعد استطلاع رأي وكيل الجمهورية، عدد الأقسام، بموجب أمر، حسب طبيعة وحجم النشاط القضائي"},{"n":"536 مكرر 4","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الرابع — في القسم التجاري — والمحكمة التجارية المتخصصة","القسم الثاني — في المحكمة التجارية المتخصصة","الفرع الرابع — في الخصومة"],"g":"مدرجة · ق 13-22","t":"يسبق قيد الدعوى إجراء الصلح الذي يتم بطلب من أحد الخصوم ويقدم إلى رئيس المحكمة التجارية المتخصصة الذي يعين خلال مدة خمسة ) (5 أيام، بموجب أمر على عريضة، أحد القضاة للقيام بإجراء الصلح في أجل لا يتجاوز ثلاثة ) (3 أشهر، ويبلغ طالب الصلح باقي أطراف النزاع بتاريخ جلسة الصلح.\nيمكن القاضي المعين لهذا الغرض الاستعانة بأي شخص يراه مناسبا لمساعدته لإجراء الصلح الذي ينتهي بتحرير محضر يوقع من القاضي وأطراف، النزاع وأمين الضبط، ويخضع للقواعد المنصوص عليها في هذا القانون.\nفي حالة فشل محاولة الصلح، ترفع الدعوى أمام المحكمة التجارية المتخصصة بعريضة افتتاح الدعوى طبقا للقواعد المنصوص عليها في هذا القانون مرفقة، تحت طائلة عدم قبول الدعوى شكلا، بمحضر عدم الصلح."},{"n":"536 مكرر 5","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الرابع — في القسم التجاري — والمحكمة التجارية المتخصصة","القسم الثاني — في المحكمة التجارية المتخصصة","الفرع الرابع — في الخصومة"],"g":"مدرجة · ق 13-22","t":"يتم الفصل في الدعوى أمام المحكمة التجارية المتخصصة بحكم قابل للاستناف أمام المجلس القضائي، وفقا للقواعد المنصوص عليها في هذا القانون."},{"n":"536 مكرر 6","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الرابع — في القسم التجاري — والمحكمة التجارية المتخصصة","القسم الثاني — في المحكمة التجارية المتخصصة","الفرع الرابع — في الخصومة"],"g":"مدرجة · ق 13-22","t":"يمارس رئيس المحكمة التجارية المتخصصة كل الصلاحيات الموكلة لرئيس المحكمة العادية في المنازعات التجارية.\nيمكن رئيس قسم بالمحكمة التجارية المتخصصة أن يتخذ، عن طريق الاستعجال، الاجراءات المؤقتة أو التحفظية للحفاظ على الحقوق موضوع النزاع وفق الإجراءات المنصوص عليها في هذا القانون والنصوص الخاصة."},{"n":"536 مكرر 7","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الأول — في الإجراءات الخاصة بالمحكمة وفي الإجراءات الخاصة ببعض الأقسام","الفصل الرابع — في القسم التجاري — والمحكمة التجارية المتخصصة","القسم الثاني — في المحكمة التجارية المتخصصة","الفرع الرابع — في الخصومة"],"g":"مدرجة · ق 13-22","t":"يمثل النيابة العامة لدى المحكمة التجارية المتخصصة وكيل الجمهورية لدى المحكمة التي يتواجد بدائرة اختصاصها وفقا للأحكام المنصوص عليها في هذا القانون، ولاسيما في المادتين 259 و 260 منه."},{"n":"537","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثاني — في الاجراءات المتبعة أمام المجلس القضائي","الفصل الأول — أحكام عامة"],"g":"","t":"تتم الإجراءات أمام المجلس القضائي بالكتابة أساسا، غير أنه يمكن للخصوم تقديم ملاحظات شفوية إضافية."},{"n":"538","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثاني — في الاجراءات المتبعة أمام المجلس القضائي","الفصل الأول — أحكام عامة"],"g":"","t":"تمثيل الخصوم أمام المجلس القضائي من طرف محام وجوبي تحت طائلة عدم قبول الاستئناف، ما لم ينص هذا القانون على خلاف ذلك.\nلا يكون تمثيل الأطراف بمحام وجوبيا في مادة شؤون الأسرة والمادة الاجتماعية بالنسبة للعمال.\nتعفى الدولة والولاية والبلدية والمؤسسات العمومية ذات الصبغة الإدارية من التمثيل الوجوبي بمحام."},{"n":"539","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثاني — في الاجراءات المتبعة أمام المجلس القضائي","الفصل الثاني — في عريضة الأستئناف"],"g":"","t":"يرفع الاستئناف بعريضة تودع بأمانة ضبط المجلس القضائي الذي صدر الحكم المستأنف في دائرة اختصاصه.\nويجوز أن يسجل الاستئناف بأمانة ضبط المحكمة التي أصدرت الحكم في سجل خاص.\nمع مراعاة أحكام المادة 17 من هذا القانون، تقيد عريضة الاستئناف حالا في سجل خاص، مرقم ومؤشر عليه من قبل رئيس المجلس القضائي، تبعا لترتيب ورودها مع بيان أسماء وألقاب الخصوم ورقم القضية وتاريخ أول جلسة.\nيسجل أمين الضبط رقم القضية وتاريخ أول جلسة على نسخ عريضة الاستئناف، وتبلغ رسميا من قبل المستأنف للمستأنف عليه.\nيجب مراعاة أجل عشرين ) (20 يوما على الأقل بين تاريخ تسليم التكليف بالحضور والتاريخ المحدد لأول جلسة."},{"n":"540","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثاني — في الاجراءات المتبعة أمام المجلس القضائي","الفصل الثاني — في عريضة الأستئناف"],"g":"","t":"يجب أن تتضمن عريضة الاستئناف، تحت طائلة عدم قبولها شكلا، البيانات الآتية:\n1- الجهة القضائية التي أصدرت الحكم المستأنف،\n2- اسم ولقب وموطن المستأنف،\n3- اسم ولقب وموطن المستأنف عليه وإن لم يكن له موطن معروف فآخر موطن له،\n4- عرض موجز للوقائع والطلبات والأوجه التي أسس عليها الاستئناف،\n5- الإشارة إلى طبيعة وتسمية الشخص المعنوي ومقره الاجتماعي وصفة ممثله القانوني أو الاتفاقي،\n6- ختم وتوقيع المحامي وعنوانه المهني، ما لم ينص القانون على خلاف ذلك."},{"n":"541","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثاني — في الاجراءات المتبعة أمام المجلس القضائي","الفصل الثاني — في عريضة الأستئناف"],"g":"","t":"يجب إرفاق عريضة الاستئناف، تحت طائلة عدم قبولها شكلا، بنسخة مطابقة لأصل الحكم المستأنف."},{"n":"542","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثاني — في الاجراءات المتبعة أمام المجلس القضائي","الفصل الثاني — في عريضة الأستئناف"],"g":"","t":"يجب على المستأنف القيام بالتبليغ الرسمي لعريضة الاستئناف إلى المستأنف عليه طبقا للمواد من 404 إلى 416 من هذا القانون، وإحضار نسخة من محاضر التبليغ الرسمي والوثائق المدعمة للاستئناف في أول جلسة.\nفي حالة عدم القيام بذلك يمنح له أجل لذات الغرض، وإذا لم يقدم محضر التبليغ الرسمي والوثائق المطلوبة بعد فوات هذا الأجل دون مبرر مقبول، تشطب القضية بأمر غير قابل للطعن.\nيترتب على الشطب إزالة الأثر الموقف للاستئناف، ما لم يعاد تسجيل القضية في الجدول خلال آجال الاستئناف المتبقية."},{"n":"543","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثاني — في الاجراءات المتبعة أمام المجلس القضائي","الفصل الثالث — في توزيع الملفات ودور المقرر"],"g":"","t":"يتولى رئيس المجلس القضائي توزيع الملفات على الغرف."},{"n":"544","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثاني — في الاجراءات المتبعة أمام المجلس القضائي","الفصل الثالث — في توزيع الملفات ودور المقرر"],"g":"","t":"يجب أن يعين رئيس الغرفة مستشارا مقررا في القضية لتقديم تقريره، قبل تاريخ انعقاد أول جلسة ينادى فيها على القضية.\nإذا تبين للمستشار المقرر عدم قبول الاستئناف، أدرجت القضية في أقرب جلسة لسماع الخصوم في ملاحظاتهم والفصل فيها فورا عند الاقتضاء."},{"n":"545","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثاني — في الاجراءات المتبعة أمام المجلس القضائي","الفصل الثالث — في توزيع الملفات ودور المقرر"],"g":"","t":"يتضمن تقرير المستشار المقرر الوقائع والإجراءات والأوجه المثارة والمسائل القانونية المعروضة للفصل فيها ويتضمن الطلبات الختامية للخصوم."},{"n":"546","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثاني — في الاجراءات المتبعة أمام المجلس القضائي","الفصل الثالث — في توزيع الملفات ودور المقرر"],"g":"","t":"يودع تقرير المستشار المقرر بأمانة ضبط الغرفة ثمانية ) (8 أيام على الأقل قبل انعقاد جلسة المرافعات، ليتسنى للخصوم الاطلاع عليه.\nيحدد رئيس الغرفة جدول القضايا لكل جلسة، ويأمر رئيس أمانة الضبط بتعليق نسخة منهبم دخل قاعة الجلسات وإبلاغه إلى ممثل النيابة العامة."},{"n":"547","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثاني — في الاجراءات المتبعة أمام المجلس القضائي","الفصل الثالث — في توزيع الملفات ودور المقرر"],"g":"","t":"يجوز للخصوم إبداء ملاحظاتهم الشفوية حول التقرير أثناء جلسة المرافعات بعد تلاوته من قبل المستشار المقرر."},{"n":"548","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثاني — في الاجراءات المتبعة أمام المجلس القضائي","الفصل الرابع — في المداولة والقرارات"],"g":"","t":"يضع رئيس الغرفة عند نهاية المرافعات القضية في المداولة ويحدد تاريخ النطق بالقرارلأقرب جلسة.\nلا يجوز تمديد المداولة إلا إذا اقتضت الضرورة الملحة ذلك، على ألا تتجاوز جلستين متتاليتين."},{"n":"549","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثاني — في الاجراءات المتبعة أمام المجلس القضائي","الفصل الرابع — في المداولة والقرارات"],"g":"","t":"يجب أن يتلو المستشار المقرر تقريره الكتابي أثناء المداولة."},{"n":"550","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثاني — في الاجراءات المتبعة أمام المجلس القضائي","الفصل الرابع — في المداولة والقرارات"],"g":"","t":"يقتصر النطق بالقرار على تلاوة منطوقه في جلسة علنية بحضور قضاة التشكيلة الذين تداولوا في القضية."},{"n":"551","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثاني — في الاجراءات المتبعة أمام المجلس القضائي","الفصل الرابع — في المداولة والقرارات"],"g":"","t":"يتضمن القرار تاريخ النطق به.\nيضمن القرار تحت طائلة البطلان، العبارة الآتية:"},{"n":"552","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثاني — في الاجراءات المتبعة أمام المجلس القضائي","الفصل الرابع — في المداولة والقرارات"],"g":"","t":"يجب أن الجمهورية الجزائرية الد يمقراطية الشعبية باسم الشعب الجزائري."},{"n":"553","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثاني — في الاجراءات المتبعة أمام المجلس القضائي","الفصل الرابع — في المداولة والقرارات"],"g":"","t":"يجب أن يتضمن القرار البيانات الآتية:\nالجهة القضائية التي أصدرته، أسماء وألقاب وصفات القضاة الذين تداولوا في القضية، الإشارة إلى تلاوة التقرير، تاريخ النطق بالقرار، اسم ولقب ممثل النيابة العامة عند الاقتضاء، اسم ولقب أمين الضبط الذي ساعد التشكيلة.\nأسماء وألقاب الخصوم وموطن كل منهم، وفي حالة الشخص المعنوي تذكر تسميته وطبيعته ومقر الاجتماعي وصفة ممثله القانوني أو الاتفاقي، أسماء وألقاب المحامين وعناوينهم المهنية، الإشارة إلى عبارة النطق بالقرار في جلسة علنية."},{"n":"554","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثاني — في الاجراءات المتبعة أمام المجلس القضائي","الفصل الرابع — في المداولة والقرارات"],"g":"","t":"لا يجوز النطق بالقرار إلا إذا كان مسببا مسبقا.\nيجب أن يكون القرار مسببا من حيث الوقائع ومن حيث القانون، مع الإشارة إلى النصوص المطبقة.\nيجب أن يبين فيه بإيجاز وقائع النزاع وطلبات وادعاءات الخصوم وأوجه دفاعهم.\nيجب أن يتم الرد فيه على كل الطلبات والأوجه المثارة.\nيجب أن يشار فيه إلى إيداع التقرير المكتوب بأمانة الضبط قبل جلسة المرافعات.\nيتضمن ما قضى به في شكل منطوق."},{"n":"555","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثاني — في الاجراءات المتبعة أمام المجلس القضائي","الفصل الرابع — في المداولة والقرارات"],"g":"","t":"يوقع الرئيس وأمين الضبط والمستشار المقرر إن اقتضى الأمر على أصل القرار الذي يحفظ في أرشيف الجهة القضائية.\nيحفظ أيضا ملف القضية في أرشيف الجهة القضائية.\nيستعيد الخصوم دون سواهم أو بوكالة خاصة، الوثائق المملوكة لهم بناء على طلبهم مقابل وصل بالاستلام."},{"n":"556","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثاني — في الاجراءات المتبعة أمام المجلس القضائي","الفصل الرابع — في المداولة والقرارات"],"g":"","t":"إذا تعذر التوقيع على أصل القرار من طرف الرئيس أو المستشار المقرر أو أمين الضبط، يعين رئيس الجهة القضائية بموجب أمر مستشارا آخر أ رئيسا آخر أو أمين ضبط آخر للقيام بذلك."},{"n":"557","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثالث — في الأحكام الخاصة بالمحكمة العليا","الفصل الأول — أحكام عامة"],"g":"","t":"تكون الإجراءات أمام المحكمة العليا كتابية."},{"n":"558","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثالث — في الأحكام الخاصة بالمحكمة العليا","الفصل الأول — أحكام عامة"],"g":"","t":"تمثيل الخصوم أمام المحكمة العليا من طرف محام وجوبي.\nتعفى الدولة والولاية والبلدية والمؤسسات العمومية ذات الصبغة الإدارية من التمثيل الوجوبي بمحام."},{"n":"559","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثالث — في الأحكام الخاصة بالمحكمة العليا","الفصل الأول — أحكام عامة"],"g":"","t":"لا يمكن تمثيل الخصوم أمام المحكمة العليا بمناسبة الطعن بالنقض إلا من قبل محامين معتمدين لدى المحكمة العليا، تحت طائلة عدم قبول الطعن بالنقض."},{"n":"560","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثالث — في الأحكام الخاصة بالمحكمة العليا","الفصل الثاني — في التصريح بالطعن بالنقض"],"g":"","t":"يرفع الطعن بالنقض بتصريح أو بعريضة أمام أمانة ضبط المحكمة العليا.\nيجوز أيضا أن يرفع الطعن بالنقض بتصريح أو بعريضة أمام أمانة ضبط المجلس القضائي الذي صدر في دائرة اختصاصه الحكم موضوع الطعن."},{"n":"561","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثالث — في الأحكام الخاصة بالمحكمة العليا","الفصل الثاني — في التصريح بالطعن بالنقض"],"g":"","t":"يمسك بأمانة ضبط المحكمة العليا وبأمانة ضبط المجالس القضائية سجل يسمى \" سجل قيد الطعون بالنقض \"، تسجل فيه تصريحات أو عرائض الطعون بالنقض حسب تاريخ وصولها.\nيكون هذا السجل موضوعا تحت مسؤولية أمين الضبط الرئيسي، مرقما وموقعا من طرف الرئيس الأول للمحكمة العليا، أو رئيس المجلس القضائي، حسب الحالة، الذي يراقب مسكه دوريا."},{"n":"562","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثالث — في الأحكام الخاصة بالمحكمة العليا","الفصل الثاني — في التصريح بالطعن بالنقض"],"g":"","t":"يتم التصريح بالطعن بالنقض من طرف الطاعن أو محاميه، في محضر يعده أمين الضبط الرئيسي لدى المحكمة العليا أو المجلس القضائي أو أمين الضبط الذي يفوضه لهذا الغرض.\nيتضمن المحضر البيانات الآتية:\n1- اسم ولقب وموطن الطاعن، وإذا تعلق الطعن بشخص معنوي بيان تسميته وطبيعته ومقره الاجتماعي وصفة ممثله القانوني أو الاتفاقي،\n2- اسم ولقب وموطن المطعون ضده أو ضدهم، وإذا تعلق الطعن بشخص معنوي بيان تسميته ومقره الاجتماعي.\n3- تاريخ وطبيعة القرار المطعون فيه.يوقع المحضر حسب الحالة، من طرف أمين الضبط الرئيسي أو أمين الضبط الذي يفوضه لهذا الغرض لدى المحكمة العليا أو المجلس القضائي والقائم بالتصريح.\nتسلم نسخة منه إلى القائم بالتصريح، بغرض تبليغه الرسمي للمطعون ضده."},{"n":"563","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثالث — في الأحكام الخاصة بالمحكمة العليا","الفصل الثالث — في آجال التبليغ الرسمي لعريضة الطعن بالنقض"],"g":"","t":"يلزم الطاعن بتبليغ المطعون ضده رسميا، خلال أجل شهر واحد )، (1 من تاريخ التصريح بالطعن بالنقض، بنسخة من محضر التصريح وتنبيهه بأنه يجب عليه تأسيس محام إذا رغب في الدفاع عن نفسه.\nوللطاعن أجل شهرين )، (2 ابتداء من تاريخ التصريح بالطعن بالنقض، لإيداع العريضة بأمانة ضبط المحكمة العليا أو المجلس القضائي، يعرض فيها الأوجه القانونية لتأسيس طعنه، وذلك تحت طائلة عدم قبول الطعن بالنقض شكلا."},{"n":"564","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثالث — في الأحكام الخاصة بالمحكمة العليا","الفصل الثالث — في آجال التبليغ الرسمي لعريضة الطعن بالنقض"],"g":"","t":"يجب على الطاعن أن يبلغ رسميا المطعون ضده خلال أجل شهر واحد ) (1 من تاريخ إيداع عريضة الطعن بأمانة ضبط المحكمة العليا أو المجلس القضائي، بنسخة من هذه العريضة مؤشر عليها من طرف أمين الضبط الرئيسي لدى المحكمة العليا أو المجلس القضائي.\nتتم التبليغات الرسمية وفقا لأحكام المواد من 404 إلى 416 من هذا القانون."},{"n":"565","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثالث — في الأحكام الخاصة بالمحكمة العليا","الفصل الرابع — في قبول عريضة الطعن بالنقض"],"g":"","t":"يجب أن تتضمن عريضة الطعن بالنقض تحت طائلة عدم قبولها شكلا المثار تلقائيا، ما يأتي:\n1- اسم ولقب وموطن الطاعن، وإذا تعلق الطعن بشخص معنوي، بيان تسميته وطبيعته ومقره الاجتماعي وصفة ممثله القانوني أو الاتفاقي،\n2- اسم ولقب وموطن المطعون ضده أو ضدهم، وإذا تعلق الطعن بشخص معنوي، بيان تسميته ومقره الاجتماعي،\n3- تاريخ وطبيعة القرار المطعون فيه،\n4- عرضا موجزا عن الوقائع والإجراءات المتبعة،\n5- عرضا عن أوجه الطعن المؤسس عليها الطعن بالنقض، يجب ألا يتضمن الوجه المتمسك به أو الفرع منه، إلا حالة واحدة من حالات الطعن بالنقض بعد تحديدها، وذلك تحت طائلة عدم قبوله."},{"n":"566","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثالث — في الأحكام الخاصة بالمحكمة العليا","الفصل الرابع — في قبول عريضة الطعن بالنقض"],"g":"","t":"يجب إرفاق عريضة الطعن بالنقض تحت طائلة عدم قبول الطعن شكلا تلقائيا، بالوثائق الآتية:\n1- نسخة مطابقة لأصل القرار أو الحكم محل الطعن، مرفقةبم حاضر التبليغ الرسمي إن وجدت.\n2- نسخة من الحكم المؤيد أو الملغى بالقرار محل الطعن،\n3- الوثائق المشار إليها في مرفقات عريضة الطعن،\n4- وصل دفع الرسم القضائي لدى أمين الضبط الرئيسي لدى المحكمة العليا أو المجلس القضائي،\n5- نسخة من محاضر التبليغ الرسمي للتصريح و /أو لعريضة الطعن بالنقض إلى المطعون ضده."},{"n":"567","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثالث — في الأحكام الخاصة بالمحكمة العليا","الفصل الرابع — في قبول عريضة الطعن بالنقض"],"g":"","t":"يجب أن تحمل عريضة الطعن بالنقض وتحت طائلة عدم قبولها شكلا تلقائيا، التوقيع الخطي وختم محام معتمد لدى المحكمة العليا وعنوانه المهني."},{"n":"568","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثالث — في الأحكام الخاصة بالمحكمة العليا","الفصل الخامس — في آجال تقديم مذكرة الرد"],"g":"","t":"للمطعون ضده أجل شهرين )، (2 ابتداء من تاريخ التبليغ الرسمي لعريضة الطعن بالنقض، لتقديم مذكرة جواب موقعة من طرف محام معتمد لدى المحكمة العليا، إلى أمين الضبط الرئيسي للمحكمة العليا أو المجلس القضائي، وتبليغها لمحامي الطاعن، وذلك تحت طائلة عدم القبول التلقائي.\nيجب أن تتضمن مذكرة الجواب الرد على أوجه الطعن المثارة."},{"n":"569","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثالث — في الأحكام الخاصة بالمحكمة العليا","الفصل الخامس — في آجال تقديم مذكرة الرد"],"g":"","t":"عند انتهاء الآجال القانونية المحددة للأطراف لإيداع مذكراتهم، يرسل أمين الضبط الرئيسي للمجلس القضائي الملف مشكلا ومرفقا بملف القضية إلى أمين الضبط الرئيسي للمحكمة العليا، الذي يحيله بدوره إلى رئيس الغرفة المعنية."},{"n":"570","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثالث — في الأحكام الخاصة بالمحكمة العليا","الفصل السادس — في سير الخصومة"],"g":"","t":"يعين رئيس الغرفة مستشارا مقررا يكلف بإعداد تقرير كتابي، وإرسال ملف القضية إلى النيابة العامة لتقديم طلباتها الكتابية حول أوجه النقض.\nيمكن للمستشار المقرر، إذا رأى ضرورة لذلك، أن يسمح للطاعن أن يرد على مذكرة جواب المطعون ضده في أجل يحدده.\nيمكن أن يطلب من الخصوم أية وثيقة يراها ضرورية للفصل في الطعن بالنقض، مع إشعار باقي الخصوم بذلك.\nعندما يرى أن القضية مهيأة للفصل، يودع تقريره الكتابي، ويصدر أمرا بإبلاغ النيابة العامة."},{"n":"571","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثالث — في الأحكام الخاصة بالمحكمة العليا","الفصل السادس — في سير الخصومة"],"g":"","t":"للنيابة العامة أجل شهر واحد ) (1 يبدأ من تاريخ استلام الأمر بالإبلاغ المشار إليه في المادة 570 أعلاه، لتقديم طلباتها.\nبعد انقضاء هذا الأجل، يتعين إرجاع ملف القضية إلى المستشار المقرر للجدولة."},{"n":"572","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثالث — في الأحكام الخاصة بالمحكمة العليا","الفصل السادس — في سير الخصومة"],"g":"","t":"يحدد رئيس الغرفة جدول القضايا لكل جلسة.\nيبلغ هذا الجدول إلى النيابة العامة لما تراه مناسبا."},{"n":"573","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثالث — في الأحكام الخاصة بالمحكمة العليا","الفصل السادس — في سير الخصومة"],"g":"","t":"يبلغ الخصوم ومحاموهم عن طريق إشعار، خمسة عشر ) (15 يوما على الأقل قبل تاريخ انعقاد الجلسة."},{"n":"574","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثالث — في الأحكام الخاصة بالمحكمة العليا","الفصل السادس — في سير الخصومة"],"g":"","t":"يجب على محامي الخصوم الذين يرغبون في تقديم ملاحظات شفوية خلال الجلسة، أن يقدموا طلبا لرئيس التشكيلة ثلاثة ) (3 أيام على الأقل قبل ذلك.\nيمكن لهذا الأخير أن يرفضه إذا رأى عدم جدواه."},{"n":"575","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثالث — في الأحكام الخاصة بالمحكمة العليا","الفصل السادس — في سير الخصومة"],"g":"","t":"تعقد الجلسات علنية ما لم تقرر المحكمة العليا خلاف ذلك، إذا رأت أن في العلنية ما يخل بالنظام العام."},{"n":"576","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثالث — في الأحكام الخاصة بالمحكمة العليا","الفصل السادس — في سير الخصومة"],"g":"","t":"تعقد الجلسات بحضور ممثل النيابة العامة وبمساعدة أمين الضبط."},{"n":"577","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثالث — في الأحكام الخاصة بالمحكمة العليا","الفصل السادس — في سير الخصومة"],"g":"","t":"ينادى على القضايا خلال الجلسة وتوضع في المداولة لنفس اليوم أو لتاريخ لاحق بعد تلاوة المستشار المقرر لتقريره وتقد يم الخصوم والنيابة العامة ملاحظاتهم عند الاقتضاء."},{"n":"578","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثالث — في الأحكام الخاصة بالمحكمة العليا","الفصل السادس — في سير الخصومة"],"g":"","t":"إذا تبين لرئيس التشكيلة أنه يمكن التصريح بعدم قبول الطعن بالنقض، يجدول القضية في أقرب جلسة لتمكين الخصوم من تقديم ملاحظاتهم.\nيقدم المستشار المقرر تقريرا وجيزا عن الإجراءات.\nيتم سماع الطلبات الشفوية للنيابة العامة."},{"n":"579","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثالث — في الأحكام الخاصة بالمحكمة العليا","الفصل السابع — في الحالات الخاصة بالتنازل ووقف الخصومة"],"g":"","t":"إذا قدم الطاعن تنازلا عن الطعن بالنقض، ولم يقدم المطعون ضده مذكرة جواب، أو إذا أودعها ولم يعترض عن التنازل عن الطعن بالنقض، فإن هذا التنازل يقرر بأمر من رئيس الغرفة المختصة.\nإذا اعترض المطعون ضده على هذا التنازل يتم الفصل فيه بقرار من الغرفة.\nفي كلا الحالت، ين يعد الأمر أو القرار الذي يثبت التنازلبم ثابة قرار رفض."},{"n":"580","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثالث — في الأحكام الخاصة بالمحكمة العليا","الفصل السابع — في الحالات الخاصة بالتنازل ووقف الخصومة"],"g":"","t":"تتوقف الخصومة في القضايا التي لم توضع في المداولة، في حالة:\n1- وفاة أحد الخصوم،\n2- وفاة أو استقالة أو توقيف أو تشطيب أو تنحية المحامي."},{"n":"581","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثالث — في الأحكام الخاصة بالمحكمة العليا","الفصل السابع — في الحالات الخاصة بالتنازل ووقف الخصومة"],"g":"","t":"بمجرد علم المستشار المقرر بالواقعة الموقفة للخصومة، يقوم بدعوة الذين لهم الصفة لاستئناف سير الخصومة، أو توكيل محام جديد في أجل شهر واحد ).(1 وبمجرد أن تتوفر شروط إعادة السير في الخصومة، يخطر الخصم المعني المستشار المقرر، بطلب بسيط من أجل رفع توقيف الخصومة.\nإذا لم يتم تنفيذ الإجراء المأمور به خلال الأجل المحدد يمكن للمستشار المقرر أن يمنح أجلا إضافيا لنفس الغرض أو يستغني عن الإجراء المذكور، ويجدول القضية من أجل الفصل فيها على الحالة التي كانت عليها قبل ظهور السبب الموقف للخصومة."},{"n":"582","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثالث — في الأحكام الخاصة بالمحكمة العليا","الفصل الثامن — في قرارات المحكمة العليا"],"g":"","t":"يصدر القرار في جلسة علنية مع الإشارة إلى النصوص المطبقة وبيان ما يأتي:\n1- اسم ولقب وصفة وموطن كل من الخصوم وأسماء وألقاب محاميهم وعناوينهم المهنية،\n2- المذكرات المقدمة والأوجه المثارة،\n3- أسماء وألقاب وصفات القضاة الذين أصدروه مع صفة المستشار المقرر،\n4- اسم ولقب ممثل النيابة العامة،\n5- اسم ولقب أمين الضبط الذي ساعد التشكيلة،\n6- سماع النيابة العامة،\n7- سماع محامي الخصوم في الجلسة عند الاقتضاء،\n8- تلاوة التقرير خلال الجلسة والمداولة،\n9- النطق بالقرار في جلسة علنية.\nيوقع أصل القرار من طرف رئيس التشكيلة وأمين الضبط والمستشار المقرر عند الاقتضاء.\nوفي حالة وجود مانع، يعين الرئيس الأول للمحكمة العليا بموجب أمر، رئيسا أو مستشارا آخر، و /أو أمين ضبط آخر للتوقيع على أصل القرار، حسب الحالة."},{"n":"583","p":["الكتاب الثاني — في الإجراءات الخاصة بكل جهة قضائية","الباب الثالث — في الأحكام الخاصة بالمحكمة العليا","الفصل الثامن — في قرارات المحكمة العليا"],"g":"","t":"ترسل أمانة ضبط المحكمة العليا نسخة من القرار إلى الجهة القضائية التي أصدرت الحكم أو القرار المطعون فيه.\nو يمكن للأطراف استخراج نسخ عادية منه من أمانة الضبط بتلك الجهة القضائية.\nوعلى أمانة ضبط الجهة القضائية المرسل إليها، التأشير على هامش أصل الحكم أو القراربم نطوق القرار الصادر من المحكمة العليا."},{"n":"584","p":["الكتاب الثالث — في التنفيذ الجبري للسندات التنفيذية","الباب الأول — في عرض الوفاء والأيداع"],"g":"","
